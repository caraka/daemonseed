# daemonseed Veilid transport.
#
# A first-class [workspace] member sharing the unified workspace lock.
# Productizes the PROVEN 1:1 path from veilid-ds-spike into a real actor; the
# transport the GUI/TUI drive now that the relay (daemonseed-server) is gone.
[package]
name = "daemonseed-veilid-net"
version = "0.1.0"
edition = "2021"
publish = false
description = "Veilid transport layer for daemonseed (Phase 1 skeleton): identity-bound node, private routes, sealed app_message. Circles/shares/presence stubbed for Phase 2+."

[dependencies]
# D4: join the PUBLIC Veilid network (no network_key_password). Private routes
# (the proven path) need no footgun feature.
veilid-core = { version = "0.5.7", default-features = false, features = ["default-tokio"] }

# D3 identity binding: VeilidNodeSeed lives in daemonseed-core (keys.rs).
# In-tree sibling crate (this crate is workspace-excluded, so a plain path dep).
daemonseed-core = { path = "../daemonseed-core" }

# Seed (Ed25519) → VLD0 keypair. Pinned to veilid-core's ed25519-dalek major.
# `zeroize` is declared rather than inherited from defaults: `SigningKey`
# zeroizes on drop only under that feature, and `identity::vld0_keypair`'s
# residual note documents that as a security property. A `default-features =
# false` elsewhere would otherwise switch it off silently, with no test failing.
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
base64 = "0.22"

tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
thiserror = "1"

# Fragment-pipelining the share fetch (#109): `StreamExt::buffered` keeps N
# fragment app_calls in flight in ONE task (no spawn → the in-process `call`
# closures need not be Send/'static). Already in this crate's lock via
# veilid-core — a direct dep adds no new supply-chain surface.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Per-contact pseudonym keygen: a fresh ML-DSA seed per introduction. Already
# in this crate's lock via daemonseed-core.
getrandom = { workspace = true }
# The spent-invite-token file's profile-id, in its cleartext header
# (daemonseed_core::dm::spent_store). Already a workspace dependency.
uuid = { workspace = true }
# Zeroizing<String> for the profile passphrase DmDriverParts carries.
zeroize = { workspace = true }

[dev-dependencies]
# Named again here purely to switch daemonseed-core's `testing` feature on while
# building this crate's test targets, so `kats::initialize_module_unsigned_test_binary`
# is reachable from test targets. The release command carries no dev-dependency
# edge (`cargo zigbuild --release --locked -p <crate>`), so the shipped artifact
# never links a `testing`-enabled core. Note the narrower true statement: under
# `--all-targets` cargo does enable the feature for this crate's bin target too,
# so "off in every build" would be false — it is off in the build that ships.
daemonseed-core = { path = "../daemonseed-core", features = ["testing"] }
# Test targets only: `ResumeRecord::new` takes key arrays sized by this crate's
# `SK_LEN` / `PK_LEN`, so a fixture that builds one names them. No production
# code here references it, and a dev-dependency carries no edge into the shipped
# artifact.
oxicrypt-ml-dsa = { workspace = true }
# Integration test (#97): the 2-node send_sealed-over-private-route oracle.
# Runs on a host that can attach to the public network (`--ignored`).
# `test-util` drives the WB-3 scheduler oracles in paused virtual time
# (`#[tokio::test(start_paused = true)]`) — the WB-2 paused-time write-budget oracle.
daemonseed-proto = { path = "../daemonseed-proto" }
oxicrypt-module = { workspace = true }
# Per-test scratch directories for the DM driver oracles (`DmPersist::open` takes a
# root). Already a workspace dependency and a dev-dep of five sibling crates.
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "test-util"] }
