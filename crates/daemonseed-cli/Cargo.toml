[package]
name = "daemonseed-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
description = "daemonseed scriptable client"

[dependencies]
# Sibling crates — bootstrap anchor + version policy + crypto live in core;
# the announcements/MOTD wire types (SignedArtifact, Post) in proto.
daemonseed-core = { path = "../daemonseed-core" }
daemonseed-proto = { path = "../daemonseed-proto" }
prost = { workspace = true }

# Veilid transport — home of the least-authority RouteAdvertSigner adapter
# (`route_signer`) the share-publish path hands veilid-net.
daemonseed-veilid-net = { path = "../daemonseed-veilid-net" }

# oxicrypt — the ML-DSA signing/verification error type surfaced by the
# public_space authoring helpers + the route_signer provenance path.
oxicrypt-module = { workspace = true }

[dev-dependencies]
# Named again here purely to switch daemonseed-core's `testing` feature on while
# building this crate's test targets, so `kats::initialize_module_unsigned_test_binary`
# is reachable from test targets. The release command carries no dev-dependency
# edge (`cargo zigbuild --release --locked -p <crate>`), so the shipped artifact
# never links a `testing`-enabled core. Note the narrower true statement: under
# `--all-targets` cargo does enable the feature for this crate's bin target too,
# so "off in every build" would be false — it is off in the build that ships.
daemonseed-core = { path = "../daemonseed-core", features = ["testing"] }
