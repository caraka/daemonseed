  # ── circle ──────────────────────────────────────────────────────────
  - name: derive_cot_key
    module: daemonseed_core::circle::key
    description: >-
      ISC-C8/C9. Canonicalizes entropy (NFKC + whitespace) then
      HKDF-SHA-384(salt=CIRCLE_KEY_SALT, ikm=canonical) ->
      expand(info="daemonseed/circle/<family>"). Family-anchored on
      Suite::family_token, so within-family suite ratchets leave the key
      unchanged; only a cross-family change re-derives (ISC-A-C8 new-circle
      event). Strength gating (>=128-bit) is the caller's responsibility via
      passphrase::strength.
    signature: "pub fn derive_cot_key(entropy: &str, suite: &Suite) -> Result<CircleKey, CircleKeyError>"
    parameters:
      - name: entropy
        type: "&str"
        direction: in
        description: The shared circle phrase (the sole circle secret).
      - name: suite
        type: "&Suite"
        direction: in
        description: The suite whose family anchors the derivation.
    returns:
      type: "Result<CircleKey, CircleKeyError>"
      description: The derived 32-byte circle key.
      error_variants:
        - name: Hkdf
          condition: HKDF derivation failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: CircleKey::as_bytes
    module: daemonseed_core::circle::key
    description: >-
      Borrow raw key bytes for AEAD use; callers must not copy into a
      non-zeroizing buffer.
    signature: "pub fn as_bytes(&self) -> &[u8; COT_KEY_LEN]"
    parameters: []
    returns:
      type: "&[u8; COT_KEY_LEN]"
      description: A borrow of the raw 32-byte key.

  - name: CircleKey::from_bytes
    module: daemonseed_core::circle::key
    description: >-
      Wrap raw key bytes into a zeroizing CircleKey. The caller zeroes its own
      copy of bytes after this call; the boxed copy zeroes on drop.
    signature: "pub fn from_bytes(bytes: [u8; COT_KEY_LEN]) -> Self"
    parameters:
      - name: bytes
        type: "[u8; COT_KEY_LEN]"
        direction: in
        description: The raw 32-byte key to wrap.
    returns:
      type: CircleKey
      description: The zeroizing key wrapper.

  - name: derive_circle_veilid_owner_seed
    module: daemonseed_core::circle::key
    description: >-
      Derive a circle's deterministic Veilid rendezvous-owner seed from shared
      entropy — the transport-address sibling of derive_cot_key. Canonicalizes
      entropy (ISC-C9) then HKDF-SHA-384(salt=CIRCLE_KEY_SALT, ikm=canonical) ->
      expand(info="daemonseed/veilid/circle-owner/<family>"). Family-anchored
      like the content key, so a cross-family rekey moves rendezvous and content
      together. Every member who agrees on the phrase derives the byte-identical
      owner seed, hence the same DHT rendezvous record key. Not a function of,
      and not derived from, the cot_key.
    signature: "pub fn derive_circle_veilid_owner_seed(entropy: &str, suite: &Suite) -> Result<CircleVeilidOwnerSeed, CircleKeyError>"
    parameters:
      - name: entropy
        type: "&str"
        direction: in
        description: The shared circle phrase (the sole circle secret).
      - name: suite
        type: "&Suite"
        direction: in
        description: The suite whose family anchors the derivation.
    returns:
      type: "Result<CircleVeilidOwnerSeed, CircleKeyError>"
      description: The derived 32-byte VLD0 rendezvous-owner seed.
      error_variants:
        - name: Hkdf
          condition: HKDF derivation failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: CircleVeilidOwnerSeed::as_bytes
    module: daemonseed_core::circle::key
    description: >-
      Borrow the raw 32-byte seed to build a VLD0 keypair; callers must not copy
      into a non-zeroizing buffer.
    signature: "pub fn as_bytes(&self) -> &[u8; CIRCLE_VEILID_OWNER_SEED_LEN]"
    parameters: []
    returns:
      type: "&[u8; CIRCLE_VEILID_OWNER_SEED_LEN]"
      description: A borrow of the raw 32-byte rendezvous-owner seed.

  - name: derive_room_veilid_owner_seed
    module: daemonseed_core::public_room
    description: >-
      Derive a public room's deterministic Veilid rendezvous-owner seed from its
      public inputs — the transport-address sibling of derive_room_key.
      HKDF-SHA-384(salt=PUBLIC_ROOM_KEY_SALT, ikm=family_token) ->
      expand(info="daemonseed/veilid/room-owner/<family>/<room>"). Family-anchored
      like the room key. World-derivable, so every participant derives the
      byte-identical owner seed, hence the same DHT rendezvous record key — an
      open rendezvous by construction. Not a function of, and not derived from,
      the room key.
    signature: "pub fn derive_room_veilid_owner_seed(room: &str, suite: &Suite) -> Result<RoomVeilidOwnerSeed, RoomKeyError>"
    parameters:
      - name: room
        type: "&str"
        direction: in
        description: The public room name (the sole per-room distinguisher).
      - name: suite
        type: "&Suite"
        direction: in
        description: The suite whose family anchors the derivation.
    returns:
      type: "Result<RoomVeilidOwnerSeed, RoomKeyError>"
      description: The derived 32-byte VLD0 rendezvous-owner seed.
      error_variants:
        - name: Hkdf
          condition: HKDF derivation failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: RoomVeilidOwnerSeed::as_bytes
    module: daemonseed_core::public_room
    description: >-
      Borrow the raw 32-byte seed to build a VLD0 keypair; callers must not copy
      into a non-zeroizing buffer.
    signature: "pub fn as_bytes(&self) -> &[u8; ROOM_VEILID_OWNER_SEED_LEN]"
    parameters: []
    returns:
      type: "&[u8; ROOM_VEILID_OWNER_SEED_LEN]"
      description: A borrow of the raw 32-byte rendezvous-owner seed.

  - name: derive_room_presence_veilid_owner_seed
    module: daemonseed_core::public_room
    description: >-
      Derive a public room's PRESENCE Veilid rendezvous-owner seed — a second,
      distinct sibling of derive_room_key under info
      "daemonseed/veilid/room-presence-owner/<family>/<room>", disjoint from both
      the room key and the chat rendezvous owner (derive_room_veilid_owner_seed).
      Presence beacons ride this OWN world-derivable record so a heartbeat can
      never evict the room chat append-ring (P1).
    signature: "pub fn derive_room_presence_veilid_owner_seed(room: &str, suite: &Suite) -> Result<RoomPresenceVeilidOwnerSeed, RoomKeyError>"
    parameters:
      - name: room
        type: "&str"
        direction: in
        description: The public room name (the sole per-room distinguisher).
      - name: suite
        type: "&Suite"
        direction: in
        description: The suite whose family anchors the derivation.
    returns:
      type: "Result<RoomPresenceVeilidOwnerSeed, RoomKeyError>"
      description: The derived 32-byte VLD0 presence rendezvous-owner seed.
      error_variants:
        - name: Hkdf
          condition: HKDF derivation failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: RoomPresenceVeilidOwnerSeed::as_bytes
    module: daemonseed_core::public_room
    description: >-
      Borrow the raw 32-byte presence seed to build a VLD0 keypair; callers must
      not copy into a non-zeroizing buffer.
    signature: "pub fn as_bytes(&self) -> &[u8; ROOM_VEILID_OWNER_SEED_LEN]"
    parameters: []
    returns:
      type: "&[u8; ROOM_VEILID_OWNER_SEED_LEN]"
      description: A borrow of the raw 32-byte presence rendezvous-owner seed.

  - name: derive_circle_presence_veilid_owner_seed
    module: daemonseed_core::circle::key
    description: >-
      Derive a circle's PRESENCE Veilid rendezvous-owner seed from shared entropy
      — a second, distinct sibling of derive_cot_key under info
      "daemonseed/veilid/circle-presence-owner/<family>", disjoint from both the
      content cot_key and the chat rendezvous owner (derive_circle_veilid_owner_seed).
      Canonicalized (ISC-C9) like its siblings, so every member agreeing on the
      phrase derives the byte-identical presence owner. Presence beacons ride this
      OWN record so a heartbeat can never evict the circle chat append-ring (P1).
    signature: "pub fn derive_circle_presence_veilid_owner_seed(entropy: &str, suite: &Suite) -> Result<CirclePresenceVeilidOwnerSeed, CircleKeyError>"
    parameters:
      - name: entropy
        type: "&str"
        direction: in
        description: The shared circle entropy (canonicalized internally, ISC-C9).
      - name: suite
        type: "&Suite"
        direction: in
        description: The suite whose family anchors the derivation.
    returns:
      type: "Result<CirclePresenceVeilidOwnerSeed, CircleKeyError>"
      description: The derived 32-byte VLD0 presence rendezvous-owner seed.
      error_variants:
        - name: Hkdf
          condition: HKDF derivation failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: CirclePresenceVeilidOwnerSeed::as_bytes
    module: daemonseed_core::circle::key
    description: >-
      Borrow the raw 32-byte presence seed to build a VLD0 keypair; callers must
      not copy into a non-zeroizing buffer.
    signature: "pub fn as_bytes(&self) -> &[u8; CIRCLE_VEILID_OWNER_SEED_LEN]"
    parameters: []
    returns:
      type: "&[u8; CIRCLE_VEILID_OWNER_SEED_LEN]"
      description: A borrow of the raw 32-byte presence rendezvous-owner seed.

  - name: circle_fingerprint
    module: daemonseed_core::circle::key
    description: >-
      ISC-C62. A relay-independent `#<12hex>` fingerprint of a circle — a pure
      function of the ISC-C9-canonicalized entropy (SHA-384, first 6 bytes hex).
      The canonical form is zeroed after hashing. Returns a bare `"#"` if the SHA
      backend gate is uninitialized.
    signature: "pub fn circle_fingerprint(entropy: &str) -> String"
    parameters:
      - name: entropy
        type: "&str"
        direction: in
        description: The shared circle phrase.
    returns:
      type: String
      description: The `#<12hex>` fingerprint.

  - name: AeadKey256::aead_key_bytes
    module: daemonseed_core::circle::key
    description: >-
      Borrow the raw 32-byte AEAD key. Callers must not copy it into a
      non-zeroizing buffer. Implemented by both CircleKey and PublicRoomKey.
    signature: "fn aead_key_bytes(&self) -> &[u8; COT_KEY_LEN]"
    parameters: []
    returns:
      type: "&[u8; COT_KEY_LEN]"
      description: A borrow of the raw 32-byte key.

  # ── public_space ────────────────────────────────────────────────────
  - name: content_address
    module: daemonseed_core::public_space
    description: "SHA-384(signed_payload) (ISC-17)."
    signature: "pub fn content_address(signed_payload: &[u8]) -> Result<ContentAddress, oxicrypt_module::Error>"
    parameters:
      - name: signed_payload
        type: "&[u8]"
        direction: in
        description: The signed artifact bytes to address.
    returns:
      type: "Result<ContentAddress, oxicrypt_module::Error>"
      description: The SHA-384 content address.
      error_variants:
        - name: NotOperational
          condition: The oxicrypt module power-up self-test has not passed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: random_announce_slot_cursor
    module: daemonseed_core::public_space
    description: >-
      A uniformly random starting point in the announce record's slot key space, as a hex
      string compared lexicographically against hex(content_address) slot ids. Seeds the
      keep-alive rotation so a session starts at a random slot rather than the lowest.
      An entropy failure yields an empty string, which starts at the first slot.
    signature: "pub fn random_announce_slot_cursor() -> String"
    parameters: []
    returns:
      type: String
      description: A random cursor position in the slot key space.

  - name: first_operator_keepalive_interval
    module: daemonseed_core::public_space
    description: >-
      The jittered delay before an operator's FIRST announce keep-alive emission of a
      session, uniformly random in [OPERATOR_KEEPALIVE_FIRST_MIN,
      OPERATOR_KEEPALIVE_FIRST_MAX]. Short so a brief session still refreshes a slot;
      every later emission uses next_operator_keepalive_interval.
    signature: "pub fn first_operator_keepalive_interval() -> Duration"
    parameters: []
    returns:
      type: Duration
      description: The delay until the session's first announce keep-alive emission.

  - name: next_operator_keepalive_interval
    module: daemonseed_core::public_space
    description: >-
      A fresh operator announce keep-alive delay, uniformly random in
      [OPERATOR_KEEPALIVE_INTERVAL_MIN, OPERATOR_KEEPALIVE_INTERVAL_MAX]. Drawn per
      emission, so the record carries no fixed-period cadence signature and holders do
      not phase-lock (WB-1.2 / WB-3 I6). An entropy failure falls back to the band
      midpoint.
    signature: "pub fn next_operator_keepalive_interval() -> Duration"
    parameters: []
    returns:
      type: Duration
      description: The delay until the next announce keep-alive emission.

  - name: project_announce_pubkey
    module: daemonseed_core::public_space
    description: >-
      project-announce signer key (ISC-15). DEV PLACEHOLDER derived once from
      an in-source seed during the private phase; replaced by a baked-in real
      release pubkey before public launch. Always authorized; operators cannot
      remove it.
    signature: "pub fn project_announce_pubkey() -> &'static [u8; PK_LEN]"
    parameters: []
    returns:
      type: "&'static [u8; PK_LEN]"
      description: The always-authorized project-announce public key.

  - name: ProjectAnnounceSeed::from_bytes
    module: daemonseed_core::public_space
    description: >-
      Wrap a seed already held as bytes. For the loader and for a test building the
      expectation it checks against; a shipped path holds a seed only through
      ProjectAnnounceSeedSource::load.
    signature: "pub fn from_bytes(bytes: [u8; PROJECT_ANNOUNCE_SEED_LEN]) -> Self"
    parameters:
      - name: bytes
        type: "[u8; PROJECT_ANNOUNCE_SEED_LEN]"
        direction: in
        description: The 32-byte seed.
    returns:
      type: ProjectAnnounceSeed
      description: The wrapped seed.

  - name: ProjectAnnounceSeed::parse_hex
    module: daemonseed_core::public_space
    description: >-
      Parse the seed's 64-hex-character text form; surrounding whitespace is ignored.
      The error never carries the text.
    signature: "pub fn parse_hex(text: &str) -> Result<Self, SeedHexError>"
    parameters:
      - name: text
        type: "&str"
        direction: in
        description: The seed as hex.
    returns:
      type: "Result<ProjectAnnounceSeed, SeedHexError>"
      description: The parsed seed.
      error_variants:
        - name: Length
          condition: The trimmed text is not 64 characters long.
        - name: NotHex
          condition: A character is not a hexadecimal digit.

  - name: ProjectAnnounceSeed::signing_keypair
    module: daemonseed_core::public_space
    description: >-
      The ML-DSA-87 keypair the operator signs MOTD and announcements with; its public
      key is project_announce_pubkey for a seed the loader accepted.
    signature: "pub fn signing_keypair(&self) -> Result<SignKeypair, KeyDerivationError>"
    parameters: []
    returns:
      type: "Result<SignKeypair, KeyDerivationError>"
      description: The signing keypair.
      error_variants:
        - name: KeyDerivationError
          condition: ML-DSA key derivation from the seed failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: ProjectAnnounceSeed::announce_owner_seed
    module: daemonseed_core::public_space
    description: The announce record's owner seed, derive_project_announce_veilid_owner_seed over this seed.
    signature: "pub fn announce_owner_seed(&self) -> Result<ProjectAnnounceVeilidOwnerSeed, AnnounceOwnerError>"
    parameters: []
    returns:
      type: "Result<ProjectAnnounceVeilidOwnerSeed, AnnounceOwnerError>"
      description: The derived 32-byte VLD0 owner seed.
      error_variants:
        - name: Hkdf
          condition: HKDF derivation failed.

  - name: ProjectAnnounceSeedSource::new
    module: daemonseed_core::public_space
    description: >-
      A source from the seed variable's value, if it was set, and the seed file
      PROJECT_ANNOUNCE_SEED_FILENAME under profile_root. Both inputs are handed in rather
      than read here. An instance with no profile root can be given the seed only
      through the variable.
    signature: "pub fn new(env: Option<ProjectAnnounceSeedText>, profile_root: Option<&Path>) -> Self"
    parameters:
      - name: env
        type: "Option<ProjectAnnounceSeedText>"
        direction: in
        description: The value of PROJECT_ANNOUNCE_SEED_ENV, if set.
      - name: profile_root
        type: "Option<&Path>"
        direction: in
        description: The profile root the seed file lives under, if any.
    returns:
      type: ProjectAnnounceSeedSource
      description: The source.

  - name: ProjectAnnounceSeedSource::load
    module: daemonseed_core::public_space
    description: >-
      Load the seed and check it against the baked project_announce_pubkey. Ok(None) is an
      instance given no seed; Ok(Some) is the seed and where it came from; every other
      outcome is an error. The variable, if set, is the seed and the file is not
      consulted; a set-but-empty variable is malformed. A missing file is absence; a file
      that exists and cannot be read, is not a regular file, or (on Unix) is readable by
      users other than its owner, is an error.
    signature: "pub fn load(&self) -> Result<Option<(ProjectAnnounceSeed, SeedOrigin)>, ProjectAnnounceSeedError>"
    parameters: []
    returns:
      type: "Result<Option<(ProjectAnnounceSeed, SeedOrigin)>, ProjectAnnounceSeedError>"
      description: The checked seed and its origin, or None for an instance given no seed.
      error_variants:
        - name: Malformed
          condition: The seed text did not parse.
        - name: Unreadable
          condition: The seed file exists but could not be read.
        - name: Permissions
          condition: The seed file is readable by a user other than its owner (Unix).
        - name: Derivation
          condition: ML-DSA key derivation from the seed failed.
        - name: NotTheProjectSeed
          condition: The seed derives a signing key other than the baked one.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: ProjectAnnounceSeedText::from_os_string
    module: daemonseed_core::public_space
    description: Take the variable's value into a zeroed-on-drop buffer; the OsString is consumed.
    signature: "pub fn from_os_string(value: OsString) -> Self"
    parameters:
      - name: value
        type: OsString
        direction: in
        description: The value of PROJECT_ANNOUNCE_SEED_ENV.
    returns:
      type: ProjectAnnounceSeedText
      description: The seed text.

  - name: ProjectAnnounceSeedSource::load_checked
    module: daemonseed_core::public_space
    description: >-
      Load the seed and check it against expected_pubkey. The same contract as load with
      the expectation as a parameter, so the check has a positive control in tests.
    signature: "pub fn load_checked(&self, expected_pubkey: &[u8; PK_LEN]) -> Result<Option<(ProjectAnnounceSeed, SeedOrigin)>, ProjectAnnounceSeedError>"
    parameters:
      - name: expected_pubkey
        type: "&[u8; PK_LEN]"
        direction: in
        description: The ML-DSA-87 public key the seed must derive.
    returns:
      type: "Result<Option<(ProjectAnnounceSeed, SeedOrigin)>, ProjectAnnounceSeedError>"
      description: As load.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: derive_project_announce_veilid_owner_seed
    module: daemonseed_core::public_space
    description: >-
      Derive the project-announce channel's Veilid rendezvous-owner seed (Phase 4
      A1 write-gate) — HKDF-SHA-384(salt=PROJECT_ANNOUNCE_OWNER_SALT,
      ikm=project_seed) expand under PROJECT_ANNOUNCE_VEILID_OWNER. A sibling of the
      content-signing key (same project seed, disjoint derivation), so a holder
      of one cannot derive the other. The project seed is not in the source tree: the
      operator loads it at runtime and only the owner pubkey is baked into clients.
    signature: "pub fn derive_project_announce_veilid_owner_seed(project_seed: &[u8; 32]) -> Result<ProjectAnnounceVeilidOwnerSeed, AnnounceOwnerError>"
    parameters:
      - name: project_seed
        type: "&[u8; 32]"
        direction: in
        description: The maintainer-held project-announce seed.
    returns:
      type: "Result<ProjectAnnounceVeilidOwnerSeed, AnnounceOwnerError>"
      description: The derived 32-byte VLD0 owner seed (the DHT write-gate secret).
      error_variants:
        - name: Hkdf
          condition: HKDF derivation failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: ProjectAnnounceVeilidOwnerSeed::as_bytes
    module: daemonseed_core::public_space
    description: >-
      Borrow the raw 32-byte owner seed to build a VLD0 keypair; callers must not
      copy into a non-zeroizing buffer. Zeroes on drop; Debug redacted.
    signature: "pub fn as_bytes(&self) -> &[u8; PROJECT_ANNOUNCE_VEILID_OWNER_SEED_LEN]"
    parameters: []
    returns:
      type: "&[u8; PROJECT_ANNOUNCE_VEILID_OWNER_SEED_LEN]"
      description: A borrow of the raw 32-byte owner seed.

  - name: AnnounceFreshness::accepts
    module: daemonseed_core::public_space
    description: >-
      The #78 monotonic rollback guard for an operator announce/MOTD record (Phase 4
      A1). Holds last_seen as state (transposition-proof — no reversible second arg);
      accepts an arriving version iff it is >= last_seen (an idempotent re-fetch is
      accepted, a strictly-older slot rolling back a revocation/MOTD is rejected). The
      version MUST be a strictly-monotonic operator counter, never a wall clock (a
      clock step-back would silently drop a legitimate update). `accepts` is a pure
      check; `accept` also advances last_seen to the max on a fresh record. Construct
      via `new` (last_seen 0) or `from_last_seen`.
    signature: "pub fn accepts(&self, incoming: u64) -> bool"
    parameters:
      - name: incoming
        type: "u64"
        direction: in
        description: The version on the arriving record.
    returns:
      type: "bool"
      description: True if the record is at/after last_seen (fresh), false if a rollback.
  - name: AnnounceFreshness::accept
    module: daemonseed_core::public_space
    description: >-
      Accept an arriving record at `incoming`: returns whether it was fresh, advancing
      last_seen to it on a fresh record (an equal re-accept is a no-op advance); a
      strictly-older record is rejected and leaves state unchanged.
    signature: "pub fn accept(&mut self, incoming: u64) -> bool"
    parameters:
      - name: incoming
        type: "u64"
        direction: in
        description: The version on the arriving record.
    returns:
      type: "bool"
      description: True if fresh (and advanced), false if a rejected rollback.

  - name: WhitelistEntry::from_str
    module: daemonseed_core::public_space
    description: Parse one whitelist-file line (ISC-10 / ISC-11).
    signature: "pub fn from_str(s: &str) -> Result<WhitelistEntry, WhitelistParseError>"
    parameters:
      - name: s
        type: "&str"
        direction: in
        description: One whitelist-file line (handle form or hex full key).
    returns:
      type: "Result<WhitelistEntry, WhitelistParseError>"
      description: The parsed entry.
      error_variants:
        - name: Handle
          condition: The handle form failed to parse.
        - name: InvalidPubkeyHex
          condition: The full-key form was not valid hex.
        - name: WrongPubkeyLength
          condition: The decoded key was the wrong length.

  - name: WhitelistEntry::from_full_key_bytes
    module: daemonseed_core::public_space
    description: >-
      Build a FullKey entry from raw ML-DSA-87 pubkey bytes (e.g. a wire
      SignerWhitelistEntry::FullPubkey a client fetched); length-checked.
    signature: "pub fn from_full_key_bytes(bytes: &[u8]) -> Result<WhitelistEntry, WhitelistParseError>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: Raw ML-DSA-87 public key bytes.
    returns:
      type: "Result<WhitelistEntry, WhitelistParseError>"
      description: A FullKey whitelist entry.
      error_variants:
        - name: WrongPubkeyLength
          condition: The byte slice was not PK_LEN long.

  - name: Whitelist::from_entries
    module: daemonseed_core::public_space
    description: >-
      Build from parsed operator entries; is checked unconditionally by
      authorizes(), not stored in entries().
    signature: "pub fn from_entries(entries: Vec<WhitelistEntry>) -> Whitelist"
    parameters:
      - name: entries
        type: "Vec<WhitelistEntry>"
        direction: in
        description: The parsed operator entries.
    returns:
      type: Whitelist
      description: A whitelist over the operator entries plus the implicit entry.

  - name: Whitelist::entries
    module: daemonseed_core::public_space
    description: >-
      Operator entries, for publishing to clients via GetSignerWhitelist (ISC-S8
      / ISC-6).
    signature: "pub fn entries(&self) -> &[WhitelistEntry]"
    parameters: []
    returns:
      type: "&[WhitelistEntry]"
      description: The operator entries (excluding the implicit entry).

  - name: Whitelist::authorizes
    module: daemonseed_core::public_space
    description: >-
      ISC-12 gate: project-announce always authorized; FullKey by exact bytes;
      Handle by SHA-384 hash-prefix match computed without touching the signature.
    signature: "pub fn authorizes(&self, pubkey: &[u8]) -> Result<bool, oxicrypt_module::Error>"
    parameters:
      - name: pubkey
        type: "&[u8]"
        direction: in
        description: The candidate signer public key.
    returns:
      type: "Result<bool, oxicrypt_module::Error>"
      description: True if the key is authorized by the whitelist.
      error_variants:
        - name: NotOperational
          condition: The oxicrypt module power-up self-test has not passed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: verify_artifact
    module: daemonseed_core::public_space
    description: >-
      ISC-A-S3 pipeline, in order (ISC-12): authorize -> ML-DSA-87 verify over the
      exact signed bytes (D-M6-7) -> SHA-384 content-address. The single shared
      server+client trust decision.
    signature: "pub fn verify_artifact(signed_payload: &[u8], signer_pubkey: &[u8], signature: &[u8], whitelist: &Whitelist) -> Result<ContentAddress, ArtifactError>"
    parameters:
      - name: signed_payload
        type: "&[u8]"
        direction: in
        description: The signed artifact bytes.
      - name: signer_pubkey
        type: "&[u8]"
        direction: in
        description: The claimed signer public key.
      - name: signature
        type: "&[u8]"
        direction: in
        description: The detached signature over signed_payload.
      - name: whitelist
        type: "&Whitelist"
        direction: in
        description: The authorization whitelist.
    returns:
      type: "Result<ContentAddress, ArtifactError>"
      description: The verified artifact's content address.
      error_variants:
        - name: UnknownSigner
          condition: The signer is not authorized by the whitelist.
        - name: BadSignature
          condition: The signature did not verify over the exact signed bytes.
        - name: Module
          condition: The oxicrypt module is not operational.
    preconditions:
      - description: The oxicrypt module must be operational.

  # ── crypto::deprecation ─────────────────────────────────────────────
  - name: sign_policy
    module: daemonseed_core::crypto::deprecation
    description: Sign the canonical policy payload (ML-DSA-87).
    signature: "pub fn sign_policy(policy: &DeprecationPolicy, signing: &SignKeypair) -> Result<Vec<u8>, PolicyError>"
    parameters:
      - name: policy
        type: "&DeprecationPolicy"
        direction: in
        description: The policy to sign.
      - name: signing
        type: "&SignKeypair"
        direction: in
        description: The operator signing keypair.
    returns:
      type: "Result<Vec<u8>, PolicyError>"
      description: The signed policy bytes.
      error_variants:
        - name: PolicyError
          condition: The policy was malformed, had too-short cutoff lead, or signing failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: verify_policy
    module: daemonseed_core::crypto::deprecation
    description: Verify + parse a signed policy. The only trusted ingestion path.
    signature: "pub fn verify_policy(bytes: &[u8], pubkey: &[u8; PK_LEN]) -> Result<DeprecationPolicy, PolicyError>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: The signed policy bytes.
      - name: pubkey
        type: "&[u8; PK_LEN]"
        direction: in
        description: The operator public key to verify against.
    returns:
      type: "Result<DeprecationPolicy, PolicyError>"
      description: The verified, parsed policy.
      error_variants:
        - name: PolicyError
          condition: Malformed payload, bad signature, or a rollback to an older version.
    preconditions:
      - description: The oxicrypt module must be operational.

  # ── trust_events ────────────────────────────────────────────────────
  - name: class_of
    module: daemonseed_core::trust_events
    description: Total, pure, no override (A-C12 no-class-degradation).
    signature: "pub fn class_of(key: TrustEventKey) -> TrustEventClass"
    parameters:
      - name: key
        type: TrustEventKey
        direction: in
        description: The trust-event key to classify.
    returns:
      type: TrustEventClass
      description: The affordance class for the key.

  - name: event_key_string
    module: daemonseed_core::trust_events
    description: Frozen-forever stable string form (closes R9).
    signature: "pub fn event_key_string(key: TrustEventKey) -> &'static str"
    parameters:
      - name: key
        type: TrustEventKey
        direction: in
        description: The trust-event key.
    returns:
      type: "&'static str"
      description: The frozen stable string form of the key.

  - name: event_key_from_str
    module: daemonseed_core::trust_events
    description: Parse the frozen stable string form back to a key.
    signature: "pub fn event_key_from_str(s: &str) -> Option<TrustEventKey>"
    parameters:
      - name: s
        type: "&str"
        direction: in
        description: The stable string form.
    returns:
      type: "Option<TrustEventKey>"
      description: The matching key, or None if unrecognized.

  - name: seal_log
    module: daemonseed_core::trust_events
    description: >-
      Argon2id+HKDF-SHA-384 key independent of the at-rest blob; AES-256-GCM with
      the header as AAD.
    signature: "pub fn seal_log(log: &TrustEventLog, passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<Vec<u8>, AuditLogError>"
    parameters:
      - name: log
        type: "&TrustEventLog"
        direction: in
        description: The trust-event log to seal.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID (Argon2 salt).
      - name: params
        type: ArgonParams
        direction: in
        description: The Argon2 work factors.
    returns:
      type: "Result<Vec<u8>, AuditLogError>"
      description: The sealed encrypted log bytes.
      error_variants:
        - name: AuditLogError
          condition: Key derivation or AEAD seal failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: open_log
    module: daemonseed_core::trust_events
    description: Decrypt a sealed trust-event log.
    signature: "pub fn open_log(bytes: &[u8], passphrase: &str) -> Result<TrustEventLog, AuditLogError>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: The sealed log bytes.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
    returns:
      type: "Result<TrustEventLog, AuditLogError>"
      description: The decrypted trust-event log.
      error_variants:
        - name: AuditLogError
          condition: Wrong passphrase or tampered ciphertext (fails closed).
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: assess_deprecation
    module: daemonseed_core::trust_events
    description: >-
      Derive client trust signals from a verified policy; reports only — never
      mutates suite/identity.
    signature: "pub fn assess_deprecation(policy: &DeprecationPolicy, in_use: &[SuiteId], now_ms: u64) -> Vec<DeprecationSignal>"
    parameters:
      - name: policy
        type: "&DeprecationPolicy"
        direction: in
        description: A verified deprecation policy.
      - name: in_use
        type: "&[SuiteId]"
        direction: in
        description: The suites the client currently uses.
      - name: now_ms
        type: u64
        direction: in
        description: The current time (Unix ms).
    returns:
      type: "Vec<DeprecationSignal>"
      description: The derived client trust signals (report-only).

  # ── backoff ─────────────────────────────────────────────────────────
  - name: apply_jitter
    module: daemonseed_core::backoff
    description: >-
      Apply +/-frac jitter to a delay, clamped to >= 0 — the one definition of
      jitter in the workspace.
    signature: "pub fn apply_jitter(delay: Duration, frac: f64, unit: f64) -> Duration"
    parameters:
      - name: delay
        type: Duration
        direction: in
        description: The un-jittered delay.
      - name: frac
        type: f64
        direction: in
        description: The half-width of the jitter band, as a fraction of the delay.
      - name: unit
        type: f64
        direction: in
        description: The point in the band, clamped to [-1, 1].
    returns:
      type: Duration
      description: The jittered delay.

  # ── mention ─────────────────────────────────────────────────────────
  - name: find_self_mentions
    module: daemonseed_core::mention
    description: >-
      Read-only scan keyed on the full wire handle, with word-boundary +
      trailing-hex guards. Does not mutate the plaintext.
    signature: "pub fn find_self_mentions(plaintext: &str, own_handle: &Handle) -> Vec<MentionSpan>"
    parameters:
      - name: plaintext
        type: "&str"
        direction: in
        description: The decrypted chat plaintext.
      - name: own_handle
        type: "&Handle"
        direction: in
        description: The local user's full handle.
    returns:
      type: "Vec<MentionSpan>"
      description: The spans where the own handle is mentioned.

  - name: resolve_mention
    module: daemonseed_core::mention
    description: >-
      Bare display name resolves by exact scope match — one match resolves,
      several are Ambiguous, none is NotFound.
    signature: "pub fn resolve_mention(typed: &str, scope: &[Handle]) -> MentionResolution"
    parameters:
      - name: typed
        type: "&str"
        direction: in
        description: The typed mention token.
      - name: scope
        type: "&[Handle]"
        direction: in
        description: The candidate handles in scope.
    returns:
      type: MentionResolution
      description: Resolved, Ambiguous, or NotFound.

  # ── release ─────────────────────────────────────────────────────────
  - name: verify_multisig
    module: daemonseed_core::release
    description: >-
      Accepts iff >= threshold DISTINCT anchor keys each signed validly. No
      verify-bypass; each key counted once; a non-anchor signature is a hard
      refusal; a wrong-length blob is rejected without panic.
    signature: "pub fn verify_multisig(anchor: &ReleaseAnchor, message: &[u8], signatures: &[&[u8]]) -> Result<(), ReleaseVerifyError>"
    parameters:
      - name: anchor
        type: "&ReleaseAnchor"
        direction: in
        description: The release trust anchor (key set + threshold).
      - name: message
        type: "&[u8]"
        direction: in
        description: The signed release message.
      - name: signatures
        type: "&[&[u8]]"
        direction: in
        description: The candidate signatures to count against the anchor.
    returns:
      type: "Result<(), ReleaseVerifyError>"
      description: Ok if at least threshold distinct anchor keys signed validly.
      error_variants:
        - name: BelowThreshold
          condition: Fewer than threshold distinct anchor keys produced valid signatures.
        - name: UnrecognizedSignature
          condition: A signature matched no anchor key.
        - name: MalformedSignature
          condition: A signature blob was the wrong length / unparseable.
        - name: Module
          condition: The oxicrypt module is not operational.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: "release::bundled"
    module: daemonseed_core::release
    description: >-
      The compile-time release anchor. to_anchor() is None during the pre-public
      phase (no real key yet).
    signature: "pub fn bundled() -> &'static BundledReleaseAnchor"
    parameters: []
    returns:
      type: "&'static BundledReleaseAnchor"
      description: The compile-time-embedded release anchor schema.

  # ── autostart ───────────────────────────────────────────────────────
  - name: unit_descriptor
    module: daemonseed_core::autostart
    description: >-
      Render the autostart unit text for `target`. Pure: no I/O, no process
      spawning, deterministic for a given spec.
    signature: "pub fn unit_descriptor(spec: &AutostartSpec, target: AutostartTarget) -> String"
    parameters:
      - name: spec
        type: "&AutostartSpec"
        direction: in
        description: The profile-specific autostart inputs.
      - name: target
        type: AutostartTarget
        direction: in
        description: Which OS mechanism to render for (systemd / launchd / Windows).
    returns:
      type: String
      description: The rendered autostart unit text (no side effects).
    postconditions:
      - description: No filesystem or process side effects occur; output is deterministic per spec.

  - name: clamp_order_ms
    module: daemonseed_core::transcript
    description: Clamp an untrusted advisory sent_unix_ms into the ordering trust window for the open lobby (#131) — a no-op inside the window, pulling only forged/broken timestamps to an edge. Callers dedup on the ORIGINAL value and cap the high-water at now.
    signature: "pub fn clamp_order_ms(sent_unix_ms: i64, now_ms: i64) -> i64"
    parameters:
      - name: sent_unix_ms
        type: i64
        direction: in
        description: The untrusted advisory sender timestamp.
      - name: now_ms
        type: i64
        direction: in
        description: Local wall-clock now (injected for testability).
    returns:
      type: i64
      description: sent_unix_ms if within [now − 24h, now + 120s], else the nearest window edge.

# ─────────────────────────────────────────────────────────────────────
# Error types — every error/result enum, with recoverability + action.
# ─────────────────────────────────────────────────────────────────────

error_types:
  - name: MnemonicError
    module: daemonseed_core::identity::mnemonic
    variants:
      - name: MnemonicError
        description: Generation or parsing/checksum failure for a BIP-39 phrase.
        recoverable: true
        user_action: Re-check the 24-word phrase, or retry generation with fresh entropy.

  - name: KeyDerivationError
    module: daemonseed_core::identity::keys
    variants:
      - name: KeyDerivationError
        description: HKDF, oxicrypt-module, or KEM keygen failure.
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized before derivation.

  - name: SignatureError
    module: daemonseed_core::identity::keys
    variants:
      - name: Module
        description: Wraps oxicrypt_module::Error (e.g. module not operational).
        recoverable: false
        user_action: Call oxicrypt_module::initialize() before signing/verifying.
      - name: BadSignature
        description: >-
          Uniform verify failure across tampered-message / wrong-key / forged-sig
          (A-S12 / A-C18) — the sub-cause is intentionally indistinguishable.
        recoverable: false
        user_action: Do not trust the message; the signature is invalid.

  - name: ChannelBindingError
    module: daemonseed_core::identity_proof
    variants:
      - name: Export
        description: The TLS exporter call failed (e.g. handshake incomplete).
        recoverable: false
        user_action: Ensure the TLS handshake completed before deriving the binding.

  - name: ProfileConfigError
    module: daemonseed_core::profile::config
    variants:
      - name: Toml
        description: TOML parse error (syntax or type mismatch).
        recoverable: true
        user_action: Fix the daemonseed.toml syntax and retry.
      - name: MissingProfileId
        description: The required `profile_id` field is absent (ISC-C36).
        recoverable: false
        user_action: Recover from .dseed or re-enroll; startup is refused without it.
      - name: InvalidProfileId
        description: The `profile_id` field is present but not a valid UUID.
        recoverable: false
        user_action: Restore the correct profile_id from .dseed, or re-enroll.
      - name: Serialize
        description: TOML serialization failed.
        recoverable: false
        user_action: Report a bug; serialization of a valid config should not fail.

  - name: ResolveError
    module: daemonseed_core::profile::resolve
    variants:
      - name: ResolveError
        description: A filesystem or parse failure during profile-root resolution.
        recoverable: true
        user_action: Check the --config path / XDG dirs and retry.

  - name: BlobError
    module: daemonseed_core::storage::seeds
    variants:
      - name: AuthenticationFailed
        description: >-
          Uniform across wrong-passphrase / wrong-profile-id / wrong-argon-params
          / ciphertext-tamper (constant-time-friendly).
        recoverable: true
        user_action: Re-enter the passphrase; if it persists, recover from .dseed.
      - name: UnknownSuite
        description: The blob's suite id is not in the registry.
        recoverable: false
        user_action: Upgrade to a build whose registry includes the suite.
      - name: SuiteIdSentinel
        description: The decoded suite id is a reserved sentinel.
        recoverable: false
        user_action: The blob is malformed or tampered; do not trust it.
      - name: WriteRefused
        description: The active write-suite is not in an ActiveWrite state.
        recoverable: false
        user_action: Migrate to an active write-suite per the deprecation policy.

  - name: RecoveryFileError
    module: daemonseed_core::storage::recovery_file
    variants:
      - name: AuthenticationFailed
        description: >-
          Wrong passphrase or tampered file — header tamper changes the derived
          key so AEAD fails closed.
        recoverable: true
        user_action: Re-enter the passphrase for the .dseed file.
      - name: UnknownSuite
        description: The header suite id is not in the registry.
        recoverable: false
        user_action: Upgrade to a build whose registry includes the suite.
      - name: SuiteIdSentinel
        description: The header suite id is a reserved sentinel.
        recoverable: false
        user_action: The file is malformed or tampered; do not trust it.
      - name: WriteRefused
        description: The chosen write-suite is not in an ActiveWrite state.
        recoverable: false
        user_action: Re-seal under an active write-suite.

  - name: CasError
    module: daemonseed_core::storage::cas
    variants:
      - name: Hash
        description: Wraps oxicrypt_module::Error during chunk addressing.
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized.
      - name: Io
        description: A filesystem error in the persistent FileChunkStore.
        recoverable: true
        user_action: Check disk space / permissions on the chunk-cache directory.
      - name: CorruptRefcount
        description: A refcount sidecar file could not be parsed.
        recoverable: false
        user_action: Drop the corrupt chunk-cache entry; it will be re-fetched.

  - name: IndexError
    module: daemonseed_core::storage::share_index
    variants:
      - name: Db
        description: Underlying redb storage error.
        recoverable: true
        user_action: Check disk / permissions; reopen the index.
      - name: Crypto
        description: AES-GCM init/seal/open failure including tamper auth-fail.
        recoverable: false
        user_action: Verify the index key; tamper fails closed (never garbage).
      - name: Corrupt
        description: A stored value could not be decoded after decryption.
        recoverable: false
        user_action: Rebuild the index via a cold_scan.
      - name: Entropy
        description: CSPRNG nonce generation failed.
        recoverable: true
        user_action: Retry the write; if it persists, check the system RNG.

  - name: WatchError
    module: daemonseed_core::indexer
    variants:
      - name: Limit
        description: OS watch limit exceeded (fs.inotify.max_user_watches).
        recoverable: true
        user_action: Fall back to periodic mtime_rescan, or raise the OS watch limit.
      - name: Io
        description: Underlying notify watcher error.
        recoverable: true
        user_action: Retry watching, or fall back to mtime_rescan.

  - name: FirstStartError
    module: daemonseed_core::first_start
    variants:
      - name: FirstStartError
        description: Passphrase-too-weak / seed-failed / display-name-invalid / etc.
        recoverable: true
        user_action: Address the reported issue (stronger passphrase, valid name) and retry the step.

  - name: SuiteIdError
    module: daemonseed_core::crypto::suite
    variants:
      - name: Sentinel
        description: The raw value is a reserved sentinel (0x0000 or 0xFFFF).
        recoverable: false
        user_action: Use a non-sentinel suite id.

  - name: WriteRefusal
    module: daemonseed_core::crypto::suite
    variants:
      - name: Unknown
        description: The suite id is not in the registry.
        recoverable: false
        user_action: Use a registered suite id.
      - name: Proposed
        description: The suite is Proposed, not yet active for writes.
        recoverable: false
        user_action: Wait until the suite becomes ActiveWrite, or pick an active suite.
      - name: ActiveReadOnly
        description: The suite is read-only-active, not write-selectable.
        recoverable: false
        user_action: Select the current ActiveWrite suite for new writes.
      - name: Deprecated
        description: The suite is deprecated read-only.
        recoverable: false
        user_action: Migrate to the recommended suite from the deprecation policy.
      - name: Removed
        description: The suite has been removed.
        recoverable: false
        user_action: Migrate to a supported suite.

  - name: NegotiationError
    module: daemonseed_core::version
    variants:
      - name: NoCommonVersion
        description: No mutually supported protocol version.
        recoverable: false
        user_action: Upgrade one peer so the supported sets overlap.
      - name: OutOfSetAck
        description: The peer ACKed a version not in the offered set.
        recoverable: false
        user_action: Treat as a hard close; the peer is misbehaving.
      - name: ZeroRttForbidden
        description: Application data arrived before negotiation completed.
        recoverable: false
        user_action: Do not send application data before APP_HELLO_ACK.
      - name: MalformedPeerOffer
        description: A peer offer failed to decode (wraps VersionError).
        recoverable: false
        user_action: Treat as a hard close; the peer offer is malformed.

  - name: VersionError
    module: daemonseed_core::version
    variants:
      - name: OutOfRange
        description: A wire u32 field exceeds the u16 in-memory range.
        recoverable: false
        user_action: Reject the offer; the version field is out of range.

  - name: TrustDecision
    module: daemonseed_core::federation::trust
    variants:
      - name: Accept
        description: The presented key is accepted (not an error path).
        recoverable: true
        user_action: Proceed with the connection.
      - name: AcceptWithRotation
        description: Accepted, but a key rotation is surfaced to the user.
        recoverable: true
        user_action: Acknowledge or dismiss the rotation notice.
      - name: Refuse
        description: Fail-closed refusal (ISC-45).
        recoverable: false
        user_action: Do not connect; verify the server key out-of-band.

  - name: CircleKeyError
    module: daemonseed_core::circle
    variants:
      - name: Hkdf
        description: HKDF derivation failed (wraps oxicrypt_kdf::KdfError).
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized.

  - name: WhitelistParseError
    module: daemonseed_core::public_space
    variants:
      - name: Handle
        description: The handle form of a whitelist line failed to parse.
        recoverable: true
        user_action: Fix the handle syntax on the offending whitelist line.
      - name: InvalidPubkeyHex
        description: The full-key form was not valid hex.
        recoverable: true
        user_action: Correct the hex public key on the offending line.
      - name: WrongPubkeyLength
        description: The decoded key was the wrong length.
        recoverable: true
        user_action: Supply a full-length ML-DSA-87 public key.

  - name: ArtifactError
    module: daemonseed_core::public_space
    variants:
      - name: UnknownSigner
        description: The signer is not authorized by the whitelist.
        recoverable: false
        user_action: Add the signer to the operator whitelist, or reject the artifact.
      - name: BadSignature
        description: The signature did not verify over the exact signed bytes.
        recoverable: false
        user_action: Reject the artifact; it was not validly signed.
      - name: Module
        description: Wraps oxicrypt_module::Error.
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized.

  - name: PolicyError
    module: daemonseed_core::crypto::deprecation
    variants:
      - name: PolicyError
        description: >-
          Build/parse/verify failure — malformed payload, too-short cutoff lead,
          bad signature, or a rollback to an older policy version.
        recoverable: false
        user_action: Reject the policy; a rollback is an attack signal.

  - name: AuditLogError
    module: daemonseed_core::trust_events
    variants:
      - name: AuditLogError
        description: Key derivation or AES-GCM seal/open failure for the audit log.
        recoverable: true
        user_action: Re-enter the passphrase; tampered ciphertext fails closed.

  - name: AnchorError
    module: daemonseed_core::release
    variants:
      - name: NoKeys
        description: The anchor was constructed with an empty key set.
        recoverable: false
        user_action: Provide at least one release-signing key.
      - name: ThresholdOutOfRange
        description: The N-of-M threshold is zero or exceeds the key count.
        recoverable: false
        user_action: Set 1 <= threshold <= number of keys.

  - name: ReleaseVerifyError
    module: daemonseed_core::release
    variants:
      - name: BelowThreshold
        description: Fewer than threshold distinct anchor keys signed validly.
        recoverable: false
        user_action: Reject the release; do not install it.
      - name: UnrecognizedSignature
        description: A signature matched no anchor key.
        recoverable: false
        user_action: Reject the release; the signer is not trusted.
      - name: MalformedSignature
        description: A signature blob was the wrong length / unparseable.
        recoverable: false
        user_action: Reject the release artifact.
      - name: Module
        description: Wraps oxicrypt_module::Error.
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized.

  - name: ConfirmError
    module: daemonseed_core::release
    variants:
      - name: NotVerified
        description: confirm() was called outside the Verified state.
        recoverable: true
        user_action: Verify the update before confirming.
      - name: DowngradeNotAcknowledged
        description: A downgrade was confirmed without explicit acknowledgement.
        recoverable: true
        user_action: Re-call confirm() with the downgrade acknowledgement flag set.

  - name: BiometricError
    module: daemonseed_core::biometric
    variants:
      - name: Unavailable
        description: No enclave on this platform, or biometric unlock is not enrolled.
        recoverable: false
        user_action: Fall back to passphrase entry; offer enrollment if supported.
      - name: NotFound
        description: Nothing is stored for this profile.
        recoverable: true
        user_action: Prompt for the passphrase and store it if the user opts in.
      - name: Backend
        description: The platform backend returned an error (string is backend-specific).
        recoverable: true
        user_action: Retry, or fall back to passphrase entry.

  - name: AutostartError
    module: daemonseed_core::autostart
    variants:
      - name: Unsupported
        description: The target mechanism is unavailable on this platform.
        recoverable: false
        user_action: Choose a target supported by the host OS.
      - name: Backend
        description: The platform backend returned an error.
        recoverable: true
        user_action: Retry; check permissions for installing the autostart unit.

# ─────────────────────────────────────────────────────────────────────
# Constants — named constants the API exposes.
# ─────────────────────────────────────────────────────────────────────

constants:
  - name: PROJECT_ANNOUNCE_SEED_ENV
    module: daemonseed_core::public_space
    type: "&str"
    value: '"DAEMONSEED_PROJECT_ANNOUNCE_SEED"'
    description: Environment variable carrying the project-announce seed as 64 hex characters; read before the seed file.
  - name: PROJECT_ANNOUNCE_SEED_FILENAME
    module: daemonseed_core::public_space
    type: "&str"
    value: '"project-announce.seed"'
    description: Name of the file under the profile root holding the project-announce seed as 64 hex characters; must be readable by its owner only.
  - name: PROJECT_ANNOUNCE_SEED_LEN
    module: daemonseed_core::public_space
    type: usize
    value: "32"
    description: Length of the project-announce seed in bytes.
  - name: WORD_COUNT
    module: daemonseed_core::identity::mnemonic
    type: usize
    value: "24"
    description: BIP-39 mnemonic length pinned at 24 words (256-bit entropy).

  - name: TRANSCRIPT_MAX_BACKLOG_AGE
    module: daemonseed_core::transcript
    type: Duration
    value: "24h"
    description: Past bound of the #131 ordering trust window; must exceed the longest a message legitimately lives in the DHT rendezvous ring so real backlog is never clamped.
  - name: TRANSCRIPT_MAX_CLOCK_SKEW
    module: daemonseed_core::transcript
    type: Duration
    value: "120s"
    description: Future bound of the #131 ordering trust window (clock-skew tolerance); a timestamp beyond it is a bad clock or a forgery.

  - name: ML_DSA_SEED_LEN
    module: daemonseed_core::identity::keys
    type: usize
    value: "32"
    description: "ML-DSA-87 seed length (FIPS 204 §5.1); the raw seed a server persists."

  - name: IDENTITY_PK_LEN
    module: daemonseed_core::identity::keys
    type: usize
    value: "ml_dsa::PK_LEN"
    description: "Width of a long-term identity public key in bytes (ML-DSA-87, FIPS 204); the length SignKeypair::public_key returns."

  - name: CHANNEL_BINDING_LABEL
    module: daemonseed_core::identity_proof
    type: "&[u8]"
    value: '"daemonseed/identity-proof/v1" (= kdf::info::IDENTITY_PROOF_V1.as_bytes())'
    description: TLS 1.3 exporter label. Single source of truth in the kdf-info registry.

  - name: CHANNEL_BINDING_LEN
    module: daemonseed_core::identity_proof
    type: usize
    value: "32"
    description: Length in bytes of the derived TLS-exporter channel binding.

  - name: SKEW_WINDOW_MS
    module: daemonseed_core::identity_proof
    type: u64
    value: "300000"
    description: >-
      +/-5min freshness window (decision D1). Hosts MUST run NTP — drift beyond
      this fails identity-proof.

  - name: IDENTITY_ROOT_SALT
    module: daemonseed_core::kdf::info
    type: "&str"
    value: '"daemonseed/v1/identity-root"'
    description: HKDF salt for the identity-root derivation.

  - name: DOMAIN_SIGN
    module: daemonseed_core::kdf::info
    type: "&str"
    value: '"sign"'
    description: Domain string for the signing-key branch.

  - name: DOMAIN_KEM_D
    module: daemonseed_core::kdf::info
    type: "&str"
    value: '"kem-d"'
    description: Domain string for the KEM decapsulation-key branch.

  - name: DOMAIN_KEM_Z
    module: daemonseed_core::kdf::info
