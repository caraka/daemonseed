# ─────────────────────────────────────────────────────────────────────
# daemonseed-cli — LAMA API Manifest
#
# A library (no binary): the Veilid clients' shared, transport-independent
# authoring surface. Two modules — `route_signer` (the least-authority
# route-advert signing capability handed to daemonseed-veilid-net) and
# `public_space` (announcement / MOTD authoring, render, and client-side
# re-verification helpers).
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Core crate: ./daemonseed-core-api.yaml
# - Veilid transport: ./daemonseed-veilid-net-api.yaml
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-cli
  version: "0.1.0"
  description: "The Veilid clients' shared authoring library: least-authority route-advert signing (`route_signer`) plus announcement/MOTD authoring, render, and re-verification helpers (`public_space`). No binary; no transport."
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-cli"

# ─────────────────────────────────────────────────────────────────────
# Modules
# ─────────────────────────────────────────────────────────────────────

modules:
  - name: daemonseed_cli::route_signer
    description: >-
      The least-authority RouteAdvertSigner adapter. Wraps the profile's
      stable ML-DSA-87 identity key and signs ONLY share route adverts;
      daemonseed-veilid-net receives it as an Arc<dyn RouteAdvertSigner> and
      can invoke route-advert signing without ever holding or reading the key.
    no_std: false
    depends_on: [daemonseed-core, daemonseed-veilid-net]
    iscs: [S27, S28]

  - name: daemonseed_cli::public_space
    description: >-
      Transport-independent announcement/MOTD data plumbing: author signed
      MOTDs and posts, render a signed MOTD as inert plaintext, re-verify
      served artifacts client-side, gate the composer on the signer whitelist,
      and select/filter share listings.
    no_std: false
    depends_on: [daemonseed-core, daemonseed-proto]
    iscs: [S7, S8, S9, "25", "26", "30", "31", "32", C16, A-C3, A-C5, A-S3]

# ─────────────────────────────────────────────────────────────────────
# Types
# ─────────────────────────────────────────────────────────────────────

types:
  - name: IdentityRouteAdvertSigner
    module: daemonseed_cli::route_signer
    kind: struct
    description: >-
      Signs a share's route advert with the held stable identity key. Holds
      the key behind an Arc so the single non-Clone SignKeypair can serve both
      announcement sealing and this route-advert capability without a second
      copy of the secret.
    implements: [RouteAdvertSigner]

  - name: RatingError
    module: daemonseed_cli::public_space
    kind: enum
    description: select_rating failure — the choice is not in the active server's taxonomy.
    variants:
      - name: NotInTaxonomy
        description: The chosen label is not in the active server's taxonomy.

  - name: WhitelistConvertError
    module: daemonseed_cli::public_space
    kind: enum
    description: whitelist_from_wire failure converting fetched SignerWhitelistEntry wire entries to a core Whitelist.
    variants:
      - name: EmptyEntry
        description: A SignerWhitelistEntry had no `entry` oneof set.
      - name: "BadKey(WhitelistParseError)"
        description: A full-key entry was the wrong length.
      - name: "BadHandle(HandleParseError)"
        description: A handle entry didn't parse as "<name>#<hash>".

  - name: ServedVerifyError
    module: daemonseed_cli::public_space
    kind: enum
    description: Client re-verification failure for a served post or MOTD.
    variants:
      - name: Missing
        description: A Post carried no `artifact`.
      - name: "Verify(ArtifactError)"
        description: Signature / whitelist verification failed.
      - name: AddressMismatch
        description: The server-asserted content address didn't match the client-derived one.

  - name: MotdAuthorError
    module: daemonseed_cli::public_space
    kind: enum
    description: sign_motd failure — invalid MOTD text or a signing failure.
    variants:
      - name: NotPlaintext
        description: The text is not single-line plaintext (ISC-S9).
      - name: "Sign(SignatureError)"
        description: Signing the payload with the local identity key failed.

# ─────────────────────────────────────────────────────────────────────
# Functions
# ─────────────────────────────────────────────────────────────────────

functions:

  # ── daemonseed_cli::route_signer ──────────────────────────────────

  - name: "IdentityRouteAdvertSigner::new"
    module: daemonseed_cli::route_signer
    description: Wrap the profile's stable signing key as a route-advert capability, taking sole ownership of the key.
    signature: "pub fn new(key: SignKeypair) -> Self"
    parameters:
      - name: key
        type: SignKeypair
        direction: in
        description: The profile's stable ML-DSA-87 identity keypair.
    returns:
      type: Self
      description: A route-advert signer owning the key behind an Arc.

  - name: "IdentityRouteAdvertSigner::from_arc"
    module: daemonseed_cli::route_signer
    description: >-
      Wrap a SHARED reference to the stable signing key — for a caller (the GUI
      / TUI net actor) that retains the same Arc<SignKeypair> to seal share
      announcements with. Cheap Arc clone, no second copy of the secret.
    signature: "pub fn from_arc(key: Arc<SignKeypair>) -> Self"
    parameters:
      - name: key
        type: "Arc<SignKeypair>"
        direction: in
        description: The shared stable identity keypair the caller also seals with.
    returns:
      type: Self
      description: A route-advert signer sharing the caller's key Arc.

  - name: "IdentityRouteAdvertSigner::into_arc"
    module: daemonseed_cli::route_signer
    description: As the Arc<dyn RouteAdvertSigner> that VeilidNetHandle::publish_share takes.
    signature: "pub fn into_arc(self) -> Arc<dyn RouteAdvertSigner>"
    parameters: []
    returns:
      type: "Arc<dyn RouteAdvertSigner>"
      description: The signer as the trait object the transport crate consumes.

  - name: "IdentityRouteAdvertSigner::sign_route_advert"
    module: daemonseed_cli::route_signer
    description: >-
      Sign share_id ‖ route_blob (via veilid-net's route_provenance_input) with
      the held key. The RouteAdvertSigner trait impl daemonseed-veilid-net calls.
    signature: "fn sign_route_advert(&self, share_id: &str, route_blob: &[u8]) -> daemonseed_veilid_net::Result<Vec<u8>>"
    parameters:
      - name: share_id
        type: "&str"
        direction: in
        description: The share whose route advert is being signed.
      - name: route_blob
        type: "&[u8]"
        direction: in
        description: The route advertisement bytes to bind under the signature.
    returns:
      type: "daemonseed_veilid_net::Result<Vec<u8>>"
      description: The detached ML-DSA-87 signature, or a Send error if the module was not operational.
    iscs: [S27, S28]

  # ── daemonseed_cli::public_space ──────────────────────────────────

  - name: render_motd
    module: daemonseed_cli::public_space
    description: >-
      Render a signed MOTD as inert plaintext (ISC-25): decode the MotdPayload
      and return its text with terminal control sequences stripped (ESC and
      other C0/C1, keeping newline and tab). No markup or link interpretation.
    signature: "pub fn render_motd(motd: &wire::SignedArtifact) -> String"
    parameters:
      - name: motd
        type: "&wire::SignedArtifact"
        direction: in
        description: The signed MOTD artifact whose payload text is rendered.
    returns:
      type: String
      description: The sanitized plaintext; a payload that fails to decode renders as empty.
    iscs: ["25"]

  - name: post_render_fields
    module: daemonseed_cli::public_space
    description: >-
      Decode a served post's inner payload into (topic, body, signed_timestamp_ms)
      for client rendering (ISC-S7). A payload that fails to decode renders as
      empty; provenance is a separate concern (pair with verify_served_post).
    signature: "pub fn post_render_fields(post: &wire::Post) -> (String, String, i64)"
    parameters:
      - name: post
        type: "&wire::Post"
        direction: in
        description: The served announcement post whose payload is decoded for display.
    returns:
      type: "(String, String, i64)"
      description: "(topic, body, signed_timestamp_ms); empty strings / 0 on decode failure."
    iscs: ["S7"]

  - name: select_rating
    module: daemonseed_cli::public_space
    description: >-
      Choose a rating only from the active server's taxonomy (ISC-30 / ISC-31);
      out-of-taxonomy is rejected.
    signature: "pub fn select_rating(taxonomy: &[String], choice: &str) -> Result<String, RatingError>"
    parameters:
      - name: taxonomy
        type: "&[String]"
        direction: in
        description: The active server's published rating labels.
      - name: choice
        type: "&str"
        direction: in
        description: The label the client wants to apply.
    returns:
      type: "Result<String, RatingError>"
      description: The accepted label, or a taxonomy rejection.
      error_variants:
        - name: NotInTaxonomy
          condition: The chosen label is not in the active server's taxonomy.
    iscs: ["30", "31"]

  - name: filter_shares_by_rating
    module: daemonseed_cli::public_space
    description: >-
      The client's rating filter, applied at render AND fetch time (ISC-A-S5b).
      None returns everything; Some(label) keeps only shares carrying that
      advisory rating.
    signature: "pub fn filter_shares_by_rating<'a>(shares: &'a [ShareListing], rating: Option<&str>) -> Vec<&'a ShareListing>"
    parameters:
      - name: shares
        type: "&'a [ShareListing]"
        direction: in
        description: The listing to filter.
      - name: rating
        type: "Option<&str>"
        direction: in
        description: None for all shares; Some(label) to keep only that rating.
    returns:
      type: "Vec<&'a ShareListing>"
      description: The borrowed subset of shares matching the filter.
    iscs: ["32", A-C5]

  - name: filter_shares_excluding_hidden
    module: daemonseed_cli::public_space
    description: >-
      The client's hidden-shares filter (ISC-C16 / ISC-A-C3): drop listings
      whose sharer_handle is in the recipient's hide set. Listings with an empty
      sharer_handle are always kept. Nothing leaves the client.
    signature: "pub fn filter_shares_excluding_hidden<'a>(shares: &'a [ShareListing], hidden: &std::collections::BTreeSet<String>) -> Vec<&'a ShareListing>"
    parameters:
      - name: shares
        type: "&'a [ShareListing]"
        direction: in
        description: The listing to filter.
      - name: hidden
        type: "&std::collections::BTreeSet<String>"
        direction: in
        description: Full wire handles whose listings to suppress.
    returns:
      type: "Vec<&'a ShareListing>"
      description: The borrowed subset minus hidden-sharer rows.
    iscs: [C16, A-C3]

  - name: whitelist_from_wire
    module: daemonseed_cli::public_space
    description: >-
      Rebuild a core Whitelist from published wire entries (ISC-S8 / ISC-6).
      server_pubkey=Some(..) adds the server's own key for MOTD verification
      (ISC-26); None for the post whitelist.
    signature: "pub fn whitelist_from_wire(entries: &[wire::SignerWhitelistEntry], server_pubkey: Option<&[u8]>) -> Result<Whitelist, WhitelistConvertError>"
    parameters:
      - name: entries
        type: "&[wire::SignerWhitelistEntry]"
        direction: in
        description: The fetched published whitelist wire entries.
      - name: server_pubkey
        type: "Option<&[u8]>"
        direction: in
        description: Some(server pubkey) to add the server's own MOTD key; None for the post whitelist.
    returns:
      type: "Result<Whitelist, WhitelistConvertError>"
      description: A core Whitelist, or a conversion failure.
      error_variants:
        - name: EmptyEntry
          condition: A SignerWhitelistEntry had no `entry` oneof set.
        - name: "BadKey(WhitelistParseError)"
          condition: A full-key entry was the wrong length.
        - name: "BadHandle(HandleParseError)"
          condition: A handle entry didn't parse as "<name>#<hash>".
    iscs: [S8, "6", "26"]

  - name: verify_served_post
    module: daemonseed_cli::public_space
    description: >-
      Client half of verify-and-serve (ISC-A-S3): re-run verify_artifact against
      the published whitelist AND re-derive the content address, rejecting any
      server-asserted-address mismatch.
    signature: "pub fn verify_served_post(post: &wire::Post, whitelist: &Whitelist) -> Result<(), ServedVerifyError>"
    parameters:
      - name: post
        type: "&wire::Post"
        direction: in
        description: The server-served post to re-verify.
      - name: whitelist
        type: "&Whitelist"
        direction: in
        description: The published whitelist to verify the artifact against.
    returns:
      type: "Result<(), ServedVerifyError>"
      description: Ok if the post verifies and its content address matches; an error otherwise.
      error_variants:
        - name: Missing
          condition: The Post carried no `artifact`.
        - name: "Verify(ArtifactError)"
          condition: Signature or whitelist verification failed.
        - name: AddressMismatch
          condition: The server-asserted content address didn't match the client-derived one.
    iscs: [A-S3]

  - name: verify_served_motd
    module: daemonseed_cli::public_space
    description: >-
      Client half of verify-and-serve (ISC-A-S3 / ISC-26): re-verify a served
      MOTD against a whitelist that includes the server key (build it via
      whitelist_from_wire with server_pubkey=Some(..)).
    signature: "pub fn verify_served_motd(motd: &wire::SignedArtifact, whitelist: &Whitelist) -> Result<(), ServedVerifyError>"
    parameters:
      - name: motd
        type: "&wire::SignedArtifact"
        direction: in
        description: The server-served MOTD to re-verify.
      - name: whitelist
        type: "&Whitelist"
        direction: in
        description: A whitelist that includes the server's own key.
    returns:
      type: "Result<(), ServedVerifyError>"
      description: Ok if the MOTD verifies against the whitelist; an error otherwise.
      error_variants:
        - name: "Verify(ArtifactError)"
          condition: Signature or whitelist verification failed.
    iscs: [A-S3, "26"]

  - name: sign_post
    module: daemonseed_cli::public_space
    description: >-
      Author a signed announcement post (ISC-S7): build the inner PostPayload,
      prost-encode it, and sign with the local identity key into a SignedArtifact
      that re-verifies against the signer whitelist.
    signature: "pub fn sign_post(kp: &SignKeypair, topic: &str, body: &str, signed_timestamp_ms: i64) -> Result<wire::SignedArtifact, SignatureError>"
    parameters:
      - name: kp
        type: "&SignKeypair"
        direction: in
        description: The local identity's signing keypair.
      - name: topic
        type: "&str"
        direction: in
        description: Operator-defined topic id to post into.
      - name: body
        type: "&str"
        direction: in
        description: The post body.
      - name: signed_timestamp_ms
        type: i64
        direction: in
        description: Signer wall-clock milliseconds; orders posts within a topic.
    returns:
      type: "Result<wire::SignedArtifact, SignatureError>"
      description: The signed post artifact, or a signing failure.
      error_variants:
        - name: "Module(oxicrypt_module::Error)"
          condition: The oxicrypt module was not operational for signing.
    iscs: ["S7"]

  - name: sign_motd
    module: daemonseed_cli::public_space
    description: >-
      Author a signed MOTD (ISC-S9): enforce the shared single-line-plaintext
      rule (motd_text_is_valid) before encoding and signing the inner MotdPayload.
    signature: "pub fn sign_motd(kp: &SignKeypair, text: &str, signed_timestamp_ms: i64) -> Result<wire::SignedArtifact, MotdAuthorError>"
    parameters:
      - name: kp
        type: "&SignKeypair"
        direction: in
        description: The local identity's signing keypair.
      - name: text
        type: "&str"
        direction: in
        description: The plaintext MOTD; rejected if not single-line plaintext.
      - name: signed_timestamp_ms
        type: i64
        direction: in
        description: Signer wall-clock milliseconds; latest validated update wins.
    returns:
      type: "Result<wire::SignedArtifact, MotdAuthorError>"
      description: The signed MOTD artifact, or a plaintext / signing failure.
      error_variants:
        - name: NotPlaintext
          condition: The text is not single-line plaintext (ISC-S9).
        - name: "Sign(SignatureError)"
          condition: Signing the payload with the local identity key failed.
    iscs: ["S9"]

  - name: sign_post_delete
    module: daemonseed_cli::public_space
    description: >-
      Author a signed delete of one's own post (ISC-S7): build and sign a
      PostDeletePayload over the target post's content address.
    signature: "pub fn sign_post_delete(kp: &SignKeypair, content_address: &[u8], signed_timestamp_ms: i64) -> Result<wire::SignedArtifact, SignatureError>"
    parameters:
      - name: kp
        type: "&SignKeypair"
        direction: in
        description: The local identity's signing keypair.
      - name: content_address
        type: "&[u8]"
        direction: in
        description: SHA-384 content address of the post to delete.
      - name: signed_timestamp_ms
        type: i64
        direction: in
        description: Signer wall-clock milliseconds (freshness).
    returns:
      type: "Result<wire::SignedArtifact, SignatureError>"
      description: The signed delete artifact, or a signing failure.
      error_variants:
        - name: "Module(oxicrypt_module::Error)"
          condition: The oxicrypt module was not operational for signing.
    iscs: ["S7"]

  - name: local_key_is_whitelisted
    module: daemonseed_cli::public_space
    description: >-
      Signer self-determination (ISC-S8): true iff the local pubkey is authorized
      by the published whitelist, gating the in-client authoring composer with no
      admin login.
    signature: "pub fn local_key_is_whitelisted(local_pubkey: &[u8], entries: &[wire::SignerWhitelistEntry]) -> Result<bool, WhitelistConvertError>"
    parameters:
      - name: local_pubkey
        type: "&[u8]"
        direction: in
        description: The local identity's public key.
      - name: entries
        type: "&[wire::SignerWhitelistEntry]"
        direction: in
        description: The published whitelist wire entries.
    returns:
      type: "Result<bool, WhitelistConvertError>"
      description: Whether the local key is authorized, or a conversion / authorization failure.
      error_variants:
        - name: EmptyEntry
          condition: A SignerWhitelistEntry had no `entry` oneof set.
        - name: "BadKey(WhitelistParseError)"
          condition: A full-key entry was the wrong length.
        - name: "BadHandle(HandleParseError)"
          condition: A handle entry didn't parse as "<name>#<hash>".
        - name: "Module(oxicrypt_module::Error)"
          condition: The oxicrypt module was not operational for the hash-prefix authorization check.
    iscs: [S8]

  - name: composer_visible
    module: daemonseed_cli::public_space
    description: >-
      The composer-gating decision (ISC-S8 / D3): true iff the local stable
      identity key is on the published signer whitelist. Fail-closed — any
      conversion / authorization error yields false. Both the GUI and TUI gate
      the MOTD/announcement composer affordance on this.
    signature: "pub fn composer_visible(local_pubkey: &[u8], entries: &[wire::SignerWhitelistEntry]) -> bool"
    parameters:
      - name: local_pubkey
        type: "&[u8]"
        direction: in
        description: The local stable identity's public key.
      - name: entries
        type: "&[wire::SignerWhitelistEntry]"
        direction: in
        description: The published whitelist wire entries.
    returns:
      type: bool
      description: Whether to show the composer (true) or keep the pane read-only (false, incl. on any whitelist error).
    iscs: [S8]
