# ─────────────────────────────────────────────────────────────────────
# daemonseed-server — LAMA API Manifest (M4a commit 4 in flight)
#
# The server crate gained config / identity / TLS modules at M4a commit 3
# and the runtime / HELLO frame I/O / KATS modules at M4a commit 4 on
# top of the v0.4.0 placeholder. The CLI initiator lands in commit 5;
# integration tests + Wu et al. fixture in commit 6.
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Core crate: ./daemonseed-core-api.yaml
# - Wire schema: ./daemonseed-proto-protocol.yaml
# - oxitls TLS provider: external sibling crate (private during pre-public phase)
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-server
  version: "0.1.0"
  description: "Relay daemon binary + library. M4a landed the TCP runtime + APP_HELLO frame I/O + SIGTERM shutdown; M4b commit 5 adds the post-HELLO identity-proof exchange and the Versioned → Authenticated gate."
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-server"
  status: "M4b commit 5 (server identity-proof orchestration)"

# ─────────────────────────────────────────────────────────────────────
# Modules landed at M4a commit 3
# ─────────────────────────────────────────────────────────────────────

modules:
  - path: daemonseed_server::config
    purpose: >-
      TOML config loader + path resolution. Per ISC-S3 / ISC-C35:
      `--config <path>` (explicit) → XDG_CONFIG_HOME/daemonseed/
      daemonseed.toml → ./daemonseed.toml. NotFound error carries the
      full search list so operators see what was looked at.
    iscs: [S3, C35]
    added_in: "M4a commit 3"
    public:
      - { kind: struct, name: ServerConfig, fields: "{listen_addr: String (default 0.0.0.0:443), key_path: PathBuf (required), display_name: Option<String>}", note: "Minimal M4a field set; later milestones extend." }
      - { kind: enum, name: ConfigError, variants: "{NotFound { searched }, Read { path, source }, Parse(toml::de::Error)}" }
    key_functions:
      - { sig: "ServerConfig::from_toml(toml_src: &str) -> Result<Self, ConfigError>" }
      - { sig: "ServerConfig::from_path(path: &Path) -> Result<Self, ConfigError>" }
      - { sig: "resolve_config_path(explicit, xdg_config_home, home, cwd) -> Result<PathBuf, ConfigError>", note: "Pure function with injected env so it's deterministic + testable." }

  - path: daemonseed_server::identity
    purpose: >-
      Long-term ML-DSA-87 server identity per ISC-S11. The on-disk
      shape is a 32-byte seed (FIPS 204 §5.1) with a 4-byte magic
      prefix `dsv1`; pubkey + private signing material are
      re-derived on every boot via `oxicrypt_ml_dsa::keygen(&seed)`.
      ServerId follows ISC-C4 / ISC-S11 — `<name>#<12hex>` with the
      hash prefix being the first 6 bytes of SHA-384(pubkey).
    iscs: [S11, C4, C4b]
    added_in: "M4a commit 3"
    public:
      - { kind: const, name: SEED_LEN, value: 32 }
      - { kind: const, name: HASH_PREFIX_BYTES, value: 6, note: "Re-export of daemonseed_core::handle::HASH_PREFIX_BYTES." }
      - { kind: struct, name: Seed, note: "Owns the 32-byte seed; zeroized on drop; Debug redacts the bytes." }
      - { kind: type, name: "ServerId = daemonseed_core::handle::Handle", note: "Same format as client handles (ISC-C4); type alias so server and client code share construction logic." }
      - { kind: enum, name: IdentityError, variants: "{NotFound, EntropyFailure(String), ReadFailed, WriteFailed, MalformedSeedFile, UnknownSeedFileMagic, Keygen, HandleConstruct}" }
    key_functions:
      - { sig: "generate_seed() -> Result<Seed, IdentityError>", note: "Uses getrandom 0.3 (OS entropy). Pre-module-init; not gated." }
      - { sig: "load_or_generate(path: &Path) -> Result<Seed, IdentityError>", note: "Idempotent — first boot generates + persists with mode 0o600 on unix; subsequent boots load." }
      - { sig: "derive_server_id(seed: &Seed, display_name: Option<String>) -> Result<ServerId, IdentityError>", note: "Module-gate precondition: `oxicrypt_module::initialize_with_profile(.., Cnsa2)` must already have run." }

  - path: daemonseed_server::tls
    purpose: >-
      rustls ServerConfig assembly with the CNSA 2.0 hybrid posture.
      Registers `oxitls_rustls_provider::cnsa_2_0_hybrid_provider`
      as the process-wide default `CryptoProvider` (idempotent via
      OnceLock); builds a self-signed ML-DSA-87 cert + matching
      PKCS#8 key via oxitls v0.1.1 helpers; pins TLS 1.3 only,
      ALPN `[b"h2"]`, `max_early_data_size = 0`.
    iscs: [S2a, S2b, S5, A-S9, A-S6]
    added_in: "M4a commit 3"
    public:
      - { kind: const, name: DEFAULT_CERT_VALIDITY, value: "90 days", note: "Cert rotation cadence; operationally visible without being annoying." }
      - { kind: struct, name: TlsError }
      - { kind: enum, name: TlsErrorKind, variants: "{Provider(String), ProviderAlreadyInstalled, CertBuilder(CertBuilderError), Rustls(String), ValidityOverflow}" }
    key_functions:
      - { sig: "install_provider() -> Result<(), TlsError>", note: "Idempotent via OnceLock — safe from concurrent tests. Err on first call is fatal per ISC-A6 (no silent fallback to aws_lc_rs)." }
      - { sig: "build_server_config(seed: &Seed, server_id: &ServerId, valid_for: Duration) -> Result<ServerConfig, TlsError>", note: "Caller-contract: install_provider() must have returned Ok before this. ServerConfig::builder() uses the process-wide default — the CNSA 2.0 cipher suite + hybrid kx-group + ML-DSA-87 sigscheme arrive automatically." }

  - path: daemonseed_server::kats
    purpose: >-
      Union-assembled CNSA 2.0 KATS slice for production module
      initialization. `oxitls_rustls_provider::cnsa_2_0_hybrid_provider`
      requires `oxicrypt-module` in the Operational state; the
      production binary drives that with
      `oxicrypt_module::initialize_with_profile(CNSA_2_0_KATS, AlgorithmProfile::Cnsa2)`
      exactly once at boot. Tests use the lighter-weight
      `oxitls_rustls_provider::testing::ensure_module_operational()`
      shim (DRBG-only KATs) instead.
    iscs: [A6, S5]
    added_in: "M4a commit 4"
    public:
      - { kind: const, name: CNSA_2_0_KATS, type: "&[oxicrypt_module::KatEntry]", note: "Concatenates SHA + HMAC + AES + KDF + DRBG + ECDH + ML-KEM + ML-DSA per-crate KATS in roughly call-order." }

  - path: daemonseed_server::hello
    purpose: >-
      Length-prefixed prost framing (`u32` BE prefix + encoded bytes)
      for `APP_HELLO` / `APP_HELLO_ACK` / `APP_HELLO_REJECT`. Server-
      side orchestration via `serve_hello` reads the initiator's offer,
      applies `daemonseed_core::version::DefaultNegotiator`'s highest-
      mutual selection, writes either Ack or Reject with
      `REJECT_NO_COMMON_VERSION`, returns the outcome to the caller.
      Frame size capped at `MAX_FRAME_BYTES` (64 KiB) to close the
      single-frame amplification DoS (ISC-A-S3).
    iscs: [S14, A-S9, A-S6, C23, A-S3]
    added_in: "M4a commit 4"
    public:
      - { kind: const, name: REJECT_NO_COMMON_VERSION, value: 1, note: "Mirrors the canonical proto-file reject-code registry." }
      - { kind: const, name: MAX_FRAME_BYTES, value: 65_536 }
      - { kind: enum, name: HelloOutcome, variants: "{Negotiated(ProtocolVersion), Rejected { peer_offer: Vec<ProtocolVersion> }}" }
      - { kind: enum, name: HelloError, variants: "{Io(io::Error), Decode(prost::DecodeError), FrameTooLarge, WireOutOfRange(VersionError)}" }
    key_functions:
      - { sig: "read_frame<R, M>(stream: &mut R) -> Result<M, HelloError>", note: "Generic over any prost Message; enforces MAX_FRAME_BYTES at the prefix step before allocating the body buffer." }
      - { sig: "write_frame<W, M>(stream: &mut W, msg: &M) -> Result<(), HelloError>" }
      - { sig: "serve_hello<S: AsyncRead + AsyncWrite + Unpin>(stream: &mut S) -> Result<HelloOutcome, HelloError>", note: "Zero branches on intended peer role per ISC-A-S6; no per-pubkey state per ISC-A-S9." }

  - path: daemonseed_server::identity_proof
    purpose: >-
      Server-side post-HELLO identity-proof orchestration (ISC-S19).
      `RustlsServerExporter` adapts the live rustls ServerConnection to
      core's `ChannelBindingSource` so the 32-byte binding is derived
      from THIS TLS session (ISC-37 / A-S14 / A1 — no constant path
      exists). `run_server_identity_proof` builds + sends the server's
      signed envelope, reads + verifies the client's via core's
      `verify_envelope`, and on success returns the `VerifiedPeer` token
      that gates `Connection::into_authenticated`. Any failure closes
      uniformly — no per-check reason frame (ISC-40 / A-S12). The
      `SeenMap` is a process-lifetime RAM-only highest-counter-per-key
      map (ISC-34); it persists/logs no client identity (A-S1 / ISC-42 /
      A5). Envelope frames reuse `hello::{read_frame, write_frame}`.
    iscs: [S19, "37", "38", "39", "40", "41", "42", "34", A-S14, A-S12, A-S1, A1]
    added_in: "M4b commit 5"
    decisions:
      - "D7: server outbound counter = wall-clock unix-ms (no persistent counter store; monotonic across restarts via the NTP requirement the ±5min skew gate already imposes — a restarted server is never rejected as a replay by returning clients)."
    public:
      - { kind: const, name: MVP_SUITE_ID, value: 1, note: "CNSA 2.0; carried on the server envelope. Widens to real suite negotiation post-MVP (S15/S16)." }
      - { kind: struct, name: "RustlsServerExporter<'a>", note: "Wraps &rustls::ServerConnection; impls core ChannelBindingSource. No constructor fabricates a constant (A1)." }
      - { kind: struct, name: ServerIdentity, note: "Server's ML-DSA-87 SignKeypair + verify-form handle + suite_id. Built via from_seed." }
      - { kind: struct, name: SeenMap, note: "Clone-able Arc<Mutex<HashMap<pubkey,u64>>>; RAM-only replay-counter map shared across connection tasks." }
      - { kind: enum, name: IdentityProofError, variants: "{Key(KeyDerivationError), Sign(SignatureError), Frame(HelloError), ChannelBinding(ChannelBindingError), Verify(VerifyRejection)}", note: "Diagnostic only — every variant maps to the same uniform close on the wire (A-S12)." }
    key_functions:
      - { sig: "now_unix_ms() -> u64", note: "Wall-clock ms; the freshness timestamp AND the D7 server counter source." }
      - { sig: "RustlsServerExporter::new(conn: &rustls::ServerConnection) -> Self" }
      - { sig: "ServerIdentity::from_seed(seed: &Seed, server_id: &ServerId) -> Result<Self, IdentityProofError>", note: "Re-derives the signing keypair from the raw seed via SignKeypair::from_ml_dsa_seed." }
      - { sig: "ServerIdentity::handle(&self) -> &str" }
      - { sig: "SeenMap::new() -> Self" }
      - { sig: "run_server_identity_proof<S: AsyncRead + AsyncWrite + Unpin>(stream: &mut S, channel_binding: [u8; 32], negotiated_version: wire::ProtocolVersion, identity: &ServerIdentity, now_unix_ms: u64, send_counter: u64, seen: &SeenMap) -> Result<VerifiedPeer, IdentityProofError>", note: "Counter-agnostic (caller passes send_counter); verify path does not branch on role (A-S8)." }

  - path: daemonseed_server::runtime
    purpose: >-
      TCP listener + tokio-rustls TlsAcceptor + per-connection HELLO +
      identity-proof handler. `run(addr, tls_config, identity, shutdown,
      observer)` binds, accepts in a `tokio::select!` against the
      shutdown future, spawns per-connection tasks sharing one RAM
      `SeenMap`. Each task drives TLS handshake → HELLO → channel
      binding off the live TLS session → identity-proof exchange →
      `Connection` advanced through `Versioned` to `Authenticated` on
      success (ISC-S19). The shutdown future is composed from
      `tokio::signal::ctrl_c()` plus the unix SIGTERM stream via
      `shutdown_signal()`. Errors at any per-connection phase close
      silently per ISC-A-S9 / ISC-40.
    iscs: [S5, ISC-9, A-S9, S19, "36"]
    added_in: "M4a commit 4; identity-proof wiring M4b commit 5"
    public:
      - { kind: type, name: "ConnectionObserver = Arc<dyn Fn(HelloOutcome) + Send + Sync>", note: "Integration-test seam; production uses noop_observer(). Reports the HELLO negotiation outcome (fired before the identity-proof phase)." }
    key_functions:
      - { sig: "run<F: Future<Output = ()>>(addr: SocketAddr, tls_config: ServerConfig, identity: Arc<ServerIdentity>, shutdown: F, observer: ConnectionObserver) -> io::Result<()>", note: "Accept loop; biased select! prefers shutdown over a new connection. Creates the process-wide RAM SeenMap and clones it into each connection task." }
      - { sig: "drive_negotiated_connection<S>(stream: S, observer: ConnectionObserver)", note: "HELLO-only driver retained as an in-memory-duplex test seam; the production path is serve_connection (private), which also runs identity-proof off the concrete TLS stream." }
      - { sig: "shutdown_signal() -> impl Future<Output = ()>", note: "Composes ctrl_c + SIGTERM on unix; ctrl_c only on non-unix." }
      - { sig: "parse_listen_addr(s: &str) -> io::Result<SocketAddr>" }
      - { sig: "noop_observer() -> ConnectionObserver" }
      - { sig: "shutdown_after(dur: Duration)", note: "Deterministic test shutdown — sleep-then-resolve." }

binaries:
  - name: daemonseed-server
    entry_point: "fn main() -> ExitCode"
    status: "live"
    note: "Boot sequence: clap parse → oxicrypt_module::initialize_with_profile(CNSA_2_0_KATS, Cnsa2) → resolve_config_path → install_provider → load_or_generate seed → derive_server_id → build_server_config → tokio multi-thread runtime → daemonseed_server::runtime::run with shutdown_signal()."

# ─────────────────────────────────────────────────────────────────────
# Anti-criteria (regression anchors that hold today)
# ─────────────────────────────────────────────────────────────────────

anti_criteria:
  - id: "ISC-A-S10 suite-transparency"
    summary: >-
      The server crate MUST NOT call `Registry::lookup`,
      `Registry::resolve_for_write`, or `Suite::same_family` on any
      CoT-relay path. CoT crypto is end-to-end and opaque to the
      server, including the suite tag. Server is permitted to consume
      `SuiteId` opaquely for its own identity material (ISC-S15
      server-wide-keyed handshakes) when M4a lands, but the registry-
      lookup boundary stays client-side.
    enforcement: >-
      Grep-asserted by
      `daemonseed-integration-tests::tests::m3_isc_coverage::m3_iscs_exercise_end_to_end`
      (server_suite_transparency block). The assertion is vacuously
      true at M3 (placeholder main) and becomes a real regression
      anchor when M5/M6 add CoT-relay code.
    iscs: [A-S10]

  - id: "ISC-A-S1 / A-S2 server payload opacity"
    summary: >-
      Server cannot decrypt CoT payloads, cannot link a payload to a
      specific circle, cannot profile per-pubkey traffic patterns.
      Will be enforced architecturally at M4b+ via the type
      separation between OpaquePayload<C> and decrypted client-side
      types.
    enforcement: "Lands at M4b+; placeholder until then."
    iscs: [A-S1, A-S2]

