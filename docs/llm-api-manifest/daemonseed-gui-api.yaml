# ─────────────────────────────────────────────────────────────────────
# daemonseed-gui — LAMA API Manifest (Slint GUI client; core wiring)
#
# A binary view-crate that consumes the daemonseed-proto + daemonseed-core +
# daemonseed-cli contract. The public Lobby room is wired to REAL networking
# via an internal Slint-free net actor (daemonseed_gui::net) — a dedicated-thread
# tokio runtime mirroring daemonseed-tui's net actor. It is still a binary with NO
# published library API surface (the net actor + state machine are internal), so
# this manifest stays a placeholder that grows only if the GUI exposes reusable
# library components.
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Core crate (future data source): ./daemonseed-core-api.yaml
# - Proto contract (future data source): ./daemonseed-proto-protocol.yaml
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-gui
  version: "0.1.0"
  description: >-
    Slint GUI client for daemonseed (scaffold). The design brief's
    three-zone shell (circle rail / conversation pane / on-demand context sheet)
    ported from the perf spike into structured Slint components, with the alpha
    tab nav (Chat / Shares / a "coming soon" circle-shares placeholder) and a
    command-palette overlay seeded from a Rust-side action registry. A subsequent
    slice made the rail interactive (click-to-switch) over a Slint-free,
    unit-tested per-circle RAM state machine (daemonseed_gui::state) that retains
    each circle's draft + scroll across switches, fed by a real TextInput composer
    and Flickable transcript. The public Lobby (rail index 0) is wired to
    REAL networking via an internal Slint-free net actor (daemonseed_gui::net,
    dedicated-thread tokio runtime mirroring daemonseed-tui's net actor):
    connect_session to the relay (ephemeral ClientIdentity), auto-join
    public_room::DEFAULT_ROOM, inbound open_room_message → render, composer
    seal_room_message → publish (+ local echo). The other rail circles keep the
    local-stub behaviour. Connection identity is ephemeral (no persistent
    identity / first-start yet — a separate milestone). Base build is
    software-renderer-only (offscreen `--screenshot <path>` PNG — the only mode a
    headless terminal can verify); the `desktop` feature forwards
    slint/backend-winit for a real software-rendered window. ISC-C6 (the GUI
    framework commitment) stays unchecked until the on-device mic-permission spike.
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-gui"
  status: "core wiring — the public Lobby room is wired to REAL networking via an internal Slint-free net actor (daemonseed_gui::net): connect_session to the relay (ephemeral identity), auto-join public_room::DEFAULT_ROOM, real AEAD-sealed chat in/out, UI thread never blocks (NetCommand/NetEvent over tokio::mpsc, drained on a slint::Timer). Other circles keep the local stub; circles-with-phrase + persistent identity/first-start + hands-on polish are separate milestones. Lobby chat is live-verified by a 2-client manual test on the fra1 relay. Launch flag: --x11 / DAEMONSEED_X11=1 forces XWayland (winit 0.30's Wayland pointer path drops clicks under VM software rendering; native Wayland stays the default). The public-share net path is BUILT (PublishShare/UnpublishShare/RefreshShares/FetchShare/ConfirmFetch commands + PublishStarted/Stopped/Error, SharesSnapshot/Error, FetchManifest/Progress/Complete/Error events, mirroring daemonseed-tui's share machinery — ShareContent::index_dir publish + serve_share, SHA-384-verified chunk fetch to disk — proven by in-process + live-fra1 round-trips). The Shares-tab UI lands in three commits: (1) DONE — the BROWSE TREE: the tab is an OS-style lazy-expand file tree (each relay share a root node; FetchShare previews its manifest on first expand; the flat manifest is parsed into a dirs-first/alphabetical folder hierarchy) over a Slint-free, unit-tested model (daemonseed_gui::share_browser); RefreshShares fires on tab-open + a manual Refresh button + a ~3s comparative-real-time auto-poll while the tab is open, all reconciled by share_id so a refresh never collapses open folders (liveness is in-band: live ShareAnnouncements fold into a ShareCatalog, a roll-call on refresh/timer prompts re-announce, entries age out by TTL — no relay registry). (2) DONE — download: right-click a tree node (file -> itself, folder -> its files, share -> all, via share_browser::fetch_target) opens the native folder picker (rfd xdg-portal backend, NO GTK link; driven on a dedicated thread + current-thread tokio runtime so the UI never blocks, dispatched to the relay via a Send command-sender clone) and fires ConfirmFetch{flat_dest} (SHA-384-verified bytes to the chosen dir); a simple label+fraction download meter sits in the rail footer (persists across tabs — download keeps running while you return to Chat). rfd needs a running xdg-desktop-portal at runtime only (a system without one falls through to a cancelled pick). (3) DONE — publish: the Publish overlay (opened from a Shares-header 'Publish' button) — an optional name field + a 'Choose folder & publish' CTA that opens the native folder picker off-thread (mirrors the download picker) and fires PublishShare (name defaults to the folder basename; sharer_handle self-asserts the unlocked display handle so one's own shares come back tagged 'you' in the tree via set_shares's my_handle arg); a 'Your live shares' list (GuiState::my_shares, fed by PublishStarted/Stopped) with per-row Unpublish -> UnpublishShare. Published shares PERSIST across restart (M16: Seeds::add_published write-through to the at-rest blob on PublishStarted, keyed by the share's directory path which PublishStarted now carries; explicit Unpublish forgets it) and AUTO-REPUBLISH on Unlock once connected (NetCommand::Connect carries republish_roots, re-served after the lobby auto-join exactly like the silent circle-rejoin). The Announcements tab (#91) is a display-only pane (reachable via the Ctrl-K palette + a header tab) showing the connected relay's MOTD verbatim (render_motd; hidden when unset) + its announcement posts (topic/body/timestamp via post_render_fields), fetched via NetCommand::RefreshPublicSpace -> NetEvent::PublicSpaceSnapshot and re-verified client-side by daemonseed_gui::state::build_announcements_view (verify_served_motd with the connected relay's server pubkey for a server-signed MOTD, verify_served_post per post; unverifiable items are dropped, ISC-A-S3); the signer composer is #92. On connect the client computes a single combined content hash of the verified MOTD + announcements (daemonseed_gui::state::combined_content_hash) and compares it to a per-relay last-seen hash in the profile's Seeds (the announce-seen directive, keyed by server_id); a mismatch or first arrival auto-opens the Announcements pane (landing_decision; only on the connect-time PublicSpaceSnapshot), else the Lobby, and viewing the pane persists the current hash (#93, client-derived, no new server state). Offscreen render flags: --show-shares draws the populated tree, --show-publish draws the overlay + a fixture live-shares list (no relay). Still a binary with no published library API; ISC-C6 unchecked (mic-permission spike pending)"

# The crate is a binary with no published library surface. Internal modules:
# `daemonseed_gui::state` (Slint-free RAM per-circle state machine),
# `daemonseed_gui::net` (Slint-free net actor: NetCommand/NetEvent over a
# dedicated-thread current-thread tokio runtime + LocalSet, mirroring
# daemonseed-tui's net actor; ephemeral ClientIdentity, public-room seal/open), and
# `daemonseed_gui::share_browser` (Slint-free, unit-tested public-share browse-tree
# model: reconcile-by-share_id listing, lazy per-share manifest load, flatten-with-
# depth render rows, and fetch-target resolution for right-click download). None is a
# published API. `net` additionally carries the direct-messaging contract:
# `NetCommand::Connect{ dm_session_keys: Option<Box<DmSessionKeys>> }` moves the
# signing keypair, the channel root and the profile at-rest key into a
# `dm::runner` the actor starts over `VeilidNetHandle::dm_records_parts` once the
# node has started. `NetCommand::Dm(RunnerCommand)`, sent by `NetHandle::dm`, goes
# to that runner's queue, and with no runner is answered by
# `RunnerEvent::Refused { reason: Refusal::ShuttingDown }`. Connect,
# `NetCommand::StopDm` and `GracefulClose` replace the runner off the actor loop,
# awaiting the previous runner's task end before the next starts. Each runner they
# stop, whether running or produced by a start still in flight, is reported by one
# `NetEvent::DmStopped`; with no runner running or starting they report nothing. A
# runner that ends on its own is also reported by one `NetEvent::DmStopped`. A
# runner that ends with an error or panics, a start or end task that panics, and
# a connect that has keys but cannot start a runner are each reported by
# `NetEvent::DmUnavailable(DmUnavailable)`, carrying a `DmUnavailableCause` and
# the redacted error text, after any `DmStopped`, and traced. Keys that fail to
# derive are traced by `GuiState::dm_session_keys`, which marks the state
# unavailable itself with `DmUnavailableCause::Internal`. Either way
# `GuiState::dm_notice` is then `DmNotice::Unavailable(cause)` until a runner
# reports its roster, worded by `dm_ui::unavailable_text`, and
# `GuiState::dm_notice_detail` is the error text, shown selectable beneath the
# notice with a Copy button for every cause but `NotConnected`. With no profile
# unlocked there are no keys and nothing is reported. While the runner's last
# `RunnerEvent::Advert` says not published, `dm_notice` is
# `DmNotice::NotReachable` where no other notice
# applies. A runner's first roster clears the notice the previous one left.
# `GracefulClose` then waits for that stop before its transport steps and its ack,
# up to `net::DM_CLOSE_CAP` (30 s); a stop still running after
# `net::DM_CLOSE_NOTICE_AFTER` (500 ms) emits `NetEvent::DmCloseSlow` once, which
# sets the connection status to `net::DM_CLOSE_MESSAGE`. On window close the binary
# keeps the window open and drawing until the ack, or until the cap plus the close
# budget has passed.
# `NetEvent::Dm(Arc<RunnerEvent>)` reaches `GuiState::on_dm_event`, and the
# binary then redraws the rail's Chats and Direct messages sections, the main pane
# and the selected thread. A room or conversation row shows the unread dot while it
# is unread and its chat or thread is not in the main pane, whether or not it is the
# active room or selected item; a section header's dot sums its rows. A message
# composed here is drawn after the thread rows placed no later than the commit time
# `RunnerEvent::Sent` reports for it, or, until that report, the time it was
# composed, and its age is read from that same time; a sent row not composed here
# ages from its reported commit time. For `RunnerEvent::StartedOver`, `on_dm_event` appends
# `TrustEventKey::DmCorrespondentStateLost` to `GuiState::trust_log`, the audit
# log. A queued command `NetHandle::dm` cannot hand over, because the network
# thread is gone, is folded back as `RunnerEvent::Refused { reason:
# Refusal::ShuttingDown }`, and losing the network thread folds as
# `NetEvent::DmStopped` does, once.
# `NetEvent::RoomReach { room: net::RoomRecord, reachable }` reports whether a
# room's record can be read (`RoomRecord`: Lobby, LobbyShares, Announcements,
# Circle(circle_id)): false after a failed repair of its lost session, a repair
# with no read answered, or two consecutive ordinary re-reads with no read
# answered; true after a complete repair, or a repair or re-read with at least
# one read answered. A repair dispatched before its record's latest re-read, or
# before the latest Connect, reports nothing.
# `GuiState::set_room_reach` keeps the set, cleared on `NetEvent::Connected`, and
# `GuiState::reach_notice` / `room_reach_notice` give the line "Can't reach <name>
# right now. Retrying.", naming a circle by its rail label and showing nothing for a
# circle no longer in the rail. The line shows under the tab strip on the tab that
# reads that record, and an unreachable circle's rail row says so in place of its
# subtitle.
# A circle is joining until `NetEvent::CircleJoined` or
# `NetEvent::CircleJoinFailed { circle_id, reason }` arrives for it
# (`GuiState::is_joining`): its rail row reads "Joining…" in place of its subtitle,
# the chat tab shows `GuiState::joining_notice` ("Joining <name>…"), and while it is
# the active circle the composer and Send are disabled (`GuiState::can_send`). A
# join that ends for good (`CircleJoinFailed`: its keys could not be derived, the
# subscribe was refused for a reason a retry cannot fix, or there is no connection,
# as for every circle a Connect that could not connect was to re-join) leaves the circle with
# `GuiState::join_failure`: its row reads "Couldn't join", the chat tab shows
# "Couldn't join <name>: <reason>", the reason cut to one line, and the composer
# and Send stay disabled, until a later `CircleJoined`. A circle that has not
# joined shows no reach line. When the active circle on the chat tab first joins,
# the composer takes keyboard focus, unless a dialog, sheet, overlay or the startup
# mask covers the window. Joining a phrase whose circle is already in
# the rail (`GuiState::index_of_phrase`) switches to that circle.
# `NetEvent::CircleError` sets the status line to `GuiState::circle_error_status`
# ("circle <name>: <reason>", or "circle: <reason>" for an unknown id), and
# `CircleJoined` replaces that circle's error with "connected · veilid".
# This manifest grows only if the GUI ever exposes reusable library components.
modules: []
public_types: []
public_functions: []
