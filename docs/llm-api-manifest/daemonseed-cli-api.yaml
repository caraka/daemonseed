# ─────────────────────────────────────────────────────────────────────
# daemonseed-cli — LAMA API Manifest (M4a commit 5)
#
# The CLI crate gained its first real subcommand (`connect`) at M4a
# commit 5, replacing the placeholder `fn main() {}`. Substantive
# additional subcommands land alongside M4b (post-identity-proof
# the CLI can authenticate as a client) and grow through M11.
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Core crate: ./daemonseed-core-api.yaml
# - Server crate: ./daemonseed-server-api.yaml
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-cli
  version: "0.1.0"
  description: "Non-interactive scriptable client. M4a commit 5 lands the `connect <server-id>` subcommand: TLS-1.3 handshake + APP_HELLO exchange + Versioned-state advance."
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-cli"
  status: "M4a commit 5"

# ─────────────────────────────────────────────────────────────────────
# Modules landed at M4a commit 5
# ─────────────────────────────────────────────────────────────────────

modules:
  - path: daemonseed_cli::connect
    purpose: >-
      End-to-end client-side connect path. `resolve_address` picks the
      dial address from the bundled bootstrap anchor or an explicit
      `--address` override (ISC-C37). `build_client_config` constructs
      the rustls `ClientConfig` with TLS 1.3 only, ALPN `h2`, and the
      M4a `AcceptAnyServerCert` verifier. `connect` performs TCP +
      TLS + AppHello write + Ack/Reject read, applies `DefaultNegotiator::verify_ack`
      to enforce ISC-C23 client-side, returns the negotiated version.
    iscs: [C23, C37, S14, A-S9]
    added_in: "M4a commit 5"
    public:
      - { kind: const, name: DEFAULT_PORT, value: 443 }
      - { kind: struct, name: ConnectOutcome, fields: "{version: ProtocolVersion, dialled: String}" }
      - { kind: enum, name: ConnectError, variants: "{NoAddress, Tcp, Rustls, TlsHandshake, HelloWrite, HelloDecode, OutOfSetAck, NoCommonVersion, UnknownRejectCode, WireOutOfRange}" }
    key_functions:
      - { sig: "resolve_address(server_id: &str, address_override: Option<&str>) -> Result<String, ConnectError>", note: "Override wins; bundled-anchor server-id match is the fallback; empty anchor + no override surfaces ConnectError::NoAddress." }
      - { sig: "build_client_config() -> Result<rustls::ClientConfig, rustls::Error>", note: "Caller-contract: install_provider() must have returned Ok before this." }
      - { sig: "connect(server_id: &str, address: &str) -> Result<ConnectOutcome, ConnectError>", note: "Caller-contract: install_provider() AND oxicrypt_module::initialize_with_profile(.., Cnsa2) must both have returned Ok before this." }

  - path: daemonseed_cli::tofu_stub
    purpose: >-
      **M4a-only** placeholder `ServerCertVerifier`. Accepts any server
      cert at the chain level; still routes the per-handshake
      TLS-1.3 `CertificateVerify` signature through the installed
      provider's `verify_tls13_signature` so the ML-DSA-87 codepoint
      (0x0906) is exercised end-to-end. Deletes wholesale in M4b
      when the TOFU + identity-proof envelope lands.
    iscs: ["M4b-pending"]
    added_in: "M4a commit 5"
    public:
      - { kind: struct, name: AcceptAnyServerCert, note: "Carries the installed provider's supported signature schemes; chain validation bypassed." }
    key_functions:
      - { sig: "AcceptAnyServerCert::from_installed_provider() -> Arc<Self>" }

binaries:
  - name: daemonseed-cli
    entry_point: "fn main() -> ExitCode"
    status: "live"
    subcommands:
      - name: "connect <server-id> [--address HOST:PORT]"
        purpose: "Open a TLS-1.3 connection to <server-id>, exchange APP_HELLO, print the negotiated MAJOR.MINOR wire version, exit 0 on success."
        added_in: "M4a commit 5"
        boot_sequence: |
          1. oxicrypt_module::initialize_with_profile(CNSA_2_0_KATS, Cnsa2)
          2. daemonseed_server::tls::install_provider()
          3. resolve_address(server_id, --address)
          4. tokio::runtime::Runtime::new()
          5. connect::connect(server_id, dial_address) (TCP → TLS → AppHello → AppHelloAck)
          6. println! the negotiated version + exit 0

# ─────────────────────────────────────────────────────────────────────
# Planned subcommands (forward-looking)
# ─────────────────────────────────────────────────────────────────────

planned_subcommands:
  - milestone: M4b
    commands:
      - { name: "first-start", purpose: "Run the daemonseed-core first_start orchestrator end-to-end. Equivalent to the TUI's enrollment flow but scriptable (passphrase via stdin or env-var)." }
      - { name: "ping <server-id>", purpose: "Like `connect` but adds the identity-proof envelope verification to confirm trust state, not just reachability." }

  - milestone: M5
    commands:
      - { name: "trust set <server-id> {trusted|untrusted}", purpose: "Flip the federation trust slider for a server per ISC-C22." }
      - { name: "introducer query <server-id>", purpose: "Fetch the introducer's known-server list. Does NOT auto-add — output is for user inspection per the no-keys-in-introducer invariant." }

  - milestone: M6
    commands:
      - { name: "post <text>", purpose: "Post to the public space." }
      - { name: "motd set <text>", purpose: "Set the daemon's MOTD." }

  - milestone: M7
    commands:
      - { name: "suite status", purpose: "List local registry + per-server deprecation policy state." }
      - { name: "suite migrate", purpose: "Explicit user-triggered migration to a newer suite. Never automatic per ISC-A-C9." }

  - milestone: M8
    commands:
      - { name: "share add <path>", purpose: "Add a file or directory to the share index." }
      - { name: "share list", purpose: "List indexed shares." }
      - { name: "fetch <hash>", purpose: "Fetch a content-addressed chunk." }

# ─────────────────────────────────────────────────────────────────────
# Discovery semantics
# ─────────────────────────────────────────────────────────────────────

profile_discovery:
  status: "M4a commit 5: `connect` doesn't yet read a profile (no per-client state to load); profile-aware subcommands land in M4b."
  priority:
    - "--config <path> CLI flag (planned for M4b profile-aware subcommands)"
    - "CWD-discovery (daemonseed.toml in current directory)"
    - "XDG fallback ($XDG_CONFIG_HOME/daemonseed/daemonseed.toml)"
  iscs: [C35]

# ─────────────────────────────────────────────────────────────────────
# Output conventions
# ─────────────────────────────────────────────────────────────────────

output_conventions:
  status: "M4a commit 5: `connect` follows these rules; subsequent subcommands inherit."
  rules:
    - "All commands MUST be scriptable — no required interactive prompts."
    - "Passphrase input via stdin (line-buffered) or DAEMONSEED_PASSPHRASE env var. Never via argv (would leak via /proc)."
    - "Default output is human-readable plain text. `--json` switches to structured JSON for scripting (planned)."
    - "No emoji in output (compatibility with non-Unicode terminals)."
    - "Exit codes: 0 success, 1 user error, 2 config error, 3 network error, 4 protocol error."
