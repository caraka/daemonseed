[package]
name = "daemonseed-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
description = "daemonseed scriptable client"

[dependencies]
# Sibling crates — bootstrap anchor + version policy + crypto live in core;
# the announcements/MOTD wire types (SignedArtifact, Post) in proto.
daemonseed-core = { path = "../daemonseed-core" }
daemonseed-proto = { path = "../daemonseed-proto" }
prost = { workspace = true }

# Veilid transport — home of the least-authority RouteAdvertSigner adapter
# (`route_signer`) the share-publish path hands veilid-net.
daemonseed-veilid-net = { path = "../daemonseed-veilid-net" }

# oxicrypt — the ML-DSA signing/verification error type surfaced by the
# public_space authoring helpers + the route_signer provenance path.
oxicrypt-module = { workspace = true }
