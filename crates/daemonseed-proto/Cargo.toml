[package]
name = "daemonseed-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "Apache-2.0 OR MIT"
description = "daemonseed protocol schema (gRPC / protobuf)"

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
# tonic runtime: the generated PublicSpace service stubs (M6, the first
# application-stream service) reference `tonic::` for the client/server traits.
# Messages-only milestones did not need it. Features are inherited from the
# workspace pin (transport/codegen/prost); the schema crate uses only the
# codegen-emitted traits.
tonic = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
