  - name: seal_log
    module: daemonseed_core::trust_events
    description: >-
      Argon2id+HKDF-SHA-384 key independent of the at-rest blob; AES-256-GCM with
      the header as AAD.
    signature: "pub fn seal_log(log: &TrustEventLog, passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<Vec<u8>, AuditLogError>"
    parameters:
      - name: log
        type: "&TrustEventLog"
        direction: in
        description: The trust-event log to seal.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID (Argon2 salt).
      - name: params
        type: ArgonParams
        direction: in
        description: The Argon2 work factors.
    returns:
      type: "Result<Vec<u8>, AuditLogError>"
      description: The sealed encrypted log bytes.
      error_variants:
        - name: AuditLogError
          condition: Key derivation or AEAD seal failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: open_log
    module: daemonseed_core::trust_events
    description: Decrypt a sealed trust-event log.
    signature: "pub fn open_log(bytes: &[u8], passphrase: &str) -> Result<TrustEventLog, AuditLogError>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: The sealed log bytes.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
    returns:
      type: "Result<TrustEventLog, AuditLogError>"
      description: The decrypted trust-event log.
      error_variants:
        - name: AuditLogError
          condition: Wrong passphrase or tampered ciphertext (fails closed).
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: assess_deprecation
    module: daemonseed_core::trust_events
    description: >-
      Derive client trust signals from a verified policy; reports only — never
      mutates suite/identity.
    signature: "pub fn assess_deprecation(policy: &DeprecationPolicy, in_use: &[SuiteId], now_ms: u64) -> Vec<DeprecationSignal>"
    parameters:
      - name: policy
        type: "&DeprecationPolicy"
        direction: in
        description: A verified deprecation policy.
      - name: in_use
        type: "&[SuiteId]"
        direction: in
        description: The suites the client currently uses.
      - name: now_ms
        type: u64
        direction: in
        description: The current time (Unix ms).
    returns:
      type: "Vec<DeprecationSignal>"
      description: The derived client trust signals (report-only).

  # ── backoff ─────────────────────────────────────────────────────────
  - name: BackoffPolicy::delay_for_attempt
    module: daemonseed_core::backoff
    description: Saturating exponential delay for the given attempt (no overflow).
    signature: "pub fn delay_for_attempt(&self, attempt: u32) -> Duration"
    parameters:
      - name: attempt
        type: u32
        direction: in
        description: The zero-based retry attempt number.
    returns:
      type: Duration
      description: The base (un-jittered) delay for that attempt.

  - name: Backoff::next_jittered
    module: daemonseed_core::backoff
    description: >-
      Consume one retry, returning the jittered delay, or None once the budget is
      exhausted.
    signature: "pub fn next_jittered(&mut self) -> Option<Duration>"
    parameters: []
    returns:
      type: "Option<Duration>"
      description: The next jittered delay, or None when retries are exhausted.

  - name: Backoff::refusal_event
    module: daemonseed_core::backoff
    description: "Map the current state to a trust-event key (ConnectionRateLimited -> …Exhausted)."
    signature: "pub fn refusal_event(&self) -> TrustEventKey"
    parameters: []
    returns:
      type: TrustEventKey
      description: The trust-event key describing the current refusal state.

  # ── mention ─────────────────────────────────────────────────────────
  - name: find_self_mentions
    module: daemonseed_core::mention
    description: >-
      Read-only scan keyed on the full wire handle, with word-boundary +
      trailing-hex guards. Does not mutate the plaintext.
    signature: "pub fn find_self_mentions(plaintext: &str, own_handle: &Handle) -> Vec<MentionSpan>"
    parameters:
      - name: plaintext
        type: "&str"
        direction: in
        description: The decrypted chat plaintext.
      - name: own_handle
        type: "&Handle"
        direction: in
        description: The local user's full handle.
    returns:
      type: "Vec<MentionSpan>"
      description: The spans where the own handle is mentioned.

  - name: resolve_mention
    module: daemonseed_core::mention
    description: >-
      Bare display name resolves by exact scope match — one match resolves,
      several are Ambiguous, none is NotFound.
    signature: "pub fn resolve_mention(typed: &str, scope: &[Handle]) -> MentionResolution"
    parameters:
      - name: typed
        type: "&str"
        direction: in
        description: The typed mention token.
      - name: scope
        type: "&[Handle]"
        direction: in
        description: The candidate handles in scope.
    returns:
      type: MentionResolution
      description: Resolved, Ambiguous, or NotFound.

  # ── release ─────────────────────────────────────────────────────────
  - name: verify_multisig
    module: daemonseed_core::release
    description: >-
      Accepts iff >= threshold DISTINCT anchor keys each signed validly. No
      verify-bypass; each key counted once; a non-anchor signature is a hard
      refusal; a wrong-length blob is rejected without panic.
    signature: "pub fn verify_multisig(anchor: &ReleaseAnchor, message: &[u8], signatures: &[&[u8]]) -> Result<(), ReleaseVerifyError>"
    parameters:
      - name: anchor
        type: "&ReleaseAnchor"
        direction: in
        description: The release trust anchor (key set + threshold).
      - name: message
        type: "&[u8]"
        direction: in
        description: The signed release message.
      - name: signatures
        type: "&[&[u8]]"
        direction: in
        description: The candidate signatures to count against the anchor.
    returns:
      type: "Result<(), ReleaseVerifyError>"
      description: Ok if at least threshold distinct anchor keys signed validly.
      error_variants:
        - name: BelowThreshold
          condition: Fewer than threshold distinct anchor keys produced valid signatures.
        - name: UnrecognizedSignature
          condition: A signature matched no anchor key.
        - name: MalformedSignature
          condition: A signature blob was the wrong length / unparseable.
        - name: Module
          condition: The oxicrypt module is not operational.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: "release::bundled"
    module: daemonseed_core::release
    description: >-
      The compile-time release anchor. to_anchor() is None during the pre-public
      phase (no real key yet).
    signature: "pub fn bundled() -> &'static BundledReleaseAnchor"
    parameters: []
    returns:
      type: "&'static BundledReleaseAnchor"
      description: The compile-time-embedded release anchor schema.

  # ── autostart ───────────────────────────────────────────────────────
  - name: unit_descriptor
    module: daemonseed_core::autostart
    description: >-
      Render the autostart unit text for `target`. Pure: no I/O, no process
      spawning, deterministic for a given spec.
    signature: "pub fn unit_descriptor(spec: &AutostartSpec, target: AutostartTarget) -> String"
    parameters:
      - name: spec
        type: "&AutostartSpec"
        direction: in
        description: The profile-specific autostart inputs.
      - name: target
        type: AutostartTarget
        direction: in
        description: Which OS mechanism to render for (systemd / launchd / Windows).
    returns:
      type: String
      description: The rendered autostart unit text (no side effects).
    postconditions:
      - description: No filesystem or process side effects occur; output is deterministic per spec.

  - name: clamp_order_ms
    module: daemonseed_core::transcript
    description: Clamp an untrusted advisory sent_unix_ms into the ordering trust window for the open lobby (#131) — a no-op inside the window, pulling only forged/broken timestamps to an edge. Callers dedup on the ORIGINAL value and cap the high-water at now.
    signature: "pub fn clamp_order_ms(sent_unix_ms: i64, now_ms: i64) -> i64"
    parameters:
      - name: sent_unix_ms
        type: i64
        direction: in
        description: The untrusted advisory sender timestamp.
      - name: now_ms
        type: i64
        direction: in
        description: Local wall-clock now (injected for testability).
    returns:
      type: i64
      description: sent_unix_ms if within [now − 24h, now + 120s], else the nearest window edge.

# ─────────────────────────────────────────────────────────────────────
# Error types — every error/result enum, with recoverability + action.
# ─────────────────────────────────────────────────────────────────────

error_types:
  - name: MnemonicError
    module: daemonseed_core::identity::mnemonic
    variants:
      - name: MnemonicError
        description: Generation or parsing/checksum failure for a BIP-39 phrase.
        recoverable: true
        user_action: Re-check the 24-word phrase, or retry generation with fresh entropy.

  - name: KeyDerivationError
    module: daemonseed_core::identity::keys
    variants:
      - name: KeyDerivationError
        description: HKDF, oxicrypt-module, or KEM keygen failure.
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized before derivation.

  - name: SignatureError
    module: daemonseed_core::identity::keys
    variants:
      - name: Module
        description: Wraps oxicrypt_module::Error (e.g. module not operational).
        recoverable: false
        user_action: Call oxicrypt_module::initialize() before signing/verifying.
      - name: BadSignature
        description: >-
          Uniform verify failure across tampered-message / wrong-key / forged-sig
          (A-S12 / A-C18) — the sub-cause is intentionally indistinguishable.
        recoverable: false
        user_action: Do not trust the message; the signature is invalid.

  - name: ChannelBindingError
    module: daemonseed_core::identity_proof
    variants:
      - name: Export
        description: The TLS exporter call failed (e.g. handshake incomplete).
        recoverable: false
        user_action: Ensure the TLS handshake completed before deriving the binding.

  - name: ProfileConfigError
    module: daemonseed_core::profile::config
    variants:
      - name: Toml
        description: TOML parse error (syntax or type mismatch).
        recoverable: true
        user_action: Fix the daemonseed.toml syntax and retry.
      - name: MissingProfileId
        description: The required `profile_id` field is absent (ISC-C36).
        recoverable: false
        user_action: Recover from .dseed or re-enroll; startup is refused without it.
      - name: InvalidProfileId
        description: The `profile_id` field is present but not a valid UUID.
        recoverable: false
        user_action: Restore the correct profile_id from .dseed, or re-enroll.
      - name: Serialize
        description: TOML serialization failed.
        recoverable: false
        user_action: Report a bug; serialization of a valid config should not fail.

  - name: ResolveError
    module: daemonseed_core::profile::resolve
    variants:
      - name: ResolveError
        description: A filesystem or parse failure during profile-root resolution.
        recoverable: true
        user_action: Check the --config path / XDG dirs and retry.

  - name: BlobError
    module: daemonseed_core::storage::seeds
    variants:
      - name: AuthenticationFailed
        description: >-
          Uniform across wrong-passphrase / wrong-profile-id / wrong-argon-params
          / ciphertext-tamper (constant-time-friendly).
        recoverable: true
        user_action: Re-enter the passphrase; if it persists, recover from .dseed.
      - name: UnknownSuite
        description: The blob's suite id is not in the registry.
        recoverable: false
        user_action: Upgrade to a build whose registry includes the suite.
      - name: SuiteIdSentinel
        description: The decoded suite id is a reserved sentinel.
        recoverable: false
        user_action: The blob is malformed or tampered; do not trust it.
      - name: WriteRefused
        description: The active write-suite is not in an ActiveWrite state.
        recoverable: false
        user_action: Migrate to an active write-suite per the deprecation policy.

  - name: RecoveryFileError
    module: daemonseed_core::storage::recovery_file
    variants:
      - name: AuthenticationFailed
        description: >-
          Wrong passphrase or tampered file — header tamper changes the derived
          key so AEAD fails closed.
        recoverable: true
        user_action: Re-enter the passphrase for the .dseed file.
      - name: UnknownSuite
        description: The header suite id is not in the registry.
        recoverable: false
        user_action: Upgrade to a build whose registry includes the suite.
      - name: SuiteIdSentinel
        description: The header suite id is a reserved sentinel.
        recoverable: false
        user_action: The file is malformed or tampered; do not trust it.
      - name: WriteRefused
        description: The chosen write-suite is not in an ActiveWrite state.
        recoverable: false
        user_action: Re-seal under an active write-suite.

  - name: CasError
    module: daemonseed_core::storage::cas
    variants:
      - name: Hash
        description: Wraps oxicrypt_module::Error during chunk addressing.
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized.
      - name: Io
        description: A filesystem error in the persistent FileChunkStore.
        recoverable: true
        user_action: Check disk space / permissions on the chunk-cache directory.
      - name: CorruptRefcount
        description: A refcount sidecar file could not be parsed.
        recoverable: false
        user_action: Drop the corrupt chunk-cache entry; it will be re-fetched.

  - name: IndexError
    module: daemonseed_core::storage::share_index
    variants:
      - name: Db
        description: Underlying redb storage error.
        recoverable: true
        user_action: Check disk / permissions; reopen the index.
      - name: Crypto
        description: AES-GCM init/seal/open failure including tamper auth-fail.
        recoverable: false
        user_action: Verify the index key; tamper fails closed (never garbage).
      - name: Corrupt
        description: A stored value could not be decoded after decryption.
        recoverable: false
        user_action: Rebuild the index via a cold_scan.
      - name: Entropy
        description: CSPRNG nonce generation failed.
        recoverable: true
        user_action: Retry the write; if it persists, check the system RNG.

  - name: WatchError
    module: daemonseed_core::indexer
    variants:
      - name: Limit
        description: OS watch limit exceeded (fs.inotify.max_user_watches).
        recoverable: true
        user_action: Fall back to periodic mtime_rescan, or raise the OS watch limit.
      - name: Io
        description: Underlying notify watcher error.
        recoverable: true
        user_action: Retry watching, or fall back to mtime_rescan.

  - name: FirstStartError
    module: daemonseed_core::first_start
    variants:
      - name: FirstStartError
        description: Passphrase-too-weak / seed-failed / display-name-invalid / etc.
        recoverable: true
        user_action: Address the reported issue (stronger passphrase, valid name) and retry the step.

  - name: SuiteIdError
    module: daemonseed_core::crypto::suite
    variants:
      - name: Sentinel
        description: The raw value is a reserved sentinel (0x0000 or 0xFFFF).
        recoverable: false
        user_action: Use a non-sentinel suite id.

  - name: WriteRefusal
    module: daemonseed_core::crypto::suite
    variants:
      - name: Unknown
        description: The suite id is not in the registry.
        recoverable: false
        user_action: Use a registered suite id.
      - name: Proposed
        description: The suite is Proposed, not yet active for writes.
        recoverable: false
        user_action: Wait until the suite becomes ActiveWrite, or pick an active suite.
      - name: ActiveReadOnly
        description: The suite is read-only-active, not write-selectable.
        recoverable: false
        user_action: Select the current ActiveWrite suite for new writes.
      - name: Deprecated
        description: The suite is deprecated read-only.
        recoverable: false
        user_action: Migrate to the recommended suite from the deprecation policy.
      - name: Removed
        description: The suite has been removed.
        recoverable: false
        user_action: Migrate to a supported suite.

  - name: NegotiationError
    module: daemonseed_core::version
    variants:
      - name: NoCommonVersion
        description: No mutually supported protocol version.
        recoverable: false
        user_action: Upgrade one peer so the supported sets overlap.
      - name: OutOfSetAck
        description: The peer ACKed a version not in the offered set.
        recoverable: false
        user_action: Treat as a hard close; the peer is misbehaving.
      - name: ZeroRttForbidden
        description: Application data arrived before negotiation completed.
        recoverable: false
        user_action: Do not send application data before APP_HELLO_ACK.
      - name: MalformedPeerOffer
        description: A peer offer failed to decode (wraps VersionError).
        recoverable: false
        user_action: Treat as a hard close; the peer offer is malformed.

  - name: VersionError
    module: daemonseed_core::version
    variants:
      - name: OutOfRange
        description: A wire u32 field exceeds the u16 in-memory range.
        recoverable: false
        user_action: Reject the offer; the version field is out of range.

  - name: TrustDecision
    module: daemonseed_core::federation::trust
    variants:
      - name: Accept
        description: The presented key is accepted (not an error path).
        recoverable: true
        user_action: Proceed with the connection.
      - name: AcceptWithRotation
        description: Accepted, but a key rotation is surfaced to the user.
        recoverable: true
        user_action: Acknowledge or dismiss the rotation notice.
      - name: Refuse
        description: Fail-closed refusal (ISC-45).
        recoverable: false
        user_action: Do not connect; verify the server key out-of-band.

  - name: CircleKeyError
    module: daemonseed_core::circle
    variants:
      - name: Hkdf
        description: HKDF derivation failed (wraps oxicrypt_kdf::KdfError).
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized.

  - name: WhitelistParseError
    module: daemonseed_core::public_space
    variants:
      - name: Handle
        description: The handle form of a whitelist line failed to parse.
        recoverable: true
        user_action: Fix the handle syntax on the offending whitelist line.
      - name: InvalidPubkeyHex
        description: The full-key form was not valid hex.
        recoverable: true
        user_action: Correct the hex public key on the offending line.
      - name: WrongPubkeyLength
        description: The decoded key was the wrong length.
        recoverable: true
        user_action: Supply a full-length ML-DSA-87 public key.

  - name: ArtifactError
    module: daemonseed_core::public_space
    variants:
      - name: UnknownSigner
        description: The signer is not authorized by the whitelist.
        recoverable: false
        user_action: Add the signer to the operator whitelist, or reject the artifact.
      - name: BadSignature
        description: The signature did not verify over the exact signed bytes.
        recoverable: false
        user_action: Reject the artifact; it was not validly signed.
      - name: Module
        description: Wraps oxicrypt_module::Error.
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized.

  - name: PolicyError
    module: daemonseed_core::crypto::deprecation
    variants:
      - name: PolicyError
        description: >-
          Build/parse/verify failure — malformed payload, too-short cutoff lead,
          bad signature, or a rollback to an older policy version.
        recoverable: false
        user_action: Reject the policy; a rollback is an attack signal.

  - name: AuditLogError
    module: daemonseed_core::trust_events
    variants:
      - name: AuditLogError
        description: Key derivation or AES-GCM seal/open failure for the audit log.
        recoverable: true
        user_action: Re-enter the passphrase; tampered ciphertext fails closed.

  - name: AnchorError
    module: daemonseed_core::release
    variants:
      - name: NoKeys
        description: The anchor was constructed with an empty key set.
        recoverable: false
        user_action: Provide at least one release-signing key.
      - name: ThresholdOutOfRange
        description: The N-of-M threshold is zero or exceeds the key count.
        recoverable: false
        user_action: Set 1 <= threshold <= number of keys.

  - name: ReleaseVerifyError
    module: daemonseed_core::release
    variants:
      - name: BelowThreshold
        description: Fewer than threshold distinct anchor keys signed validly.
        recoverable: false
        user_action: Reject the release; do not install it.
      - name: UnrecognizedSignature
        description: A signature matched no anchor key.
        recoverable: false
        user_action: Reject the release; the signer is not trusted.
      - name: MalformedSignature
        description: A signature blob was the wrong length / unparseable.
        recoverable: false
        user_action: Reject the release artifact.
      - name: Module
        description: Wraps oxicrypt_module::Error.
        recoverable: false
        user_action: Ensure the oxicrypt module was initialized.

  - name: ConfirmError
    module: daemonseed_core::release
    variants:
      - name: NotVerified
        description: confirm() was called outside the Verified state.
        recoverable: true
        user_action: Verify the update before confirming.
      - name: DowngradeNotAcknowledged
        description: A downgrade was confirmed without explicit acknowledgement.
        recoverable: true
        user_action: Re-call confirm() with the downgrade acknowledgement flag set.

  - name: BiometricError
    module: daemonseed_core::biometric
    variants:
      - name: Unavailable
        description: No enclave on this platform, or biometric unlock is not enrolled.
        recoverable: false
        user_action: Fall back to passphrase entry; offer enrollment if supported.
      - name: NotFound
        description: Nothing is stored for this profile.
        recoverable: true
        user_action: Prompt for the passphrase and store it if the user opts in.
      - name: Backend
        description: The platform backend returned an error (string is backend-specific).
        recoverable: true
        user_action: Retry, or fall back to passphrase entry.

  - name: AutostartError
    module: daemonseed_core::autostart
    variants:
      - name: Unsupported
        description: The target mechanism is unavailable on this platform.
        recoverable: false
        user_action: Choose a target supported by the host OS.
      - name: Backend
        description: The platform backend returned an error.
        recoverable: true
        user_action: Retry; check permissions for installing the autostart unit.

# ─────────────────────────────────────────────────────────────────────
# Constants — named constants the API exposes.
# ─────────────────────────────────────────────────────────────────────

constants:
  - name: WORD_COUNT
    module: daemonseed_core::identity::mnemonic
    type: usize
    value: "24"
    description: BIP-39 mnemonic length pinned at 24 words (256-bit entropy).

  - name: TRANSCRIPT_MAX_BACKLOG_AGE
    module: daemonseed_core::transcript
    type: Duration
    value: "24h"
    description: Past bound of the #131 ordering trust window; must exceed the longest a message legitimately lives in the DHT rendezvous ring so real backlog is never clamped.
  - name: TRANSCRIPT_MAX_CLOCK_SKEW
    module: daemonseed_core::transcript
    type: Duration
    value: "120s"
    description: Future bound of the #131 ordering trust window (clock-skew tolerance); a timestamp beyond it is a bad clock or a forgery.

  - name: ML_DSA_SEED_LEN
    module: daemonseed_core::identity::keys
    type: usize
    value: "32"
    description: "ML-DSA-87 seed length (FIPS 204 §5.1); the raw seed a server persists."

  - name: CHANNEL_BINDING_LABEL
    module: daemonseed_core::identity_proof
    type: "&[u8]"
    value: '"daemonseed/identity-proof/v1" (= kdf::info::IDENTITY_PROOF_V1.as_bytes())'
    description: TLS 1.3 exporter label. Single source of truth in the kdf-info registry.

  - name: CHANNEL_BINDING_LEN
    module: daemonseed_core::identity_proof
    type: usize
    value: "32"
    description: Length in bytes of the derived TLS-exporter channel binding.

  - name: SKEW_WINDOW_MS
    module: daemonseed_core::identity_proof
    type: u64
    value: "300000"
    description: >-
      +/-5min freshness window (decision D1). Hosts MUST run NTP — drift beyond
      this fails identity-proof.

  - name: IDENTITY_ROOT_SALT
    module: daemonseed_core::kdf::info
    type: "&str"
    value: '"daemonseed/v1/identity-root"'
    description: HKDF salt for the identity-root derivation.

  - name: DOMAIN_SIGN
    module: daemonseed_core::kdf::info
    type: "&str"
    value: '"sign"'
    description: Domain string for the signing-key branch.

  - name: DOMAIN_KEM_D
    module: daemonseed_core::kdf::info
    type: "&str"
    value: '"kem-d"'
    description: Domain string for the KEM decapsulation-key branch.

  - name: DOMAIN_KEM_Z
    module: daemonseed_core::kdf::info
    type: "&str"
    value: '"kem-z"'
    description: Domain string for the KEM implicit-rejection-key branch.

  - name: IDENTITY_PROOF_V1
    module: daemonseed_core::kdf::info
    type: "&str"
    value: '"daemonseed/identity-proof/v1"'
    description: HKDF info string / channel-binding label for the v1 identity proof.

  - name: CONFIG_FILENAME
    module: daemonseed_core::profile::resolve
    type: "&str"
    value: '"daemonseed.toml"'
    description: The per-profile config filename resolved per ISC-C35.

  - name: MAGIC
    module: daemonseed_core::storage::seeds
    type: "&[u8]"
    value: 'b"daemonseed/blob/v2\0"'
    description: >-
      Current 19-byte v2 magic. seal() always writes this. NOT bumped by M4b —
      counters are a payload-schema extension, not a blob-format change.

  - name: MAGIC_V1
    module: daemonseed_core::storage::seeds
    type: "&[u8]"
    value: 'b"daemonseed/blob/v1\0"'
    description: Legacy v1 magic accepted by open() for read-fallback.

  - name: SUITE_ID_LEN
    module: daemonseed_core::storage::seeds
    type: usize
    value: "2"
    description: Big-endian suite_id slot length after the magic prefix.

  - name: NONCE_LEN
    module: daemonseed_core::storage::seeds
    type: usize
    value: "12"
    description: AES-256-GCM nonce length in bytes.

  - name: TAG_LEN
    module: daemonseed_core::storage::seeds
    type: usize
    value: "16"
    description: AES-256-GCM authentication tag length in bytes.

  - name: ARGON2_OUTPUT_LEN
    module: daemonseed_core::storage::seeds
    type: usize
    value: "48"
    description: 48 since D5 (HKDF-SHA-384 PRK length; was 32 under SHA-256).

  - name: AEAD_KEY_LEN
    module: daemonseed_core::storage::seeds
    type: usize
    value: "32"
    description: AES-256-GCM key length in bytes.

  - name: RECOVERY_FILE_MAGIC
    module: daemonseed_core::storage::recovery_file
    type: "&[u8]"
    value: 'b"daemonseed/dseed/v2\0"'
