  # ── identity ─────────────────────────────────────────────────────────
  - name: identity::node_keypair
    module: daemonseed_veilid_net::identity
    description: Derive the Veilid node keypair from a VeilidNodeSeed (D3).
    signature: "pub fn node_keypair(seed: &VeilidNodeSeed) -> Result<KeyPair>"
    parameters:
      - name: seed
        type: "&VeilidNodeSeed"
        direction: in
        description: The node identity seed.
    returns:
      type: "Result<KeyPair>"
      description: The node keypair.
  - name: identity::rendezvous_owner_keypair
    module: daemonseed_veilid_net::identity
    description: Derive the shared rendezvous-owner keypair from a 32-byte owner seed (every participant derives the same one).
    signature: "pub fn rendezvous_owner_keypair(owner_seed: &[u8; 32]) -> Result<KeyPair>"
    parameters:
      - name: owner_seed
        type: "&[u8; 32]"
        direction: in
        description: The circle/room rendezvous-owner seed.
    returns:
      type: "Result<KeyPair>"
      description: >-
        The rendezvous-owner keypair. The KeyPair contains the seed (it is the VLD0
        secret) in a non-zeroizing veilid Bytes. Deriving per operation bounds only this
        binding, NOT the secret: passing the keypair to open_dht_record /
        create_dht_record makes veilid retain a clone in OpenedRecord.writer for as long
        as the record stays open. daemonseed opens a record once per session and holds it
        open. Use
        rendezvous_owner_public_bytes where only a record identity is needed.
  - name: identity::OperatorCredential::load
    module: daemonseed_veilid_net::identity
    description: >-
      Load the seed from the source, checked against the baked project_announce_pubkey,
      then derive the announce owner seed, checked against PROJECT_ANNOUNCE_OWNER_PUBKEY.
      Ok(None) is an instance given no seed; every other failure is an error.
    signature: "pub fn load(source: &ProjectAnnounceSeedSource) -> Result<Option<(Self, SeedOrigin)>, OperatorCredentialError>"
    parameters:
      - name: source
        type: "&ProjectAnnounceSeedSource"
        direction: in
        description: The seed variable's value and the profile root's seed file.
    returns:
      type: "Result<Option<(OperatorCredential, SeedOrigin)>, OperatorCredentialError>"
      description: The credential and where its seed came from, or None for an instance given no seed.
      error_variants:
        - name: Seed
          condition: The seed could not be loaded or is not the project-announce seed.
        - name: Signer
          condition: ML-DSA key derivation failed.
        - name: Owner
          condition: The owner-seed derivation failed.
        - name: NotTheBakedSigner
          condition: The seed derives a signing key other than the baked one.
        - name: NotTheBakedOwner
          condition: The seed derives an announce owner key other than the baked one.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: identity::OperatorCredential::from_seed
    module: daemonseed_veilid_net::identity
    description: >-
      Derive both halves from the seed and check the signing key against expected_signer
      and the owner key against expected_owner. Both checks run on every path that builds
      a credential; the expectations are parameters so each check has a positive control
      in tests, and load passes the baked constants.
    signature: "pub fn from_seed(seed: &ProjectAnnounceSeed, expected_signer: &[u8; IDENTITY_PK_LEN], expected_owner: &[u8; 32]) -> Result<Self, OperatorCredentialError>"
    parameters:
      - name: seed
        type: "&ProjectAnnounceSeed"
        direction: in
        description: A loaded project-announce seed.
      - name: expected_signer
        type: "&[u8; IDENTITY_PK_LEN]"
        direction: in
        description: The ML-DSA-87 public key the seed must derive.
      - name: expected_owner
        type: "&[u8; 32]"
        direction: in
        description: The Ed25519 owner public key the seed must derive.
    returns:
      type: "Result<OperatorCredential, OperatorCredentialError>"
      description: The credential.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: identity::OperatorCredential::signer
    module: daemonseed_veilid_net::identity
    description: The keypair MOTD and announcements are signed with.
    signature: "pub fn signer(&self) -> &SignKeypair"
    parameters: []
    returns:
      type: "&SignKeypair"
      description: The project-announce signing keypair.

  - name: identity::OperatorCredential::owner_seed
    module: daemonseed_veilid_net::identity
    description: The announce record's owner seed, for the write sites and for subscribing the record as its owner.
    signature: "pub fn owner_seed(&self) -> &OwnerSeed"
    parameters: []
    returns:
      type: "&OwnerSeed"
      description: The owner seed.

  - name: identity::rendezvous_owner_public_bytes
    module: daemonseed_veilid_net::identity
    description: >-
      The 32-byte Ed25519 public key of a rendezvous-owner keypair — the same value
      rendezvous_owner_keypair puts in KeyPair::key(), as raw bytes. Total, because a
      VLD0 public key is 32 bytes for every seed. Identifies a record without carrying
      the secret: the DHT address derives from this key, so it separates records at
      least as precisely as the seed does.
    signature: "pub fn rendezvous_owner_public_bytes(owner_seed: &[u8; 32]) -> [u8; 32]"
    parameters:
      - name: owner_seed
        type: "&[u8; 32]"
        direction: in
        description: The rendezvous-owner seed.
    returns:
      type: "[u8; 32]"
      description: The owner's raw Ed25519 public key.
  - name: identity::owner_public_key
    module: daemonseed_veilid_net::identity
    description: >-
      The VLD0-kinded PublicKey naming a rendezvous owner, built from the raw 32 public
      bytes alone — exactly the value rendezvous_owner_keypair's KeyPair::key() yields
      for the same owner, so it addresses the same DHT record with no owner secret
      derived or held. Total. The kind must be VLD0: get_dht_record_key runs the owner
      key through check_public_key.
    signature: "pub fn owner_public_key(owner_public: &[u8; 32]) -> PublicKey"
    parameters:
      - name: owner_public
        type: "&[u8; 32]"
        direction: in
        description: The owner's raw Ed25519 public key.
    returns:
      type: PublicKey
      description: The VLD0 public key get_dht_record_key consumes.

  # ── schedule ─────────────────────────────────────────────────────────
  - name: DirectMessageWrite::class
    module: daemonseed_veilid_net::schedule
    description: The priority class of every direct-messaging write. Total, const.
    signature: "pub const fn class(self) -> WriteClass"
    parameters: []
    returns:
      type: WriteClass
      description: WriteClass::Chat, for every variant.
  - name: DirectMessageWrite::kind
    module: daemonseed_veilid_net::schedule
    description: >-
      The coalescing behavior of every direct-messaging write. Ring takes no logical id:
      it is the kind the funnel never coalesces, so there is no coalescing key to name.
      Total, const.
    signature: "pub const fn kind(self) -> WriteKind"
    parameters: []
    returns:
      type: WriteKind
      description: WriteKind::Ring, for every variant.
  - name: WriteRequest::direct_message
    module: daemonseed_veilid_net::schedule
    description: >-
      The funnel request for one direct-messaging write. class and kind come from write
      and deadline is None, so a direct-messaging write reaches the queue in one shape.
      A chat-lane write dispatches on its own pool at any queue depth and has no use for
      the deadline override.
    signature: "impl<D> WriteRequest<D> { pub fn direct_message(record: RecordId, write: DirectMessageWrite, item: D, reply: Option<oneshot::Sender<Result<()>>>) -> Self }"
    parameters:
      - name: record
        type: RecordId
        direction: in
        description: The target DHT record — the enqueue-order and coalescing scope.
      - name: write
        type: DirectMessageWrite
        direction: in
        description: Which direct-messaging write this is; it fixes the class and the kind.
      - name: item
        type: D
        direction: in
        description: The opaque dispatch token handed to the WriteSink at dispatch.
      - name: reply
        type: "Option<oneshot::Sender<Result<()>>>"
        direction: in
        description: Fired with the write result.
    returns:
      type: "WriteRequest<D>"
      description: The request to hand WriteSchedulerHandle::enqueue.
  - name: WriteSchedulerHandle::enqueue
    module: daemonseed_veilid_net::schedule
    description: >-
      Submit one write to the funnel. This is the only write entry point; no read path
      reaches it. The call is non-blocking and returns once the request is queued — the
      write result arrives on req.reply, as does an Ok when a newer same-record,
      same-logical-id write coalesces this one away. When the scheduler task is already
      gone the reply resolves with an error rather than the request being dropped
      silently.
    signature: "impl<D: Send + 'static> WriteSchedulerHandle<D> { pub fn enqueue(&self, req: WriteRequest<D>) }"
    parameters:
      - name: req
        type: "WriteRequest<D>"
        direction: in
        description: The write to queue — target record, class, kind, optional deadline, dispatch token and optional reply channel.
    returns:
      type: "()"
      description: None; the outcome arrives on req.reply.

  # ── resweep ──────────────────────────────────────────────────────────
  - name: next_resweep_record
    module: daemonseed_veilid_net::resweep
    description: >-
      Pick the record a steady-state resweep tick sweeps next: the smallest identity
      strictly greater than `last`, wrapping to the smallest when `last` is None, is the
      largest, or has left the set. Selection is key-based rather than index-based, so a
      record joining or leaving between ticks is never skipped. Every identity in one
      caller's set must be the same kind of identity — an owner seed or an owner public
      key, never a mix, since a cursor cannot order across the two.
    signature: "pub fn next_resweep_record(records: &mut Vec<[u8; 32]>, last: Option<[u8; 32]>) -> Option<[u8; 32]>"
    parameters:
      - name: records
        type: "&mut Vec<[u8; 32]>"
        direction: in
        description: The currently subscribed record identities. Sorted and deduplicated in place, so traversal order is stable across ticks whatever the caller's insertion order.
      - name: last
        type: "Option<[u8; 32]>"
        direction: in
        description: The identity swept on the previous tick, or None to start at the smallest.
    returns:
      type: "Option<[u8; 32]>"
      description: The identity to sweep on this tick, or None when the set is empty.

# ─────────────────────────────────────────────────────────────────────
# Error types
# ─────────────────────────────────────────────────────────────────────

error_types:
  - name: VeilidNetError
    module: daemonseed_veilid_net::error
    kind: enum
    description: Errors from bringing up or operating the daemonseed Veilid node. `fetch_class(&self) -> FetchErrorClass` classifies a fetch-path failure so the download engine decides resume vs abort vs surface without switching on message strings.
    variants:
      - name: Startup
        condition: veilid startup failed.
      - name: NotReady
        condition: The node did not become public-internet-ready in time.
      - name: Routing
        condition: A routing / private-route error.
      - name: Send
        condition: A send / transport failure (offline / slow / dead route).
      - name: TimedOut
        condition: A network call that ran out of time — an open or read cut off at its bound, a call Veilid answered with Timeout, or a write the network had not taken (or could not be checked) within its confirmation budget. Classified where the typed error is first seen, never from message text.
      - name: Local
        condition: A failure that never left this node — a runtime the synchronous record bridge cannot use, a record this node just wrote and no longer holds, a write the scheduler never took because it is gone, or a call Veilid refused before sending it (NotInitialized, AlreadyInitialized, Shutdown, Unimplemented, ParseError, InvalidArgument, MissingArgument, TransactionNotFound). Veilid's Internal is a refusal, since Veilid also raises it after a fanout.
      - name: NotServed
        condition: The peer answered but does not serve the requested share/chunk (withdrawn or never offered) — an authoritative negative distinct from a transport error.
      - name: Integrity
        condition: The sharer served content that failed verification — SHA-384 content-address mismatch, chunk-address mismatch, or a malformed/oversized frame. The route is fine; the content is hostile.
      - name: Identity
        condition: Invalid node identity.
      - name: Actor
        condition: The actor task is gone or dropped a reply.
      - name: Unimplemented
        condition: A Phase 4 surface (presence / announcements) not yet implemented.
  - name: FetchErrorClass
    module: daemonseed_veilid_net::error
    kind: enum
    description: Coarse class of a fetch-path failure, returned by `VeilidNetError::fetch_class`. The download engine switches on it to decide resume vs abort vs surface.
    variants:
      - name: Transient
        condition: Transport / route failure — resumable; verified units are retained and the share stays Unresolved.
      - name: Integrity
        condition: Content failed verification — fatal for the share; never persisted, never resumed past.
      - name: NotServed
        condition: The reachable owner does not serve this share/chunk — an authoritative negative.
      - name: Local
        condition: A local fetcher fault (path sanitize, disk write, index write) contributed by the download engine; `fetch_class` never returns it.

# ─────────────────────────────────────────────────────────────────────
# Constants
# ─────────────────────────────────────────────────────────────────────

constants:
  - name: DirectMessageWrite::ALL
    module: daemonseed_veilid_net::schedule
    type: "[DirectMessageWrite; 9]"
    description: Every DirectMessageWrite variant, in the order the direct-messaging flows reach them.
  - name: PROJECT_ANNOUNCE_OWNER_PUBKEY
    module: daemonseed_veilid_net::identity
    type: "[u8; 32]"
    value: "ca406be72b15eab6e5c97a51a9db4c35054a57b1da7645c05db43a326eede31c"
    description: >-
      The 32-byte Ed25519 public key owning the project-announce/MOTD DHT record
      (ISC-15). owner_public_key turns it into the VLD0 PublicKey get_dht_record_key
      consumes, which names the record's DHT address. It confers no write capability —
      the owner secret gates writes. The operator instance checks its runtime-loaded
      seed's derived owner key against this value (OperatorCredential::load) before
      holding the credential; project_announce_owner_pubkey_kat pins the value.
  - name: GRACEFUL_CLOSE_BUDGET
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(12)"
    description: Total a front-end waits on a graceful close. CLOSE_PREFLUSH_BUDGET and CLOSE_FLUSH_FLOOR are carved out of it, and the remainder covers transport teardown and the command/reply hops.
  - name: CLOSE_PREFLUSH_BUDGET
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(6)"
    description: What a close arm may spend on share withdraws and LEAVE tombstones before the I7 flush runs. A step cut off here stays enqueued on the scheduler and is dispatched by the flush.
  - name: CLOSE_FLUSH_FLOOR
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(2)"
    description: Minimum budget the I7 flush receives, plus any unspent CLOSE_PREFLUSH_BUDGET.
  - name: CLOSE_LEAVE_RESERVE
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(2)"
    description: The slice of CLOSE_PREFLUSH_BUDGET the share withdraws may not take, so the LEAVE tombstone always has a budget to run in.
  - name: TEARDOWN_CAP
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(3)"
    description: Cap on veilid's own teardown, and half a caller's bound on shutdown. flush_budget counts from the moment the actor dequeues Command::Shutdown, so a caller caps its await at flush_budget + TEARDOWN_CAP.
  - name: APP_MESSAGE_CAP
    module: daemonseed_veilid_net::actor
    type: usize
    value: "32768"
    description: veilid's app_message / app_call payload cap (bytes); sealed envelopes must fit.
  - name: FRAGMENT_SIZE
    module: daemonseed_veilid_net::share
    type: usize
    value: "30 * 1024"
    description: Per-fragment payload size for share transfer over app_call.
  - name: FRAGMENT_FETCH_CONCURRENCY
    module: daemonseed_veilid_net::share
    type: usize
    value: "8"
    description: Default (ceiling) concurrent fragment app_calls per chunk fetch.
  - name: FRAGMENT_LATENCY_THRESHOLD
    module: daemonseed_veilid_net::share
    type: Duration
    value: "2s"
    description: Per-fragment latency above which the AIMD window narrows (#128 D-1).
  - name: W_FLOOR
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "2"
    description: Per-route budget slow-start / collapse width.
  - name: W_CEIL
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "8"
    description: Widest a single route's budget opens; W_CEIL < G_GLOBAL is a design invariant.
  - name: DEFAULT_ROUTE_CEIL
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "2"
    description: Fresh-route starting ceiling in production (= W_FLOOR); pins the fetch window on veilid 0.5.7, where a serving route dies above ~2 concurrent fragment app_calls.
  - name: G_GLOBAL
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "12"
    description: Fetcher-global cap on total in-flight fragment app_calls across all routes.
  - name: F_FILES
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "4"
    description: Per-download in-flight file cap (bookkeeping, not route protection).
  - name: DHT_GATE_PERMITS
    module: daemonseed_veilid_net::dht_gate
    type: usize
    value: "16"
    description: veilid's process-global DHT-operation gate size (its `network.dht.max_concurrent_operations` default). A stock build does not change it.
  - name: DHT_GATE_MARGIN
    module: daemonseed_veilid_net::dht_gate
    type: usize
    value: "2"
    description: Headroom kept below veilid's gate for daemonseed's un-gated DHT ops (open_dht_record, watch_dht_values). It also sizes DhtGate's un-gated-op limiter, which bounds their peak concurrency to this number.
  - name: DHT_BUDGET
    module: daemonseed_veilid_net::dht_gate
    type: usize
    value: "DHT_GATE_PERMITS - DHT_GATE_MARGIN"
    description: daemonseed's self-imposed combined chat + floor + window + read in-flight DHT-op budget, 14 at the current margin. The four pool sizes sum to exactly this.
  - name: CHAT_PERMITS
    module: daemonseed_veilid_net::dht_gate
    type: usize
    value: "2"
    description: Chat-lane pool size — two cross-record chat writes proceed in parallel; a third queues behind chat alone, never behind a non-chat lane.
  - name: FLOOR_PERMITS
    module: daemonseed_veilid_net::dht_gate
    type: usize
    value: "1"
    description: Floor-lane pool size — the starvation-floor and deadline lane's single additional guaranteed write slot, so saturated aggregate write concurrency is W_MAX + 1.
  - name: W_MAX
    module: daemonseed_veilid_net::dht_gate
    type: usize
    value: "2"
    description: The non-chat window pool size — the ceiling on concurrent non-chat window-lane writes. Raising it is a static re-construction of the gate at the new value, never a live re-partition.
  - name: READ_PERMITS
    module: daemonseed_veilid_net::dht_gate
    type: usize
    value: "DHT_BUDGET - CHAT_PERMITS - FLOOR_PERMITS - W_MAX"
    description: Read-lane pool size — the residual of the budget after the other three pools, 9 at the current W_MAX. A sweep holds one read permit per get_dht_value, so read occupancy stays within it whatever the live sweep count.
  - name: R_MIN
    module: daemonseed_veilid_net::dht_gate
    type: usize
    value: "6"
    description: The read-partition floor. READ_PERMITS may not fall below it, which caps W_MAX at 5. A compile-time assertion block checks this alongside the partition sum.
  - name: ROUTE_ADVERT_DOMAIN
    module: daemonseed_veilid_net::discovery
    type: "&[u8]"
    value: "b\"daemonseed/veilid/share-route/v1\""
    description: Domain-separation prefix for the route-advert provenance input.

# ─────────────────────────────────────────────────────────────────────
# Gotchas
# ─────────────────────────────────────────────────────────────────────

gotchas:
  - description: >-
      Attach first. Every operation requires the node public-internet-ready —
      call attach_and_wait after start; operations before then fail.
  - description: >-
      Node identity is EPHEMERAL (fresh per launch); content identity (the ML-DSA
      signing key) is stable. Share adverts are placed at a stable-share_id
      rendezvous slot (last-writer-wins), so a republish under a fresh node
      identity overwrites in place and a withdraw cancels it (#118).
  - description: >-
      A share is served owner-on-demand: the sharer MUST stay online (ISC-A-S21).
      serve_share registers content; publish_share advertises the route. Unpublish
      is stop_serve (drops the serve registry entry + advert) plus a signed
      withdraw announcement.
  - description: >-
      Discovery is anti-swap: a fetcher MUST verify_route_advert against the
      announcer pubkey (from open_announcement) before importing a discovered
      route — a MITM on the world-writable lobby record cannot redirect a fetch.
  - description: >-
      Rendezvous records are opened with no Veilid encryption key (verbatim
      storage). Do not rely on Veilid value-encryption; the cot seal is the only
      content layer.

# ─────────────────────────────────────────────────────────────────────
# Testing
# ─────────────────────────────────────────────────────────────────────

testing:
  - description: >-
      Unit tests run without a network (in-process app_call closures for share
      serve/fetch, pure codec + AIMD + discovery anti-swap tests). Live two-node
      tests (crates/daemonseed-veilid-net/tests/two_node_*.rs) require a real
      public Veilid attach and are `#[ignore]`d by default — run with
      `cargo nextest run -- --ignored` on a host that can attach to the public
      network.
