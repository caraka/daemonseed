// daemonseed wire protocol — direct messaging.
//
// Design of record: `docs/design/direct-messaging.md` (FROZEN, DRAFT v6).
// Anchors ISC-C38-C46 and ISC-A-C20-A-C25.
//
// These messages are DHT record values, not gRPC payloads — there is no service
// stanza. Each is written to a Veilid DFLT subkey and read back verbatim; the
// only encryption is ours (AES-256-GCM inside), so the DHT and every storage
// node see sealed bytes and no forgeable authorship (ISC-A-S2 / ISC-A-C20).
//
// Green-field additive MINOR on the frozen v0.36.2 wire: no existing message,
// field, or record changes, and a pre-DM client never derives or sweeps a DM
// record, so it neither sees nor breaks on any of this. MINOR bumps here MUST
// stay additive-only. Never reuse field numbers, never repurpose enum values.

syntax = "proto3";

package daemonseed.v1;

// Which key an initiator encapsulated `ss0` to when opening a conversation.
//
// Alpha always writes `KEY_SELECTOR_STATIC`. The enum exists so that
// re-introducing one-time PQ prekeys later is a no-wire-change addition rather
// than an additive proto bump: a future client could name a prekey and fall back
// to `STATIC` against an older peer. Prekeys were dropped for alpha (and are
// expected to stay dropped), which is why the opening burst before the
// recipient's first reply has no forward secrecy — see ISC-C45's hello-grade
// labeling requirement, which is the mitigation.
enum KeySelector {
  // Never written. Proto3 requires a zero default; treat it as `STATIC` on read
  // so an unset field from a future client is not silently a different key.
  KEY_SELECTOR_UNSPECIFIED = 0;

  // The recipient's long-term ML-KEM-1024 encapsulation key, published in
  // `DmKeyRecord.kem_ek`.
  KEY_SELECTOR_STATIC = 1;
}

// An identity's published static ML-KEM-1024 encapsulation key — the thing that
// makes an identity DM-able (ISC-C40).
//
// Lives alone in subkey 0 of a `dflt(1)` record whose owner is derived from the
// identity's own ML-DSA-87 public key, so anyone holding that pubkey computes
// the address. Every provenance-signed artifact already carries it (chat and
// room messages, share announcements, presence beacons), so anyone visible on a
// roster or in a transcript is reachable with no new discovery surface.
//
// The record is world-WRITABLE, because a world-derivable address under DFLT
// implies a world-derivable owner. That is accepted and bounded: forgery is
// impossible (the signature is verified against the identity pubkey the reader
// already used to derive the address), so the only attack is erasure or
// rollback, both denial-of-service. Readers cache the highest verified `version`
// and never regress.
//
// The publish is presence-INDEPENDENT: written once and re-seeded against
// eviction on a fixed slow schedule that takes no input from user activity, so
// polling it reveals at most "this identity is DM-able", never an online rhythm.
message DmKeyRecord {
  // Monotonic. A reader accepts a record only if `version` is at least the
  // highest it has already verified for this identity, so a replayed older
  // signed blob cannot revert a key rotation.
  uint64 version = 1;

  // ML-KEM-1024 encapsulation key, exactly 1568 bytes. The public half of the
  // mnemonic-derived identity KEM keypair; only this half is new to the wire.
  bytes kem_ek = 2;

  // Whether this identity requires a grantee-bound one-time invite token on a
  // first-contact entry (admission option C). Advertised so a sender knows to
  // include one; the recipient enforces it regardless of what it advertised.
  bool invite_only = 3;

  // ML-DSA-87 signature, exactly 4627 bytes, over the domain-separated
  // preimage of (identity pubkey, version, kem_ek, invite_only). Verified
  // against the identity pubkey the reader derived this record's address from —
  // never against anything carried in the record, which carries no pubkey
  // precisely so there is nothing to substitute.
  bytes signature = 4;
}

// What one party has settled on one direction of one conversation, sealed
// (ISC-C39).
//
// Lives alone in subkey 0 of a `dflt(1)` record whose owner is derived from the
// conversation's retained address root `AR` and the direction. Unlike the key
// record's `dflt(1)`, that address is NOT world-derivable: only the two parties
// hold `AR`, so the record is owner-write-gated and no third party can forge or
// erase it.
//
// **Everything is inside the seal, and nothing is in the clear.** A reader
// derives the key from `AR` and the direction alone, both of which it already
// holds before it fetches, so there is no field it needs before it can decrypt —
// and a collection high-water plus a gap pattern is exactly the metadata the
// record exists to keep off a storage node. The plaintext is padded to a single
// constant bucket before sealing, so the record's length is fixed and carries no
// signal about how many gaps a conversation has accumulated.
message DmAck {
  // `nonce(12) ‖ ciphertext ‖ tag(16)` over a padded `DmAckBody`, AES-256-GCM
  // under `K_ack(dir)`, binding the conversation identifier and the direction as
  // AAD. An acknowledgement replayed onto the other direction's record, or onto
  // another conversation's, fails to open.
  bytes sealed = 1;
}

// The sealed contents of a `DmAck` — the statement itself and the signature over
// it.
//
// The statement is monotonic: a reader unions it into what it already holds and
// never regresses, so a replayed older acknowledgement is a no-op rather than a
// rollback. Nothing here is trusted until the reader has also clipped it to the
// highest sequence number it has actually sent on this direction.
message DmAckBody {
  // The contiguous prefix: every sequence number from zero up to and including
  // this one is settled. Absent when none is — a real state, distinct from a
  // prefix of zero, because sequence zero is a live position on both directions.
  // Optional rather than sentinel-encoded for exactly that reason.
  optional uint64 high_water = 1;

  // The canonical run-length encoding of the settled positions BEYOND the
  // prefix: a big-endian `uint16` run count, then per run a big-endian `uint64`
  // gap measured from two past the previous run's end and a big-endian `uint64`
  // extent. Bounded at 64 runs, so at most 1026 bytes. One set has exactly one
  // spelling, which is what lets a verifier rebuild the signature preimage from
  // the decoded statement rather than from the bytes it was handed.
  bytes beyond = 2;

  // ML-DSA-87 signature, exactly 4627 bytes, under the sender's PSEUDONYM key,
  // over the domain-separated preimage of (chan_id, direction, high_water, the
  // encoded runs). Mandatory and always verified: owner-write authority on the
  // record is symmetric, so finding an acknowledgement at the `a2b` address does
  // not establish who wrote it. This signature is the only thing that does. It
  // covers the runs as well as the prefix, because the runs decide confirmation
  // just as the prefix does.
  bytes msg_sig = 3;
}

// A knock: everything the recipient needs to decide whether to accept a stranger
// and, on accept, to start the conversation (ISC-C41).
//
// Written to one slot of the recipient's world-writable `dflt(32)` doorbell. The
// slot is derived from a SENDER secret, so a storage node co-hosting the record
// cannot map it back to a sender; the sender's identity is only inside the seal.
//
// **Self-contained on purpose.** An earlier design put a pointer here and the
// payload elsewhere, which forced the recipient to fetch before it could judge —
// a read-amplification lever for anyone willing to write garbage. Carrying the
// whole thing means an unwanted entry costs exactly one decapsulation and one
// failed AEAD open, and nothing is fetched on a stranger's say-so. That is what
// makes the entry large, and the entry size is what forces the doorbell to
// `dflt(32)`.
//
// Every entry is padded to one of a few bucket sizes before it is written, so
// the length reveals only a coarse size class rather than the message.
message FirstContactEntry {
  // ML-KEM-1024 ciphertext, exactly 1568 bytes, encapsulated to the recipient's
  // published static key. Decapsulating it yields `ss0`, from which the seal
  // key, the channel address root, and the ratchet root all derive.
  bytes ct0 = 1;

  // `nonce(12) ‖ ciphertext ‖ tag(16)` over a `FirstContactBody`, AES-256-GCM
  // under a key derived from `ss0`, binding the recipient's key-record address
  // and the current first-contact epoch as AAD. An entry replayed to a different
  // recipient, or outside its epoch window, fails to open.
  bytes sealed = 2;

  // Proof-of-work over the entry, bounding flood rate (admission option B).
  // Absent until the admission slice lands; a recipient that requires it drops
  // entries without one.
  bytes pow = 3;

  // Reserved: `token` briefly lived here and was moved inside the seal. It is
  // bound to the sender's long-term public key, so carrying it in the clear would
  // have published the identity of every sender knocking at an invite-only
  // recipient — defeating the sender-blindness the doorbell exists for.
  reserved 4;
  reserved "token";
}

// The sealed contents of a `FirstContactEntry` — who is knocking, what they say,
// and the material to answer them.
//
// Nothing here is readable without `ss0`, so the identities are protected by the
// encapsulation to the recipient rather than by the DHT.
message FirstContactBody {
  // SHA-384 of the recipient's ML-DSA-87 public key, 48 bytes. The recipient
  // rejects an entry whose hash is not its own, which is what stops a ciphertext
  // meant for one identity being replayed at another. A hash rather than the
  // full key because the entry is size-constrained and the recipient already
  // knows its own key. Note the recipient reads this only AFTER decapsulating —
  // the alpha accepts that (no proof of decapsulation-key possession).
  bytes intended_recipient_hash = 1;

  // The sender's long-term ML-DSA-87 public key, exactly 2592 bytes. What the
  // recipient displays, blocks, and later recognises.
  bytes pk_lt = 2;

  // The sender's per-contact pseudonym ML-DSA-87 public key, exactly 2592 bytes.
  // Signs every message of this conversation, so wire authorship is never the
  // long-term key. Random per correspondent — hence unlinkable across
  // conversations, and unrecoverable from the recovery phrase.
  bytes pk_pc = 3;

  // ML-DSA-87 signature, exactly 4627 bytes, under the LONG-TERM key, binding
  // the pseudonym to the identity. This is what lets the recipient say "the
  // pseudonym signing this conversation belongs to that identity".
  bytes bind_lt = 4;

  // Which of the recipient's keys `ct0` was encapsulated to. Alpha always
  // `KEY_SELECTOR_STATIC`.
  KeySelector key_selector = 5;

  // Sequence number within the direction. Always zero for first contact, and
  // rejected otherwise: the conversation pages messages at `seq / K`, so a large
  // value would start the recipient's collection cursor at an absurd page.
  uint64 seq = 6;

  // Unix milliseconds, sender-asserted and signed. Display only — never trusted
  // for ordering or freshness against an adversary.
  int64 sent_unix_ms = 7;

  // The first message. Bounded well below the padding bucket so the entry always
  // fits its doorbell subkey.
  string body = 8;

  // The sender's first ratchet ephemeral ML-KEM-1024 encapsulation key, exactly
  // 1568 bytes. The recipient encapsulates to it in its reply, which is the first
  // ratchet step and the point at which the conversation becomes forward-secret.
  // Everything before it is not.
  bytes eph_ek = 9;

  // ML-DSA-87 signature, exactly 4627 bytes, under the PSEUDONYM key. Mandatory
  // and always verified: it proves possession of the pseudonym key and covers
  // the body, the ephemeral key, the recipient, the sequence, and both public
  // keys. It is the SOLE proof-of-possession path: there is no separate
  // `bind_pop` signature, and folding it into `msg_sig` saves 4627 bytes. So any
  // future frame type must carry it or proof-of-possession silently disappears
  // there.
  bytes msg_sig = 10;

  // A grantee-bound one-time invite token the recipient issued (admission option
  // C), present only when knocking at an `invite_only` identity. Bound to the
  // sender's long-term key, so it is not a bearer secret and is useless if
  // intercepted. Inside the seal, because it names the sender. Absent until the
  // admission slice lands.
  bytes token = 11;
}

// One message on the established channel: a clear ratchet header and a sealed
// body, written to one slot of a `dflt(16)` page record (ISC-C42).
//
// **Everything in the clear is here because the receiver needs it BEFORE it can
// derive the key** — the ratchet position to look up, and the ML-KEM material to
// take the generation step with. Nothing else is: no identity, no pseudonym, no
// signature. The two parties learned each other's keys at first contact and hold
// them in the contact cache, so a channel frame never re-states them and a page
// co-host sees only opaque bytes at a bucketed size class (ISC-A-C20).
//
// Every clear field is bound in the seal's AAD, so tampering with the header
// fails the AEAD open before any signature is checked, and again in `msg_sig`
// inside the seal, so a party that opens a frame can prove who wrote it.
message DmChannelFrame {
  // Which root this message's chain hangs from. `uint32` deliberately matches
  // the width the ratchet counts generations in: a `uint64` here would need a
  // narrowing cast at this boundary, and generation 0 and generation 2^32 would
  // then collide on one skipped-key slot.
  uint32 ratchet_gen = 1;

  // The sequence number at which this message's chain begins — the frozen
  // design's `PN` stated absolutely rather than as a count, because sequence
  // numbers here are monotonic per direction across the whole conversation
  // (they address the page a message lives in) instead of restarting per chain.
  // The receiver runs the previous chain out to `chain_base - 1` before
  // switching, and the value stays unambiguous when the message that would have
  // anchored a relative count is lost.
  uint64 chain_base = 2;

  // This message's sequence number, monotonic per direction across the whole
  // conversation. It is also what the page address encodes, so a collector MUST
  // check it against the position the frame was read from once the sweep yields
  // subkey indices — otherwise the write-once mapping between a sequence number
  // and its slot is asserted by the writer and checked by nobody.
  uint64 seq = 3;

  // The sender's current ratchet ephemeral ML-KEM-1024 encapsulation key,
  // exactly 1568 bytes. The far end encapsulates to it to take the next
  // generation step, which is where a compromise of this sender heals. Signed,
  // because an unauthenticated ephemeral would let an active attacker
  // substitute their own and defeat exactly that healing.
  bytes eph_ek = 4;

  // The ML-KEM-1024 ciphertext that created this generation, exactly 1568
  // bytes, repeated on EVERY message of the generation rather than only the one
  // that opened it. Without the repetition, losing that single message would
  // make the whole rest of the conversation undecryptable instead of costing
  // one message. Absent only in the initiator's opening burst, whose chain
  // hangs off the first-contact secret directly.
  bytes eph_ct = 5;

  // `nonce(12) ‖ ciphertext ‖ tag(16)` over a padded `DmChannelBody`,
  // AES-256-GCM under the ratchet message key for this position, binding every
  // clear field above as AAD. The plaintext is padded to a bucket before
  // sealing, so the length reveals only a coarse size class.
  bytes sealed = 6;
}

// The sealed contents of a `DmChannelFrame`.
//
// Small on purpose: the conversation's identities, keys and channel material
// were all established at first contact, so an ongoing message carries only what
// changes per message.
message DmChannelBody {
  // Unix milliseconds, sender-asserted and signed. Display only — never trusted
  // for ordering or freshness against an adversary.
  int64 sent_unix_ms = 1;

  // The message.
  string body = 2;

  // ML-DSA-87 signature, exactly 4627 bytes, under the sender's PSEUDONYM key —
  // the same key and the same preimage builder as the first-contact entry, under
  // a distinct frame-kind label, extended to bind the ratchet header and the
  // generation ciphertext. Mandatory and always verified: owner-write authority
  // on a page is SYMMETRIC (both parties derive the owner seed for both
  // directions), so finding a frame in the `a2b` pages does not establish that A
  // wrote it. This signature is the only thing that does.
  bytes msg_sig = 3;

  // The sender's own collection prefix, riding out on this message instead of a
  // standalone acknowledgement record. Absent when the message carries no
  // acknowledgement, and absent-versus-zero is a real distinction — sequence
  // zero is a live position on both directions — so this is optional rather
  // than sentinel-encoded, exactly as `DmAckBody.high_water` is.
  optional uint64 ack_high_water = 4;

  // The canonical run-length encoding of the sender's settled positions BEYOND
  // that prefix, in the same spelling `DmAckBody.beyond` carries: a big-endian
  // `uint16` run count, then per run a big-endian `uint64` gap and a big-endian
  // `uint64` extent. Empty when this message carries no acknowledgement at all;
  // a piggybacked acknowledgement of zero runs is the two zero bytes of a run
  // count, not an empty field.
  //
  // Both fields are bound in `msg_sig` alongside every other signed field, so
  // the frame's own authorship signature authenticates the acknowledgement and
  // no second signature rides with it.
  bytes ack_beyond = 5;

  // The acceptor's per-contact pseudonym key, exactly 2592 bytes. Present only
  // on the acceptor's ACCEPT — the frame at its sequence zero, the first thing
  // written to the channel itself — and empty on every other frame. It is the
  // key the initiator verifies every later frame of this conversation against;
  // nothing else on the channel carries a pseudonym.
  bytes pk_pc = 6;

  // ML-DSA-87 signature, exactly 4627 bytes, under the acceptor's LONG-TERM key
  // over the `daemonseed/dm/bind/lt/v1` preimage `lp(pk_lt) || lp(pk_pc)` — the
  // same statement and the same domain a first-contact entry carries in the
  // other direction. Present exactly when `pk_pc` is, and verified against the
  // long-term key the initiator knocked at.
  bytes bind_lt = 7;
}
