// daemonseed wire protocol — circle-of-trust live relay service (M8, F23).
//
// The protocol's FIRST streaming RPC. Like PublicSpace (M6) it runs as
// gRPC-over-h2 over the post-Authenticated TLS stream (daemonseed-core
// Connection<Authenticated, T>); h2 owns its own framing, so there is no
// length-prefix framing here (that belonged to the pre-auth HELLO/proof phase).
//
// A circle's members meet at a rendezvous address — SHA-384(cot_key, server_id),
// derived client-side (daemonseed-core cot::asset_address) and opaque to the
// relay. Subscribe is a single bidirectional stream per member per asset: the
// stream's lifetime IS the member's presence (the "presence = subscription
// stream" decision). Opening the stream takes a reference to the asset; the
// stream closing — gracefully or via h2-keepalive detecting its death —
// releases it; the relay reaps the asset and its routing entry at refcount zero
// (ISC-A-S5). The relay forwards opaque ciphertext only: it never decrypts a
// payload, never learns the circle, its membership, or any notion of "joining"
// (ISC-A-S2). Nothing is persisted — an offline circle leaves no trace.
//
// Anchors: ISC-S4 (CoT side of the public-vs-CoT bifurcation), ISC-8 / ISC-S4
// (asset addressing), ISC-A-S2 (relay opacity), ISC-A-S5 (refcounted, no
// persistent CoT state), F23 (subscription lifecycle).
//
// MINOR bumps to this schema MUST be additive-only (ISC-S14): never reuse a
// field number, never repurpose an enum value, never tighten validation after
// a field has shipped. MAJOR bumps create a new `vN` proto module.

syntax = "proto3";

package daemonseed.v1;

// Circle-of-trust live relay (M8). The protocol's only bidirectional-streaming
// service. A member opens one Subscribe stream per circle-asset it participates
// in; the relay fans each inbound frame out to every *other* current subscriber
// of the same asset.
service CircleOfTrust {
  // Join a circle-asset's live relay. The client's FIRST frame names the
  // asset_address it is subscribing to (its payload, if any, is relayed like
  // any other frame). The stream stays open for the member's whole presence:
  // inbound frames are fanned out to co-subscribers, and frames from
  // co-subscribers arrive on the response stream. Closing the stream — or
  // h2-keepalive detecting its death — releases the member's reference, and the
  // asset is reaped at refcount zero (ISC-A-S5).
  rpc Subscribe(stream CotFrame) returns (stream CotFrame);
}

// One frame on a circle-asset's live relay. The relay routes by asset_address
// and forwards `payload` verbatim.
message CotFrame {
  // The rendezvous address SHA-384(cot_key, server_id) (ISC-8). Set on every
  // frame; the relay binds a stream to the asset named by that stream's first
  // frame and rejects any later frame naming a different asset, so a member
  // cannot inject into an asset it did not subscribe to.
  bytes asset_address = 1;

  // Opaque end-to-end-encrypted application bytes (a chat message, a share
  // announcement, and so on). The relay never decrypts or interprets these —
  // it is structurally a blind forwarder (ISC-A-S2).
  bytes payload = 2;
}

// A ROOM MESSAGE — the unified chat payload for BOTH a public room and a
// private circle (ISC-S4 / ISC-S22..S26 / ISC-10..14 / ISC-C57). A public room
// and a private circle behave identically in every respect except how their key
// is derived: a public room's key is world-derivable from the room name, a
// circle's key is entropy-gated from the shared phrase. Everything downstream —
// provenance, the #12hex authorship binding, sealing, fan-out, discovery — is
// ONE code path parameterized by the room key (design-of-record:
// docs/design/room-circle-unification.md § Design (A)). This is the *plaintext*
// shape: it is prost-encoded, then AES-256-GCM-sealed under the surface's key
// (daemonseed-core room_message via public_room / circle::message), and ONLY the
// resulting ciphertext rides in CotFrame.payload — it is NEVER wire-cleartext
// (ISC-A-S16), the relay is content-blind by construction (ISC-A-S2).
//
// It is SELF-SIGNED FOR PROVENANCE (ISC-S24 / ISC-C57): `sender_pubkey` and
// `signature` carry an ML-DSA-87 signature by the posting identity over a
// domain-separated input binding `provenance_domain ‖ room_id ‖ sender_pubkey ‖
// sent_unix_ms ‖ body`. The signature proves WHO posted (not that they were
// authorized to). Recipients verify it client-side and bind the displayed
// handle to `SHA-384(sender_pubkey)[:12]` (ISC-C4) so a spoofed `sender_handle`
// cannot impersonate a real key — closing the pre-merge gap where a circle
// message carried only a self-asserted handle. The two surfaces use DISTINCT
// domain strings (public-room/message/v1 vs circle/message/v2), so a signature
// or seal from one can never be opened or replayed as the other.
message RoomMessage {
  // The room/circle identifier bound into the provenance signature so a message
  // cannot be replayed across rooms/circles. For a public room this is the room
  // name (e.g. "lobby"); for a circle it is the member-derivable fingerprint
  // SHA-384(cot_key)[:12] (12 hex) — one-way, leaks no secret, recomputed by the
  // verifier from its OWN key. The verifier NEVER trusts this carried value for
  // crypto: it verifies the signature against a room_id it recomputes/knows from
  // context, so a forged or foreign room_id cannot validate.
  string room_id = 1;

  // The poster's full ML-DSA-87 public key (2592 bytes for ML-DSA-87). The
  // provenance signature verifies under it, and the recipient derives the
  // authoritative handle hash-prefix `SHA-384(sender_pubkey)[:12]` from it
  // (ISC-C4) — never trusting `sender_handle` alone. Authorship, dedup, and the
  // `mine` decision all key on this stable pubkey, not the mutable handle.
  bytes sender_pubkey = 2;

  // The poster's self-asserted display handle (`<name>#<12hex>`). DECORATIVE:
  // the recipient cross-checks its hash component against `sender_pubkey`
  // (ISC-C57) and shows the verified `#<prefix>` floor when it disagrees. It is
  // NOT in the signed transcript and is never read by any trust/dedup path.
  string sender_handle = 3;

  // The message body as typed. Rendered as inert plaintext by the client
  // (terminal control sequences stripped at the UI boundary).
  string body = 4;

  // Sender wall-clock at compose time, unix milliseconds. Advisory ordering and
  // provenance binding only — there is no global clock and no relay timestamp
  // (the relay sees ciphertext). Recipients display it; they do not trust it for
  // security, and it is provenance binding, NOT anti-replay.
  int64 sent_unix_ms = 5;

  // Detached ML-DSA-87 provenance signature (4627 bytes for ML-DSA-87) over the
  // domain-separated signed input (ISC-S24). Verified client-side under
  // `sender_pubkey`; an absent, empty, or bad signature drops the message
  // (ISC-A-S17, fail-closed).
  bytes signature = 6;
}

// A SHARE ANNOUNCEMENT — the in-band discovery payload that replaces the
// relay-hosted share registry (design-of-record: docs/design/unified-share-model.md).
// It is posted into a room/circle as a CotFrame.payload at that room's
// rendezvous address, sealed + ML-DSA self-signed exactly like a
// RoomMessage: discovery becomes "listen to the stream" instead of a
// relay ListPublicShares call, so the relay holds NO share directory (A-S2,
// A-S1) and is a pure blind forwarder for shares as it already is for chat.
//
// Like RoomMessage it is (1) SELF-SIGNED FOR PROVENANCE (C57): the
// signature over the domain-separated input proves WHO announced, not that they
// were authorized to. And (2) ENCRYPTED UNDER THE TIER KEY: the whole message
// is prost-encoded then AES-256-GCM-sealed — under the public room key for a
// public announcement (server-readable, the deliberately-public tier) or under
// a circle cot_key for a circle announcement (members-only). ONLY the
// ciphertext rides in CotFrame.payload (A-S16). See daemonseed-core
// share_announce::{seal_public_announcement, seal_circle_announcement,
// open_announcement}.
message ShareAnnouncement {
  // The room/circle this announcement belongs to (e.g. "lobby" for public).
  // Bound into the provenance signature so an announcement cannot be replayed
  // into a different room.
  string room = 1;

  // The announcer's full ML-DSA-87 public key. The provenance signature
  // verifies under it; the recipient derives the authoritative handle
  // hash-prefix SHA-384(sender_pubkey)[:12] (ISC-C4), never trusting
  // sender_handle alone.
  bytes sender_pubkey = 2;

  // The announcer's self-asserted display handle (`name#12hex`). Advisory: the
  // recipient cross-checks its hash component against sender_pubkey (ISC-C57).
  string sender_handle = 3;

  // The share's opaque id (ISC-S21). The fetcher derives the rendezvous address
  // it subscribes to from this — public_share_asset_address(share_id,
  // server_id) for a public share (daemonseed-core cot). This is what the old
  // PublicShareListing.share_id carried; the announcement hands it out in-band
  // instead of via the relay registry.
  //
  // At #156 this is RECEIVER-VERIFIABLE: share_id ==
  // derive_share_id_v2(sender_pubkey, root_commitment). Every ingest point
  // recomputes it and drops a mismatch, so an attacker can no longer pair a
  // scraped victim share_id with its own key (occupation/censorship). See
  // daemonseed-core share_announce and docs/design/share-id-binding.md.
  string share_id = 4;

  // Display name of the shared folder (was PublicShareListing.name).
  string name = 5;

  // Sharer-assigned rating label from the active taxonomy. Advisory, never
  // relay-enforced (was PublicShareListing.rating, ISC-C19 / ISC-A-S5b).
  string rating = 6;

  // True = this share is being WITHDRAWN (unpublish); false = announce/refresh.
  // Bound into the provenance signature so a withdraw cannot be forged for, or
  // replayed against, another announcer's share.
  bool withdraw = 7;

  // Announcer wall-clock at announce time, unix milliseconds. Advisory ordering
  // and liveness aging — the two-speed reconcile prunes announcements not
  // refreshed within a TTL; never trusted for security (the relay sees only
  // ciphertext and stamps nothing).
  int64 sent_unix_ms = 8;

  // Detached ML-DSA-87 provenance signature over the domain-separated signed
  // input (room ‖ sender_pubkey ‖ share_id ‖ root_commitment ‖ name ‖ rating ‖
  // withdraw ‖ sent_unix_ms). Verified client-side under sender_pubkey; a bad
  // signature drops the announcement. (#156 adds root_commitment to the input.)
  bytes signature = 9;

  // The receiver-verifiable root commitment (#156): a 48-byte SHA-384 digest
  // (daemonseed-core share_announce::derive_root_commitment) binding the share's
  // local root path under a secret, identity-derived per-share nonce. It keeps
  // the raw path OFF the wire (ISC-A-S2) while letting a receiver recompute
  // share_id == derive_share_id_v2(sender_pubkey, root_commitment). Proto3 has no
  // `required`, so an omitted field decodes as empty bytes — the binding rests
  // ENTIRELY on ingest: an absent or non-48-byte commitment is HARD-REJECTED with
  // no legacy / owner-binding-only fallback. Breaking daemonseed-proto change
  // (SemVer MAJOR); no live pre-cutover shares exist, so no dual-accept window.
  bytes root_commitment = 10;
}

// A SHARE ROLL-CALL — the late-join discovery request that pairs with
// ShareAnnouncement (design-of-record: docs/design/unified-share-model.md).
// Because the relay is a pure blind forwarder it cannot tell live sharers that
// a new member subscribed, so fast late-join is pull-based: a joining (or
// refreshing) client posts this sealed roll-call into the room, and every
// currently-connected sharer answers by re-posting its ShareAnnouncement(s).
// One late-join hook — startup discovery, the Refresh action, and the jittered
// reconcile timer all post a roll-call — and it needs NO new relay capability:
// it is just another CotFrame.payload at the room's rendezvous address, fitting
// the relay's existing live-only, no-retention posture (a late chat joiner
// likewise sees no history).
//
// It is a DISTINCT sealed payload kind (not implicit-on-subscribe): the relay
// emits no subscribe events, so the request must travel in-band as its own
// message. Like ShareAnnouncement it is (1) SELF-SIGNED FOR PROVENANCE (C57) —
// the signature proves WHO asked — and (2) AES-256-GCM-sealed under the tier
// key (public room key, or a circle cot_key), so only room/circle members can
// post or read a roll-call and the relay sees ciphertext only (A-S2, A-S16). A
// distinct AAD (daemonseed/share/rollcall/v1) keeps it from ever being opened
// as — or substituted from — a room message (public or circle), a share
// announcement, or a content frame under a coincidentally-equal key. See
// daemonseed-core share_rollcall::{seal_public_rollcall, seal_circle_rollcall,
// open_rollcall}.
message ShareRollCall {
  // The room/circle the roll-call probes (e.g. "lobby" for public). Bound into
  // the provenance signature so a roll-call cannot be replayed into a different
  // room.
  string room = 1;

  // The requester's full ML-DSA-87 public key. The provenance signature
  // verifies under it; the recipient derives the authoritative handle
  // hash-prefix SHA-384(requester_pubkey)[:12] (ISC-C4), never trusting
  // requester_handle alone. Carried for parity with ShareAnnouncement
  // provenance; a roll-call confers no authority — any member may ask.
  bytes requester_pubkey = 2;

  // The requester's self-asserted display handle (`name#12hex`). Advisory only.
  string requester_handle = 3;

  // Requester wall-clock at request time, unix milliseconds. Advisory only —
  // never trusted for security (the relay stamps nothing and sees ciphertext).
  int64 sent_unix_ms = 4;

  // Detached ML-DSA-87 provenance signature over the domain-separated signed
  // input (room ‖ requester_pubkey ‖ sent_unix_ms). Verified client-side under
  // requester_pubkey; a bad signature drops the roll-call.
  bytes signature = 5;
}

// A MEMBER HEARTBEAT — the member-plane connected-presence beacon (presence
// superstructure; design-of-record: docs/design/presence-superstructure.md).
// Every connected member periodically posts this sealed beacon into each room it
// is subscribed to, as a CotFrame.payload at that room's rendezvous address, so
// members can see who is online while the relay stays blind. It is the
// member-plane counterpart to the relay-plane subscription-refcount presence
// (ISC-S20): the relay knows an address has live subscribers but never their
// identities; this beacon carries the member's self-asserted presence INSIDE the
// seal, where only room members can read it.
//
// Like ShareAnnouncement / ShareRollCall it is (1) SELF-SIGNED FOR PROVENANCE
// (C57) — the signature over the domain-separated input proves WHO is present —
// and (2) AES-256-GCM-sealed under the tier key (public room key, or a circle
// cot_key), so only room/circle members can post or read a heartbeat and the
// relay sees ciphertext only (A-S2, A-S16). A distinct AAD
// (daemonseed/presence/heartbeat/v1) keeps it from ever being opened as — or
// substituted from — a room message (public or circle), a share
// announcement, or a roll-call under a coincidentally-equal key. It is
// wire-shape-identical to those sealed frames, adding no new distinguishable
// flow (A-S2 traffic-shape), and carries ONLY the beacon's own presence
// assertion — never a roster or peer list (A-C38). See daemonseed-core
// heartbeat::{seal_public_heartbeat, seal_circle_heartbeat, open_heartbeat}.
message MemberHeartbeat {
  // The room/circle this heartbeat belongs to (e.g. "lobby" for public). Bound
  // into the provenance signature so a heartbeat cannot be replayed into a
  // different room.
  string room = 1;

  // The member's full ML-DSA-87 public key. The provenance signature verifies
  // under it; the recipient derives the authoritative handle hash-prefix
  // SHA-384(sender_pubkey)[:12] (ISC-C4), never trusting sender_handle alone.
  bytes sender_pubkey = 2;

  // The member's self-asserted display handle (`name#12hex`). Advisory: the
  // recipient cross-checks its hash component against sender_pubkey (ISC-C57).
  string sender_handle = 3;

  // Member wall-clock at beacon time, unix milliseconds. Advisory ordering and
  // liveness aging — a receiver ages out a member not re-heard within a TTL,
  // measured from local receive time; never trusted for security (the relay sees
  // only ciphertext and stamps nothing).
  int64 sent_unix_ms = 4;

  // Detached ML-DSA-87 provenance signature over the domain-separated signed
  // input (room ‖ sender_pubkey ‖ sent_unix_ms ‖ live_share_ids). Verified
  // client-side under sender_pubkey; a bad signature drops the heartbeat.
  bytes signature = 5;

  // The share-ids this member is currently serving into this room — the
  // live-share digest (#76). A receiver refreshes the liveness of these shares
  // and prunes any of this member's shares absent from the digest, so share
  // liveness rides the heartbeat and a full ShareAnnouncement fires only on
  // change (publish/unpublish) plus the late-join roll-call. Empty when the
  // member serves nothing. Bound into the provenance signature so the digest
  // cannot be tampered or replayed across rooms. (Post-#153 the veilid presence
  // path leaves this empty — share liveness rides the share record; the field
  // stays for the relay path.)
  repeated string live_share_ids = 6;

  // Whether this beacon is a LEAVE tombstone (WB-1.3): posted on graceful close
  // to mark the member departed. A receiver applies leave-dominance (WB-1.5): it
  // records this beacon's sent_unix_ms as the member's leave time and reaps the
  // member, and thereafter no same-room write with sent_unix_ms <= that leave
  // time re-freshens the departed member (a final chat racing the tombstone can
  // no longer flicker it back onto the roster). A genuinely newer write (rejoin /
  // post-leave message) re-freshens normally. Bound into the provenance signature
  // so a relay cannot forge or strip a leave. The sealed frame is padded to one
  // constant length (WB-ISC-6), so a key-free observer cannot distinguish a leave
  // tombstone from a keepalive — only cessation is visible, as it must be.
  bool is_leave = 7;
}
