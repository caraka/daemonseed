  - name: "info::at_rest"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/at-rest/<profile_id>`.
    signature: "pub fn at_rest(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the at-rest seeds blob.

  - name: "info::recovery_file"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/recovery-file/<profile_id>`.
    signature: "pub fn recovery_file(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the .dseed recovery file.

  - name: "info::share_index"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/share-index/<profile_id>`.
    signature: "pub fn share_index(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the encrypted share index.

  - name: "info::trust_events"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/trust-events/<profile_id>`.
    signature: "pub fn trust_events(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the encrypted trust-event log.

  # ── passphrase ──────────────────────────────────────────────────────
  - name: "strength::evaluate"
    module: daemonseed_core::passphrase
    description: zxcvbn-derived score with explicit ISC-C12 floor check.
    signature: "pub fn evaluate(input: &str) -> StrengthReport"
    parameters:
      - name: input
        type: "&str"
        direction: in
        description: The candidate passphrase.
    returns:
      type: StrengthReport
      description: A zxcvbn-derived strength report with the ISC-C12 floor check.

  - name: "strength::estimate_circle"
    module: daemonseed_core::passphrase
    description: >-
      Circle-of-trust entropy estimator (ISC-C9, M15) — the key-space companion
      to the session estimator that can actually certify >=128 bits (zxcvbn
      saturates at 2^64). bits = (distinct BIP-39 words x 11) + charset residue
      (len x log2 of the residue's distinct chars); zxcvbn is retained only as a
      low-end veto on repeat/sequence patterns the additive sum over-credits.
      CircleStrength::is_circle_green() = bits >= 128 && !trivially_weak — the
      real ISC-C9 gate that replaced the M14 interim score-4 proxy.
    signature: "pub fn estimate_circle(phrase: &str) -> CircleStrength"
    parameters:
      - name: phrase
        type: "&str"
        direction: in
        description: The candidate circle-of-trust passphrase.
    returns:
      type: CircleStrength
      description: "{ bits: f64, trivially_weak: bool } with is_circle_green() = bits >= 128 && !trivially_weak."

  - name: "circle_canonicalize::canonicalize"
    module: daemonseed_core::passphrase
    description: >-
      NFKC normalization for circle-of-trust entropy. Pre-applied before KDF so
      equivalent unicode inputs produce the same key.
    signature: "pub fn canonicalize(input: &str) -> String"
    parameters:
      - name: input
        type: "&str"
        direction: in
        description: The raw circle entropy phrase.
    returns:
      type: String
      description: The NFKC-normalized phrase.

  # ── profile::config ─────────────────────────────────────────────────
  - name: ProfileConfig::new_for_first_start
    module: daemonseed_core::profile::config
    description: >-
      Build a fresh config for first-start (ISC-C29 step 3). Mints a UUID-v4
      profile_id from CSPRNG, the given Argon2 params, and both opt-in flags
      defaulted off.
    signature: "pub fn new_for_first_start(argon2: ArgonParams) -> ProfileConfig"
    parameters:
      - name: argon2
        type: ArgonParams
        direction: in
        description: The Argon2 work factors to persist.
    returns:
      type: ProfileConfig
      description: A fresh config with a random profile_id and both flags false.

  - name: ProfileConfig::from_toml
    module: daemonseed_core::profile::config
    description: >-
      Parse a daemonseed.toml body. Distinguishes missing from invalid
      profile_id; biometric_unlock and autostart default false when absent.
    signature: "pub fn from_toml(body: &str) -> Result<ProfileConfig, ProfileConfigError>"
    parameters:
      - name: body
        type: "&str"
        direction: in
        description: The daemonseed.toml file body.
    returns:
      type: "Result<ProfileConfig, ProfileConfigError>"
      description: The parsed config, or a specific parse error.
      error_variants:
        - name: Toml
          condition: TOML syntax error or type mismatch.
        - name: MissingProfileId
          condition: The `profile_id` field is absent.
        - name: InvalidProfileId
          condition: The `profile_id` field is present but not a valid UUID.
        - name: Serialize
          condition: Not produced by from_toml; reserved for to_toml.

  - name: ProfileConfig::to_toml
    module: daemonseed_core::profile::config
    description: Serialize to the canonical daemonseed.toml representation.
    signature: "pub fn to_toml(&self) -> Result<String, ProfileConfigError>"
    parameters: []
    returns:
      type: "Result<String, ProfileConfigError>"
      description: The serialized TOML body, or a serialize error.
      error_variants:
        - name: Serialize
          condition: TOML serialization failed.

  # ── profile::resolve ────────────────────────────────────────────────
  - name: resolve
    module: daemonseed_core::profile::resolve
    description: Resolve the profile root per ISC-C35 priority order.
    signature: "pub fn resolve(args: ResolveArgs) -> Result<ResolvedProfileRoot, ResolveError>"
    parameters:
      - name: args
        type: ResolveArgs
        direction: in
        description: Caller-supplied resolution inputs (--config, XDG override, etc.).
    returns:
      type: "Result<ResolvedProfileRoot, ResolveError>"
      description: Existing or FirstStart root, or a resolution error.
      error_variants:
        - name: ResolveError
          condition: A filesystem or parse failure occurred during resolution.

  - name: resolve_with_env
    module: daemonseed_core::profile::resolve
    description: Testable variant — pass an env-var lookup closure.
    signature: "pub fn resolve_with_env<F>(args: ResolveArgs, getenv: F) -> Result<ResolvedProfileRoot, ResolveError>"
    parameters:
      - name: args
        type: ResolveArgs
        direction: in
        description: Caller-supplied resolution inputs.
      - name: getenv
        type: F
        direction: in
        description: An environment-variable lookup closure (for testing).
    returns:
      type: "Result<ResolvedProfileRoot, ResolveError>"
      description: Existing or FirstStart root, or a resolution error.
      error_variants:
        - name: ResolveError
          condition: A filesystem or parse failure occurred during resolution.

  # ── storage::seeds ──────────────────────────────────────────────────
  - name: seal
    module: daemonseed_core::storage::seeds
    description: Writes v2 under Registry::default_write_suite().
    signature: "pub fn seal(seeds: &Seeds, passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<Vec<u8>, BlobError>"
    parameters:
      - name: seeds
        type: "&Seeds"
        direction: in
        description: The plaintext seeds payload to seal.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase (Argon2id input).
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID (used as Argon2 salt).
      - name: params
        type: ArgonParams
        direction: in
        description: The Argon2 work factors.
    returns:
      type: "Result<Vec<u8>, BlobError>"
      description: The sealed v2 blob bytes.
      error_variants:
        - name: WriteRefused
          condition: The active write-suite is not in an ActiveWrite state.
        - name: AuthenticationFailed
          condition: Not produced by seal; reserved for open.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: seal_under
    module: daemonseed_core::storage::seeds
    description: Explicit-suite variant. Used by touch_reseal and by tests.
    signature: "pub fn seal_under(seeds: &Seeds, passphrase: &str, profile_id: Uuid, params: ArgonParams, suite_id: SuiteId) -> Result<Vec<u8>, BlobError>"
    parameters:
      - name: seeds
        type: "&Seeds"
        direction: in
        description: The plaintext seeds payload to seal.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID (Argon2 salt).
      - name: params
        type: ArgonParams
        direction: in
        description: The Argon2 work factors.
      - name: suite_id
        type: SuiteId
        direction: in
        description: The explicit suite to seal under.
    returns:
      type: "Result<Vec<u8>, BlobError>"
      description: The sealed v2 blob bytes under the named suite.
      error_variants:
        - name: UnknownSuite
          condition: The suite id is not in the registry.
        - name: WriteRefused
          condition: The suite is not in an ActiveWrite state under policy.
        - name: SuiteIdSentinel
          condition: The suite id is a reserved sentinel.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: open
    module: daemonseed_core::storage::seeds
    description: "Dispatches on MAGIC: v2 parses suite_id, v1 assumes 0x0001."
    signature: "pub fn open(blob: &[u8], passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<Opened, BlobError>"
    parameters:
      - name: blob
        type: "&[u8]"
        direction: in
        description: The sealed blob bytes.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID (Argon2 salt).
      - name: params
        type: ArgonParams
        direction: in
        description: The Argon2 work factors.
    returns:
      type: "Result<Opened, BlobError>"
      description: The decrypted payload plus suite + legacy flag.
      error_variants:
        - name: AuthenticationFailed
          condition: >-
            Wrong passphrase, wrong profile-id, wrong argon params, or tampered
            ciphertext — uniform (constant-time-friendly).
        - name: UnknownSuite
          condition: The parsed suite id is not in the registry.
        - name: SuiteIdSentinel
          condition: The parsed suite id is a reserved sentinel.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: touch_reseal
    module: daemonseed_core::storage::seeds
    description: >-
      ISC-C24 read-old-write-new — decrypt then re-encrypt as v2 under the active
      write-suite.
    signature: "pub fn touch_reseal(blob: &[u8], passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<Vec<u8>, BlobError>"
    parameters:
      - name: blob
        type: "&[u8]"
        direction: in
        description: The existing sealed blob bytes.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID (Argon2 salt).
      - name: params
        type: ArgonParams
        direction: in
        description: The Argon2 work factors.
    returns:
      type: "Result<Vec<u8>, BlobError>"
      description: A freshly-resealed v2 blob under the active write-suite.
      error_variants:
        - name: AuthenticationFailed
          condition: Decryption of the input blob failed.
        - name: WriteRefused
          condition: The active write-suite is not in an ActiveWrite state.
    preconditions:
      - description: The oxicrypt module must be operational.

  # ── storage::seeds — M13 persistence write-through ────────────────────
  - name: "SealingKey::derive"
    module: daemonseed_core::storage::seeds
    description: >-
      Derive the at-rest AEAD key from the passphrase (one Argon2id run) and cache
      it for the session write-through. Used at first-start; the Unlock path gets
      the key for free from open() via Opened::key instead of calling this (M13).
    signature: "pub fn derive(passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<SealingKey, BlobError>"
    parameters:
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase (Argon2id input).
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID (Argon2 salt).
      - name: params
        type: ArgonParams
        direction: in
        description: The Argon2 work factors.
    returns:
      type: "Result<SealingKey, BlobError>"
      description: The cached at-rest key for the session.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: "SealingKey::seal"
    module: daemonseed_core::storage::seeds
    description: >-
      Re-seal `seeds` under the active write-suite using the cached key — no
      Argon2id. The session calls this on every persist-worthy mutation (M13).
    signature: "pub fn seal(&self, seeds: &Seeds) -> Result<Vec<u8>, BlobError>"
    parameters:
      - name: seeds
        type: "&Seeds"
        direction: in
        description: The current plaintext seeds payload to re-seal.
    returns:
      type: "Result<Vec<u8>, BlobError>"
      description: A freshly re-sealed v2 blob under the active write-suite.
      error_variants:
        - name: WriteRefused
          condition: The active write-suite is not in an ActiveWrite state.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: "Seeds::set_display_name"
    module: daemonseed_core::storage::seeds
    description: >-
      Set (or clear, with None) the persisted display name (ISC-C4b, M13). Returns
      true if the value changed. Refuses a name containing a line break — the
      directive is rest-of-line, so a \n / \r would inject a spurious directive and
      corrupt the blob on the next open.
    signature: "pub fn set_display_name(&mut self, name: Option<String>) -> bool"
    parameters:
      - name: name
        type: "Option<String>"
        direction: in
        description: The new display name, or None to clear to the floor handle.
    returns:
      type: bool
      description: True iff the value changed (and was line-break-free).

  - name: "Seeds::display_name"
    module: daemonseed_core::storage::seeds
    description: "The persisted display name (ISC-C4b), or None for the floor handle."
    signature: "pub fn display_name(&self) -> Option<&str>"
    parameters: []
    returns:
      type: "Option<&str>"
      description: The display name if set.

  - name: "Seeds::circles"
    module: daemonseed_core::storage::seeds
    description: "The remembered circles, in join order (ISC-C59 persistence, M13)."
    signature: "pub fn circles(&self) -> &[PersistedCircle]"
    parameters: []
    returns:
      type: "&[PersistedCircle]"
      description: The persisted circle set, in join order.

  - name: "Seeds::add_circle"
    module: daemonseed_core::storage::seeds
    description: >-
      Remember a circle so it rejoins next launch (ISC-C59, M13). `entropy` must
      already be canonicalized (ISC-C9). Idempotent — a circle with the same
      entropy is not duplicated.
    signature: "pub fn add_circle(&mut self, entropy: impl Into<String>, label: impl Into<String>) -> bool"
    parameters:
      - name: entropy
        type: "impl Into<String>"
        direction: in
        description: Canonicalized circle entropy (the cot_key IKM).
      - name: label
        type: "impl Into<String>"
        direction: in
        description: Client-local display label (ISC-C62).
    returns:
      type: bool
      description: True if newly added, false if already remembered.

  - name: "Seeds::remove_circle"
    module: daemonseed_core::storage::seeds
    description: "Forget a remembered circle, keyed on its canonicalized entropy (M13)."
    signature: "pub fn remove_circle(&mut self, entropy: &str) -> bool"
    parameters:
      - name: entropy
        type: "&str"
        direction: in
        description: The canonicalized entropy of the circle to forget.
    returns:
      type: bool
      description: True if one was removed.

  - name: "Seeds::rename_circle"
    module: daemonseed_core::storage::seeds
    description: >-
      Rename a remembered circle's client-local label (ISC-C62 override, M13),
      keyed on its canonicalized entropy.
    signature: "pub fn rename_circle(&mut self, entropy: &str, new_label: impl Into<String>) -> bool"
    parameters:
      - name: entropy
        type: "&str"
        direction: in
        description: The canonicalized entropy of the circle to rename.
      - name: new_label
        type: "impl Into<String>"
        direction: in
        description: The new client-local label.
    returns:
      type: bool
      description: True if the label changed.

  # ── storage::recovery_file ──────────────────────────────────────────
  - name: "recovery_file::seal"
    module: daemonseed_core::storage::recovery_file
    description: Seal a .dseed recovery file under the active write-suite.
    signature: "pub fn seal(mnemonic: &Mnemonic, passphrase: &str, profile_id: Uuid, argon2: ArgonParams) -> Result<Vec<u8>, RecoveryFileError>"
    parameters:
      - name: mnemonic
        type: "&Mnemonic"
        direction: in
        description: The recovery-root mnemonic.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase (same as the at-rest blob, ISC-C30).
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID (cleartext header + Argon2 salt).
      - name: argon2
        type: ArgonParams
        direction: in
        description: The Argon2 work factors (also in the cleartext header).
    returns:
      type: "Result<Vec<u8>, RecoveryFileError>"
      description: The sealed .dseed file bytes.
      error_variants:
        - name: WriteRefused
          condition: The active write-suite is not in an ActiveWrite state.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: "recovery_file::seal_under"
    module: daemonseed_core::storage::recovery_file
    description: Explicit-suite variant of the recovery-file seal path.
    signature: "pub fn seal_under(mnemonic: &Mnemonic, passphrase: &str, profile_id: Uuid, argon2: ArgonParams, suite_id: SuiteId) -> Result<Vec<u8>, RecoveryFileError>"
    parameters:
      - name: mnemonic
        type: "&Mnemonic"
        direction: in
        description: The recovery-root mnemonic.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
      - name: profile_id
        type: Uuid
        direction: in
        description: The profile UUID.
      - name: argon2
        type: ArgonParams
        direction: in
        description: The Argon2 work factors.
      - name: suite_id
        type: SuiteId
        direction: in
        description: The explicit suite to seal under.
    returns:
      type: "Result<Vec<u8>, RecoveryFileError>"
      description: The sealed .dseed file bytes under the named suite.
      error_variants:
        - name: UnknownSuite
          condition: The suite id is not in the registry.
        - name: SuiteIdSentinel
          condition: The suite id is a reserved sentinel.
        - name: WriteRefused
          condition: The suite is not in an ActiveWrite state under policy.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: "recovery_file::open"
    module: daemonseed_core::storage::recovery_file
    description: >-
      Recovery-on-clean-device: takes only the file bytes + passphrase;
      profile_id + argon2 come from the file's cleartext header.
    signature: "pub fn open(bytes: &[u8], passphrase: &str) -> Result<RecoveryFileContents, RecoveryFileError>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: The .dseed file bytes.
      - name: passphrase
        type: "&str"
        direction: in
        description: The user passphrase.
    returns:
      type: "Result<RecoveryFileContents, RecoveryFileError>"
      description: The decrypted recovery payload plus header parameters.
      error_variants:
        - name: AuthenticationFailed
          condition: >-
            Wrong passphrase or tampered file — header tamper changes the derived
            key so AEAD fails closed.
        - name: UnknownSuite
          condition: The header suite id is not in the registry.
        - name: SuiteIdSentinel
          condition: The header suite id is a reserved sentinel.
    preconditions:
      - description: The oxicrypt module must be operational.

  # ── storage::cas ────────────────────────────────────────────────────
  - name: chunk_addr
    module: daemonseed_core::storage::cas
    description: "SHA-384(chunk) (ISC-2 / F23)."
    signature: "pub fn chunk_addr(chunk: &[u8]) -> Result<ChunkAddr, oxicrypt_module::Error>"
    parameters:
      - name: chunk
        type: "&[u8]"
        direction: in
        description: The chunk bytes to address.
    returns:
      type: "Result<ChunkAddr, oxicrypt_module::Error>"
      description: The SHA-384 content address of the chunk.
      error_variants:
        - name: NotOperational
          condition: The oxicrypt module power-up self-test has not passed.
    preconditions:
      - description: The oxicrypt module must be operational.

  # ── cot ─────────────────────────────────────────────────────────────
  - name: asset_address
    module: daemonseed_core::cot
    description: >-
      SHA-384(cot_key.as_bytes() || server_id) (ISC-8). Transient key||id buffer
      is zeroed after hashing. server_id must be the same stable wire server-id
      representation on member + relay.
    signature: "pub fn asset_address(cot_key: &circle::key::CotKey, server_id: &[u8]) -> Result<AssetAddr, oxicrypt_module::Error>"
    parameters:
      - name: cot_key
        type: "&circle::key::CotKey"
        direction: in
        description: The circle-of-trust symmetric key.
      - name: server_id
        type: "&[u8]"
        direction: in
        description: The stable wire server-id, namespacing the address per relay.
    returns:
      type: "Result<AssetAddr, oxicrypt_module::Error>"
      description: The rendezvous asset address.
      error_variants:
        - name: NotOperational
          condition: The oxicrypt module power-up self-test has not passed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: public_share_asset_address
    module: daemonseed_core::cot
    description: >-
      Derive a public share's rendezvous address on a given relay (ISC-19,
      F23 unified mechanism): SHA-384(share_id || 0x00 || server_id). Shape
      mirrors asset_address with the circle secret replaced by the public
      share_id (nothing to hide in a public share's address; ISC-C19 makes
      public-share content server-visible by design). The 0x00 separator
      makes the share_id/server_id boundary unambiguous. The CoT-share
      variant (post-MVP) will derive an analogous address keyed by a
      share-CoT key and wrap each ShareFrame in an AEAD seal — same wire
      mechanism, additional secret + encryption layer.
    signature: "pub fn public_share_asset_address(share_id: &[u8], server_id: &[u8]) -> Result<AssetAddr, oxicrypt_module::Error>"
    parameters:
      - name: share_id
        type: "&[u8]"
        direction: in
        description: The public share identifier (from PublicShareListing.share_id).
      - name: server_id
        type: "&[u8]"
        direction: in
        description: The stable wire server-id, namespacing the address per relay.
    returns:
      type: "Result<AssetAddr, oxicrypt_module::Error>"
      description: The public-share rendezvous asset address.
    iscs: ["19", F23]

  # ── share_envelope ──────────────────────────────────────────────────
  - name: ShareFrame::encode
    module: daemonseed_core::share_envelope
    description: >-
      Serialize a ShareFrame to its on-wire bytes (the payload of a
      CircleOfTrust.Subscribe CotFrame on the share-fetch path, ISC-19).
      One-byte discriminator (0..3) then big-endian fields per the wire
      shape documented at the module level. Stays inside CotFrame.payload
      so the relay's wire surface (cot.proto) does not gain new schema —
      A-S2 structural opacity holds for share traffic the same way it does
      for chat. Each frame fits inside a single CotFrame.payload; the
      largest realistic frame is a ChunkResponse whose data bytes are
      bounded by share_serve::CHUNK_SIZE (1 MiB sub-file chunks, M16 —
      relay-safe under tonic's default 4 MB per-message decode cap), and a
      ManifestResponse is publish-guarded under
      share_serve::MANIFEST_FRAME_BUDGET (ISC-A-C37).
    signature: "pub fn encode(&self) -> Vec<u8>"
    iscs: ["19", F23, A-S2]

  - name: ShareFrame::decode
    module: daemonseed_core::share_envelope
    description: >-
      Parse a CotFrame.payload into a ShareFrame. Fail-closed on any
      malformed input (unknown discriminator, truncated buffer, invalid
      UTF-8 in a rel_path); the caller treats decode failure as foreign
      noise (same posture chat already takes per open_message returning
      Err).
    signature: "pub fn decode(bytes: &[u8]) -> Result<ShareFrame, DecodeError>"
    returns:
      type: "Result<ShareFrame, DecodeError>"
      error_variants:
        - name: UnknownKind
          condition: Discriminator byte did not match a known frame kind.
        - name: Truncated
          condition: Buffer ended before parser expected, or a length prefix overruns.
        - name: BadUtf8
          condition: A manifest entry's rel_path bytes are not valid UTF-8.
    iscs: ["19", F23]

  # ── share_serve ─────────────────────────────────────────────────────
  - name: hash_share
    module: daemonseed_core::share_serve
    description: >-
      Walk root and stream-hash every regular file into a ShareManifest
      (M16, ISC-C73) — each file read one CHUNK_SIZE (1 MiB) buffer at a
      time, never a whole-file read, each full buffer-load hashed as ONE
      chunk to its own SHA-384 address (only EOF may leave a chunk short),
      so the pass's memory footprint is independent of file size. Same
      deterministic order and byte-identical ordered per-chunk addresses as
      ShareContent::index_dir, so fetch-side verification is unchanged
      (ISC-S28). progress(done, total) fires after every file — per-file,
      not per-chunk (a chunk is an internal unit, not a UX one); the file
      list is collected first so total is stable from the first callback.
      cancel is checked between files AND between chunks of a large file —
      a set flag aborts with ServeError::Cancelled, no partial manifest. An
      unreadable file aborts the pass (a sharer must know its content is
      complete before advertising it).
    signature: "pub fn hash_share(root: &Path, cancel: &AtomicBool, progress: &mut dyn FnMut(usize, usize)) -> Result<ShareManifest, ServeError>"
    returns:
      type: "Result<ShareManifest, ServeError>"
      description: The hashed manifest, or why the pass stopped.
      error_variants:
        - name: Io
          condition: A file's metadata or bytes could not be read.
        - name: Cas
          condition: SHA-384 init failed (oxicrypt self-test not passed).
        - name: Cancelled
          condition: The cancel flag was set before the pass completed.
    iscs: [C73, C74, S28]

  - name: manifest_frame_len
    module: daemonseed_core::share_serve
    description: >-
      The exact byte length of the encoded ShareFrame::ManifestResponse
      carrying this manifest's entries — what the manifest's wire frame will
      weigh, computed WITHOUT building the (potentially multi-megabyte)
      buffer. Mirrors the share_envelope entry encoding exactly ([1 kind]
      [u32 count] + per entry [u16 path-len][path][u64 size][u32 chunk_count]
      [48-byte addr x chunk_count]); the unit test
      manifest_frame_len_matches_real_encoding pins the arithmetic to
      ShareFrame::encode's actual output length so the two cannot drift. The
      publish path compares this against MANIFEST_FRAME_BUDGET (3_500_000 —
      headroom under tonic's default 4 MiB per-message decode cap for the
      CotFrame envelope overhead; a compile-time assert keeps it < 4 MiB)
      and refuses an over-budget share loudly at publish time — never a
      silent relay-side stall (ISC-A-C37; the ceiling is file-count-driven
      as much as byte-driven, ~62 bytes + path per entry).
    signature: "pub fn manifest_frame_len(manifest: &ShareManifest) -> usize"
    iscs: [A-C37]

  # ── circle::message ─────────────────────────────────────────────────
  - name: seal_message
    module: daemonseed_core::circle::message
    description: >-
      Seal a plaintext CircleMessage under cot_key into an opaque
      nonce(12)||ciphertext||tag(16) envelope for a CotFrame.payload. Fresh
      random nonce per call; AAD = MESSAGE_AAD; prost plaintext zeroed after
      GCM consumes it.
    signature: "pub fn seal_message(cot_key: &circle::key::CotKey, message: &daemonseed_proto::v1::CircleMessage) -> Result<Vec<u8>, MessageError>"
    parameters:
      - name: cot_key
        type: "&circle::key::CotKey"
        direction: in
        description: The circle-of-trust symmetric key (the AES-256-GCM key).
      - name: message
        type: "&daemonseed_proto::v1::CircleMessage"
        direction: in
        description: The plaintext chat message to seal.
    returns:
      type: "Result<Vec<u8>, MessageError>"
      description: The opaque sealed envelope.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: open_message
    module: daemonseed_core::circle::message
    description: >-
      Open an envelope produced by seal_message back into a CircleMessage.
      Fails closed (Authentication) on a wrong cot_key or any tamper — the
      position a content-blind relay is in (ISC-A-S2). Recovered plaintext
      zeroed before returning.
    signature: "pub fn open_message(cot_key: &circle::key::CotKey, sealed: &[u8]) -> Result<daemonseed_proto::v1::CircleMessage, MessageError>"
    parameters:
      - name: cot_key
        type: "&circle::key::CotKey"
        direction: in
        description: The circle-of-trust symmetric key.
      - name: sealed
        type: "&[u8]"
        direction: in
        description: The nonce||ciphertext||tag envelope.
    returns:
      type: "Result<daemonseed_proto::v1::CircleMessage, MessageError>"
      description: The decoded plaintext message.
      error_variants:
        - name: Authentication
          condition: Wrong cot_key, tampered ciphertext/nonce, or wrong AAD.
        - name: Truncated
          condition: Buffer shorter than nonce||tag.
        - name: Decode
          condition: Decrypted bytes are not a valid CircleMessage.
    preconditions:
      - description: The oxicrypt module must be operational.

  # ── storage::share_index ────────────────────────────────────────────
  - name: ShareIndex::open
    module: daemonseed_core::storage::share_index
    description: >-
      Opens/creates the encrypted index. index_key derived
      Argon2id(passphrase, salt=profile_id) -> HKDF-SHA384(info=share_index) by
      the caller (seeds-blob chain, distinct info).
    signature: "pub fn open(path: impl AsRef<Path>, index_key: [u8; 32]) -> Result<ShareIndex, IndexError>"
    parameters:
      - name: path
        type: "impl AsRef<Path>"
        direction: in
        description: The redb file path.
      - name: index_key
        type: "[u8; 32]"
        direction: in
        description: The caller-derived 32-byte index key.
    returns:
      type: "Result<ShareIndex, IndexError>"
      description: The opened encrypted index.
      error_variants:
        - name: Db
          condition: The underlying redb store could not be opened.
        - name: Crypto
          condition: AES-GCM initialization failed.
        - name: Entropy
          condition: CSPRNG nonce generation failed.

  - name: ShareIndex::put
    module: daemonseed_core::storage::share_index
    description: Single-entry encrypted write (A-C7).
    signature: "pub fn put(&self, entry: &ShareEntry) -> Result<(), IndexError>"
    parameters:
      - name: entry
        type: "&ShareEntry"
        direction: in
        description: The share-file entry to upsert.
    returns:
      type: "Result<(), IndexError>"
      description: Ok on a single-entry write.
      error_variants:
        - name: Db
          condition: The redb write failed.
        - name: Crypto
          condition: AES-GCM seal failed.

  - name: ShareIndex::get
    module: daemonseed_core::storage::share_index
    description: Look up one entry by relative path (wrong key returns Ok(None)).
    signature: "pub fn get(&self, rel_path: &str) -> Result<Option<ShareEntry>, IndexError>"
    parameters:
      - name: rel_path
        type: "&str"
        direction: in
        description: The path relative to the share root.
    returns:
      type: "Result<Option<ShareEntry>, IndexError>"
      description: The decrypted entry, or None if absent / unreachable.
      error_variants:
        - name: Db
          condition: The redb read failed.
        - name: Crypto
          condition: AES-GCM open failed (tamper fails closed).
        - name: Corrupt
          condition: A stored value could not be decoded after decryption.

  - name: ShareIndex::entries
    module: daemonseed_core::storage::share_index
    description: Decrypt and return all entries (paths come from values, not keys).
    signature: "pub fn entries(&self) -> Result<Vec<ShareEntry>, IndexError>"
    parameters: []
    returns:
      type: "Result<Vec<ShareEntry>, IndexError>"
      description: All decrypted share entries.
      error_variants:
        - name: Db
          condition: The redb scan failed.
        - name: Crypto
          condition: AES-GCM open failed on an entry.
        - name: Corrupt
          condition: A stored value could not be decoded.

  - name: ShareIndex::clear
    module: daemonseed_core::storage::share_index
    description: >-
      Delete every entry in ONE write transaction — the table is dropped and
      re-created atomically (M16). The clear-then-rescan move: latest-wins
      semantics for a share whose root changed wholesale, without tracking
      per-entry staleness and without ever cycling the redb file lock
      (ISC-A-C36 — the TUI keeps one open handle for the actor's life).
    signature: "pub fn clear(&self) -> Result<(), IndexError>"
    parameters: []
    returns:
      type: "Result<(), IndexError>"
      description: Ok once the empty table is committed.
      error_variants:
        - name: Db
          condition: The redb delete/re-create/commit failed.
    iscs: [C73, A-C36]

  # ── storage::fetched ────────────────────────────────────────────────
  - name: FetchedStore::open
    module: daemonseed_core::storage::fetched
    description: >-
      Open (creating if absent) the downloads store rooted at `root`.
      Creates `<root>/` via create_dir_all. Reopening an existing root
      recovers every prior download; the manifest is read lazily on list_shares.
    signature: "pub fn open(root: impl Into<PathBuf>) -> Result<FetchedStore, FetchedError>"
    parameters:
      - name: root
        type: "impl Into<PathBuf>"
        direction: in
        description: The directory to use as the downloads landing zone.
    returns:
      type: "Result<FetchedStore, FetchedError>"
      description: An open store ready for record/list/share_dir.
      error_variants:
        - name: Io
          condition: create_dir_all failed.

  - name: FetchedStore::record_share
    module: daemonseed_core::storage::fetched
    description: >-
      Persist a fully-verified fetched share by writing each file's bytes
      directly under its real name into a per-share folder (ISC-C63 / A-C31).
      The folder name is derived from `name` (collision-suffixed by share_id
      prefix when needed). Re-recording the same share_id reuses its folder
      and overwrites files (a re-fetch refreshes the download). Called only
      after all chunks have verified; a fetch that fails verification never
      reaches here.
    signature: "pub fn record_share(&mut self, share_id: &str, name: &str, files: &[VerifiedFile]) -> Result<FetchedShare, FetchedError>"
    parameters:
      - name: share_id
        type: "&str"
        direction: in
        description: Server-assigned opaque share id.
      - name: name
        type: "&str"
        direction: in
        description: Sharer-advertised display name (used to derive the folder).
      - name: files
        type: "&[VerifiedFile]"
        direction: in
        description: Fully-verified plaintext files to write.
    returns:
      type: "Result<FetchedShare, FetchedError>"
      description: The recorded manifest entry (includes the derived folder name).
      error_variants:
        - name: Io
          condition: directory creation, file write, or manifest write failed.
        - name: UnsafePath
          condition: A file's rel_path is absolute, contains `..`, or has a non-Normal component.

  - name: FetchedStore::list_shares
    module: daemonseed_core::storage::fetched
    description: >-
      Enumerate every fetched share in manifest order. Returns Ok(vec![])
      when nothing has been fetched yet (missing manifest is not an error).
    signature: "pub fn list_shares(&self) -> Result<Vec<FetchedShare>, FetchedError>"
    parameters: []
    returns:
      type: "Result<Vec<FetchedShare>, FetchedError>"
      description: All recorded downloads, in manifest order (oldest first).
      error_variants:
        - name: Io
          condition: manifest read failed (other than NotFound).
        - name: Corrupt
          condition: manifest parse failed.

  - name: FetchedStore::share_dir
    module: daemonseed_core::storage::fetched
    description: >-
      Return the absolute path of the folder a recorded share's files live
      in (`<root>/<share.folder>`). The caller uses this to open the folder
      in a file manager or display it in the browse pane.
    signature: "pub fn share_dir(&self, share: &FetchedShare) -> PathBuf"
    parameters:
      - name: share
        type: "&FetchedShare"
        direction: in
        description: A share record from list_shares.
    returns:
      type: PathBuf
      description: Absolute path of the share's download folder.

  - name: FetchedShare::total_bytes
    module: daemonseed_core::storage::fetched
    description: Sum the size fields across all files in this fetched share.
    signature: "pub fn total_bytes(&self) -> u64"
    parameters: []
    returns:
      type: u64
      description: Total bytes of all files in the share.

  # ── indexer ─────────────────────────────────────────────────────────
  - name: Indexer::cold_scan
    module: daemonseed_core::indexer
    description: >-
      Walk the root, upsert every regular file, return count. Unreadable entries
      skipped. Run on a niced bg thread (ISC-A-C7 no-fate-sharing).
    signature: "pub fn cold_scan(&self) -> Result<usize, IndexError>"
    parameters: []
    returns:
      type: "Result<usize, IndexError>"
      description: The number of files upserted.
      error_variants:
        - name: Db
          condition: A redb write failed during the scan.
        - name: Crypto
          condition: AES-GCM seal failed during the scan.

  - name: Indexer::apply_event
    module: daemonseed_core::indexer
    description: >-
      Single-entry write (ISC-C21/A-C7 no rewalk). Upsert->put (or remove if
      vanished); transient stat error leaves entry as-is; paths outside root
      ignored.
    signature: "pub fn apply_event(&self, event: &FsEvent) -> Result<(), IndexError>"
    parameters:
      - name: event
        type: "&FsEvent"
        direction: in
        description: One filesystem change to apply.
    returns:
      type: "Result<(), IndexError>"
      description: Ok after the single index write (or a no-op).
      error_variants:
        - name: Db
          condition: The redb write failed.
        - name: Crypto
          condition: AES-GCM seal failed.

  - name: Indexer::mtime_rescan
    module: daemonseed_core::indexer
    description: >-
      Fallback (ISC-21): walk root, upsert only files newer than the cutoff
      (visits all, writes only changed). Driven periodically with the last pass's
      timestamp when watching is unavailable.
    signature: "pub fn mtime_rescan(&self, since_unix_ms: u64) -> Result<usize, IndexError>"
    parameters:
      - name: since_unix_ms
        type: u64
        direction: in
        description: The cutoff time; only files newer than this are upserted.
    returns:
      type: "Result<usize, IndexError>"
      description: The number of files upserted.
      error_variants:
        - name: Db
          condition: A redb write failed during the rescan.
        - name: Crypto
          condition: AES-GCM seal failed during the rescan.

  - name: ShareWatcher::watch
    module: daemonseed_core::indexer
    description: "Begin recursive watching; WatchError::Limit -> caller uses mtime_rescan."
    signature: "pub fn watch(root: impl AsRef<Path>) -> Result<(ShareWatcher, Receiver<FsEvent>), WatchError>"
    parameters:
      - name: root
        type: "impl AsRef<Path>"
        direction: in
        description: The share root to watch recursively.
    returns:
      type: "Result<(ShareWatcher, Receiver<FsEvent>), WatchError>"
      description: The live watcher plus an event receiver.
      error_variants:
        - name: Limit
          condition: The OS watch limit (fs.inotify.max_user_watches) was exceeded.
        - name: Io
          condition: The underlying notify watcher returned an error.

  - name: Indexer::spawn_background_scan
    module: daemonseed_core::indexer
    description: >-
      Run cold_scan on a dedicated thread (ISC-19/A-C7 no-fate-sharing). Returns
      immediately; index stays queryable from redb (MVCC) during the scan
      (ISC-23 no-startup-blockade).
    signature: "pub fn spawn_background_scan(self: Arc<Self>) -> ScanHandle"
    parameters:
      - name: self
        type: "Arc<Self>"
        direction: in
        description: A shared handle to the indexer.
    returns:
      type: ScanHandle
      description: A handle to the running background scan.

  - name: scan_into
    module: daemonseed_core::indexer
    description: >-
      Cold-scan root into a BORROWED ShareIndex (M14 — the TUI net-actor
      share-activation path; cold_scan delegates here). Upserts every regular
      file (metadata only — chunk_addrs: None; content addresses come from the
      hash pass, never a stat walk); unreadable entries skipped, not fatal.
      M16 added the cancel flag: checked per entry, a set flag EARLY-RETURNS
      Ok(count) — cancellation is idempotent metadata work, not an error
      (every entry already written is valid); a caller that must distinguish
      complete from cut-short checks its own flag after the call.
    signature: "pub fn scan_into(index: &ShareIndex, root: &Path, cancel: &AtomicBool) -> Result<usize, IndexError>"
    returns:
      type: "Result<usize, IndexError>"
      description: The number of files upserted (possibly cut short by cancel).
      error_variants:
        - name: Db
          condition: A redb write failed during the scan.
        - name: Crypto
          condition: AES-GCM seal failed during the scan.
    iscs: [C21, A-C7]

  - name: cached_or_hash
    module: daemonseed_core::indexer
    description: >-
      Build a share's ShareManifest using the index as a chunk-addr CACHE
      (M16, ISC-C73 — the disk-backed publish path): a file whose indexed
      size+mtime still match and whose entry carries a cached chunk_addrs
      blob that PARSES for that size (len % 48 == 0, len/48 ==
      ceil(size/CHUNK_SIZE)) is reused WITHOUT reading the file; misses
      (new, changed, never-hashed — and malformed/wrong-count blobs such as
      abandoned v2 single-addr rows, which degrade to a re-hash, never into
      the manifest) are streamed through per-chunk SHA-384 as in hash_share,
      and ALL fresh addresses are written back, ordered + concatenated, so
      the next publish of an unchanged share reads no file at all. index
      None = exactly hash_share (the cache is an optimization, never a
      requirement). Walk order, rel_path form, progress cadence (after every
      file, hit or miss), and cancellation between files AND between chunks
      (ServeError::Cancelled wrapped in CachedHashError::Serve) all match
      hash_share, so both paths produce identical manifests for the same
      tree.
    signature: "pub fn cached_or_hash(index: Option<&ShareIndex>, root: &Path, cancel: &AtomicBool, progress: &mut dyn FnMut(usize, usize)) -> Result<ShareManifest, CachedHashError>"
    returns:
      type: "Result<ShareManifest, CachedHashError>"
      description: The manifest, or which domain (cache vs hash pass) failed.
      error_variants:
        - name: Index
          condition: Reading or writing the chunk-addr cache (ShareIndex) failed.
        - name: Serve
          condition: The hash pass failed — I/O, hashing, or cancellation.
    iscs: [C73, C74]

