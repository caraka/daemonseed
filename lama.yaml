# ─────────────────────────────────────────────────────────────────────
# daemonseed — LAMA discovery file
#
# Repository-root entry point for AI coding agents. Quick-evaluation
# summary of what daemonseed is, what's implemented today, and where
# to find the per-crate API manifests.
#
# Specification: https://github.com/lamaspec/lama
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed
  version: "0.17.0"
  description: >-
    Federated end-to-end-encrypted communication and file-sharing
    protocol. Pure-Rust backend, CNSA 2.0 baseline crypto via the
    oxicrypt sibling crate, gRPC-over-HTTP/2 wire (prost + tonic),
    AGPL-3.0 code with Apache-2.0/MIT dual-licensed schema. Designed
    against the GFW-survivable bar per Wu et al., USENIX Security 2023.
  repository: "https://github.com/caraka/daemonseed"
  languages:
    - rust
  # Dual-license expressed as a single LAMA `license` string (the spec field is
  # a string; "custom" is permitted). Code crates are AGPL-3.0-or-later; the
  # daemonseed-proto schema crate is Apache-2.0 OR MIT. Precise per-crate
  # licenses live in `crates[].license` below.
  license: "AGPL-3.0-or-later (code); Apache-2.0 OR MIT (schema)"
  minimum_toolchain: "rust 1.95"
  edition: "2024"
  phase: private

# ─────────────────────────────────────────────────────────────────────
# This file is a LAMA discovery manifest, not a project status board. Per the
# LAMA spec (https://github.com/lamaspec/lama, SPEC.md "Repository discovery"),
# the root lama.yaml is a concise capabilities + manifest pointer for fast
# agent triage — it carries NO milestone, release-history, or coverage state.
# Those live in their canonical homes (see AGENTS.md "Canonical homes"):
#   • milestone / release history → git tags + ../CHANGELOG.md
#   • live ISC coverage           → `cargo xtask isc-coverage`
#   • in-progress / next          → the project lead's vault manifest (uncommitted)
# ─────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────
# Workspace layout
# ─────────────────────────────────────────────────────────────────────

crates:
  - name: daemonseed-core
    purpose: >-
      Protocol library — identity, storage, bootstrap, first-start
      orchestration, crypto-agility primitives, circle-of-trust key derivation,
      the M9 client surfaces (reconnect backoff, mute / hide-shares lists,
      @-mention recognition/resolution), the M10 release surface
      (daemonseed_core::release: release trust anchor + N-of-M multi-sig verify +
      update-lifecycle FSM), and the M13 at-rest persistence keystone — the
      storage::seeds blob now carries display_name + circle membership alongside
      the mute/hide lists, re-sealed on each mutation via a cached SealingKey
      (no second Argon2id). Pure library (no_std-compatible where the underlying
      primitives allow; currently uses std for I/O).
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-core-api.yaml"

  - name: daemonseed-proto
    purpose: >-
      Wire schema — `.proto` definitions for the daemonseed protocol,
      compiled via tonic-build. Carries the first gRPC service (PublicSpace,
      M6) alongside the message schema; took a `tonic` runtime dep at v0.8.0
      because the generated service stubs reference it. Schema crate is
      dual-licensed to remove copyleft drag from cross-language client
      implementations.
    license: "Apache-2.0 OR MIT"
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-proto-protocol.yaml"

  - name: daemonseed-server
    purpose: "Relay daemon binary + library. TLS 1.3 termination, APP_HELLO negotiation, the post-HELLO identity-proof exchange that lands a connection at Authenticated (M4b), federation introducer/peering (M5), the post-Authenticated PublicSpace application-stream service (M6, gRPC-over-h2 via daemonseed_server::public_space), and the M8 CircleOfTrust live relay (daemonseed_server::cot) — refcounted bidirectional Subscribe fan-out keyed by rendezvous address, served alongside public-space with h2 keepalive driving reap-at-zero — the M9 RAM-only rate limiter (daemonseed_server::rate_limit) wired into the per-connection path with per-identity-key admission released via an RAII drop-guard on disconnect, and the M10 release boot-gate (daemonseed_server::boot_gate) that refuses to boot on failed release-signature verify (wiring into real startup deferred to M10-infra). M12 adds the user-publish share surface (daemonseed_server::share — RAM-only SharePublishRegistry + ShareReapGuard reaping on real disconnect) over the PublicSpace service and the FederationIntroducer gRPC endpoint (gate step 6); serve_application now serves a single connection until real peer close (once().chain(pending()) + CloseNotify-driven shutdown) so a held publisher's share is reaped on disconnect, not on stream-end."
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-server-api.yaml"

  - name: daemonseed-cli
    purpose: "Non-interactive scriptable client binary + library. `connect <server-id>` does TLS-1.3 + APP_HELLO + (M4b) client-side identity-proof, returning only after Authenticated. M12 adds the user-publish share subcommands `publish` / `unpublish` / `list-shares` over the PublicSpace RPCs (gate step 5); `publish` holds the connection open until Ctrl-C (you-must-be-online-to-share), and the share is RAM-only — reaped on disconnect (ISC-A-S1). The library side also carries the M6 public-space client plumbing and the M12 introducer refresh."
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-cli-api.yaml"

  - name: daemonseed-tui
    purpose: "Interactive ratatui client — the MVP product surface. A terminal-free screen state machine (daemonseed_tui::app) rendered by pure functions (daemonseed_tui::ui), driven by a thin binary (terminal lifecycle + event loop) that reuses daemonseed-cli's connect / identity-proof / C22-trust client stack. M11 grows it through first-start (incl. clean-device recovery), chat, circle, share/fetch, the C22 trust slider, the C28 trust-event taxonomy, the F22 server-management screen, the public-space (MOTD + announcements) view, and the suite-deprecation policy view (fetch + ML-DSA verify + anti-rollback, ISC-C25 / A-S11). M12 adds the Servers-pane introducer refresh: a read-only Discovered (introducer) sub-section listing introducer-discovered candidates (server-id + address, no keys, never auto-trusted — ISC-S6 / C22 / A-C19; gate step 6). v0.16 adds the multi-circle carousel: simultaneous membership in several circles (joining ADDS, never evicts — ISC-C59), a split chat view (lobby pane + active-circle carousel pane) where each line carries a Surface tag and each pane filters strictly on it (no cross-surface bleed — ISC-A-C29), arrow-key cycling of the active circle (ISC-C60), per-circle client-local labels (ISC-C62), and per-circle seal/attribution (a post seals under exactly the active circle's key; an inbound frame is attributed to the single circle whose key opened it — ISC-A-C30) — all client-internal, no wire change. M13 (the persistence keystone) wires the session write-through: the running client holds the at-rest SealingKey and re-seals the seeds blob on each persist-worthy mutation, so display name + mute/hide + circle membership survive a daily-login Unlock; on Unlock the persisted circles silently rejoin without re-typing the phrase (CircleJoined echoes the entropy in-process for ordering-free rejoin pairing — ISC-C51 / C59). Still client-internal, no wire change."
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-tui-api.yaml"

  - name: daemonseed-integration-tests
    purpose: "Cross-crate integration tests + ISC coverage registry. Per-milestone ISC-coverage exercise files under tests/m{N}_isc_coverage.rs. Subprocess-driven end-to-end gate: tests/common/gate.rs (ServerProcess + PtyTui + Gate driver with vt100-emulated screen text + BIP-39-validated mnemonic extractor + lockstep keystroke broadcast) consumed by tests/subprocess_gate.rs (4-daemon end-to-end scenario gated by `cargo xtask mvp-gate`). Wu et al. USENIX'23 GFW negative-allowlist classifier: tests/common/wire_shape.rs consumed by tests/usenix_wire_shape.rs (real TLS 1.3 handshake observation, gated by `cargo xtask wire-shape`)."
    license: AGPL-3.0-or-later
    status: active
    manifest: null

  - name: xtask
    purpose: "Workspace task runner. Subcommands: gen-proto, check-proto, isc-coverage, findings-resolved, install-hooks, mvp-gate (builds release server+tui binaries then runs the 4-daemon PTY harness, propagating its pass/fail bit — 10/10 at M12 with steps 5 & 6 added), wire-shape (Wu et al. GFW classifier over a real handshake)."
    license: AGPL-3.0-or-later
    status: active
    manifest: null

# ─────────────────────────────────────────────────────────────────────
# Capability quick-reference
# ─────────────────────────────────────────────────────────────────────

capabilities:
  - category: "Identity & enrollment"
    summary: >-
      BIP-39 24-word mnemonic generation via the `bip39` crate; HKDF-SHA-384
      derives separate ML-DSA-87 (signing) and ML-KEM-1024 (KEM) seeds
      using domain-separated info strings; primary identity + per-device
      identity branches; passphrase strength gate via `zxcvbn`. Handle
      format = adjective-noun display name + 12-hex-character fingerprint
      of the identity public key.
    crate: daemonseed-core
    modules:
      - daemonseed_core::identity::mnemonic
      - daemonseed_core::identity::keys
      - daemonseed_core::handle
      - daemonseed_core::handle::display_name
      - daemonseed_core::kdf::info
      - daemonseed_core::passphrase
    iscs: [C1, C2, C4, C4a, C4b, C9, C12, C13]

  - category: "Profile substrate"
    summary: >-
      Per-profile UUID-v4 profile-id (ISC-C36), Argon2id params (ISC-C14)
      persisted in `daemonseed.toml`, profile-root discovery via CWD /
      `--config <path>` / XDG fallback (ISC-C35). UUID double-duty: HKDF
      info-string substitution + Argon2 salt (cryptographically independent
      uses, both non-secret).
    crate: daemonseed-core
    modules:
      - daemonseed_core::profile::config
      - daemonseed_core::profile::resolve
    iscs: [C14, C35, C36]

  - category: "At-rest storage"
    summary: >-
      Three-layer storage. The at-rest seeds blob (ISC-C3) holds the
      user's mnemonic + future profile state; the recovery file `.dseed`
      (ISC-C32) is the air-gap-paper replacement for recovery on a clean
      device — both v2 as of M3 with a 2-byte suite_id slot after the
      magic prefix (v1 reads accepted under implicit suite_id=0x0001 for
      M1/M2 compatibility; v2 binds suite_id into the AEAD AAD; touch_reseal
      migrates v1 → v2 on next save per ISC-C24). The chunk CAS (M8) is a
      third layer: opaque encrypted chunks named by SHA-384, reference-
      counted, with an ephemeral in-memory relay backing (constant-time
      presence per A-S2/A-S12) and a persistent client-cache on disk (ISC-6).
      The share index (M8) is the redb-backed indexed-state layer: a
      persistent, incremental, per-value-encrypted index of a shared folder
      (keyed opaque keys + AES-256-GCM padded values; ISC-C21 / A-C6 / A-C7).
    crate: daemonseed-core
    modules:
      - daemonseed_core::storage::seeds
      - daemonseed_core::storage::recovery_file
      - daemonseed_core::storage::cas
      - daemonseed_core::storage::share_index
    iscs: [C3, C24, C30, C32, A-C9, C21, A-C6, A-C7]

  - category: "Share indexer engine"
    summary: >-
      Drives the share index from the filesystem (M8), designed against
      Demonsaw's cold-rescan thrash. cold_scan walks the root once (run niced
      in the background so it never starves a foreground task; the persisted
      index stays queryable, so startup never blocks); apply_event folds one
      filesystem change into exactly one index write — a single file change
      never triggers a share-wide rewalk. Synchronous + runtime-free so the
      caller owns task isolation. The live recursive inotify/FSEvents watcher
      (ShareWatcher, notify crate) feeds events in; when the OS watch limit is
      exceeded it surfaces WatchError::Limit and the caller drops to the
      periodic mtime_rescan fallback. The Pi civility benchmark layers on top.
    crate: daemonseed-core
    modules:
      - daemonseed_core::indexer
    iscs: [C21, A-C7]

  - category: "First-start type-state orchestrator"
    summary: >-
      Cold-enrollment flow as a compile-time-gated state machine —
      Welcome → Sealed → BackupVerified → Ready. Each transition
      consumes the prior state; identity-recoverable-before-network is
      a type-system guarantee (A-C15 enforced via the type signature
      of Ready::into_session_materials).
    crate: daemonseed-core
    modules:
      - daemonseed_core::first_start
      - daemonseed_core::first_start::orchestrator
      - daemonseed_core::first_start::verify
    iscs: [C29, C30, C31, C33, C34, A-C13, A-C14, A-C15, A-C19]

  - category: "Bootstrap-anchor selection"
    summary: >-
      Two bootstrap paths exposed at first-start (ISC-C37): a bundled
      canonical relay (currently a placeholder until the project stands
      up its public daemonseed network) and a manual-paste
      out-of-band-supplied server-id + address. No third path
      (no mDNS, no DHT, no auto-discovery).
    crate: daemonseed-core
    modules:
      - daemonseed_core::bootstrap
      - daemonseed_core::bootstrap::anchor
    iscs: [C22, C37]

  - category: "Crypto-agility (suite registry)"
    summary: >-
      Registry of (AEAD, KEM, signature, hash, KDF, memory-hard) bundles
      identified by a u16 SuiteId. Single entry at M3: CNSA 2.0 (0x0001).
      Family discriminator = (KDF, hash) equivalence; cross-family
      migration is post-MVP (treated as a new-circle event per ISC-A-C8).
      Compose-time write-policy gate (WritePolicy enum) refuses
      Read-only-deprecated and Removed states by default.
    crate: daemonseed-core
    modules:
      - daemonseed_core::crypto::suite
      - daemonseed_core::crypto::policy
    iscs: [S15, C24, A-S10, A-C8, A-C9]

  - category: "Circle-of-trust key derivation & rendezvous addressing"
    summary: >-
      Circles are flat and metadata-free (F16): a circle is defined
      solely by its shared entropy — no founder, no metadata record, no
      per-circle min-suite policy. `derive_cot_key(entropy, suite)`
      canonicalizes the phrase (NFKC) then HKDF-SHA-384, family-anchored
      on Suite::family_token so within-family suite ratchets keep the key
      stable; a cross-family change re-derives (new-circle event per
      ISC-A-C8). Suite floor lives in the server S16 policy + client
      registry, not at circle level. CotKey is ZeroizeOnDrop with
      redacted Debug. `cot::asset_address(cot_key, server_id)` =
      SHA-384(cot_key||server_id) is the per-relay rendezvous point a
      circle meets at — member-only-computable (relay never learns the
      circle, A-S2), namespaced per relay for cross-server unlinkability.
      Key derivation is client-only; addressing is shared (client derives
      to subscribe, server keys its registry by it). `circle::message`
      (M11) seals a plaintext CircleMessage under cot_key via AES-256-GCM
      (nonce||ciphertext||tag, domain-separated AAD) — the only path that
      produces CotFrame.payload bytes, making relay content-blindness a
      crypto guarantee not a policy (A-S2); open_message fails closed.
    crate: daemonseed-core
    modules:
      - daemonseed_core::circle::key
      - daemonseed_core::circle::message
      - daemonseed_core::cot
    iscs: [C8, C9, A-C8, S4, A-S2, C15, C17]

  - category: "Wire schema (proto)"
    summary: >-
      Protocol Buffers schema for the `daemonseed.v1` package. Messages
      so far: Version (M0; for HELLO once it lands), SuiteId (M3; wire
      tag for cryptographic artifacts). Schema is version-stable per
      ISC-S14: MINOR bumps are additive-only; MAJOR bumps create a new
      `vN` module. (CircleMin, added M3, was retired at M8 per F16 —
      flat metadata-free circles — before it was ever sent on the wire.)
      M8 adds the CircleOfTrust service (CotFrame) — the protocol's first
      streaming RPC, a bidirectional Subscribe carrying opaque CoT frames.
      M11 adds CircleMessage — the plaintext chat envelope (additive MINOR),
      never sent in the clear; it is sealed under cot_key and only the
      ciphertext rides in CotFrame.payload.
    crate: daemonseed-proto
    modules:
      - daemonseed_proto::v1
    iscs: [S14, A-S9, C23, C24, S4, A-S2, C15, C17]

  - category: "Abuse / DoS rate limiting (server, M9)"
    summary: >-
      Multi-granularity, RAM-only rate limits (S17). Per-connection
      ConnectionLimiter: a request token bucket (capacity + refill) plus
      concurrent-subscription and signature-verify caps. Per-identity-key
      PerKeyRateTable: an Arc<Mutex<HashMap<pubkey,count>>> (same shape as
      the M4b SeenMap) capping concurrent connections per signing key, wired
      into runtime::serve_connection — admitted after identity-proof, GC'd to
      empty on disconnect. RateLimitConfig defaults are the Pi-4 civility
      floor (per-key cap 4 matches the client A-C10 self-cap). No state is
      serialized (A-S12); RateLimitTrip is a server-side diagnostic with no
      wire form — every trip maps to the same uniform silent close as an
      identity-proof failure. The OS/per-IP layer stays operator-owned outside
      the binary (A-S1 carve-out).
    crate: daemonseed-server
    modules:
      - daemonseed_server::rate_limit
    iscs: [S17, A-S12, A-S1]

  - category: "Chat affordances: backoff, mute/hide, mentions (client, M9)"
    summary: >-
      Client-side abuse-resilience + chat surfaces, all pure/local. backoff:
      an exponential+jitter reconnect curve (1s→60s, ±25%) with an 8-retry
      per-server-id budget and CloseCause categorization by observable layer,
      mapping refusals to the M7 ConnectionRateLimited trust events without
      speculating which limit was hit (C26). storage::seeds gains mute +
      hide-shares handle lists, persisted as additive directive lines in the
      sealed at-rest blob and never sent on the wire (C15/C16/A-C3). mention:
      find_self_mentions (read-only scan keyed on the full wire handle) and
      resolve_mention (autocomplete → full handle / candidates), adding no
      new server-visible distinction over plain chat (C17/C18/A-C4). TUI
      rendering of all three lands at M11.
    crate: daemonseed-core
    modules:
      - daemonseed_core::backoff
      - daemonseed_core::mention
      - daemonseed_core::storage::seeds
    iscs: [C15, C16, C17, C18, C26, A-C3, A-C4]

  - category: "Release-signing verify + update lifecycle (M10 verifiable-core)"
    summary: >-
      The pure-Rust half of M10's release/update story. daemonseed_core::release
      holds the binary-bound release trust anchor (an N-of-M ML-DSA-87 key set,
      shipping its 1-of-1 shape with the key array empty until the signing-key
      ceremony) and verify_multisig, which accepts iff >= threshold DISTINCT
      anchor keys each signed validly — no verify-bypass, each key counted once,
      a non-anchor signature is a hard refusal, a wrong-length blob is rejected
      without panic (S18/A-C11). daemonseed_server::boot_gate maps that verify to
      Boot / RefuseToBoot with no boot-with-warning variant (A-S13).
      daemonseed_core::release::update is the client update-lifecycle FSM that
      verifies before applying, never auto-installs (even emergencies), refuses
      silent downgrades, and wipes+logs on failure — emitting the existing M7
      update trust-event keys (no new wire surface). Real signing keys, Sigstore,
      reproducible build, the update-relay role, live fetch, and C7/C20 platform
      features are deferred to M10-infra.
    crate: daemonseed-core
    modules:
      - daemonseed_core::release
      - daemonseed_server::boot_gate
    iscs: [S18, A-S13, C27, A-C11]

  - category: "Platform-feature scaffolds — biometric unlock + autostart (M10-completion)"
    summary: >-
      Abstraction-only scaffolds for the two platform-gated M10 ISCs; opt-in,
      off by default, platform halves reserved. daemonseed_core::biometric: the
      BiometricStore trait over a zeroizing SessionPassphrase newtype (never the
      mnemonic — a type-level guarantee), the RECOVERY_RISK_WARNING constant, and
      the opt-in ProfileConfig::biometric_unlock flag; no platform secure-enclave
      backend ships (ISC-C7). daemonseed_core::autostart: the pure unit_descriptor
      generator emitting systemd-user-unit / launchd-plist / Windows-Startup text
      for a profile (headless by default, never installs/enables/runs), the
      AutostartManager trait, the PRESENCE_SIDE_CHANNEL_WARNING constant, and the
      opt-in ProfileConfig::autostart flag; no OS install ships (ISC-C20). The
      platform backends + OS install + the session-holding GUI/mobile client that
      gives them meaning are reserved (see the C7/C20 Reservations).
    crate: daemonseed-core
    modules:
      - daemonseed_core::biometric
      - daemonseed_core::autostart
    iscs: [C7, C20]

# ─────────────────────────────────────────────────────────────────────
# Cross-cutting properties (system-wide invariants)
# ─────────────────────────────────────────────────────────────────────

properties:
  - id: "no-client-history"
    summary: >-
      Clients persist identity + federation state + ephemeral caches
      only. No message archive, no post archive, no file-content
      archive. Total wipe = start over with a fresh identity, not data
      loss. Load-bearing for the .dseed backup design.
    enforcement: convention (no archival API exists)

  - id: "server-payload-opacity"
    summary: >-
      The server never decrypts circle-of-trust payloads, never links
      a payload to a specific circle, never profiles per-pubkey traffic
      patterns. Asserted at M3 via grep-anchor in m3_isc_coverage
      (zero Registry::lookup references in daemonseed-server/src/).
    enforcement: |
      Convention + grep-asserted regression anchor (m3_iscs::server_suite_transparency).
      Compile-time strengthening lands at M5/M6 via separated CoT-relay
      types that don't depend on the suite registry.
    iscs: [A-S1, A-S2, A-S10]

  - id: "type-state-protocol-gating"
    summary: >-
      Protocol-level invariants (no traffic before APP_HELLO; no
      identity-proof before HELLO_ACK; no AsyncRead/AsyncWrite before
      authentication) are enforced via Rust's type system. The
      Connection<Negotiating → Versioned → Authenticated> machine landed
      across M4a (Negotiating → Versioned) and M4b (Versioned →
      Authenticated, gated by a VerifiedPeer token only verify_envelope can
      mint). Only Authenticated impls AsyncRead/AsyncWrite, so pre-auth
      application I/O is a compile error (ISC-A6).
    enforcement: compile-time (M4a + M4b, shipped)
    iscs: [C23, S14, S19, A-S14, A-C18]

  - id: "censorship-survivability-baseline"
    summary: >-
      First TLS record on :443 satisfies Wu et al. (USENIX Security
      2023) GFW Ex5 negative-allowlist by construction. ALPN is set
      to generic `h2`; application-protocol identification happens
      after TLS handshake. Shipped at M4a.
    enforcement: wire-shape (M4a, shipped)
    iscs: [S5]

# ─────────────────────────────────────────────────────────────────────
# External dependencies
# ─────────────────────────────────────────────────────────────────────

external_dependencies:
  crypto_foundation:
    name: oxicrypt
    relationship: path-dependency (private phase) / registry-dependency (post-public)
    purpose: "CNSA 2.0 primitives (AES-256-GCM, ML-DSA-87, ML-KEM-1024, SHA-384, HKDF), TLS 1.3 glue. Pure-Rust FIPS 140-3 Level 1 module."
    visibility: "private during the private phase; goes public before daemonseed does"

  wire:
    - { name: prost, version: "=0.13.4", purpose: "Protocol Buffers encoding for Rust" }
    - { name: tonic, version: "=0.12.3", purpose: "gRPC-over-HTTP/2 server + client" }
    - { name: tonic-build, version: "=0.12.3", purpose: "tonic codegen from .proto" }

  runtime_and_glue:
    - { name: tokio, version: "1.43", purpose: "async runtime (rt + macros + io-util + net)" }
    - { name: tower, version: "0.5", purpose: "Service abstraction for tonic" }
    - { name: ratatui, version: "0.29", purpose: "TUI framework for daemonseed-tui (M11)" }

  identity_and_crypto_aux:
    - { name: argon2, version: "0.5", purpose: "Argon2id KDF (ISC-C14, ISC-C30) — RFC 9106, not NIST so out of oxicrypt scope" }
    - { name: bip39, version: "2", purpose: "BIP-39 mnemonic + 2048-word English wordlist (ISC-C2)" }
    - { name: zeroize, version: "1", purpose: "ZeroizeOnDrop derive for secret-bearing types" }
    - { name: zxcvbn, version: "3", purpose: "Passphrase strength estimation (ISC-C12, ISC-C9)" }
    - { name: uuid, version: "1", purpose: "UUID v4 from cryptographic randomness (ISC-C36, ISC-C1)" }
    - { name: unicode-normalization, version: "0.1", purpose: "NFKC for circle-of-trust entropy (ISC-C9)" }

  config_and_glue:
    - { name: toml, version: "0.8", purpose: "Profile config persistence — daemonseed.toml (ISC-C35)" }
    - { name: serde, version: "1", purpose: "(De)serialization for daemonseed.toml" }
    - { name: hex, version: "0.4", purpose: "12-char hash-prefix codec in handle format (ISC-C4)" }
