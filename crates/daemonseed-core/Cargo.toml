[package]
name = "daemonseed-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
description = "daemonseed protocol library"

[dependencies]
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-kdf = { workspace = true }
oxicrypt-aes = { workspace = true }
oxicrypt-ml-dsa = { workspace = true }
oxicrypt-ml-kem = { workspace = true }
# oxicrypt primitives daemonseed does not call directly — declared so `kats`
# can assemble the complete KATS slice for
# `oxicrypt_module::initialize_with_profile`. ECDH is reached by no call path
# at all; see the `kats` module header.
oxicrypt-hmac = { workspace = true }
oxicrypt-drbg = { workspace = true }
oxicrypt-ecdh = { workspace = true }
bip39 = { workspace = true }
zeroize = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
fs4 = { workspace = true }
getrandom.workspace = true
zxcvbn.workspace = true
unicode-normalization.workspace = true
toml = { workspace = true }
serde = { workspace = true }
argon2.workspace = true
tokio = { workspace = true }
prost = { workspace = true }
daemonseed-proto = { path = "../daemonseed-proto" }
# The one crate permitted to use `unsafe`, holding the single Win32 call that
# makes a rename's directory entry durable. Depended on precisely so this crate
# can keep `#![forbid(unsafe_code)]`.
daemonseed-sys = { path = "../daemonseed-sys" }
redb = { workspace = true }
walkdir = { workspace = true }
notify = { workspace = true }

[features]
# Test-only escape hatches, off by default and never enabled by a consumer of
# this crate. It gates `VerifiedFirstContact::new_for_test` and its two
# companions: that type is a verification witness whose fields are private so
# that holding one really is the proof its doc comment claims (#265), but the
# behavioural zeroize witness in `tests/secret_zeroize_on_drop.rs` needs a
# `GlobalAlloc` hook and this crate is `#![forbid(unsafe_code)]`, so that harness
# must live outside the crate — where sealed fields would put the type out of its
# reach. The dev-dependency below is what turns the feature on for this crate's
# own test targets, and nothing else.
testing = []

[dev-dependencies]
# This crate, named by itself, purely to switch its `testing` feature on while
# building its own tests. A dev-dependency cycle is allowed and is the only way a
# crate can enable one of its own features for integration tests without exposing
# it to consumers.
daemonseed-core = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
# Test-only: paused-time (`start_paused`) for the session-health cursor-tick oracles
# (CRSH-ISC-2/9), as the WB scheduler oracles use it. Merges additively with the
# non-dev tokio features.
tokio = { workspace = true, features = ["test-util", "time"] }
