// daemonseed wire protocol — version handshake.
//
// Anchors ISC-S14 / A-S9 / C23: clients and servers advertise the wire-protocol
// version they speak. SemVer 2.0; MINOR bumps MUST be additive-only. This is
// the first concrete .proto in the schema crate and exists primarily so the
// codegen pipeline (build.rs + `cargo xtask gen-proto` / `check-proto`) has
// something real to compile against.

syntax = "proto3";

package daemonseed.v1;

// Advertised wire-protocol version. Sent inside HELLO once HELLO lands; for
// now it stands alone so the pipeline has a non-trivial message to generate.
message Version {
  // Major version. Breaking-change bumps only.
  uint32 major = 1;

  // Minor version. Additive-only per ISC-S14.
  uint32 minor = 2;

  // Patch version. Bug-fix bumps that do not change the wire surface.
  uint32 patch = 3;

  // Optional human-readable suffix (e.g. "alpha.1", "rc.2"). Empty for
  // stable releases.
  string pre_release = 4;
}
