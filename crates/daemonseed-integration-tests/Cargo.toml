[package]
name = "daemonseed-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
publish = false
description = "daemonseed cross-crate integration tests + ISC coverage registry (M0 scaffold; never published)"

[lib]
# Library target so `cargo xtask isc-coverage` can read the registry without
# spawning a binary. Tests live under `tests/` (per Rust convention) and pull
# the registry via this lib.

[dependencies]
# M0 minimal path-deps: library crates only. server/cli/tui are binary-only
# today; when M4a / M11 need in-process test access, those crates gain a
# `[lib]` target and a corresponding path-dep lands here.
daemonseed-core = { path = "../daemonseed-core" }
daemonseed-proto = { path = "../daemonseed-proto" }

[dev-dependencies]
# M0 type-state ↔ tonic spike (closes R2 — see tests/spike_type_state.rs).
# Throwaway compile-prove only; not used at M0 by integration code.
tonic = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }

# M1 — end-to-end ISC coverage exercise needs the same primitives the core
# crate uses to compose its surface (UUIDs for profile-ids, the oxicrypt
# module power-on shim, and zeroize for hand-rolled secret buffers in the
# test scaffolding).
oxicrypt-module = { workspace = true }
uuid = { workspace = true }

# M4a commit 6 — full end-to-end TCP + TLS + APP_HELLO round-trip between
# the real server runtime and the real CLI connect path. Both crates gain
# `[lib]` targets in commits 4 and 5 so the harness drives them in-process.
daemonseed-server = { path = "../daemonseed-server" }
daemonseed-cli = { path = "../daemonseed-cli" }
oxitls-rustls-provider = { workspace = true, features = ["testing"] }
prost = { workspace = true }
tempfile = { workspace = true }
# M6 — content-address hex for post-file names in the public-space coverage test.
hex = { workspace = true }
# M11 — CoT chat round-trip e2e wraps the client's outbound subscribe mpsc as a
# Stream for the bidirectional Subscribe RPC.
tokio-stream = { workspace = true }

# M11 — MVP-gate PTY harness (tests/common/gate.rs). Drives 4 real
# `daemonseed-tui` subprocesses through PTY pairs + 1 plain
# `daemonseed-server` subprocess. portable-pty is the only PTY-touching dep
# anywhere in the workspace; it's confined to `[dev-dependencies]` so no
# shipping crate compiles it — ISC-A1 (no test-only surface in ship
# binaries) survives at the dependency layer too. vt100 wraps the raw PTY
# byte stream into a terminal-emulated screen model so the gate's
# assertions can match multi-word strings (mnemonic re-type, bootstrap
# address, etc.) that ratatui's per-word cursor-positioning interleaves
# with control sequences.
portable-pty = { workspace = true }
vt100 = { workspace = true }
anyhow = { workspace = true }
# BIP-39 wordlist for the gate's mnemonic-extractor — validates that
# words pulled from the rendered ShowMnemonic body are real BIP-39
# entries before the harness types them back at VerifyRoundTrip. The
# shipping crates already pull this version through `daemonseed-core`,
# so no new lockfile entry.
bip39 = { workspace = true }
# M11 workstream D — wire-shape regression. The wire-shape classifier
# inspects the negotiated rustls `ProtocolVersion`; the live test in
# tests/usenix_wire_shape.rs drives a real TLS 1.3 handshake against the
# subprocess server via the production `build_client_config` and reads
# back the observable wire features. Both already-workspace deps.
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# alpha2 — public-room e2e: the forged-provenance test crafts a sealed envelope
# directly (the global room key is public, so anyone can SEAL), and posts use a
# raw ML-DSA-87 keypair as the posting identity.
oxicrypt-aes = { workspace = true }
oxicrypt-ml-dsa = { workspace = true }
getrandom = { workspace = true }
