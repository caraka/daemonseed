# ─────────────────────────────────────────────────────────────────────
# daemonseed-tui — LAMA API Manifest (interactive client; M11 MVP gate)
#
# The TUI is the product surface for the MVP. M11 grows it from a placeholder
# into a ratatui client that drives the full transaction. This manifest tracks
# the library surface (the terminal-free screen state machine + render
# functions) that the binary and the gate harness drive. The binary itself
# (terminal lifecycle + event loop) carries no library API.
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Core crate: ./daemonseed-core-api.yaml
# - CLI crate (reused client stack): ./daemonseed-cli-api.yaml
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-tui
  version: "0.1.0"
  description: "Interactive ratatui client — the MVP product surface. The interactive logic is a terminal-free screen state machine (daemonseed_tui::app) rendered by pure functions (daemonseed_tui::ui), so it is unit-testable and PTY-driveable without a terminal. The binary owns terminal lifecycle + event loop and reuses daemonseed-cli's connect / identity-proof / C22-trust client stack for the network side."
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-tui"
  status: "M11 in progress — app state machine + render loop + first-start flow live; chat / circle / share / trust / server-management screens grow across the remaining M11 workstreams"

modules:
  - name: daemonseed_tui::app
    description: >-
      The screen state machine. App holds all interactive state and advances
      only through App::on_key (and, later, network-result messages); it
      performs no terminal I/O, so every navigation and input transition is
      unit-testable and deterministically driveable by the M11 gate harness.
      Screen is the top-level screen enum (Welcome / FirstStart / Main); App
      owns the active first-start component and stashes the SessionMaterials a
      completed first-start produces. on_key ignores non-Press key kinds so
      Windows Release/Repeat events do not double-fire transitions.
    no_std: false
    depends_on: [daemonseed-core, "daemonseed_tui::screens::first_start"]
    iscs: ["1"]
    added_in: "M11 scaffold"

  - name: daemonseed_tui::net
    description: >-
      Network actor — the async side of the TUI. The binary owns a NetHandle
      holding a dedicated network thread (current-thread tokio runtime) and two
      channels: NetCommand flows in, NetEvent flows out; the render thread sends
      commands and drains events with non-blocking try_recv so a slow connect
      never blocks the UI (ISC-A-C7 substrate). A current-thread runtime is
      required because daemonseed_cli::connect takes &mut dyn TrustStore (not
      Send) and so cannot be tokio::spawn'd onto a multi-thread runtime. Connect
      uses an ephemeral client identity (D8) + a trust store seeded for the
      dialed server in the requested C22 mode (trusted = TOFU-pin; untrusted
      needs a pre-imported key, reported until the server-management import UX).
    no_std: false
    depends_on: [daemonseed-cli, daemonseed-core]
    iscs: ["47", C22, C37]
    added_in: "M11 connect workstream"

  - name: daemonseed_tui::screens::first_start
    description: >-
      First-start flow component (ISC-C29 family). Drives the core
      FirstStart type-state machine through passphrase (live C12 strength
      meter, 60-bit session floor) → 24-word mnemonic display → backup verify
      (re-type round-trip C33, or 3-word type-back fallback C34) → adj-noun
      display name (C4b) → bootstrap relay (C37) → SessionMaterials. A-C15 is
      structural: SessionMaterials (the only thing the connect path accepts)
      are produced only on completion. The core verify methods CONSUME the
      Sealed state, so the component locally pre-validates against the held
      mnemonic and only invokes the consuming verify when it will succeed —
      a mistyped phrase stays on the step instead of destroying the session.
    no_std: false
    depends_on: [daemonseed-core]
    iscs: ["2", "3", "4", "5", "6", "7", "8", "9", C2, C4b, C12, C29, C31, C32, C33, C34, C37, A-C15]
    added_in: "M11 first-start workstream"

  - name: daemonseed_tui::ui
    description: >-
      Pure render functions over a ratatui Frame, dispatched on the current
      Screen. No state mutation happens here — rendering is a pure function of
      App, which is what makes the PTY gate harness' screen-scraping assertions
      deterministic.
    no_std: false
    depends_on: [daemonseed_tui::app]
    iscs: ["1"]
    added_in: "M11 scaffold"

public_types:
  - name: daemonseed_tui::app::App
    kind: struct
    description: "Interactive application state. Construct with App::new (production Argon2) or App::with_argon (fast params for tests/gate); feed key events with on_key, render from ui::render. Owns the active first-start component and stashes the SessionMaterials a completed first-start produces."
    methods:
      - "fn new() -> App"
      - "fn with_argon(argon: ArgonParams) -> App"
      - "fn screen(&self) -> &Screen"
      - "fn should_quit(&self) -> bool"
      - "fn first_start(&self) -> Option<&FirstStartUi>"
      - "fn has_session(&self) -> bool"
      - "fn connection(&self) -> &ConnectionStatus"
      - "fn take_pending_connect(&mut self) -> Option<ConnectRequest>"
      - "fn on_net_event(&mut self, event: NetEvent)"
      - "fn on_key(&mut self, key: KeyEvent)"
  - name: daemonseed_tui::app::Screen
    kind: enum
    description: "Top-level screen: Welcome (landing), FirstStart (cold first-start flow), Main (post-first-start view). Sub-screens added by later M11 workstreams."
    variants: [Welcome, FirstStart, Main]
  - name: daemonseed_tui::screens::first_start::FirstStartUi
    kind: struct
    description: "Interactive first-start state, advanced through on_key; produces SessionMaterials on completion."
    methods:
      - "fn new(argon: ArgonParams) -> FirstStartUi"
      - "fn step(&self) -> FsStep"
      - "fn input(&self) -> &str"
      - "fn strength(&self) -> Option<&Strength>"
      - "fn passphrase_is_green(&self) -> bool"
      - "fn mnemonic(&self) -> Option<&str>"
      - "fn challenge_positions(&self) -> Option<Vec<usize>>"
      - "fn name_default(&self) -> &str"
      - "fn error(&self) -> Option<&str>"
      - "fn on_key(&mut self, key: KeyEvent) -> Option<FirstStartOutcome>"
      - "fn take_completed(&mut self) -> Option<SessionMaterials>"
  - name: daemonseed_tui::screens::first_start::FsStep
    kind: enum
    description: "First-start step: Passphrase, ShowMnemonic, VerifyRoundTrip, VerifyTypeBack, DisplayName, Bootstrap, Complete."
    variants: [Passphrase, ShowMnemonic, VerifyRoundTrip, VerifyTypeBack, DisplayName, Bootstrap, Complete]
  - name: daemonseed_tui::screens::first_start::FirstStartOutcome
    kind: enum
    description: "Terminal outcome of the first-start flow: Completed (materials ready) or Cancelled (user backed out)."
    variants: [Completed, Cancelled]

public_functions:
  - name: daemonseed_tui::ui::render
    signature: "fn render(app: &App, frame: &mut Frame)"
    description: "Draw the current screen as a pure function of App state."
