      - name: route_blob
        type: "&[u8]"
        direction: in
        description: The advertised route blob.
      - name: route_sig
        type: "&[u8]"
        direction: in
        description: The advert signature.
    returns:
      type: bool
      description: true iff the advert is authentic; false (fail-closed) otherwise.
  - name: DiscoveryEnvelope::encode
    module: daemonseed_veilid_net::discovery
