      - "commit 7: end-to-end TLS identity-proof test (client + server both reach Authenticated) + uniform-close / replay / skew fixtures + v0.6.0-pre"
    landed_commit_5:
      - "Server identity-proof orchestration: channel binding off the live TLS session, signed-envelope exchange, Versioned → Authenticated gate"
      - "Channel-bound envelope + per-key monotonic counter + ±5min skew window (D1); server outbound counter = wall-clock ms (D7)"
      - "Uniform close-shape (shape, not timing) for all auth failures (A-S12); timing constant-ness is best-effort per the core module note"

  - milestone: M5
    surface:
      - "Federation trust slider (per-server trusted/untrusted) — `daemonseed_server::federation::trust`"
      - "Introducer endpoint (returns server-id + address, NEVER public keys per ISC-A-S6)"
      - "S2S peering — `daemonseed_server::federation::peer`"
      - "introduce-to-clients toggle (S13) suppresses introductions symmetrically across client AND s2s queries"

  - milestone: M6
    surface:
      - "Public-space post / MOTD / rating handlers"
      - "Server-side taxonomy enforcement (no metadata leak per ISC-A-S3 / A-S4)"

  - milestone: M7
    surface:
      - "Suite-deprecation policy publish endpoint (ISC-S16)"
      - "Per-suite cutoff enforcement at identity-proof (SUITE_DEPRECATED_PAST_CUTOFF response)"

  - milestone: M8
    surface:
      - "CoT-asset relay (server reads suite_id only as opaque bytes; never consults Registry::lookup on this path — regression anchor in m3_isc_coverage stays live)"
      - "Chunk store + content-addressed fetch"
      - "Subscription dispatch"

  - milestone: M9
    surface:
      - "Per-connection / per-key / per-IP rate limits (ISC-S17 silent constant-time close)"
      - "Operator-tunable thresholds with Pi-4 defaults"

# ─────────────────────────────────────────────────────────────────────
# Operator config surface (planned — not implemented at M3)
# ─────────────────────────────────────────────────────────────────────

operator_config:
  format: "TOML"
  status: "M4a commit 3 (minimal); grows per-milestone"
  iscs: [S3, S11, S13, S16, S17, C35]
  resolution_order:
    - "--config <path> (explicit CLI flag)"
    - "$XDG_CONFIG_HOME/daemonseed/daemonseed.toml (or $HOME/.config/daemonseed/daemonseed.toml if XDG unset)"
    - "./daemonseed.toml (current working directory)"
  m4a_fields:
    - "listen_addr (string, default '0.0.0.0:443')"
    - "key_path (path, required) — ML-DSA-87 seed file location"
    - "display_name (string, optional) — empty surfaces floor `#<12hex>` per ISC-C4b"
  planned_sections:
    - "[federation] trust-mode defaults, introduce-to-clients, S2S peering list (M5)"
    - "[signers] whitelist of authorized signer pubkeys (M6)"
    - "[suite_policy] per-suite cutoff dates (M7)"
    - "[rate_limits] per-conn / per-key / per-IP thresholds (M9)"
