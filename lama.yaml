# ─────────────────────────────────────────────────────────────────────
# daemonseed — LAMA discovery file
#
# Repository-root entry point for AI coding agents. Quick-evaluation
# summary of what daemonseed is, what's implemented today, and where
# to find the per-crate API manifests.
#
# Specification: https://github.com/lamaspec/lama
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed
  version: "0.37.2"
  description: >-
    Peer-to-peer end-to-end-encrypted communication and file-sharing
    over the Veilid DHT. Pure Rust, CNSA 2.0 baseline crypto via the
    oxicrypt sibling crate, protobuf (prost) messages, AGPL-3.0 code
    with Apache-2.0/MIT dual-licensed schema.
  repository: "https://github.com/caraka/daemonseed"
  languages:
    - rust
  # Dual-license expressed as a single LAMA `license` string (the spec field is
  # a string; "custom" is permitted). Code crates are AGPL-3.0-or-later; the
  # daemonseed-proto schema crate is Apache-2.0 OR MIT. Precise per-crate
  # licenses live in `crates[].license` below.
  license: "AGPL-3.0-or-later (code); Apache-2.0 OR MIT (schema)"
  minimum_toolchain: "rust 1.95"
  edition: "2024"

# ─────────────────────────────────────────────────────────────────────
# This file is a LAMA discovery manifest, not a project status board. Per the
# LAMA spec (https://github.com/lamaspec/lama, SPEC.md "Repository discovery"),
# the root lama.yaml is a concise capabilities + manifest pointer for fast
# agent triage — it carries NO milestone, release-history, or coverage state.
# Those live in their canonical homes (see AGENTS.md "Canonical homes"):
#   • milestone / release history → git tags + ../CHANGELOG.md
#   • live ISC coverage           → `cargo xtask isc-coverage`
#   • in-progress / next          → GitHub Issues and ../ROADMAP.md
# ─────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────
# Workspace layout
# ─────────────────────────────────────────────────────────────────────

crates:
  - name: daemonseed-sys
    purpose: "OS calls that std does not wrap. It provides one function, replace_durably, which renames a file onto another, replacing it, with the durability each platform gives. daemonseed-core calls it from its storage paths."
    license: AGPL-3.0-or-later
    status: active
    manifest: null

  - name: daemonseed-core
    purpose: >-
      Protocol library shared by the clients. Identity (handle format, BIP-39
      mnemonic, HKDF-derived ML-DSA-87 and ML-KEM-1024 keypairs), first-start
      orchestration and crypto-agility suites; the passphrase-sealed at-rest
      store (the seeds blob holding display name, circle memberships and the
      mute and hide lists, re-sealed on each change), the content-addressed
      chunk store and the encrypted share index; circle-of-trust key derivation
      and rendezvous addressing; public-room and share sealing, share
      announcement, indexing and serving; direct messaging; presence; @-mention
      recognition; the signed public-space artifact model; and the release
      trust anchor with N-of-M multi-signature verification and the update
      lifecycle. Uses std.
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-core-api.yaml"

  - name: daemonseed-proto
    purpose: >-
      Wire schema — `.proto` definitions for the daemonseed protocol,
      compiled via tonic-build. Carries the PublicSpace, CircleOfTrust and
      FederationIntroducer service definitions alongside the message schema.
      Depends on the `tonic` runtime for the generated service stubs.
      Dual-licensed Apache-2.0 OR MIT.
    license: "Apache-2.0 OR MIT"
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-proto-protocol.yaml"

  - name: daemonseed-cli
    purpose: "Library the GUI and TUI share; no binary. route_signer is the least-authority RouteAdvertSigner adapter that signs a Veilid share-route advert with the node's identity key without handing the key to the transport crate. public_space holds the announcement and MOTD helpers: signing a MOTD or post, rendering a signed MOTD as inert plaintext, re-verifying served artifacts, gating the composer on the signer whitelist, and filtering share listings by hide list and rating. All of it is transport-independent."
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-cli-api.yaml"

  - name: daemonseed-tui
    purpose: "Interactive ratatui terminal client for Veilid, with no relay. It drives first-start (mnemonic, passphrase, recovery) and passphrase unlock, then the live session: the public Lobby, circles of trust, member presence, and in-band share discovery and fetch, all over the daemonseed-veilid-net actor behind its NetCommand / NetEvent contract. Operator announcements and MOTD are not yet carried over Veilid in this client. Several circles can be joined at once, and each chat line is shown only on the surface it arrived on. Display name, mute and hide lists and circle memberships persist in the passphrase-sealed at-rest blob. The screen state machine (daemonseed_tui::app) and its render functions (daemonseed_tui::ui) are terminal-free, and a thin binary owns the terminal and the event loop."
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-tui-api.yaml"

  - name: daemonseed-gui
    purpose: >-
      Slint desktop client: Lobby and circle chat, presence, direct messages, public share publish, browse and download, announcements and MOTD, first-start enrollment and passphrase unlock, driven over daemonseed-veilid-net. Software renderer by default; the desktop feature opens a window. Binary, no library API surface.
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-gui-api.yaml"

  - name: daemonseed-veilid-net
    purpose: "Veilid transport layer the GUI and TUI run on. An identity-bound Veilid node (VeilidNet::start) driven through a command-channel handle (VeilidNetHandle): sealed 1:1 messages over a private route; circles and lobby / public rooms over a shared-owner DFLT DHT rendezvous record (per-participant append-rings, backlog sweep, watch); member presence heartbeats on a sibling rendezvous record; announcements and MOTD read from the operator-owned announce record; public-share discovery through a signed route advert on the lobby rendezvous (DiscoveryEnvelope, verify_route_advert); and owner-on-demand share content transfer over app_call, reassembled from fragments and SHA-384-verified per chunk. Direct messaging (daemonseed_veilid_net::dm) is VeilidRecords, the record store the core flows run over real DHT records, and the runner task a front end spawns over it, exchanging RunnerCommand / RunnerEvent with it. Every DHT write goes through one prioritized, rate-limited scheduler. 1:1 private-route messages, circle items and presence heartbeats reach this crate already sealed, under keys it never holds. Public-room items, share announcements and served share content are sealed under a PublicRoomKey that anyone derives from the room name, and the share server holds that key to seal its responses, so anyone can read them. Announcements and MOTD are signed, unencrypted payloads on the operator-owned announce record. The dm runner holds the identity signing keypair, the channel root secret and the profile's at-rest key (RunnerParts), takes message plaintext in RunnerCommand::FirstContact, Send and Accept, and returns opened plaintext in RunnerEvent::Message."
    license: AGPL-3.0-or-later
    status: active
    manifest: "docs/llm-api-manifest/daemonseed-veilid-net-api.yaml"

  - name: daemonseed-isc
    purpose: "ISC registry — the single source of truth for the ISC inventory. A zero-dependency leaf crate (std only) holding IscClass, the ISCS list, TOTAL (built, non-deferred ISC count) and COVERED (registered-test count), with compile-time drift guards (ISCS.len()==TOTAL, COVERED<=TOTAL) and a covered_sum_matches test. Read by both daemonseed-integration-tests (which re-exports it as isc_coverage) and xtask isc-coverage, so the coverage count lives in exactly one place."
    license: AGPL-3.0-or-later
    status: active
    manifest: null

  - name: daemonseed-integration-tests
    purpose: "Cross-crate integration tests; re-exports the daemonseed-isc registry as isc_coverage. ISC-coverage exercise files under tests/*_isc_coverage.rs (client identity, identity portability, share download, circle detail, presence, identity rename, share-name persistence and the earlier protocol layers), an indexer benchmark, and tests/spike_type_state.rs."
    license: AGPL-3.0-or-later
    status: active
    manifest: null

  - name: xtask
    purpose: "Workspace task runner. Subcommands: check-manifests, check-versions (fails when a workspace package does not inherit the workspace version, or lama.yaml or a manifest under docs/llm-api-manifest/ disagrees with it, or the README current-release line is newer than it: the README may lag but never lead; --release also requires the README line and any v* tag on HEAD to equal it, and a clean working tree), gen-proto, check-proto, check-ui-strings (refuses placeholder text in any string a user can read), isc-coverage, install-hooks, gate (runs the Definition-of-Done gate — one step table in the groups preflight, dev-suite and release-suite; --group runs one group, --list prints the table — and exits non-zero naming any red step), release-gate (runs check-versions --release, then every group of that gate)."
    license: AGPL-3.0-or-later
    status: active
    manifest: null

# ─────────────────────────────────────────────────────────────────────
# Capability quick-reference
# ─────────────────────────────────────────────────────────────────────

capabilities:
  - category: "Identity & enrollment"
    summary: >-
      BIP-39 24-word mnemonic generation via the `bip39` crate; HKDF-SHA-384
      derives separate ML-DSA-87 (signing) and ML-KEM-1024 (KEM) seeds
      using domain-separated info strings; primary identity + per-device
      identity branches; passphrase strength gate via `zxcvbn`. Handle
      format = adjective-noun display name + 12-hex-character fingerprint
      of the identity public key.
    crate: daemonseed-core
    modules:
      - daemonseed_core::identity::mnemonic
      - daemonseed_core::identity::keys
      - daemonseed_core::handle
      - daemonseed_core::handle::display_name
      - daemonseed_core::kdf::info
      - daemonseed_core::passphrase
    iscs: [C1, C2, C4, C4a, C4b, C9, C12, C13]

  - category: "Profile substrate"
    summary: >-
      Per-profile UUID-v4 profile-id (ISC-C36), Argon2id params (ISC-C14)
      persisted in `daemonseed.toml`, profile-root discovery via CWD /
      `--config <path>` / XDG fallback (ISC-C35). UUID double-duty: HKDF
      info-string substitution + Argon2 salt (cryptographically independent
      uses, both non-secret).
    crate: daemonseed-core
    modules:
      - daemonseed_core::profile::config
      - daemonseed_core::profile::resolve
    iscs: [C14, C35, C36]

  - category: "At-rest storage"
    summary: >-
      Three-layer storage. The at-rest seeds blob (ISC-C3) holds the
      user's mnemonic and profile state; the recovery file `.dseed`
      (ISC-C32) restores an identity on a clean device. Both are written
      in the v2 format, with a 2-byte suite_id slot after the magic prefix
      that is bound into the AEAD AAD. A v1 seeds blob is still read, under
      an implicit suite_id of 0x0001, and the desktop app writes it back as
      v2 on the next profile change (ISC-C24). A v1 recovery file is still
      read the same way and is never rewritten. The chunk CAS is a
      third layer: opaque encrypted chunks named by SHA-384, reference-
      counted, with an ephemeral in-memory relay backing (constant-time
      presence per A-S2/A-S12) and a persistent client-cache on disk (ISC-6).
      The share index is the redb-backed indexed-state layer: a
      persistent, incremental, per-value-encrypted index of a shared folder
      (keyed opaque keys + AES-256-GCM padded values; ISC-C21 / A-C6 / A-C7).
    crate: daemonseed-core
    modules:
      - daemonseed_core::storage::seeds
      - daemonseed_core::storage::recovery_file
      - daemonseed_core::storage::cas
      - daemonseed_core::storage::share_index
    iscs: [C3, C24, C30, C32, A-C9, C21, A-C6, A-C7]

  - category: "Fetched-content landing zone"
    summary: >-
      Persistent on-disk store for fully-verified fetched share content (ISC-C63 / C64 / C65, ISC-A-C31 / A-C32). A FileChunkStore at
      `<fetched-root>/cas` holds each file's plaintext bytes by SHA-384 address;
      a line-based manifest at `<fetched-root>/shares.idx` records share_id →
      name → [(rel_path, chunk_addr, size)] so the user can browse downloads
      and extract files after the fetch overlay closes. At-rest posture:
      plaintext explicit downloads — user-chosen artifacts, not
      message/post/session history (no-client-history intact); the R-PANIC
      erasure target. Extraction is path-traversal-safe (every rel_path is
      validated before any chunk is read, ISC-A-C32); only fully-verified
      fetches persist (ISC-A-C31).
    crate: daemonseed-core
    modules:
      - daemonseed_core::storage::fetched
    iscs: [C63, C64, C65, A-C31, A-C32]

  - category: "Share indexer engine"
    summary: >-
      Drives the share index from the filesystem, designed against
      Demonsaw's cold-rescan thrash. cold_scan walks the root once (run niced
      in the background so it never starves a foreground task; the persisted
      index stays queryable, so startup never blocks); apply_event folds one
      filesystem change into exactly one index write — a single file change
      never triggers a share-wide rewalk. Synchronous + runtime-free so the
      caller owns task isolation. The live recursive inotify/FSEvents watcher
      (ShareWatcher, notify crate) feeds events in; when the OS watch limit is
      exceeded it surfaces WatchError::Limit and the caller drops to the
      periodic mtime_rescan fallback. The Pi civility benchmark layers on top.
    crate: daemonseed-core
    modules:
      - daemonseed_core::indexer
    iscs: [C21, A-C7]

  - category: "First-start type-state orchestrator"
    summary: >-
      Cold-enrollment flow as a compile-time-gated state machine —
      Welcome → Sealed → BackupVerified → Ready. Each transition
      consumes the prior state; identity-recoverable-before-network is
      a type-system guarantee (A-C15 enforced via the type signature
      of Ready::into_session_materials).
    crate: daemonseed-core
    modules:
      - daemonseed_core::first_start
      - daemonseed_core::first_start::orchestrator
      - daemonseed_core::first_start::verify
    iscs: [C29, C30, C31, C33, C34, A-C13, A-C14, A-C15, A-C19]

  - category: "Bootstrap-anchor selection"
    summary: >-
      Two bootstrap paths exposed at first-start (ISC-C37): a bundled
      canonical relay (currently a placeholder until the project stands
      up its public daemonseed network) and a manual-paste
      out-of-band-supplied server-id + address. No third path
      (no mDNS, no DHT, no auto-discovery).
    crate: daemonseed-core
    modules:
      - daemonseed_core::bootstrap
      - daemonseed_core::bootstrap::anchor
    iscs: [C22, C37]

  - category: "Crypto-agility (suite registry)"
    summary: >-
      Registry of (AEAD, KEM, signature, hash, KDF, memory-hard) bundles
      identified by a u16 SuiteId. It holds one suite, CNSA 2.0 (0x0001).
      Family discriminator = (KDF, hash) equivalence; there is no
      cross-family migration.
      Compose-time write-policy gate (WritePolicy enum) refuses
      Read-only-deprecated and Removed states by default.
    crate: daemonseed-core
    modules:
      - daemonseed_core::crypto::suite
      - daemonseed_core::crypto::policy
    iscs: [S15, C24, A-S10, A-C8, A-C9]

  - category: "Circle-of-trust key derivation & rendezvous addressing"
    summary: >-
      Circles are flat and metadata-free: a circle is defined
      solely by its shared entropy — no founder, no metadata record, no
      per-circle min-suite policy. `derive_cot_key(entropy, suite)`
      canonicalizes the phrase (NFKC) then HKDF-SHA-384, family-anchored
      on Suite::family_token so within-family suite ratchets keep the key
      stable; a cross-family change re-derives (new-circle event per
      ISC-A-C8). Suite floor lives in the server S16 policy + client
      registry, not at circle level. CircleKey is ZeroizeOnDrop with
      redacted Debug. `cot::asset_address(cot_key, server_id)` =
      SHA-384(cot_key||server_id) is the per-relay rendezvous point a
      circle meets at — member-only-computable (relay never learns the
      circle, A-S2), namespaced per relay for cross-server unlinkability.
      Key derivation is client-only; addressing is shared (client derives
      to subscribe, server keys its registry by it). `circle::message`
      seals a plaintext CircleMessage under cot_key via AES-256-GCM
      (nonce||ciphertext||tag, domain-separated AAD) — the only path that
      produces CotFrame.payload bytes, making relay content-blindness a
      crypto guarantee not a policy (A-S2); open_message fails closed.
      `derive_circle_veilid_owner_seed(entropy, suite)` is the Veilid-era
      rendezvous-addressing sibling (a separate HKDF expansion of the same
      circle PRK): a deterministic VLD0 owner seed from which every member
      computes the same DHT rendezvous record key, the substrate-independent
      analog of asset_address. Not a function of cot_key; content keys never
      derive from transport material.
    crate: daemonseed-core
    modules:
      - daemonseed_core::circle::key
      - daemonseed_core::circle::message
      - daemonseed_core::cot
    iscs: [C8, C9, A-C8, S4, A-S2, C15, C17]

  - category: "Direct messaging (core surface)"
    summary: >-
      Direct messaging between two identities over DHT records. `advert` is
      the record an identity publishes its current key in; `drop` is the
      world-writable record first contact lands in; `channel` is one direction
      of a conversation, written only by its owner, and `chain` its key
      schedule. `store` is the layer's on-disk state and `delivery` decides
      whether a written message has reached the correspondent. `flows` drives
      first contact and messaging over a `Records` store, and `push` builds,
      takes and answers the bytes a flow hands the correspondent directly.
      `contact_cache` and `block_list` hold per-correspondent state; `domain`
      fixes the label namespace.
    crate: daemonseed-core
    modules:
      - daemonseed_core::dm::advert
      - daemonseed_core::dm::block_list
      - daemonseed_core::dm::chain
      - daemonseed_core::dm::channel
      - daemonseed_core::dm::contact_cache
      - daemonseed_core::dm::delivery
      - daemonseed_core::dm::domain
      - daemonseed_core::dm::drop
      - daemonseed_core::dm::flows
      - daemonseed_core::dm::push
      - daemonseed_core::dm::store
    iscs: [C38, C39, C40, C41, C42, C43, C44, C45, C46, C100, C101, C103, C104, C105, C106, C108, C109, A-C20, A-C21, A-C22, A-C23, A-C24, A-C25, A-C44, A-C45]

  - category: "Direct-messaging records and runner (transport)"
    summary: >-
      The transport half of direct messaging. `records` holds `VeilidRecords`,
      which implements `daemonseed_core::dm::flows::Records` over real
      records, reading through the DHT gate and writing through the write
      scheduler. `runner` is the task a front end spawns to drive one
      identity's conversations over that record store: `RunnerCommand` in,
      `RunnerEvent` out. `push` carries pushes to and from a correspondent's
      private route, `watch` routes changes on watched channel records to the
      runner, and `view` is the view model a front end renders.
    crate: daemonseed-veilid-net
    modules:
      - daemonseed_veilid_net::dm::records
      - daemonseed_veilid_net::dm::push
      - daemonseed_veilid_net::dm::runner
      - daemonseed_veilid_net::dm::view
      - daemonseed_veilid_net::dm::watch
    iscs: [C39, C40, C41, C42, C43, C45, C103, C104, C107, C108, C109, C110, A-C21, A-C24]

  - category: "Wire schema (proto)"
    summary: >-
      Protocol Buffers schema for the `daemonseed.v1` package: SuiteId and
      ProtocolVersion; the AppHello handshake; IdentityProof; the
      direct-message records and frames (Dm*, FirstContact*); the
      public-space artifacts (SignedArtifact, Post, MOTD, deprecation
      policy, signer whitelist, rating taxonomy); and the room surface
      (CotFrame, RoomMessage, ShareAnnouncement, ShareRollCall,
      MemberHeartbeat). Services: PublicSpace, FederationIntroducer, and
      CircleOfTrust, whose Subscribe is a bidirectional stream of opaque
      CotFrames. RoomMessage is the plaintext chat payload for public rooms
      and circles alike; it is sealed under the surface's key and only the
      ciphertext rides in CotFrame.payload.
    crate: daemonseed-proto
    modules:
      - daemonseed_proto::v1
    iscs: [S14, A-S9, C23, C24, S4, A-S2, C15, C17]

  - category: "Chat affordances: backoff, mute/hide, mentions (client)"
    summary: >-
      Client-side abuse-resilience + chat surfaces, all pure/local. backoff:
      apply_jitter, the one definition of jitter in the workspace (±frac at a
      unit in [-1, 1]), and CloseCause, the close-cause vocabulary by observable
      layer whose user_message() never speculates which limit was hit.
      storage::seeds holds the mute and
      hide-shares handle lists, persisted as additive directive lines in the
      sealed at-rest blob and never sent on the wire (C15/C16/A-C3). mention:
      find_self_mentions (read-only scan keyed on the full wire handle) and
      resolve_mention (autocomplete → full handle / candidates), adding no
      new server-visible distinction over plain chat (C17/C18/A-C4). The
      TUI shows close causes, applies the mute and hide lists, and marks
      self-mentions.
    crate: daemonseed-core
    modules:
      - daemonseed_core::backoff
      - daemonseed_core::mention
      - daemonseed_core::storage::seeds
    iscs: [C15, C16, C17, C18, A-C3, A-C4]

  - category: "Release-signing verify + update lifecycle (verifiable-core)"
    summary: >-
      Release verification and the client update lifecycle, in pure Rust.
      daemonseed_core::release holds the binary-bound release trust anchor (an
      N-of-M ML-DSA-87 key set, currently a threshold of 1 with no keys, so no
      release verifies) and verify_multisig, which requires >= threshold DISTINCT
      anchor keys each signed validly and fails on any signature it does not
      recognise — no verify-bypass, each key counted once, a wrong-length blob
      is rejected without panic (S18/A-C11).
      daemonseed_core::release::update is the client update-lifecycle FSM that
      verifies before applying, never auto-installs (even emergencies), refuses
      silent downgrades, and drops the artifact and logs on failure, emitting
      the update trust-event keys (no new wire surface). It does not fetch
      updates.
    crate: daemonseed-core
    modules:
      - daemonseed_core::release
    iscs: [S18, C27, A-C11]

  - category: "Platform-feature scaffolds — biometric unlock + autostart"
    summary: >-
      Abstraction-only scaffolds for biometric unlock and autostart; opt-in,
      off by default, with no platform implementation. daemonseed_core::biometric: the
      BiometricStore trait over SessionPassphrase, a zeroizing String newtype
      that accepts any string, the RECOVERY_RISK_WARNING constant, and
      the opt-in ProfileConfig::biometric_unlock flag; no platform secure-enclave
      backend ships (ISC-C7). daemonseed_core::autostart: the pure unit_descriptor
      generator emitting systemd-user-unit / launchd-plist / Windows-Startup text
      for a profile (headless by default, never installs/enables/runs), the
      AutostartManager trait, the PRESENCE_SIDE_CHANNEL_WARNING constant, and the
      opt-in ProfileConfig::autostart flag; no OS install ships (ISC-C20).
    crate: daemonseed-core
    modules:
      - daemonseed_core::biometric
      - daemonseed_core::autostart
    iscs: [C7, C20]

# ─────────────────────────────────────────────────────────────────────
# Design properties & dependencies — NOT tracked here (canonical homes)
# ─────────────────────────────────────────────────────────────────────
#
# System-wide invariants — no-client-history, server-payload-opacity,
# type-state protocol gating, censorship-survivability baseline — are part of
# the design contract. Canonical home: ISA.md (## Principles + ## Constraints),
# each tied to its ISC IDs there. Not duplicated here (a LAMA discovery file
# describes the API surface, not the design invariants).
#
# Dependency inventory + pinned versions: the Cargo manifests (Cargo.toml /
# Cargo.lock) are the canonical, build-enforced source — a copy here only drifts.
# The one architecturally notable dependency is the `oxicrypt` crypto crate
# family (CNSA 2.0 primitives), consumed from the registry at a pinned
# version; see ISA.md ## Constraints and AGENTS.md.

# ─────────────────────────────────────────────────────────────────────
# Design-document references
# ─────────────────────────────────────────────────────────────────────
#
# The authoritative spec is the Ideal State Criteria (ISC) contract in the
# repo-root `ISA.md`. ISC numbers are the spec breadcrumbs throughout these
# manifests.

# ISC inventory and live coverage are NOT tracked here — the canonical source is
# the integration-tests registry (`isc_coverage::ISCS` / `TOTAL`), surfaced by
# `cargo xtask isc-coverage`. The full ISC contract (every ID + its end-state)
# lives in ISA.md `## Criteria`. Do not add a count here.

# ─────────────────────────────────────────────────────────────────────
# Where the rich detail lives
# ─────────────────────────────────────────────────────────────────────
#
# Canonical LAMA root carries a single `manifest:` pointer to the primary full
# manifest (daemonseed-core, the protocol library). The per-crate manifests for
# the other crates that have one are enumerated above under `crates[].manifest`.

manifest: "docs/llm-api-manifest/daemonseed-core-api.yaml"
