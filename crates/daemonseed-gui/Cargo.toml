[package]
name = "daemonseed-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
description = "Slint GUI client for daemonseed (round-1 scaffold: software-renderer shell)."
publish = false

[dependencies]
# Round-1 is software-renderer-only (no winit/GL backend) so the crate builds and
# renders offscreen on a headless host. The windowed backend is the `desktop`
# feature, enabled on a host with a display (felt-test). See ISA Decisions 2026-06-14.
slint = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# XDG-correct user dirs (data/config) for first-run desktop integration
# (src/desktop_integration.rs). Already in the workspace lockfile via daemonseed-core.
dirs = "5"
# Direct handle on the winit backend for the focus-restoration hook (#39): re-grab
# keyboard focus on window activation. Optional + desktop-gated; already in the lock
# transitively via `slint/backend-winit`, so no new download. Version tracks `slint`.
i-slint-backend-winit = { version = "1.13", optional = true }

# Real networking (round-3): the GUI lobby wires to a relay by REUSING the proven
# client stack rather than duplicating security-critical code. `daemonseed-cli`
# gives the connect / identity-proof / AppSession flow; `daemonseed-core` the
# public-room key/seal/open primitives; `daemonseed-proto` the `CotFrame` wire
# type. The net actor (src/net.rs) mirrors `daemonseed-tui`'s net actor exactly.
daemonseed-cli = { path = "../daemonseed-cli" }
daemonseed-core = { path = "../daemonseed-core" }
daemonseed-proto = { path = "../daemonseed-proto" }

# Veilid transport (#98) — the only transport. Backs the net actor
# (`src/veilid_net.rs`) that `net::NetHandle::new` spawns.
daemonseed-veilid-net = { path = "../daemonseed-veilid-net" }

# Bounded-concurrency stream combinator (`StreamExt::buffered`) for parallelizing
# public-share chunk downloads (#113) — same dep + spec the veilid-net fragment
# pipeline (#109) uses.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Startup crypto-module init — symmetric with the TUI.
oxicrypt-module = { workspace = true }

# Async runtime for the network side. The render loop stays on the main (UI)
# thread; the net actor runs a current-thread runtime on a dedicated thread and
# posts results back over an unbounded channel (drained non-blocking each tick).
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util"] }

# The public room rides the CircleOfTrust bidirectional Subscribe stream:
# tokio-stream wraps the outbound mpsc receiver as a Stream; tonic::Streaming is
# the inbound type the reader task drains.
tokio-stream = { workspace = true }
tonic = { workspace = true }

# Native folder picker for "Download to…" (commit 2). xdg-portal backend (async,
# over the xdg-desktop-portal D-Bus service) — NO GTK link, keeping the binary lean
# (ISC-C11); rfd uses native pickers on Android/iOS later. Driven on a dedicated
# thread with a current-thread tokio runtime so the UI thread never blocks while the
# dialog is open (caraka 2026-06-16). Needs a running portal service at RUNTIME only
# (not to build); a system without one falls through to a cancelled pick.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# Clipboard read for right-click "paste" (#63) — the platform clipboard plumbing
# the GUI reuses wherever a right-click paste affordance is wanted. A plain dep
# like rfd: it compiles in the offscreen build and is exercised only on the
# windowed paste path. Permissive (MIT/Apache); the X11/Wayland/Windows backends
# are already in the lock tree transitively via winit.
arboard = "3"

# Encode/decode the operator announce-record item envelope (Phase 4 A-c): the
# 1-byte-tagged `SignedArtifact` (MOTD) / `Post` (announcement) values the Veilid
# composer publishes + the inbound reader verifies; `hex` keys announcement items
# by their content-address slot.
prost = { workspace = true }
hex = { workspace = true }

# Windows single-instance liveness (#196): a Global named mutex is the authoritative
# "am I already running?" signal — the OS releases it on process death, so a lockfile
# left by an unclean close is reclaimable (unlike the std-only `pid_alive -> true`
# stub, which never reclaimed and silently blocked every later launch). Also
# MessageBoxW to surface the stale-lock recovery hint on the no-console build. Pinned
# to 0.61 to reuse the version already dominant in the lock tree.
[target.'cfg(windows)'.dependencies]
# `Win32_Security` is required in addition to `Win32_System_Threading`: windows-sys
# only emits `CreateMutexW` when every type in its signature is enabled, and its
# `*const SECURITY_ATTRIBUTES` parameter lives behind `Win32_Security`.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
# Share publish→fetch round-trip oracle (veilid_net tests): a temp share directory
# + a temp fetch root.
tempfile = { workspace = true }
# Test-only: paused virtual time (`start_paused`) for the #180 §RS-2 off-loop fetch
# oracle (CRSH-ISC-7 — a failing-fetch storm must not delay chat past the I4 bound).
tokio = { workspace = true, features = ["test-util", "time"] }

[features]
default = []
# Real winit window on the Wayland head (the felt-test surface). Forwards Slint's
# winit backend; still software-rendered (no GL dependency). `cargo run -p
# daemonseed-gui --features desktop` opens a window. Base build (no features) stays
# offscreen-only so it compiles/verifies from a headless terminal.
desktop = ["slint/backend-winit", "dep:i-slint-backend-winit"]
