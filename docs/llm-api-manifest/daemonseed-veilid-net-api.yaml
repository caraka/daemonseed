# ─────────────────────────────────────────────────────────────────────
# daemonseed-veilid-net — LAMA API Manifest (Veilid transport layer)
#
# The Veilid-native transport for daemonseed: an identity-bound node driven
# through a command-channel actor (VeilidNet / VeilidNetHandle), the
# AppSession-replacement the GUI/TUI drive behind their `veilid` feature. Moves
# ONLY opaque cot-sealed bytes — content stays sealed under a circle key /
# PublicRoomKey (ISC-A-S2); this layer never holds a content key or plaintext.
# Circles, the lobby / public rooms, and public-share discovery all ride ONE
# shared-owner DFLT DHT rendezvous engine, distinguished only by which owner seed
# the caller derives. Public-share content moves owner-on-demand over app_call +
# a private route. The crate is workspace-excluded until the v0.33.0 cutover and
# is compiled by the GUI/TUI only under their `veilid` feature.
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Core crate (key derivation, seal/open, share types): ./daemonseed-core-api.yaml
# - Wire schema: ./daemonseed-proto-protocol.yaml
# - Schema specification: https://github.com/lamaspec/lama/blob/main/SPEC.md
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-veilid-net
  version: "0.1.0"
  description: >-
    Veilid transport layer for daemonseed. Brings up an identity-bound Veilid
    node (VeilidNet::start), driven through a cloneable command-channel handle
    (VeilidNetHandle) that serializes access to the single VeilidAPI. Provides:
    sealed 1:1 messaging over a private route; circles + lobby / public rooms over
    a shared-owner DFLT DHT rendezvous (append-ring fan-out + login-backlog sweep +
    a re-sweep recovery primitive); public-share discovery via an anti-swap SIGNED
    route advert on the lobby rendezvous (DiscoveryEnvelope); and public-share
    content transfer owner-on-demand over app_call, fragment-reassembled and
    SHA-384-verified per chunk. Emits typed VeilidNetEvents so the app never
    touches veilid types. Presence / announcements are Phase 4.
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-veilid-net"
  status: >-
    Phase 3 (public shares) complete and live-verified on the public Veilid
    network; circles + lobby live. Presence / announcements are Phase 4. Consumed
    by the GUI/TUI behind their `veilid` feature; workspace-excluded until the
    v0.33.0 cutover.

# ─────────────────────────────────────────────────────────────────────
# Library-wide constraints
# ─────────────────────────────────────────────────────────────────────

constraints:
  - description: >-
      `oxicrypt_module::initialize()` MUST have run before any operation that
      seals/opens or signs/verifies (share serve/fetch, route advert sign/verify).
      The consuming binary initializes oxicrypt at startup.
    enforcement: runtime
    severity: error

  - description: >-
      The node MUST be attached and public-internet-ready before any transport
      operation — call `VeilidNetHandle::attach_and_wait` after `VeilidNet::start`.
    enforcement: runtime
    severity: error

  - description: >-
      This layer moves ONLY opaque sealed bytes. Content is sealed under a circle
      key / PublicRoomKey in daemonseed-core; the DHT and app_call frames carry
      ciphertext (ISC-A-S2). Rendezvous records are opened with NO Veilid
      encryption key so values are stored verbatim — the cot seal is the only
      content-encryption layer, keeping content crypto decoupled from Veilid's
      transport crypto.
    enforcement: convention + tests
    severity: error

# ─────────────────────────────────────────────────────────────────────
# Modules
# ─────────────────────────────────────────────────────────────────────

modules:
  - name: daemonseed_veilid_net::actor
    description: >-
      The command-channel actor. `VeilidNet::start` spawns the actor + a dedicated
      inbound-serve lane + a slow advert watchdog; `VeilidNetHandle` is the
      cloneable command surface (attach, routes, sealed send, circle/room
      publish/subscribe/resweep, share serve/fetch, share advert publish/stop).
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::config
    description: Bring-up configuration (VeilidNetConfig) — identity seed, bootstrap, storage dir, hop count, namespace, listen address.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::event
    description: Typed transport events (VeilidNetEvent), mapped from raw VeilidUpdates so the app never touches veilid types.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::error
    description: The transport error surface (VeilidNetError) and the crate `Result` alias.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::identity
    description: Derive the Veilid node keypair and the rendezvous-owner keypair from daemonseed-core seeds (D3).
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::discovery
    description: >-
      The anti-swap SIGNED route advert for public-share discovery (D-3.5): a
      DiscoveryEnvelope binds the sharer's private-route blob to the announcer's
      ML-DSA-87 identity over a domain-separated `share_id ‖ route_blob`, signed via
      the least-authority RouteAdvertSigner capability.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::share
    description: >-
      Public-share content transfer over app_call: request/response framing, a
      served-share registry (ServedShare) that answers fragment requests from a
      seal cache, and the fetch side that reassembles ≤30 KiB fragments and
      SHA-384-verifies each chunk against its content address (ISC-S28).
    no_std: false
    depends_on:
      - daemonseed_veilid_net::error
  - name: daemonseed_veilid_net::aimd
    description: An additive-increase/multiplicative-decrease fragment-concurrency window (AimdWindow) that narrows under fragment-latency congestion and recovers as it clears (#128 D-1).
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::route_budget
    description: >-
      A single per-route concurrency budget (RouteBudget) capping total in-flight
      fragment app_calls to one serving route, with a global cap and an
      error-primary window controller (collapse on failure + a sharer-keyed
      learned ceiling; latency only a secondary 3-of-5 valve). Counter-gated
      admission via RouteLease/BudgetPermit; clock-free, injected observations.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::download
    description: >-
      The shared download engine both frontends drive (run_download): fetches a set
      of placed files' chunks in parallel under one RouteLease, writes each verified
      chunk into a StagingArea at its manifest offset, promotes each file on
      completion, and disposes staging by failure class (integrity → destroy;
      transient/not-served/local → retain verified units). Frontend-agnostic and
      network-free (the fetch closure carries the budget).
    no_std: false
    depends_on:
      - daemonseed_veilid_net::error
      - daemonseed_veilid_net::route_budget

# ─────────────────────────────────────────────────────────────────────
# Types
# ─────────────────────────────────────────────────────────────────────

types:
  - name: RouteBudget
    module: daemonseed_veilid_net::route_budget
    kind: struct
    description: >-
      Per-route concurrency budget (generic over the route key; production keys on
      RouteId). `lease(route, sharer)` returns a RouteLease; admission is
      counter-gated at `in_flight(route) < W(route)` and `in_flight(global) < G`.
      `new()` starts fresh routes at `DEFAULT_ROUTE_CEIL`; `with_default_ceiling(c)`
      overrides the fresh-route starting ceiling.
  - name: RouteLease
    module: daemonseed_veilid_net::route_budget
    kind: struct
    description: >-
      A download's lease on a route's budget; `acquire().await` yields a
      BudgetPermit, `observe(outcome)` feeds the window controller. Dropping the
      last lease drops the route's live accounting; the sharer's learned ceiling
      persists.
  - name: BudgetPermit
    module: daemonseed_veilid_net::route_budget
    kind: struct
    description: A granted admission for one fragment app_call; releases its route and global slot on drop (so a retry-backoff release frees the global pool).
  - name: FragmentOutcome
    module: daemonseed_veilid_net::route_budget
    kind: enum
    description: One completed-fragment observation fed to the controller — Completed{over_threshold} or Failed.
  - name: SharerKey
    module: daemonseed_veilid_net::route_budget
    kind: struct
    description: Sharer identity (verified long-term announcer pubkey bytes, #156) — the learned-ceiling key, stable across route rotation.
  - name: PlannedFile
    module: daemonseed_veilid_net::download
    kind: struct
    description: One file the engine fetches — dest_rel (promote target), size (staging pre-size), and the ordered chunk addresses (chunk i writes at offset i*CHUNK_SIZE).
  - name: DownloadOutcome
    module: daemonseed_veilid_net::download
    kind: enum
    description: >-
      The engine's terminal outcome the frontend folds — Complete{files,bytes},
      TransientFailed (retain + mark Unresolved + park), IntegrityFailed (staging
      destroyed + poison flag; no mark/park), LocalFailed (retain; surface only).
  - name: VeilidNet
    module: daemonseed_veilid_net::actor
    kind: struct
    description: Entry point; `start` brings up the node and spawns the actor.
  - name: VeilidNetHandle
    module: daemonseed_veilid_net::actor
    kind: struct
    description: >-
      Cloneable handle to the running actor — every transport operation goes
      through it; the actor task serializes access to the single VeilidAPI. The
      shape the app/UI drives (the AppSession replacement).
  - name: VeilidNetConfig
    module: daemonseed_veilid_net::config
    kind: struct
    description: Node bring-up configuration.
    fields:
      - name: identity_seed
        type: VeilidNodeSeed
        description: Node identity seed (D3), from the daemonseed mnemonic.
      - name: bootstrap
        type: "Vec<String>"
        description: Bootstrap entries; empty uses veilid's built-in defaults.
      - name: storage_dir
        type: String
        description: veilid protected-store + DHT-cache directory.
      - name: hop_count
        type: usize
        description: Private-route hop count (D5); carried, applied when the safety-route dial-up is on.
      - name: namespace
        type: String
        description: Program namespace so multiple nodes coexist on one host.
      - name: listen_address
        type: "Option<String>"
        description: UDP/TCP/WS listen address; None uses veilid's defaults.
  - name: VeilidNetEvent
    module: daemonseed_veilid_net::event
    kind: enum
    description: A daemonseed-facing transport event.
    variants:
      - name: Attachment
        description: "Attachment state changed; `public_internet_ready` gates all operations. Also carries `reliable_peers` / `live_peers` (u32) — the current attach peer counts, climbing during the cold-start warmup (#144)."
      - name: Inbound
        description: An opaque sealed inbound message arrived; the app opens it with the relevant circle/room key.
      - name: RouteChanged
        description: An allocated/imported private route died or changed and may need re-allocation.
      - name: ValueChanged
        description: A watched DHT value changed (circles / shares).
      - name: SweepHealth
        description: Emitted once per completed rendezvous sweep, carrying per-record GET accounting (attempted / failed / found) so a consumer can drive session-health / self-heal detection. Does not change the on-slot Inbound emission.
  - name: RouteAdvertSigner
    module: daemonseed_veilid_net::discovery
    kind: trait
    description: >-
      Least-authority capability to sign a route advert (`share_id ‖ route_blob`)
      with the sharer's ML-DSA-87 identity — keeps the identity key out of the
      transport crate.
  - name: DiscoveryEnvelope
    module: daemonseed_veilid_net::discovery
    kind: struct
    description: A public-share discovery item on the lobby rendezvous — the sealed self-signed announcement, the sharer's route blob, and the anti-swap route signature.
  - name: ServedShare
    module: daemonseed_veilid_net::share
    kind: struct
    description: A registered share served owner-on-demand from any ChunkSource; answers fragment requests from an LRU-bounded seal cache so all fragments of one response come from a single seal.
  - name: FetchTarget
    module: daemonseed_veilid_net::share
    kind: enum
    description: What a fetcher is pulling.
    variants:
      - name: Manifest
        description: The share manifest (file names + sizes + chunk addresses).
      - name: Chunk
        description: One content chunk, by its ChunkAddr.
  - name: AimdWindow
    module: daemonseed_veilid_net::aimd
    kind: struct
    description: A bounded additive-increase/multiplicative-decrease concurrency window (floor..ceiling).
  - name: DmPageSweep
    module: daemonseed_veilid_net::actor
    kind: struct
    description: >-
      One page sweep's full result: `conversation` (the AR fingerprint naming which
      correspondence the frames came from), `slots`, and `outcome`. The tag means a
      caller sweeping several correspondents concurrently matches results to
      conversations by a value it was handed rather than by the order it dispatched
      in; a misattribution forges nothing, because frames are individually
      authenticated, but the ratchet fails to open them and that conversation stalls
      while every layer reports success. Each populated slot arrives as a checked
      `daemonseed_core::dm::paging::PagePosition` on the swept page, so the collector
      compares the frame's declared sequence number against a position it did not
      have to compute. The outcome is required, not decoration: an empty slot list
      alone means both "nobody has written to this page" and "all sixteen GETs
      errored", and `rendezvous.rs` names surfacing `failed` separately as the
      enabling signal for consumer-side session-health tracking (CRSH-ISC-1).
  - name: DoorbellDispatch
    module: daemonseed_veilid_net::actor
    kind: enum
    description: Which dispatch of a doorbell knock a write is, deciding its WB-3 funnel priority class.
    variants:
      - name: FirstSend
        description: The first dispatch of a user's first-contact send; classifies WriteClass::Chat (rank 1).
      - name: Reseed
        description: A scheduler-driven re-dispatch, the doorbell keep-alive; classifies WriteClass::Keepalive (rank 4).
  - name: DoorbellSweep
    module: daemonseed_veilid_net::actor
    kind: struct
    description: >-
      One doorbell sweep's result: `slots`, the populated `(slot, bytes)` pairs, and
      `outcome`. The bytes are unverified and still sealed — only
      `daemonseed_core::dm::firstcontact::open` may decide an entry is genuine, and it
      needs the recipient's ML-KEM decapsulation key. The slot travels back with the
      bytes because a sender's retry re-lands in that same slot and overwrites its own
      previous entry. There is no conversation tag: a doorbell holds knocks from
      distinct and as-yet-unknown senders, and the slot is derived from a secret only
      the sender holds. The outcome is required, not decoration: an empty slot list
      alone means both "nobody has knocked" and "all thirty-two GETs errored".

# ─────────────────────────────────────────────────────────────────────
# Functions
# ─────────────────────────────────────────────────────────────────────

functions:
  # ── actor: bring-up ──────────────────────────────────────────────────
  - name: VeilidNet::start
    module: daemonseed_veilid_net::actor
    description: Bring up the node with a daemonseed-derived identity, spawn the actor, and return the handle plus a stream of events. Does NOT attach.
    signature: "pub async fn start(cfg: VeilidNetConfig) -> Result<(VeilidNetHandle, mpsc::UnboundedReceiver<VeilidNetEvent>)>"
    parameters:
      - name: cfg
        type: VeilidNetConfig
        direction: in
        description: Node bring-up configuration.
    returns:
      type: "Result<(VeilidNetHandle, mpsc::UnboundedReceiver<VeilidNetEvent>)>"
      description: The command handle and the event stream, or a startup error.

  # ── actor: VeilidNetHandle ───────────────────────────────────────────
  - name: VeilidNetHandle::attach_and_wait
    module: daemonseed_veilid_net::actor
    description: Attach and poll until public-internet-ready or the deadline elapses.
    signature: "pub async fn attach_and_wait(&self, timeout_secs: u64) -> Result<()>"
    parameters:
      - name: timeout_secs
        type: u64
        direction: in
        description: Deadline for reaching public-internet-ready.
    returns:
      type: "Result<()>"
      description: Ok when ready; NotReady on timeout.
  - name: VeilidNetHandle::new_inbound_route
    module: daemonseed_veilid_net::actor
    description: Allocate a private inbound route; the returned blob never exposes this node's id or IP.
    signature: "pub async fn new_inbound_route(&self) -> Result<RouteBlob>"
    parameters: []
    returns:
      type: "Result<RouteBlob>"
      description: The route blob a peer addresses.
  - name: VeilidNetHandle::import_route
    module: daemonseed_veilid_net::actor
    description: Import a peer's private-route blob, returning the route id to send to.
    signature: "pub async fn import_route(&self, blob: Vec<u8>) -> Result<RouteId>"
    parameters:
      - name: blob
        type: "Vec<u8>"
        direction: in
        description: A peer's private-route blob.
    returns:
      type: "Result<RouteId>"
      description: The imported route id.
  - name: VeilidNetHandle::release_route
    module: daemonseed_veilid_net::actor
    description: Release a previously imported peer route.
    signature: "pub async fn release_route(&self, route_id: RouteId)"
    parameters:
      - name: route_id
        type: RouteId
        direction: in
        description: The imported route id to release.
    returns:
      type: "()"
      description: None.
  - name: VeilidNetHandle::send_sealed
    module: daemonseed_veilid_net::actor
    description: Send a sealed 1:1 payload over a peer's private route.
    signature: "pub async fn send_sealed(&self, route: RouteId, sealed: Vec<u8>) -> Result<()>"
    parameters:
      - name: route
        type: RouteId
        direction: in
        description: The imported peer route.
      - name: sealed
        type: "Vec<u8>"
        direction: in
        description: The cot-sealed payload.
    returns:
      type: "Result<()>"
      description: Ok on send, else a Send error.
  - name: VeilidNetHandle::publish_circle
    module: daemonseed_veilid_net::actor
    description: Publish a sealed payload to a circle's shared-owner rendezvous append-ring.
    signature: "pub async fn publish_circle(&self, owner_seed: [u8; 32], sealed: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The circle's rendezvous-owner seed (daemonseed_core::derive_circle_veilid_owner_seed).
      - name: sealed
        type: "Vec<u8>"
        direction: in
        description: The circle-key-sealed message.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. This is a Ring
        write and is never coalesced.
  - name: VeilidNetHandle::subscribe_circle
    module: daemonseed_veilid_net::actor
    description: Open + watch + backlog-sweep a circle's rendezvous record; inbound messages arrive as VeilidNetEvent::Inbound.
    signature: "pub async fn subscribe_circle(&self, owner_seed: [u8; 32]) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The circle's rendezvous-owner seed.
    returns:
      type: "Result<()>"
      description: Ok once subscribed.
  - name: VeilidNetHandle::publish_room
    module: daemonseed_veilid_net::actor
    description: Publish a sealed payload to a public room / lobby rendezvous (a room message, or a ShareAnnouncement for share discovery). Mechanics identical to publish_circle; only the owner seed differs.
    signature: "pub async fn publish_room(&self, owner_seed: [u8; 32], sealed: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The public-room rendezvous-owner seed (daemonseed_core::derive_room_veilid_owner_seed), world-derivable.
      - name: sealed
        type: "Vec<u8>"
        direction: in
        description: Payload sealed under the room's PublicRoomKey.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. This is a Ring
        write and is never coalesced.
  - name: VeilidNetHandle::subscribe_room
    module: daemonseed_veilid_net::actor
    description: Open + watch + backlog-sweep a public room / lobby rendezvous; inbound sealed room messages / share announcements arrive as VeilidNetEvent::Inbound.
    signature: "pub async fn subscribe_room(&self, owner_seed: [u8; 32]) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The public-room rendezvous-owner seed.
    returns:
      type: "Result<()>"
      description: Ok once subscribed.
  - name: VeilidNetHandle::resweep_rendezvous
    module: daemonseed_veilid_net::actor
    description: Re-run the one-shot backlog sweep on an already-subscribed rendezvous record WITHOUT registering another watch — the recovery primitive for an item published during the post-(re)connect watch-warmup window (#132/#133) and for re-resolving a stale-route share (#118).
    signature: "pub async fn resweep_rendezvous(&self, owner_seed: [u8; 32]) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The circle or public-room rendezvous-owner seed.
    returns:
      type: "Result<()>"
      description: Ok once the re-sweep is dispatched; re-swept items arrive as Inbound and are deduped downstream.
  - name: VeilidNetHandle::repair_rendezvous
    module: daemonseed_veilid_net::actor
    description: Re-establish a rendezvous record's session under its record_lock — invalidate the open-cache entry, re-open, re-watch, and full re-sweep. Re-swept backlog arrives as VeilidNetEvent::Inbound.
    signature: "pub async fn repair_rendezvous(&self, owner_seed: [u8; 32]) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The circle or public-room rendezvous-owner seed.
    returns:
      type: "Result<()>"
      description: Ok once the repair is dispatched.
  - name: VeilidNetHandle::rendezvous_record_key
    module: daemonseed_veilid_net::actor
    description: Derive a rendezvous record's RecordKey from its owner seed locally (no network) — the seed→key resolution the self-heal needs.
    signature: "pub async fn rendezvous_record_key(&self, owner_seed: [u8; 32]) -> Result<RecordKey>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The circle or public-room rendezvous-owner seed.
    returns:
      type: "Result<RecordKey>"
      description: The record's deterministic key.
  - name: VeilidNetHandle::publish_dm_key_record
    module: daemonseed_veilid_net::actor
    description: Publish an identity's signed DM key record to subkey 0 of its dflt(1) record (ISC-C40). Bytes are opaque here — the caller signs with daemonseed_core::dm::keyrec::build and derives owner_seed with derive_owner_seed. Enqueued on the WB-3 funnel as a Keepalive-class coalescible current-state write, so slow anti-eviction re-seeds collapse to at most one queued write per record. The record is world-writable (a world-derivable address implies a world-derivable owner), so anyone can overwrite or erase it; forgery is impossible because the signature inside is verified against the address's own identity key, leaving erasure and rollback as denial-of-service only.
    signature: "pub async fn publish_dm_key_record(&self, owner_seed: [u8; 32], record: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The key record's owner seed, from daemonseed_core::dm::keyrec::derive_owner_seed over the identity's ML-DSA-87 public key.
      - name: record
        type: "Vec<u8>"
        direction: in
        description: The prost-encoded, already-signed DmKeyRecord.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. The funnel also
        answers Ok when the write is coalesced away by a later same-record, same-logical-id
        write, and when a tombstone dominates it.
  - name: VeilidNetHandle::fetch_dm_key_record
    module: daemonseed_veilid_net::actor
    description: Fetch a correspondent's DM key record from subkey 0 of its dflt(1) record. Ok(None) is an empty slot — evicted, wiped, or never published — and is the caller's awaiting-key state, deliberately distinct from Err (a transport failure); conflating them would make an attacker's wipe indistinguishable from a network problem. The bytes are UNVERIFIED — only daemonseed_core::dm::keyrec::verify may decide a record is genuine, and it needs the identity public key this layer does not hold. One gated GET on the read lane; no write funnel involvement (WB-3 I9).
    signature: "pub async fn fetch_dm_key_record(&self, owner_seed: [u8; 32]) -> Result<Option<Vec<u8>>>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The correspondent's key-record owner seed, derived from their ML-DSA-87 public key.
    returns:
      type: "Result<Option<Vec<u8>>>"
      description: The unverified prost-encoded DmKeyRecord bytes, or None for an empty slot.
  - name: VeilidNetHandle::publish_dm_ack
    module: daemonseed_veilid_net::actor
    description: Publish one direction's sealed acknowledgement to subkey 0 of its dflt(1) record (ISC-C39). Bytes are opaque here — the caller builds them with daemonseed_core::dm::ack_record::build_encoded and the address with DmAckAddress::for_direction over the same address root and direction. Enqueued on the WB-3 funnel as a Keepalive-class coalescible current-state write under the logical id dm-ack; the statement is monotonic, so a coalesced write carries nothing the surviving one lacks. The record is owner-write-gated — the owner seed derives from the conversation's secret address root — so a third party can neither forge nor erase it, and that seed rides inside the zeroizing DmAckAddress rather than as a copyable array.
    signature: "pub async fn publish_dm_ack(&self, address: DmAckAddress, record: Vec<u8>) -> Result<()>"
    parameters:
      - name: address
        type: "DmAckAddress"
        direction: in
        description: The acknowledgement record's address, from daemonseed_core::dm::ack_record::DmAckAddress::for_direction over the conversation's address root and the direction of the messages being acknowledged. Taken by value; derive one per call.
      - name: record
        type: "Vec<u8>"
        direction: in
        description: The prost-encoded, already-sealed and already-signed DmAck.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. The funnel also
        answers Ok when the write is coalesced away by a later same-record, same-logical-id
        write, and when a tombstone dominates it.
  - name: VeilidNetHandle::fetch_dm_ack
    module: daemonseed_veilid_net::actor
    description: Fetch a correspondent's acknowledgement record from subkey 0 of its dflt(1) record. Ok(None) is an empty slot — evicted, or never written because the peer has settled nothing — and is the caller's no-confirmation-yet state, deliberately distinct from Err (a transport failure); under a fail-safe delivery posture, conflating them would let a network fault read as an absence of confirmation. The bytes are UNVERIFIED — only daemonseed_core::dm::ack_record::decode_and_verify may open them, and its PeerAck answers nothing until merged under the caller's own ceiling. One gated GET on the read lane; no write funnel involvement (WB-3 I9).
    signature: "pub async fn fetch_dm_ack(&self, address: DmAckAddress) -> Result<Option<Vec<u8>>>"
    parameters:
      - name: address
        type: "DmAckAddress"
        direction: in
        description: The correspondent's acknowledgement-record address, from DmAckAddress::for_direction over the conversation's address root and the direction of the messages being acknowledged — Ratchet::send_direction for a sender reading its peer's acknowledgement. Taken by value; derive one per call.
    returns:
      type: "Result<Option<Vec<u8>>>"
      description: The unverified prost-encoded DmAck bytes, or None for an empty slot.
  - name: VeilidNetHandle::publish_dm_page
    module: daemonseed_veilid_net::actor
    description: >-
      Publish one sealed DM channel frame into the slot its address names
      (ISC-C42). Bytes are opaque here — this layer neither parses nor verifies the
      frame, and a successful write proves nothing about authorship, since both parties
      can derive the owner seed for both directions. The address carries the position
      it writes, so page and slot cannot disagree and there is nothing to reject.
      Enqueued on the WB-3 funnel as a Chat-class, Ring-kind write —
      non-coalescible, because two queued writes to one page are two different messages
      in two different slots. Write-once is a CALLER OBLIGATION: this is an
      unconditional last-writer-wins set_dht_value with no read-before-write, so a
      reissued sequence number overwrites an already-delivered message and returns Ok
      (see #243). The page record is not world-writable: its owner seed derives from the
      first-contact secret, so a third party cannot compute the address at all.
    signature: "pub async fn publish_dm_page(&self, address: DmPageAddress<Sending>, frame: Vec<u8>) -> Result<()>"
    parameters:
      - name: address
        type: "DmPageAddress<Sending>"
        direction: in
        description: The placed slot to write, from daemonseed_core::dm::paging::DmPageAddress::sending(address_root, ratchet, paging::position_of(seq)). The address IS the position, so page and slot come from one sequence number by construction. Typed to Sending, so an address for the stream this end receives on is a compile error. Taken by value — it holds a boxed, redacted, zeroize-on-drop owner seed that is neither Clone nor constructible outside daemonseed_core::dm::paging, so it is moved into the command rather than copied. Derive one per call; derivation is pure. The funnel's record id is the owner's PUBLIC key derived from the seed, never the seed.
      - name: frame
        type: "Vec<u8>"
        direction: in
        description: The already-sealed, already-signed channel frame.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. The funnel also
        answers Ok when the write is coalesced away by a later same-record, same-logical-id
        write, and when a tombstone dominates it.
  - name: VeilidNetHandle::sweep_dm_page
    module: daemonseed_veilid_net::actor
    description: >-
      Sweep every slot of one DM channel page, returning a DmPageSweep: the
      conversation the swept address named, the populated (PagePosition, bytes)
      slots, and the sweep's SweepOutcome. The conversation tag means a caller
      sweeping several correspondents concurrently attributes frames by a value it
      was handed rather than by dispatch order. Each subkey is placed on
      the addressed page through PagePosition::new at the boundary, so the collector
      checks the frame's declared sequence number against a position rather than
      recomputing one; a slot the record cannot hold returns
      VeilidNetError::DmPageSlotOutsideRecord rather than being skipped. Refuses a
      record whose o_cnt is not paging::PAGE_SLOTS as
      VeilidNetError::DmPageShapeMismatch before any slot is read, so a shape
      disagreement is loud in both directions rather than truncating the page. The outcome
      travels back because an empty Vec alone cannot distinguish an unwritten page from
      one whose every GET errored, and those demand opposite responses. A partial sweep
      returns what it read, which makes recovery a CALLER OBLIGATION: the collector must
      hold probe frontier and contiguous cursor as separate pointers and treat failed >
      0 as a record-health signal. No such collector exists yet (#236). Bounded by the
      handle's own shape; PAGE_SLOTS gated GETs on the read lane, no write funnel
      involvement (WB-3 I9). Spawned off the command loop (D-0b / #128, CRSH-ISC-22).
      Opens via open_only, so probing a page nobody has written does NOT create it: an
      absent page returns an empty Vec with SweepOutcome attempted 0, distinct from a
      present page whose slots were all read and empty (attempted PAGE_SLOTS, found 0).
      attempted 0 means the record was not found by this node on this pass, NOT that it
      does not exist: veilid raises KeyNotFound on an inspect that returns no
      descriptor, and a fanout reaching nobody is a non-error outcome. A caller must
      not treat it as authoritative absence or clear a health / repair latch on it.
      An absence is never cached, so each probe of a still-unwritten page pays a fresh
      open (~6-10s) rather than the one-off cost of creating and caching a record.
    signature: "pub async fn sweep_dm_page(&self, address: DmPageAddress<Receiving>) -> Result<DmPageSweep>"
    parameters:
      - name: address
        type: "DmPageAddress<Receiving>"
        direction: in
        description: The page's address, from daemonseed_core::dm::paging::DmPageAddress::receiving(address_root, ratchet, page). Typed to Receiving, so sweeping the stream this end sends on is a compile error — that address is valid and would read this end's own writes back forever. Taken by value for the reason publish_dm_page gives; derive one per call.
    returns:
      type: "Result<DmPageSweep>"
      description: DmPageSweep { conversation, slots, outcome } — the AR fingerprint naming the correspondence, the populated slots as (PagePosition, unverified bytes) pairs, and the sweep outcome (attempted / found / failed).
  - name: VeilidNetHandle::publish_doorbell_entry
    module: daemonseed_veilid_net::actor
    description: >-
      Write one sealed first-contact entry into one slot of a recipient's dflt(32)
      doorbell record (ISC-C41). Bytes are opaque here — this layer neither parses,
      seals, nor verifies the entry, and a successful write proves nothing about the
      sender, because the record is world-writable. This is the one record a party
      writes that it does not own: a world-derivable address implies a world-derivable
      owner under Veilid's DFLT schema, so the sender derives the recipient's owner
      keypair from the recipient's public identity key and signs the set with it. Any
      third party holds that same authority and can overwrite or erase any slot, which
      is a denial-of-service residual only — forgery is impossible, since an entry that
      does not verify under the recipient's own decapsulation key does not open. Opens
      with create, so the first sender brings a recipient's doorbell into being. A slot
      outside the record and an entry above the per-subkey cap are refused before the
      command crosses the channel, so neither reaches a network call. Enqueued on the
      WB-3 funnel as a Keepalive-class CurrentState write coalescing on the slot: a
      retry re-lands in the sender's own slot and is defined to overwrite its previous
      entry, while two slots of one doorbell never coalesce. The class comes from
      `dispatch`. Coalescing is keyed on the kind, not the class, so a FirstSend still
      queued when its own Reseed is enqueued is superseded, and the survivor inherits the
      strongest class of the set it subsumed, so a knock already answered Ok is not shed
      at shutdown. Carries no deadline.
    signature: "pub async fn publish_doorbell_entry(&self, owner_seed: [u8; 32], slot: u16, entry: Vec<u8>, dispatch: DoorbellDispatch) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The recipient's doorbell owner seed, from daemonseed_core::dm::doorbell::derive_owner_seed over the recipient's ML-DSA-87 public key.
      - name: slot
        type: u16
        direction: in
        description: The sender's slot in that doorbell, from daemonseed_core::dm::doorbell::slot_for over this sender's own doorbell slot secret and the same recipient key. Must be below daemonseed_core::dm::doorbell::DOORBELL_SLOTS; a slot outside the record returns VeilidNetError::DmDoorbellSlotOutsideRecord.
      - name: entry
        type: "Vec<u8>"
        direction: in
        description: The already-sealed, already-signed first-contact entry, from daemonseed_core::dm::firstcontact::build. At most daemonseed_core::dm::firstcontact::MAX_ENTRY_LEN bytes; larger returns VeilidNetError::DmDoorbellEntryTooLarge.
      - name: dispatch
        type: DoorbellDispatch
        direction: in
        description: Whether this is the first dispatch of a user send (WriteClass::Chat) or a scheduler-driven re-seed (WriteClass::Keepalive). The transport cannot tell them apart, so the caller states it; there is no default.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. The funnel also
        answers Ok when the write is coalesced away by a newer one for the same slot, and
        when a tombstone dominates it. A caller needing delivery re-seeds on its own
        schedule; the #236 outbox owns that decision.
  - name: VeilidNetHandle::sweep_doorbell
    module: daemonseed_veilid_net::actor
    description: >-
      Sweep every slot of a doorbell, returning a DoorbellSweep: the populated
      (slot, bytes) pairs and the sweep's SweepOutcome (ISC-C41). The bytes are
      unverified and still sealed — pass each to daemonseed_core::dm::firstcontact::open,
      which fails closed and uniformly, because a world-writable record makes garbage an
      ordinary input. Whether the doorbell is this node's own is the caller's to know:
      the owner seed is a world-derivable [u8; 32], so sweeping another identity's
      doorbell is well-formed and returns entries no local key opens. A
      partial sweep returns what it read, so outcome.failed > 0 is a record-health
      signal and not an empty doorbell. Bounded by the handle's own shape;
      DOORBELL_SLOTS gated GETs on the read lane, no write funnel involvement (WB-3 I9).
      Spawned off the command loop (D-0b / #128, CRSH-ISC-22). Opens via open_only, so
      sweeping a doorbell nobody has knocked on does not create it: an absent record
      returns an empty Vec with SweepOutcome attempted 0, distinct from a present record
      whose slots were all read and empty. attempted 0 means the record was not found by
      this node on this pass, not that it does not exist.
    signature: "pub async fn sweep_doorbell(&self, owner_seed: [u8; 32]) -> Result<DoorbellSweep>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The doorbell's owner seed, from daemonseed_core::dm::doorbell::derive_owner_seed over the owning identity's ML-DSA-87 public key.
    returns:
      type: "Result<DoorbellSweep>"
      description: DoorbellSweep { slots, outcome } — the populated slots as (slot, unverified sealed bytes) pairs, and the sweep outcome (attempted / found / failed).
  - name: VeilidNetHandle::publish_presence
    module: daemonseed_veilid_net::actor
    description: Publish a sealed member-presence beacon to a per-member current-state slot on the presence sibling rendezvous record; a re-beacon overwrites the same slot (last-writer-wins). The presence record is distinct from the chat rendezvous, so a beacon never evicts chat backlog. member_pubkey owns the stable-slot-id encoding (member_slot_id, hex) so all callers agree. The slot count is bounded (SUBKEY_COUNT), so at unbounded membership two members can slot-share (a bounded, self-healing degradation). The app net actor holds the keys and runs the emit/ingest/reap loop; a receiver subscribes via subscribe_room on the same presence owner seed.
    signature: "pub async fn publish_presence(&self, owner_seed: [u8; 32], member_pubkey: &[u8], sealed: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The presence sibling record's rendezvous-owner seed (daemonseed_core::derive_room_presence_veilid_owner_seed / derive_circle_presence_veilid_owner_seed).
      - name: member_pubkey
        type: "&[u8]"
        direction: in
        description: The beacon's stable identity pubkey; hex-encoded to a slot id via member_slot_id.
      - name: sealed
        type: "Vec<u8>"
        direction: in
        description: The opaque sealed MemberHeartbeat.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. The funnel also
        answers Ok when the write is coalesced away by a later same-record, same-logical-id
        write, and when a tombstone dominates it.
  - name: VeilidNetHandle::publish_current_state
    module: daemonseed_veilid_net::actor
    description: Publish opaque bytes to a named current-state slot (last-writer-wins) on an owner-gated rendezvous record — the Phase-4 A-b operator announcements/MOTD record. The write is owner-signed, so only a holder of owner_seed (the non-derivable project-announce owner from daemonseed_core::derive_project_announce_veilid_owner_seed — the write-gate) can place a value; clients subscribe_room and read/verify but cannot write. slot_id is the stable slot key ("motd", or an announcement's content address); bytes is a public signed SignedArtifact (verified client-side by verify_artifact, not AEAD-sealed). Spawned off-loop, per-record serialized.
    signature: "pub async fn publish_current_state(&self, owner_seed: [u8; 32], slot_id: &str, bytes: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The operator record's owner seed (the write-gate secret).
      - name: slot_id
        type: "&str"
        direction: in
        description: The stable slot key ("motd" or an announcement's content address).
      - name: bytes
        type: "Vec<u8>"
        direction: in
        description: The opaque payload (a signed SignedArtifact).
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. The funnel also
        answers Ok when the write is coalesced away by a later same-record, same-logical-id
        write, and when a tombstone dominates it.
  - name: member_slot_id
    module: daemonseed_veilid_net::actor
    description: The stable presence-slot id for a member — its identity pubkey, hex-encoded. A pure function of the member's stable identity, so a re-beacon overwrites the same current_state_subkey slot and all callers agree byte-for-byte.
    signature: "pub fn member_slot_id(member_pubkey: &[u8]) -> String"
    parameters:
      - name: member_pubkey
        type: "&[u8]"
        direction: in
        description: The member's identity pubkey.
    returns:
      type: "String"
      description: The lowercase-hex slot id.
  - name: VeilidNetHandle::serve_share
    module: daemonseed_veilid_net::actor
    description: Register a share to serve owner-on-demand; the actor answers inbound fragment app_calls for share_id from content, sealing each response under room_key. The sharer must stay online to serve (ISC-A-S21).
    signature: "pub async fn serve_share(&self, share_id: String, content: Arc<dyn ChunkSource + Send + Sync>, room_key: [u8; 32]) -> Result<()>"
    parameters:
      - name: share_id
        type: String
        direction: in
        description: The share's stable id (daemonseed_core::share_announce::derive_share_id_v2).
      - name: content
        type: "Arc<dyn ChunkSource + Send + Sync>"
        direction: in
        description: The share's content source — DiskShareContent to serve from disk at O(CHUNK_SIZE) memory, ShareContent to serve from RAM.
      - name: room_key
        type: "[u8; 32]"
        direction: in
        description: The share's PublicRoomKey bytes (responses seal under it).
    returns:
      type: "Result<()>"
      description: Ok once registered.
  - name: VeilidNetHandle::fetch_manifest
    module: daemonseed_veilid_net::actor
    description: Fetch + reassemble + open a share's manifest from the sharer at a private route.
    signature: "pub async fn fetch_manifest(&self, route: RouteId, share_id: &str, room_key: [u8; 32]) -> Result<Vec<ManifestEntry>>"
    parameters:
      - name: route
        type: RouteId
        direction: in
        description: The imported sharer route (anti-swap-verified at discovery before import).
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: room_key
        type: "[u8; 32]"
        direction: in
        description: The share's PublicRoomKey bytes.
    returns:
      type: "Result<Vec<ManifestEntry>>"
      description: The manifest entries, or a transport / NotServed error.
  - name: VeilidNetHandle::fetch_manifest_budgeted
    module: daemonseed_veilid_net::actor
    description: Budget-admitted fetch_manifest — every fragment app_call is admitted through the shared per-route RouteBudget via lease. The scheduler leases once per download and shares the lease across the manifest + every chunk (#204).
    signature: "pub async fn fetch_manifest_budgeted(&self, route: RouteId, share_id: &str, room_key: [u8; 32], lease: &RouteLease<RouteId>) -> Result<Vec<ManifestEntry>>"
    parameters:
      - name: route
        type: RouteId
        direction: in
        description: The imported sharer route.
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: room_key
        type: "[u8; 32]"
        direction: in
        description: The share's PublicRoomKey bytes.
      - name: lease
        type: "&RouteLease<RouteId>"
        direction: in
        description: The download's shared per-route budget lease.
    returns:
      type: "Result<Vec<ManifestEntry>>"
      description: The manifest entries, or a classified fetch error.
  - name: VeilidNetHandle::fetch_chunk_budgeted
    module: daemonseed_veilid_net::actor
    description: Budget-admitted fetch_chunk — SHA-384-verifies the chunk (ISC-S28 / ISC-A-S20) and admits every fragment app_call through the shared per-route budget via lease; the controller's observations are fed internally (the caller never calls observe).
    signature: "pub async fn fetch_chunk_budgeted(&self, route: RouteId, share_id: &str, chunk_addr: ChunkAddr, room_key: [u8; 32], lease: &RouteLease<RouteId>) -> Result<(Vec<u8>, Duration)>"
    parameters:
      - name: route
        type: RouteId
        direction: in
        description: The imported sharer route.
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: chunk_addr
        type: ChunkAddr
        direction: in
        description: The content-address of the chunk to fetch.
      - name: room_key
        type: "[u8; 32]"
        direction: in
        description: The share's PublicRoomKey bytes.
      - name: lease
        type: "&RouteLease<RouteId>"
        direction: in
        description: The download's shared per-route budget lease.
    returns:
      type: "Result<(Vec<u8>, Duration)>"
      description: The verified chunk bytes and the max per-fragment latency observed.
  - name: run_download
    module: daemonseed_veilid_net::download
    description: The shared download engine — fetch a set of PlannedFiles' chunks in parallel under the budget behind fetch_chunk, write each verified chunk into staging at its offset, promote each file on completion, and dispose staging by failure class. progress(chunks_done, bytes_done) reports cumulative totals.
    signature: "pub async fn run_download<FetchChunk, Fut, Prog>(files: &[PlannedFile], staging: &StagingArea, fetch_chunk: &FetchChunk, progress: &Prog) -> DownloadOutcome"
    parameters:
      - name: files
        type: "&[PlannedFile]"
        direction: in
        description: The placed files to fetch (dest_rel + size + chunk addresses).
      - name: staging
        type: "&StagingArea"
        direction: in
        description: The fetch's reserved staging area (daemonseed_core::storage::fetched).
      - name: fetch_chunk
        type: "&FetchChunk"
        direction: in
        description: Fn(ChunkAddr) -> Future<Result<Vec<u8>, VeilidNetError>> returning already-verified bytes — bind to fetch_chunk_budgeted on one lease.
      - name: progress
        type: "&Prog"
        direction: in
        description: Fn(u32, u64) + Sync called with cumulative (chunks, bytes) after each verified chunk.
    returns:
      type: DownloadOutcome
      description: The terminal outcome; staging is disposed by class before returning.
  - name: VeilidNetHandle::publish_share
    module: daemonseed_veilid_net::actor
    description: Announce a public share to the lobby with an anti-swap SIGNED route advert — allocate a private route, sign the advert via signer, wrap it with the sealed announcement into a DiscoveryEnvelope, and publish on the lobby rendezvous. When persist is true the advert is remembered and re-published on RouteChanged; when false (a withdraw) it is a one-shot write that releases its own route and is never re-published (#163). Pair with serve_share.
    signature: "pub async fn publish_share(&self, owner_seed: [u8; 32], share_id: String, sealed_announcement: Vec<u8>, signer: Arc<dyn RouteAdvertSigner>, persist: bool) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The lobby rendezvous-owner seed.
      - name: share_id
        type: String
        direction: in
        description: The share's stable id (also its stable-slot placement key).
      - name: sealed_announcement
        type: "Vec<u8>"
        direction: in
        description: The core ShareAnnouncement sealed under the PublicRoomKey.
      - name: signer
        type: "Arc<dyn RouteAdvertSigner>"
        direction: in
        description: Least-authority capability signing `share_id ‖ route_blob`.
      - name: persist
        type: bool
        direction: in
        description: true for a live share (remembered + re-published on RouteChanged/watchdog); false for a one-shot withdraw, written exactly once and never re-lingered (#163).
    returns:
      type: "Result<()>"
      description: Ok once the advert is published.
  - name: VeilidNetHandle::stop_serve
    module: daemonseed_veilid_net::actor
    description: Stop serving a share and drop its advert (the teeth of unpublish) — inbound fetch app_calls for it are no longer answered and a RouteChanged will not re-publish it; its private route is released.
    signature: "pub async fn stop_serve(&self, share_id: String) -> Result<()>"
    parameters:
      - name: share_id
        type: String
        direction: in
        description: The share to stop serving.
    returns:
      type: "Result<()>"
      description: Ok once de-registered.
  - name: VeilidNetHandle::shutdown
    module: daemonseed_veilid_net::actor
    description: Runs the I7 write-scheduler flush within flush_budget, then shuts the node down. Terminal — every later command on this handle fails.
    signature: "pub async fn shutdown(&self, flush_budget: Duration)"
    parameters:
      - name: flush_budget
        type: Duration
        direction: in
        description: Bound on the flush. The caller's remaining GRACEFUL_CLOSE_BUDGET; pending chat and tombstones dispatch inside it, class-3/4/5 current-state writes are shed, and an overrun abandons to the TTL backstop.
    returns:
      type: "()"
      description: Returns once the flush has completed or expired and the node has shut down.

  # ── config ───────────────────────────────────────────────────────────
  - name: VeilidNetConfig::new
    module: daemonseed_veilid_net::config
    description: A node config with daemonseed defaults (public network, hop_count = 2).
    signature: "pub fn new(identity_seed: VeilidNodeSeed, storage_dir: impl Into<String>) -> Self"
    parameters:
      - name: identity_seed
        type: VeilidNodeSeed
        direction: in
        description: The node identity seed (D3).
      - name: storage_dir
        type: "impl Into<String>"
        direction: in
        description: The protected-store + DHT-cache directory.
    returns:
      type: Self
      description: A config with daemonseed defaults.

  # ── discovery ────────────────────────────────────────────────────────
  - name: route_provenance_input
    module: daemonseed_veilid_net::discovery
    description: The domain-separated bytes a route advert signs/verifies over — ROUTE_ADVERT_DOMAIN ‖ share_id ‖ route_blob.
    signature: "pub fn route_provenance_input(share_id: &str, route_blob: &[u8]) -> Vec<u8>"
    parameters:
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: route_blob
        type: "&[u8]"
        direction: in
        description: The sharer's opaque Veilid route blob.
    returns:
      type: "Vec<u8>"
      description: The provenance input for sign/verify.
  - name: verify_route_advert
    module: daemonseed_veilid_net::discovery
    description: Verify a route advert against the announcer's ML-DSA-87 public key (the one open_announcement provenance-verified). Fails closed (returns false) on a wrong-length key/signature, a tampered/rogue route_blob, a share_id mismatch, or a forged signature — uniform close-shape, the caller cannot tell which.
    signature: "pub fn verify_route_advert(announcer_pubkey: &[u8], share_id: &str, route_blob: &[u8], route_sig: &[u8]) -> bool"
    parameters:
      - name: announcer_pubkey
        type: "&[u8]"
        direction: in
        description: The provenance-verified announcer public key.
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: route_blob
        type: "&[u8]"
        direction: in
        description: The advertised route blob.
      - name: route_sig
        type: "&[u8]"
        direction: in
        description: The advert signature.
    returns:
      type: bool
      description: true iff the advert is authentic; false (fail-closed) otherwise.
  - name: DiscoveryEnvelope::encode
    module: daemonseed_veilid_net::discovery
    description: Length-prefixed encode of the envelope for publication on the lobby rendezvous.
    signature: "pub fn encode(&self) -> Vec<u8>"
    parameters: []
    returns:
      type: "Vec<u8>"
      description: The wire bytes.
  - name: DiscoveryEnvelope::decode
    module: daemonseed_veilid_net::discovery
    description: Fail-closed decode of a swept lobby item into an envelope.
    signature: "pub fn decode(bytes: &[u8]) -> Result<Self>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: A swept lobby-record value.
    returns:
      type: "Result<Self>"
      description: The envelope, or an error if the bytes are not a well-formed envelope.

  # ── share (lower-level codec + serve/fetch primitives) ───────────────
  - name: share::encode_request
    module: daemonseed_veilid_net::share
    description: "Encode a fetch request frame: [tag][share_id(32)]([chunk_addr(48)] iff chunk)[fragment(u32 BE)]."
    signature: "pub fn encode_request(share_id: &str, target: &FetchTarget, fragment: u32) -> Result<Vec<u8>>"
    parameters:
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: target
        type: "&FetchTarget"
        direction: in
        description: Manifest or a specific chunk.
      - name: fragment
        type: u32
        direction: in
        description: The fragment index within the target.
    returns:
      type: "Result<Vec<u8>>"
      description: The encoded request frame.
  - name: share::decode_request
    module: daemonseed_veilid_net::share
    description: Decode a fetch request frame (sharer side).
    signature: "pub fn decode_request(bytes: &[u8]) -> Result<(String, FetchTarget, u32)>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: An inbound request frame.
    returns:
      type: "Result<(String, FetchTarget, u32)>"
      description: The share id, target, and fragment index.
  - name: share::decode_response
    module: daemonseed_veilid_net::share
    description: Decode a fetch response frame into (fragment index, payload), or None for a not-found response.
    signature: "pub fn decode_response(bytes: &[u8]) -> Result<Option<(u32, Vec<u8>)>>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: An inbound response frame.
    returns:
      type: "Result<Option<(u32, Vec<u8>)>>"
      description: The fragment index + payload, or None if the sharer returned not-found.
  - name: share::serve
    module: daemonseed_veilid_net::share
    description: Answer one inbound fetch request from the served-share registry, returning the response frame (a not-found frame if the share is unregistered).
    signature: "pub fn serve(shares: &mut HashMap<String, ServedShare>, request: &[u8]) -> Vec<u8>"
    parameters:
      - name: shares
        type: "&mut HashMap<String, ServedShare>"
        direction: in
        description: The served-share registry.
      - name: request
        type: "&[u8]"
        direction: in
        description: The inbound request frame.
    returns:
      type: "Vec<u8>"
      description: The response frame to reply with.
  - name: share::fetch_manifest
    module: daemonseed_veilid_net::share
    description: Fetch + reassemble + open a manifest via a caller-supplied per-fragment app_call closure. Used by VeilidNetHandle::fetch_manifest.
    signature: "pub async fn fetch_manifest<F, Fut>(share_id: &str, room_key: &PublicRoomKey, call: F) -> Result<Vec<ManifestEntry>>"
    parameters:
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: room_key
        type: "&PublicRoomKey"
        direction: in
        description: The share's room key.
      - name: call
        type: "F: Fn(Vec<u8>) -> Fut"
        direction: in
        description: A per-fragment app_call round-trip.
    returns:
      type: "Result<Vec<ManifestEntry>>"
      description: The reassembled, opened manifest.
  - name: share::fetch_manifest_budgeted
    module: daemonseed_veilid_net::share
    description: Fetch + reassemble + open a manifest, admitting every fragment app_call through a shared per-route RouteBudget (no per-fetch window). Replaces fetch_manifest.
    signature: "pub async fn fetch_manifest_budgeted<R, F, Fut>(share_id: &str, room_key: &PublicRoomKey, lease: &RouteLease<R>, call: F) -> Result<Vec<ManifestEntry>>"
    parameters:
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: room_key
        type: "&PublicRoomKey"
        direction: in
        description: The share's room key.
      - name: lease
        type: "&RouteLease<R>"
        direction: in
        description: The download's lease on the serving route's budget.
      - name: call
        type: "F: Fn(Vec<u8>) -> Fut"
        direction: in
        description: A per-fragment app_call round-trip.
    returns:
      type: "Result<Vec<ManifestEntry>>"
      description: The reassembled, opened manifest.
  - name: share::fetch_chunk_budgeted
    module: daemonseed_veilid_net::share
    description: Fetch + reassemble + open + SHA-384-verify one chunk, admitting every fragment app_call through a shared per-route RouteBudget and feeding each fragment's outcome to the window controller. Replaces fetch_chunk.
    signature: "pub async fn fetch_chunk_budgeted<R, F, Fut>(share_id: &str, chunk_addr: &ChunkAddr, room_key: &PublicRoomKey, lease: &RouteLease<R>, call: F) -> Result<(Vec<u8>, Duration)>"
    parameters:
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: chunk_addr
        type: "&ChunkAddr"
        direction: in
        description: The content-address of the chunk.
      - name: room_key
        type: "&PublicRoomKey"
        direction: in
        description: The share's room key.
      - name: lease
        type: "&RouteLease<R>"
        direction: in
        description: The download's lease on the serving route's budget.
      - name: call
        type: "F: Fn(Vec<u8>) -> Fut"
        direction: in
        description: A per-fragment app_call round-trip.
    returns:
      type: "Result<(Vec<u8>, Duration)>"
      description: The SHA-384-verified chunk bytes and the max per-fragment latency.
  - name: ServedShare::new
    module: daemonseed_veilid_net::share
    description: Register a share's content + room key for owner-on-demand serving.
    signature: "pub fn new(content: Arc<dyn ChunkSource + Send + Sync>, room_key: PublicRoomKey) -> Self"
    parameters:
      - name: content
        type: "Arc<dyn ChunkSource + Send + Sync>"
        direction: in
        description: The share's content source.
      - name: room_key
        type: PublicRoomKey
        direction: in
        description: The room key responses seal under.
    returns:
      type: Self
      description: The served-share entry.

  # ── aimd ─────────────────────────────────────────────────────────────
  - name: AimdWindow::new
    module: daemonseed_veilid_net::aimd
    description: A window bounded to floor..=ceiling, starting fully open at the ceiling (safe-by-default).
    signature: "pub fn new(floor: usize, ceiling: usize) -> Self"
    parameters:
      - name: floor
        type: usize
        direction: in
        description: The minimum window (never below 1).
      - name: ceiling
        type: usize
        direction: in
        description: The maximum (and initial) window.
    returns:
      type: Self
      description: A window at the ceiling.
  - name: AimdWindow::observe
    module: daemonseed_veilid_net::aimd
    description: Fold one latency sample against a threshold — additive-increase below it, multiplicative-decrease at/above it.
    signature: "pub fn observe(&mut self, latency: Duration, threshold: Duration)"
    parameters:
      - name: latency
        type: Duration
        direction: in
        description: The observed (max per-chunk fragment) latency.
      - name: threshold
        type: Duration
        direction: in
        description: The congestion threshold (FRAGMENT_LATENCY_THRESHOLD).
    returns:
      type: "()"
      description: Adjusts the window in place.

  # ── identity ─────────────────────────────────────────────────────────
  - name: identity::node_keypair
    module: daemonseed_veilid_net::identity
    description: Derive the Veilid node keypair from a VeilidNodeSeed (D3).
    signature: "pub fn node_keypair(seed: &VeilidNodeSeed) -> Result<KeyPair>"
    parameters:
      - name: seed
        type: "&VeilidNodeSeed"
        direction: in
        description: The node identity seed.
    returns:
      type: "Result<KeyPair>"
      description: The node keypair.
  - name: identity::rendezvous_owner_keypair
    module: daemonseed_veilid_net::identity
    description: Derive the shared rendezvous-owner keypair from a 32-byte owner seed (every participant derives the same one).
    signature: "pub fn rendezvous_owner_keypair(owner_seed: &[u8; 32]) -> Result<KeyPair>"
    parameters:
      - name: owner_seed
        type: "&[u8; 32]"
        direction: in
        description: The circle/room rendezvous-owner seed.
    returns:
      type: "Result<KeyPair>"
      description: >-
        The rendezvous-owner keypair. The KeyPair contains the seed (it is the VLD0
        secret) in a non-zeroizing veilid Bytes. Deriving per operation bounds only this
        binding, NOT the secret: passing the keypair to open_dht_record /
        create_dht_record makes veilid retain a clone in OpenedRecord.writer for as long
        as the record stays open, and daemonseed opens records once per session and
        never closes them (#252). Use rendezvous_owner_public_bytes where only a record
        identity is needed.
  - name: identity::rendezvous_owner_public_bytes
    module: daemonseed_veilid_net::identity
    description: >-
      The 32-byte Ed25519 public key of a rendezvous-owner keypair — the same value
      rendezvous_owner_keypair puts in KeyPair::key(), as raw bytes. Total, because a
      VLD0 public key is 32 bytes for every seed. Identifies a record without carrying
      the secret: the DHT address derives from this key, so it separates records at
      least as precisely as the seed does.
    signature: "pub fn rendezvous_owner_public_bytes(owner_seed: &[u8; 32]) -> [u8; 32]"
    parameters:
      - name: owner_seed
        type: "&[u8; 32]"
        direction: in
        description: The rendezvous-owner seed.
    returns:
      type: "[u8; 32]"
      description: The owner's raw Ed25519 public key.

# ─────────────────────────────────────────────────────────────────────
# Error types
# ─────────────────────────────────────────────────────────────────────

error_types:
  - name: VeilidNetError
    module: daemonseed_veilid_net::error
    kind: enum
    description: Errors from bringing up or operating the daemonseed Veilid node. `fetch_class(&self) -> FetchErrorClass` classifies a fetch-path failure so the download engine decides resume vs abort vs surface without switching on message strings.
    variants:
      - name: Startup
        condition: veilid startup failed.
      - name: NotReady
        condition: The node did not become public-internet-ready in time.
      - name: Routing
        condition: A routing / private-route error.
      - name: Send
        condition: A send / transport failure (offline / slow / dead route).
      - name: NotServed
        condition: The peer answered but does not serve the requested share/chunk (withdrawn or never offered) — an authoritative negative distinct from a transport error.
      - name: Integrity
        condition: The sharer served content that failed verification — SHA-384 content-address mismatch, chunk-address mismatch, or a malformed/oversized frame. The route is fine; the content is hostile.
      - name: Identity
        condition: Invalid node identity.
      - name: Actor
        condition: The actor task is gone or dropped a reply.
      - name: DmPageShapeMismatch
        condition: A DM page's record carries an o_cnt other than paging::PAGE_SLOTS, checked before any slot is read (ISC-C100). Carries the page and the o_cnt found. An o_cnt below PAGE_SLOTS yields no unplaceable slot, so without this check the sweep returns Ok with a silently truncated page.
      - name: DmPageSlotOutsideRecord
        condition: A DM page sweep returned a slot the addressed page cannot hold — an o_cnt above paging::PAGE_SLOTS (ISC-C100). Carries the page and the subkey. Backstop behind DmPageShapeMismatch, which rejects the shape first.
      - name: Unimplemented
        condition: A Phase 4 surface (presence / announcements) not yet implemented.
  - name: FetchErrorClass
    module: daemonseed_veilid_net::error
    kind: enum
    description: Coarse class of a fetch-path failure, returned by `VeilidNetError::fetch_class`. The download engine switches on it to decide resume vs abort vs surface.
    variants:
      - name: Transient
        condition: Transport / route failure — resumable; verified units are retained and the share stays Unresolved.
      - name: Integrity
        condition: Content failed verification — fatal for the share; never persisted, never resumed past.
      - name: NotServed
        condition: The reachable owner does not serve this share/chunk — an authoritative negative.
      - name: Local
        condition: A local fetcher fault (path sanitize, disk write, index write) contributed by the download engine; `fetch_class` never returns it.

# ─────────────────────────────────────────────────────────────────────
# Constants
# ─────────────────────────────────────────────────────────────────────

constants:
  - name: GRACEFUL_CLOSE_BUDGET
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(12)"
    description: Total a front-end waits on a graceful close. CLOSE_PREFLUSH_BUDGET and CLOSE_FLUSH_FLOOR are carved out of it, and the remainder covers transport teardown and the command/reply hops.
  - name: CLOSE_PREFLUSH_BUDGET
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(6)"
    description: What a close arm may spend on share withdraws and LEAVE tombstones before the I7 flush runs. A step cut off here stays enqueued on the scheduler and is dispatched by the flush.
  - name: CLOSE_FLUSH_FLOOR
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(2)"
    description: Minimum budget the I7 flush receives, plus any unspent CLOSE_PREFLUSH_BUDGET.
  - name: CLOSE_LEAVE_RESERVE
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(2)"
    description: The slice of CLOSE_PREFLUSH_BUDGET the share withdraws may not take, so the LEAVE tombstone always has a budget to run in.
  - name: TEARDOWN_CAP
    module: daemonseed_veilid_net::actor
    type: Duration
    value: "Duration::from_secs(3)"
    description: Cap on veilid's own teardown, and half a caller's bound on shutdown. flush_budget counts from the moment the actor dequeues Command::Shutdown, so a caller caps its await at flush_budget + TEARDOWN_CAP.
  - name: APP_MESSAGE_CAP
    module: daemonseed_veilid_net::actor
    type: usize
    value: "32768"
    description: veilid's app_message / app_call payload cap (bytes); sealed envelopes must fit.
  - name: FRAGMENT_SIZE
    module: daemonseed_veilid_net::share
    type: usize
    value: "30 * 1024"
    description: Per-fragment payload size for share transfer over app_call.
  - name: FRAGMENT_FETCH_CONCURRENCY
    module: daemonseed_veilid_net::share
    type: usize
    value: "8"
    description: Default (ceiling) concurrent fragment app_calls per chunk fetch.
  - name: FRAGMENT_LATENCY_THRESHOLD
    module: daemonseed_veilid_net::share
    type: Duration
    value: "2s"
    description: Per-fragment latency above which the AIMD window narrows (#128 D-1).
  - name: W_FLOOR
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "2"
    description: Per-route budget slow-start / collapse width.
  - name: W_CEIL
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "8"
    description: Widest a single route's budget opens; W_CEIL < G_GLOBAL is a design invariant.
  - name: DEFAULT_ROUTE_CEIL
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "2"
    description: Fresh-route starting ceiling in production (= W_FLOOR); pins the fetch window on veilid 0.5.7, where a serving route dies above ~2 concurrent fragment app_calls.
  - name: G_GLOBAL
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "12"
    description: Fetcher-global cap on total in-flight fragment app_calls across all routes.
  - name: F_FILES
    module: daemonseed_veilid_net::route_budget
    type: usize
    value: "4"
    description: Per-download in-flight file cap (bookkeeping, not route protection).
  - name: ROUTE_ADVERT_DOMAIN
    module: daemonseed_veilid_net::discovery
    type: "&[u8]"
    value: "b\"daemonseed/veilid/share-route/v1\""
    description: Domain-separation prefix for the route-advert provenance input.

# ─────────────────────────────────────────────────────────────────────
# Gotchas
# ─────────────────────────────────────────────────────────────────────

gotchas:
  - description: >-
      Attach first. Every operation requires the node public-internet-ready —
      call attach_and_wait after start; operations before then fail.
  - description: >-
      Node identity is EPHEMERAL (fresh per launch); content identity (the ML-DSA
      signing key) is stable. Share adverts are placed at a stable-share_id
      rendezvous slot (last-writer-wins), so a republish under a fresh node
      identity overwrites in place and a withdraw cancels it (#118).
  - description: >-
      A share is served owner-on-demand: the sharer MUST stay online (ISC-A-S21).
      serve_share registers content; publish_share advertises the route. Unpublish
      is stop_serve (drops the serve registry entry + advert) plus a signed
      withdraw announcement.
  - description: >-
      Discovery is anti-swap: a fetcher MUST verify_route_advert against the
      announcer pubkey (from open_announcement) before importing a discovered
      route — a MITM on the world-writable lobby record cannot redirect a fetch.
  - description: >-
      Rendezvous records are opened with no Veilid encryption key (verbatim
      storage). Do not rely on Veilid value-encryption; the cot seal is the only
      content layer.

# ─────────────────────────────────────────────────────────────────────
# Testing
# ─────────────────────────────────────────────────────────────────────

testing:
  - description: >-
      Unit tests run without a network (in-process app_call closures for share
      serve/fetch, pure codec + AIMD + discovery anti-swap tests). Live two-node
      tests (crates/daemonseed-veilid-net/tests/two_node_*.rs) require a real
      public Veilid attach and are `#[ignore]`d by default — run with
      `cargo nextest run -- --ignored` on a host that can attach to the public
      network.
