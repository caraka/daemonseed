[package]
name = "daemonseed-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
description = "daemonseed relay daemon"

[dependencies]
# Daemonseed siblings.
daemonseed-core = { path = "../daemonseed-core" }

# oxicrypt primitives + module gate (KATS for production module init).
oxicrypt-module = { workspace = true }
oxicrypt-sha = { workspace = true }
oxicrypt-kdf = { workspace = true }
oxicrypt-aes = { workspace = true }
oxicrypt-ml-dsa = { workspace = true }
oxicrypt-ml-kem = { workspace = true }

# oxicrypt primitives the v0.1.1 TLS provider exercises but daemonseed-server
# doesn't call directly — declared so we can assemble the complete KATS slice
# for `oxicrypt_module::initialize_with_profile` in commit-4's main().
oxicrypt-hmac = { workspace = true }
oxicrypt-drbg = { workspace = true }
oxicrypt-ecdh = { workspace = true }

# TLS stack — oxitls v0.1.1. rustls is pinned at workspace level.
oxitls-rustls-provider = { workspace = true }
oxitls-webpki-mldsa = { workspace = true, features = ["cert-builder"] }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }

# Wire schema — APP_HELLO/Ack/Reject prost types live in daemonseed-proto;
# prost provides the encode/decode trait the framing layer calls.
daemonseed-proto = { path = "../daemonseed-proto" }
prost = { workspace = true }

# tonic runtime — serves the post-Authenticated PublicSpace application service
# (M6, the first application-stream service) as gRPC-over-h2 over the single
# already-established TLS connection. tokio-stream wraps that one connection as
# a one-element incoming stream for `Server::serve_with_incoming`.
tonic = { workspace = true }
# `sync` adds BroadcastStream — the per-asset CoT fan-out wrapper (M8 cot.rs).
tokio-stream = { workspace = true, features = ["sync"] }
# tower Layer/Service — the per-connection request-rate middleware (M9 ISC-29,
# app_limit.rs) wraps the served application service.
tower = { workspace = true }

# Runtime — `signal` / `time` / `rt-multi-thread` / `sync` augment the
# workspace base (`rt`, `macros`, `io-util`, `net`). Cargo unions feature sets
# across the workspace + per-crate declarations.
tokio = { workspace = true, features = ["signal", "rt-multi-thread", "time", "sync"] }
tokio-rustls = { workspace = true }

# Config + CLI surface.
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

# OS entropy for first-boot seed generation. The seed itself is module-gate-
# independent (it's just 32 bytes of high-quality entropy); subsequent uses
# of that seed through oxicrypt go through the module gate.
getrandom = { workspace = true }

# Zeroize for the seed in memory (drop-on-out-of-scope; matches the in-tree
# at-rest blob pattern from M1/M3 storage).
zeroize = { workspace = true }

# Hex for ServerId hash prefix (mirrors daemonseed-core::handle).
hex = { workspace = true }

[dev-dependencies]
# Test-only: oxitls's module-init shim. Per-module unit tests + commit-6
# integration tests use this rather than the heavyweight production-KATS init.
oxitls-rustls-provider = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
# Test-only: in-memory tonic round-trip for the public-space handoff. TokioIo
# bridges a tokio duplex half into hyper 1.0's IO traits for the client
# connector; tower::service_fn (a regular dependency, see above) builds the
# one-shot connector. Pinned to the version tonic 0.12.3 already pulls.
hyper-util = "=0.1.20"
