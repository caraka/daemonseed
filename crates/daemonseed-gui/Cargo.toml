[package]
name = "daemonseed-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
description = "Slint GUI client for daemonseed (round-1 scaffold: software-renderer shell)."
publish = false

[dependencies]
# Round-1 is software-renderer-only (no winit/GL backend) so the crate builds and
# renders offscreen on a headless host. The windowed backend is the `desktop`
# feature, enabled on a host with a display (felt-test). See ISA Decisions 2026-06-14.
slint = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
# XDG-correct user dirs (data/config) for first-run desktop integration
# (src/desktop_integration.rs). Already in the workspace lockfile via daemonseed-core.
dirs = "5"

# Real networking (round-3): the GUI lobby wires to a relay by REUSING the proven
# client stack rather than duplicating security-critical code. `daemonseed-cli`
# gives the connect / identity-proof / AppSession flow; `daemonseed-core` the
# public-room key/seal/open primitives; `daemonseed-proto` the `CotFrame` wire
# type. The net actor (src/net.rs) mirrors `daemonseed-tui`'s net actor exactly.
daemonseed-cli = { path = "../daemonseed-cli" }
daemonseed-core = { path = "../daemonseed-core" }
daemonseed-proto = { path = "../daemonseed-proto" }
# Process-wide CryptoProvider install + KATs — symmetric with cli/tui. The GUI
# initializes the same oxicrypt module + rustls provider before connecting
# (`daemonseed_server::tls::install_provider`, `::kats::CNSA_2_0_KATS`).
daemonseed-server = { path = "../daemonseed-server" }

# Process-wide CryptoProvider install — symmetric with cli/tui/server. The GUI
# initializes the same oxicrypt module + rustls provider before connecting.
oxicrypt-module = { workspace = true }
oxitls-rustls-provider = { workspace = true }

# Async runtime for the network side. The render loop stays on the main (UI)
# thread; the net actor runs a current-thread runtime on a dedicated thread and
# posts results back over an unbounded channel (drained non-blocking each tick).
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util"] }

# The public room rides the CircleOfTrust bidirectional Subscribe stream:
# tokio-stream wraps the outbound mpsc receiver as a Stream; tonic::Streaming is
# the inbound type the reader task drains.
tokio-stream = { workspace = true }
tonic = { workspace = true }

# Native folder picker for "Download to…" (commit 2). xdg-portal backend (async,
# over the xdg-desktop-portal D-Bus service) — NO GTK link, keeping the binary lean
# (ISC-C11); rfd uses native pickers on Android/iOS later. Driven on a dedicated
# thread with a current-thread tokio runtime so the UI thread never blocks while the
# dialog is open (caraka 2026-06-16). Needs a running portal service at RUNTIME only
# (not to build); a system without one falls through to a cancelled pick.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
# In-process relay round-trip test (mirrors daemonseed-integration-tests'
# cot_chat_e2e): a CotRegistry + serve_application over tokio::io::duplex, two
# AppSessions fed to two actor instances via the AttachSession test seam.
# (daemonseed-server itself is a regular dep above for crypto init; the relay
# types it also exposes are used here in tests.)
oxitls-rustls-provider = { workspace = true, features = ["testing"] }
# Share publish→fetch round-trip oracle: a temp share directory + a temp fetch root.
tempfile = { workspace = true }

[features]
default = []
# Real winit window on the Wayland head (the felt-test surface). Forwards Slint's
# winit backend; still software-rendered (no GL dependency). `cargo run -p
# daemonseed-gui --features desktop` opens a window. Base build (no features) stays
# offscreen-only so it compiles/verifies from a headless terminal.
desktop = ["slint/backend-winit"]
