      rule. Each sealer returns Vec<u8> of LEG_LEN.
      scan_re_est / scan_re_ack / scan_re_confirm(root, dir, generation, seq:
      u64, last_seen: u32, encoded: &[u8], peer_pk_pc: &[u8; ml_dsa::PK_LEN])
      recover a leg by bounded trial decryption over the attempt window
      [last_seen, last_seen + MAX_GAP] inclusive, skipping attempt 0; dir,
      generation, seq and the kind come from the reader, never from the bytes.
      They return OpenedReEst / OpenedReAck / OpenedReConfirm with generation(),
      attempt() and, for the first two, eph_ek() / eph_ct(); OpenedReAck also has
      floor_gen() -> u32 and OpenedReConfirm agreed_gen() -> u32, the carried
      generations. OpenedReEst also has
      answer() -> ReAckAuthority, whose generation() and attempt() read back.
      ReEstError is Truncated for bytes that are not LEG_LEN, PayloadLen {
      expected, got } for an opened payload of the wrong size in either
      direction, PayloadTooLong { max, got } for a payload handed to the sealer
      that does not fit the padded plaintext (a local caller error, unreachable
      from the public sealers), DidNotOpen for a window that yielded nothing,
      Signature for an opened leg whose signature does not verify (the scan
      stops there rather than trying the next candidate), Kdf, Module, Sealing
      and EntropySource.
      tiebreak_winner(root, generation) -> Direction is the contest coin: HKDF
      over DM_REEST_TIEBREAK with the generation length-prefixed, and the
      least-significant bit of the first expanded byte names the winner — 0 is
      AToB, 1 is BToA. contest_outcome(root, generation, our_direction,
      our_pending_initiation_at: Option<u32>) -> ContestOutcome returns NoContest
      unless the pending initiation is at this generation, then WeSurvive or
      WeAbandon. ReEstGate::from_record(&ResumeRecord) / new() / admit(generation,
      attempt, budget: impl FnOnce() -> bool) -> ReEstAdmission holds one accepted
      (generation, attempt) with A5.1(ii)'s confirmation flag and orders incoming
      pairs against it: the same pair is ReServe with no charge; any differing
      attempt at a CONFIRMED generation is Locked with no charge, checked before
      the budget closure; a pair ordering below it (a lower attempt at an
      unconfirmed generation, or any lower generation) is Dropped with no charge
      and no state change; and a pair above it — a higher generation, or A5.1's
      superseding higher attempt at an unconfirmed candidate — is charged and
      replaces the slot, yielding Emit or Withheld. accepted() reads the slot back
      as Option<(u32, Attempt)>, is_confirmed() -> bool reads the lock, and
      floor() -> u32 reads the committed generation below which nothing is
      admitted. Locked is deliberately wider than A5.1(ii)'s "lower-or-stale": a
      higher attempt is refused too, because confirmation means a frame has
      opened under the re-rooted chain and re-rooting again would fork the root
      the peer is already using.
      from_record is the constructor production uses and the type has no Default:
      the accepted pair, the lock and the floor are durable state, so a gate built
      empty after a restart would let a returning peer's stale attempt supersede a
      candidate both sides had settled. The floor is carried even when the
      acceptance slot is empty — A3.14 zeroes that slot on completion, so a gate
      seeded from the slot alone would admit generations A3.4 has already closed;
      a replay of the accepted pair is still re-served ahead of the floor. It is A3.4's acceptance slot plus A5.1's
      supersede and lock, not A5.3's durable dedup memory, which lives in
      ResumeRecord::dedup and is keyed (gen, attempt, leg, dir, seq).
      AttemptBudget::empty() / from_record(&ResumeRecord) / anchor() / attempt() /
      count() / exhausted() / charge() -> Option<Self> / observe_peer_opened(
      attempt: Attempt) -> Self carries A7.3's window anchor beside the monotone
      attempt counter and derives the toward-C count as their difference, so no
      second counter can disagree with the number it describes. charge refuses at
      anchor + ATTEMPT_CEILING on a >= boundary. observe_peer_opened is the only
      anchor reset (A8.2's last_seen-derived rollover, recomputed at load) and
      takes the attempt an opened RE-ACK names; an observation at or below the
      anchor, or above the counter, is inert. ATTEMPT_CEILING is 8 and MAX_GAP
      equals it; both are placeholders for the design's tunable C,
      protocol-global rather than per-deployment, and moving them changes no
      encoding. Together the ceiling and the anchor reset bound attempt −
      last_seen by C, so the legitimate current attempt is always inside the
      receiver's scan window.
      Sub-module dm::domain
      declares the daemonseed/dm/… label namespace, one distinct prefix-free label
      per purpose.
    no_std: false
    depends_on:
      - daemonseed_core::identity::keys
      - daemonseed_core::secret_seed
    iscs:
      - C39
      - C40
      - C41
      - C42
      - A-C20
      - A-C21
      - A-C24
      - A-C22
      - A-C23

  - name: daemonseed_core::room_message
    description: >-
      The ONE signed room-message seal/open path shared by public rooms and
      circles (room↔circle convergence). seal_signed_room_message(key, aad,
      provenance_domain, sender, room_id, sender_handle, body, sent_unix_ms)
      self-signs a RoomMessage over provenance_domain||room_id||sender_pubkey||
      sent_unix_ms||body then AES-256-GCM seals it under `key` with `aad`.
      open_signed_room_message(key, aad, provenance_domain, sealed,
      expected_room_id) opens, exact-length-gates sender_pubkey/signature BEFORE
      any ML-DSA call (empty pubkey ≠ anyone), and verifies the signature against
      the caller-supplied expected_room_id — NEVER the carried field. public_room
      and circle::message are thin wrappers supplying their key + DISTINCT AAD +
      domain. RoomMessageError is the shared error (KeyInit/EntropySource/Aead/
      Authentication/Truncated/Decode/Sign/Provenance).
    no_std: false
    depends_on:
      - daemonseed_core::circle::key
      - daemonseed_core::circle::message
      - daemonseed_core::identity::keys
    iscs:
      - S24
      - C57
      - C99
      - A-S2
      - A-S16
      - A-S17

  - name: daemonseed_core::circle::message
    description: >-
      Circle chat-message sealing — the thin circle-side wrapper over the ONE
      signed seal/open path in room_message (room↔circle convergence). A circle
      is a public room with a secret key: seal_message signs a RoomMessage with
      the poster's identity (C99) then AES-256-GCM seals under the 32-byte cot_key
      with the circle AAD + provenance domain (daemonseed/circle/message/v2, the
      signed shape); envelope = nonce(12)||ciphertext||tag(16). open_message
      recomputes room_id from cot_key and verifies the signature against that,
      fails closed (Authentication) on a wrong key/tamper (A-S2) and (Provenance)
      on an absent/bad signature or a message signed for a different circle
      (A-S17). MESSAGE_AAD / CIRCLE_PROVENANCE_DOMAIN / NONCE_LEN / TAG_LEN live
      here; MessageError re-exports room_message::RoomMessageError.
    no_std: false
    depends_on:
      - daemonseed_core::circle::key
      - daemonseed_core::room_message
      - daemonseed_core::identity::keys
    iscs:
      - C15
      - C17
      - C57
      - C99
      - A-S2
      - A-S17

  - name: daemonseed_core::public_room
    description: >-
      Interactive public-room sealing — the public tier of the public-vs-circle
      bifurcation (S4 / S22..S26). derive_room_key builds a GLOBAL key from
      PUBLIC inputs (crypto family token + room name under PUBLIC_ROOM_KEY_SALT,
      no secret IKM), so every client AND the relay derive it: the room is
      server-readable by design — protocol uniformity, NOT a confidentiality
      barrier. room_asset_address = SHA-384(room_key ‖ server_id) puts a room on
      the SAME Subscribe surface as a circle. seal_room_message / open_room_message
      are thin wrappers over the unified room_message seal/open path (AAD =
      ROOM_MESSAGE_AAD, domain daemonseed/public-room/message/v1). open_room_message
      takes the subscribed `room` and verifies the signature against it (never the
      carried room_id), failing closed (Authentication) on a wrong key/tamper and
      (Provenance) on a bad signature (A-S17). DEFAULT_ROOM = "lobby". Also derives
      the Veilid rendezvous-owner + presence-owner seeds (siblings of the room key).
    no_std: false
    depends_on:
      - daemonseed_core::circle::key
      - daemonseed_core::circle::message
      - daemonseed_core::room_message
      - daemonseed_core::cot
      - daemonseed_core::identity::keys
    iscs:
      - S4
      - S22
      - S24
      - C57
      - A-S2
      - A-S16
      - A-S17

  - name: daemonseed_core::heartbeat
    description: >-
      Member-plane presence heartbeat sealing. seal_public_heartbeat /
      seal_circle_heartbeat self-sign a MemberHeartbeat (ML-DSA, C57) then
      AES-256-GCM-seal it under the public room key or a circle cot_key
      respectively (the typed key is the tier guard — wrong tier is a compile
      error); open_heartbeat is generic over AeadKey256 and fails closed
      (Authentication on a wrong key or tamper, Provenance on a bad signature).
      AAD = HEARTBEAT_AAD, envelope nonce(12)||ciphertext||tag(16). The beacon
      carries the member's own presence assertion (room, pubkey, handle,
      timestamp) plus a live_share_ids digest of the shares it is serving into
      that room (#76, provenance-bound) — never a roster. Types: HeartbeatFields,
      HeartbeatError.
    no_std: false
    depends_on:
      - daemonseed_core::circle::key
      - daemonseed_core::circle::message
      - daemonseed_core::identity::keys
      - daemonseed_core::public_room
    iscs:
      - A-S2
      - A-S23
      - C57
      - C83
      - C84
      - C86
      - A-C38

  - name: daemonseed_core::presence
    description: >-
      Receiver-side member liveness view. PresenceTracker.apply folds a verified
      MemberHeartbeat keyed by sender pubkey (an older sent_unix_ms is ignored);
      reap() ages members out past a TTL measured from monotonic receive time and
      returns the reaped members (so a caller can drop their shares too, #76).
      with_cadence(interval, miss_count) sets TTL = interval * miss_count
      (decoupled knobs, bias to forgiveness). next_keepalive_interval draws a
      jittered interval in [KEEPALIVE_INTERVAL_MIN, KEEPALIVE_INTERVAL_MAX].
      Transport-free, RAM-only. Types: PresenceTracker, LiveMember,
      PresenceChange.
    no_std: false
    depends_on:
      - daemonseed_core::heartbeat
    iscs:
      - A-S2
      - S20
      - C85
      - A-C39

  - name: daemonseed_core::transcript
    description: >-
      Chat-transcript ordering policy shared by the GUI + TUI (#131). clamp_order_ms
      bounds an untrusted advisory sent_unix_ms to [now − TRANSCRIPT_MAX_BACKLOG_AGE,
      now + TRANSCRIPT_MAX_CLOCK_SKEW] for ORDERING + read high-water on the open lobby:
      real backlog (in-window) is returned unchanged, a forged/broken timestamp is
      pulled to a window edge, so a peer cannot pin/hide/suppress. Callers dedup on the
      ORIGINAL sent_unix_ms and never advance the high-water past now. is_stale_backlog
      is true when sent_unix_ms is older than TRANSCRIPT_MAX_BACKLOG_AGE (24h) — for
      pruning stale count-bounded-ring backlog at ingest (#151, GUI). Pure +
      clock-injected.
    no_std: false
    depends_on: []

  - name: daemonseed_core::share_announce
    description: >-
      Share-announcement sealing. share_id is the receiver-verifiable v2
      derivation: derive_share_root_nonce (from the identity-scoped ShareRootIkm)
      → derive_root_commitment → derive_share_id_v2(sender_pubkey,
      root_commitment) — a deterministic 128-bit id (32 hex) a republish
      re-asserts and any receiver recomputes to reject a forged pairing
      (S21, S32/S33/S34, A-S24/A-S25/A-S26). mint_share_id (random) is retained
      for tests only, off every publish path. seal_public_announcement / seal_circle_announcement
      self-sign a ShareAnnouncement (ML-DSA, C57) then AES-256-GCM-seal it under
      the public room key or a circle cot_key respectively (the typed key is the
      tier guard — wrong tier is a compile error); AAD = SHARE_ANNOUNCE_AAD,
      envelope nonce(12)||ciphertext||tag(16). open_announcement is generic over
      AeadKey256 and fails closed (Authentication on a wrong key or tamper,
      Provenance on a bad signature). The announcement carries share_id (S21),
      never server_id.
    no_std: false
    depends_on:
      - daemonseed_core::circle::key
      - daemonseed_core::circle::message
      - daemonseed_core::identity::keys
    iscs:
      - A-S1
      - A-S2
      - A-S16
      - S21
      - C57

  - name: daemonseed_core::share_rollcall
    description: >-
      Seal/open for the ShareRollCall late-join request. seal_public_rollcall /
      seal_circle_rollcall self-sign a ShareRollCall (ML-DSA, C57) then
      AES-256-GCM-seal it under the public room key or a circle cot_key
      respectively (the typed key is the tier guard — wrong tier is a compile
      error); open_rollcall is generic over AeadKey256 and fails closed
      (Authentication on a wrong key or tamper, Provenance on a bad signature).
      AAD = SHARE_ROLLCALL_AAD.
    no_std: false
    depends_on:
      - daemonseed_core::circle::key
      - daemonseed_core::circle::message
      - daemonseed_core::identity::keys
      - daemonseed_core::public_room
    iscs:
      - A-S1
      - A-S2
      - A-S16
      - S21
      - C57

  - name: daemonseed_core::share_catalog
    description: >-
      Client-side catalog of shares discovered in one room/circle.
      apply_verified() is the ingest gate — it folds an announcement only after the
      #156 binding check (share_id == derive_share_id_v2(sender_pubkey,
      root_commitment)); apply() is the raw fold WITHOUT the check and must not be
      called at ingest. An announce inserts or refreshes, a withdraw removes, an
      older sent_unix_ms for a known share is ignored. prune() ages
      entries out past a receive-time TTL; remove() drops one explicitly.
      reconcile_sharer() folds a heartbeat's live-share digest (#76: refresh
      in-digest shares, drop a sharer's shares absent from it); prune_sharer()
      drops all of one sharer's shares on heartbeat lapse. Transport-free. Types:
      ShareCatalog, DiscoveredShare, ShareListing, CatalogChange.
    no_std: false
    iscs:
      - A-S1
      - A-S2
      - S21
      - C86

  - name: daemonseed_core::share_seal
    description: >-
      Share CONTENT sealing — AES-256-GCM-seals each share_envelope ShareFrame
      (manifest/chunk) before it enters CotFrame.payload, so public-share traffic
      is structurally indistinguishable from chat/circle traffic.
      seal_public_share_frame / seal_circle_share_frame
      are tier-split (the PublicRoomKey / CircleKey type is the guard — the wrong
      tier is a compile error); open_share_frame is generic over AeadKey256. No
      provenance signature: per-chunk SHA-384 integrity already lives inside the
      frame, and authorship is established by the share announcement. AAD =
      SHARE_FRAME_AAD, distinct from the chat / room / announce AADs.
    no_std: false
    depends_on:
      - daemonseed_core::circle::key
      - daemonseed_core::circle::message
      - daemonseed_core::public_room
      - daemonseed_core::share_envelope
    iscs:
      - A-S2
      - A-S16
      - C19

  - name: "circle::default_circle_label"
    module: daemonseed_core::circle
    description: >-
      Canonical home (shared by the TUI and the GUI; neither reimplements it) for a
      circle's stable client-local display label (ISC-C62). Deterministically derives an
      `adj-noun` pair from the circle's rendezvous AssetAddr (SHA-384(cot_key ‖ server_id))
      by folding the address bytes into the display-name wordlist index — same address →
      same label (recognisable re-join), `#circle` only if the address is empty. The label
      never leaves the client and is never derived from members or the secret phrase (A-S2).
    signature: "pub fn default_circle_label(asset_addr: &AssetAddr) -> String"
    parameters:
      - name: asset_addr
        type: "&AssetAddr"
        direction: in
        description: The circle's relay rendezvous address.
    returns:
      type: String
      description: A deterministic adj-noun client-local label.

  - name: daemonseed_core::public_space
    description: >-
      Signed-artifact model for the public-space service, shared
      byte-for-byte by the server (verify-and-serve, ISC-A-S3) and every
      client (independent re-verification of what the server served). One
      implementation of "is this artifact trustworthy" — content-address
      derivation, signer-whitelist authorization, ML-DSA-87 signature
      verification — so the server can never serve content a client would
      reject. Proto-agnostic: operates on &[u8] payloads / keys / signatures
      (no daemonseed-proto dependency), so the wire crate adapts its types
      into these calls.
    no_std: false
    depends_on:
      - daemonseed_core::identity::keys
      - daemonseed_core::handle
    iscs:
      - S7
      - S8
      - A-S3
    added_in: "v0.8.0"

  - name: daemonseed_core::crypto::deprecation
    description: >-
      Operator-configured suite-deprecation policy (ISC-S16 / A-S11 / C25 /
      A-C9). A signed, monotonically-versioned policy listing per-suite cutoffs
      and recommended migration targets; clients fetch + verify it and surface
      trust events (never silently downgrade). Includes a TTL'd per-server cache
      with rollback detection (older policy-version than already seen = attack
      signal).
    no_std: false
    depends_on:
      - daemonseed_core::crypto::suite
      - daemonseed_core::identity::keys
    iscs:
      - S16
      - A-S11
      - C25
      - A-C9
    added_in: "v0.9.0"

  - name: daemonseed_core::trust_events
    description: >-
      Trust-event taxonomy + bounded encrypted audit log (ISC-C28 / A-C12).
      A closed, append-only TrustEventKey enum mapped to a four-class affordance
      taxonomy (Blocking / PersistentNonBlocking / Transient / LogOnly), with a
      frozen stable string form persisted in the log and consumed by third-party
      clients. Keys may be added, never renamed/removed.
    no_std: false
    depends_on:
      - daemonseed_core::crypto::deprecation
      - daemonseed_core::crypto::suite
    iscs:
      - C28
      - A-C12
    added_in: "v0.9.0"

  - name: daemonseed_core::dm::spent_store
    description: >-
      Profile-root home for the spent-invite-token set (#233, ISC-C28). The set
      is profile-global rather than per-correspondence, so it sits beside the
      trust log rather than inside the DM store, sealed under its own HKDF info
      string. Its size reveals how many unexpired grants have been burnt and
      nothing about who held them.
    no_std: false
    depends_on:
      - daemonseed_core::dm::token
      - daemonseed_core::kdf::info
      - daemonseed_core::profile::config
    iscs:
      - C28
    added_in: unreleased

  - name: daemonseed_core::backoff
    description: >-
      Jitter arithmetic + close-cause categorization. apply_jitter(delay, frac,
      unit) applies +/-frac jitter at unit in [-1, 1], clamped to >= 0 — the one
      definition of jitter in the workspace, called by dm::outbox's rung ladder.
      CloseCause is a uniform close-cause layering that never names which
      rate-limit was hit (A-S12).
    no_std: false
    depends_on: []
    iscs: []
    added_in: "v0.11.0"

  - name: daemonseed_core::mention
    description: >-
      @-mention recognition + resolution over decrypted chat plaintext (ISC-C17 / C18 / A-C4). Pure client-side functions that add no server-
      visible distinction over plain chat (no daemonseed-proto dependency).
    no_std: false
    depends_on:
      - daemonseed_core::handle
    iscs:
      - C17
      - C18
      - A-C4
    added_in: "v0.11.0"

  - name: daemonseed_core::release
    description: >-
      Release-signing trust anchor, N-of-M multi-sig verify, and the client
      update-lifecycle FSM (ISC-S18 / A-S13 / C27 / A-C11).
      The anchor is binary-bound (include_str!'d TOML, mirrors bootstrap::anchor)
      and ships its 1-of-1 shape with the key array empty (the real key is deferred
      to the signing-key ceremony). The FSM enforces verify-before-apply, never-auto-install,
      no-silent-downgrade, and wipe-and-log-on-failure by its shape, emitting the
      existing M7 update trust-event keys (no new wire surface).
    no_std: false
    depends_on:
      - daemonseed_core::identity::keys
      - daemonseed_core::trust_events
    iscs:
      - S18
      - A-S13
      - C27
      - A-C11
    added_in: "v0.12.0"
    deferred: "Real signing keys / Sigstore / reproducible build / live fetch / binary swap."

  - name: daemonseed_core::biometric
    description: >-
      Biometric / secure-enclave session-passphrase storage — scaffold only
      (ISC-C7). Defines the BiometricStore trait a future
      GUI/mobile client implements to offer biometric login, plus the typed
      SessionPassphrase secret it may hold (never the mnemonic) and the mandatory
      RECOVERY_RISK_WARNING. No platform implementation (iOS Keychain, Android
      Keystore, Linux Secret Service) ships here — those live with the client
      that holds a session and can prompt for a fingerprint/face.
    no_std: false
    depends_on: []
    iscs:
      - C7
    added_in: "v0.12.1"

  - name: daemonseed_core::autostart
    description: >-
      OS-native autostart — scaffold only (ISC-C20). Ships the
      pure `unit_descriptor` generator (systemd user unit / launchd plist /
      Windows Startup command, text only, no I/O) and the AutostartManager trait a
      future client implements to install/enable/disable a unit. Autostart is
      opt-in (ProfileConfig::autostart), launches headless by default, and pins
      the daemon's primary identity online whenever the machine is on (see
      PRESENCE_SIDE_CHANNEL_WARNING).
    no_std: false
    depends_on: []
    iscs:
      - C20
    added_in: "v0.12.1"

# ─────────────────────────────────────────────────────────────────────
# Types — structs / enums / traits / aliases. Each references its module.
# ─────────────────────────────────────────────────────────────────────

types:
  # ── public_space: the operator's project-announce seed ───────────────
  - name: ProjectAnnounceSeed
    module: daemonseed_core::public_space
    kind: struct
    description: >-
      The project-announce seed: the one secret the project-announce signing key and the
      announce record's owner seed both descend from. Held only by the operator instance,
      loaded at runtime through ProjectAnnounceSeedSource; a value of this type is a seed
      that derived the public key its loader was told to expect. 32 bytes, boxed.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: ProjectAnnounceSeedText
    module: daemonseed_core::public_space
    kind: struct
    description: >-
      The value of PROJECT_ANNOUNCE_SEED_ENV as taken out of the process environment —
      the seed in text form. Zeroed-on-drop buffer; Clone yields another; Debug redacted.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: ProjectAnnounceSeedSource
    module: daemonseed_core::public_space
    kind: struct
    description: >-
      Where an operator instance's seed may come from: the value of
      PROJECT_ANNOUNCE_SEED_ENV, read first, and the file PROJECT_ANNOUNCE_SEED_FILENAME
      under the profile root. Both inputs are handed in rather than read ambiently.
      Not Clone; Debug names whether the variable was set, never its value.

  - name: SeedOrigin
    module: daemonseed_core::public_space
    kind: enum
    description: Where a loaded seed came from — Env, or File(path). Named in the operator's trace and in every error.

  - name: ProjectAnnounceSeedError
    module: daemonseed_core::public_space
    kind: enum
    description: >-
      Why an operator instance's seed could not be loaded — Malformed { origin, reason },
      Unreadable { path, source }, Permissions { path, mode }, Derivation, or
      NotTheProjectSeed { origin }. An absent source is not an error.

  - name: SeedHexError
    module: daemonseed_core::public_space
    kind: enum
    description: Why a seed's text form did not parse — NotText, Length(found) or NotHex. Carries the length, never the text.

  # ── identity::mnemonic ──────────────────────────────────────────────
  - name: Mnemonic
    module: daemonseed_core::identity::mnemonic
    kind: struct
    description: >-
      Newtype wrapping bip39::Mnemonic. Debug redacts. ZeroizeOnDrop.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: MnemonicError
    module: daemonseed_core::identity::mnemonic
    kind: enum
    description: Generation / parsing failure modes.

  # ── identity::keys ──────────────────────────────────────────────────
  - name: Identity
    module: daemonseed_core::identity::keys
    kind: enum
    description: >-
      Primary | Device(Uuid) — selects which HKDF info-string prefix is used.
    variants:
      - name: Primary
        description: Cross-device identity root branch.
      - name: Device
        description: Per-device branch keyed by a Uuid.

  - name: KeyDerivationError
    module: daemonseed_core::identity::keys
    kind: enum
    description: HKDF / oxicrypt-module / KEM keygen failure modes.

  - name: SignKeypair
    module: daemonseed_core::identity::keys
    kind: struct
    description: >-
      ML-DSA-87 keypair. Drop zeroizes private key. Exposes detached `sign`.
      Built from a mnemonic (via derive_identity_keys), directly from a raw
      seed (from_ml_dsa_seed, server path), or from two stored halves
      (from_halves).
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: KemKeypair
    module: daemonseed_core::identity::keys
    kind: struct
    description: ML-KEM-1024 keypair. Drop zeroizes private key.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: IdentityKeys
    module: daemonseed_core::identity::keys
    kind: struct
    description: Bundle of SignKeypair + KemKeypair for one Identity branch.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: SignatureError
    module: daemonseed_core::identity::keys
    kind: enum
    description: >-
      Module(oxicrypt_module::Error) | BadSignature. BadSignature is uniform
      across tampered-message / wrong-key / forged-sig (ISC-A-S12 / A-C18 —
      verifier cannot distinguish the sub-cause).

  # ── identity_proof ──────────────────────────────────────────────────
  - name: ChannelBindingSource
    module: daemonseed_core::identity_proof
    kind: trait
    description: >-
      export_keying_material(label, context, out). The seam a
      transport-terminating layer would implement; no implementor exists outside
      the module's test fake. MUST NOT substitute a constant (A-S14/A-C18).

  - name: ChannelBindingError
    module: daemonseed_core::identity_proof
    kind: enum
    description: Export(String) — exporter call failed (e.g. handshake incomplete).
    variants:
      - name: Export
        description: The TLS exporter call failed (e.g. handshake incomplete).

  - name: VerifiedPeer
    module: daemonseed_core::identity_proof
    kind: struct
    description: >-
      Opaque proof-of-verification token. Constructible ONLY by verify_envelope
      returning Ok. Accessors: handle(), pubkey(), counter(), counter_gap().
      Gates Connection::into_authenticated.

  - name: VerifyRejection
    module: daemonseed_core::identity_proof
    kind: struct
    description: >-
      Zero-field, no-discriminator rejection — bad-sig / wrong-key / stale-ts /
      replayed-counter / unsupported-suite / handle-mismatch all collapse here so
      neither caller nor peer can tell which check failed (A-S12 / A-C18).

  # ── handle::display_name ────────────────────────────────────────────
  - name: DisplayNameRng
    module: daemonseed_core::handle::display_name
    kind: trait
    description: >-
      CSPRNG abstraction. random_index(len) -> usize. Same trait used by
      type-back challenge.

  # ── profile::config ─────────────────────────────────────────────────
  - name: ArgonParams
    module: daemonseed_core::profile::config
    kind: struct
    description: >-
      ISC-C14 work-factor knobs. Defaults are OWASP-2024 baselines.
      is_openable() bounds parameters read from a file before a key is derived
      from them; MAX_OPENABLE_MEMORY_KIB / _ITERATIONS / _PARALLELISM are the
      per-field ceilings and MAX_OPENABLE_MEMORY_ITERATION_PRODUCT bounds the
      work. Applied at open_log, spent_store::open, recovery_file::open and
      ProfileConfig::from_toml.
    fields:
      - name: memory_kib
        type: u32
        description: Memory cost in KiB.
      - name: iterations
        type: u32
        description: Iteration count (Argon2 `t`).
      - name: parallelism
        type: u32
        description: Parallelism (Argon2 `p`).

  - name: ProfileConfig
    module: daemonseed_core::profile::config
    kind: struct
    description: Round-tripped through `toml` to / from `daemonseed.toml`.
    fields:
      - name: profile_id
        type: Uuid
        description: UUID v4 drawn at first-start; immutable for the profile life (A-C16).
      - name: argon2
        type: ArgonParams
        description: Argon2 work factors; never silently changed (A-C17).
      - name: biometric_unlock
        type: bool
        description: >-
          Opt-in biometric / secure-enclave session-passphrase unlock (ISC-C7).
          Default false; serde-default so older daemonseed.toml files still parse.
      - name: autostart
        type: bool
        description: >-
          Opt-in OS-native autostart (ISC-C20). Default false; serde-default so
          older daemonseed.toml files still parse.

  - name: ProfileConfigError
    module: daemonseed_core::profile::config
    kind: enum
    description: >-
      Missing / unparseable / wrong-type field surfaces here.
      ArgonParamsOutOfRange carries work factors outside
      ArgonParams::is_openable.

  # ── profile::resolve ────────────────────────────────────────────────
  - name: ResolveArgs
    module: daemonseed_core::profile::resolve
    kind: struct
    description: "Caller-supplied: optional --config path, optional override-XDG, etc."

  - name: ResolvedProfileRoot
    module: daemonseed_core::profile::resolve
    kind: enum
    description: Whether the resolved profile root already exists or needs first-start.
    variants:
      - name: Existing
        description: Existing(PathBuf) — a profile already lives at this root.
      - name: FirstStart
        description: FirstStart(PathBuf) — no profile yet; cold enrollment is needed.

  - name: ResolveError
    module: daemonseed_core::profile::resolve
    kind: enum
    description: Filesystem / parse failure modes.

  # ── storage::seeds ──────────────────────────────────────────────────
  - name: CounterState
    module: daemonseed_core::storage::seeds
    kind: struct
    description: >-
      Replay-protection state (project_clocks_freshness). Methods:
      next_send()->u64 (pre-increment, first=1), current_send(),
      highest_seen(target)->Option<u64>, record_seen(target, counter) (keeps
      max). send_counter MUST persist (ISC-33); server MUST NOT persist its
      per-client seen map (A-S1/A-S12, RAM-only).
    fields:
      - name: send_counter
        type: u64
        description: Private. Monotonic send counter; pre-increment, first value 1.
      - name: seen
        type: "BTreeMap<String, u64>"
        description: Private. Highest seen counter per target.

  - name: Seeds
    module: daemonseed_core::storage::seeds
    kind: struct
    description: >-
      Plaintext payload. Construct via Seeds::new(mnemonic) (default counters,
      empty mute/hide/circles, no display name). Plaintext is line-based: line 0 =
      phrase, then `send-counter <n>` / `seen <target> <n>` directives, the
      M9 `muted <handle>` / `hidden-share <handle>` lines, and the M13
      `display-name <name>` line plus per-circle `circle <entropy-hex> <label-hex>`
      lines (entropy + label hex-encoded so arbitrary text round-trips through the
      line-based scheme). Bare-phrase (legacy M1/M2/M3) payloads parse with all
      fields defaulted — no re-enrollment. Directive scheme is additive for future
      fields. The struct is Clone so the running client can keep a mutate-and-
      re-seal copy (the M13 write-through) independent of the cold-start
      SessionMaterials copy; the clone still zeroizes the mnemonic on drop.
    fields:
      - name: mnemonic
        type: Mnemonic
        description: The recovery-root BIP-39 mnemonic.
      - name: counters
        type: CounterState
        description: Replay-protection counter state.
      - name: muted
        type: "BTreeSet<String>"
        description: >-
          Full wire handles whose chat is muted (ISC-C15). Unilateral and silent;
          the muted party is never signalled. Persisted, never sent on the wire.
      - name: hidden_shares
        type: "BTreeSet<String>"
        description: >-
          Full wire handles whose file shares are hidden (ISC-C16). Independent of
          `muted`. Persisted, never sent on the wire.
      - name: display_name
        type: "Option<String>"
        description: >-
          The user's chosen display name (ISC-C4b), persisted at M13 so it survives
          a daily-login Unlock (ISC-C51) rather than resetting each session. `None`
          = the floor-handle presentation. Mutate via set_display_name (refuses
          line breaks). Public (it travels on the wire), so unredacted in Debug.
      - name: circles
        type: "Vec<PersistedCircle>"
        description: >-
          Circles to silently rejoin on the next Unlock (ISC-C59 persistence, M13),
          in join order so the carousel restores deterministically. Each entry
          carries the canonicalized entropy needed to re-derive the cot_key (ISC-C8)
          without re-typing the phrase, plus the client-local label (ISC-C62).
          Mutate via add_circle / remove_circle / rename_circle. Per the M13
          remember-all decision this revises the earlier ISC-A-C2 wording that
          circle entropy is never persisted; the entropy lives encrypted under the
          at-rest blob's two-stage KDF and stays non-mnemonic-derivable (a
          mnemonic-only recovery never reconstructs the social graph). Debug surfaces
          only the count.
      - name: shares
        type: "Vec<PersistedShare>"
        description: >-
          Local share roots to re-index on the next Unlock (ISC-C21 persistence,
          M14), in insertion order. Each entry is a directory path + optional
          client-local label, serialized as a `share <hex(root)> <hex(label)>`
          directive. Mutate via add_share / remove_share / shares. Client-local
          only — no wire message carries it (ISC-A-C3); this is persistence of
          configuration, not shared content, so no-client-history holds. Debug
          surfaces only the count.
      - name: published
        type: "Vec<PublishedShare>"
        description: >-
          Published share roots to auto-republish on the next Unlock (publish-intent
          persistence), in publish order. Each entry is a directory path + an optional
          wire-facing share name, serialized additively as `publish <hex(root)>` (no
          name) or `publish <hex(root)> <hex(name)>`. Mutate via add_published /
          remove_published / published. Client-local persistence of intent only — the
          relay stays RAM-only (ISC-S20); the client re-asserts each root once
          reconnected. Debug surfaces only the count.
      - name: announce_seen
        type: "BTreeMap<String, String>"
        description: >-
          Per-relay last-seen announcements/MOTD content hash (#93 unread-gating),
          keyed by server_id -> the client-derived combined content hash (hex),
          serialized as the additive `announce-seen <server_id> <hex_hash>` directive
          (both tokens whitespace-free; a malformed line is skipped). Mutate via
          set_announce_seen / announce_seen. Client-local only — no wire message
          carries it (ISC-A-C3); persistence of read-state, not content. Debug
          surfaces only the count.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: Opened
    module: daemonseed_core::storage::seeds
    kind: struct
    description: >-
      Output of open(). legacy_v1=true signals the caller should run
      touch_reseal on next save. As of M13, also carries the at-rest AEAD key
      derived while opening (`key`) so the Unlock path can hand the running client
      a SealingKey for the write-through without a second Argon2id run.
    fields:
      - name: seeds
        type: Seeds
        description: The decrypted seeds payload.
      - name: suite_id
        type: SuiteId
        description: The suite the blob was sealed under.
      - name: legacy_v1
        type: bool
        description: True if the blob used the legacy v1 magic (re-seal recommended).
      - name: key
        type: SealingKey
        description: >-
          The at-rest AEAD key derived while opening, cached for the session so the
          M13 write-through can re-seal on each mutation without re-running
          Argon2id. The Unlock path hands this straight to the client.
      - name: index_key
        type: IndexKey
        description: >-
          The share-index key, derived as a sibling of `key` from the same
          Argon2id run via a second domain-separated HKDF-Expand (info=share-index).
          The Unlock path hands it to the client to open the redb ShareIndex for
          free — no extra Argon2id. Zeroizing; never logged/persisted.

  - name: PersistedShare
    module: daemonseed_core::storage::seeds
    kind: struct
    description: >-
      One remembered local share root in the at-rest blob (ISC-C21 persistence,
      M14). Holds the directory path and an optional client-local label; neither
      leaves the encrypted blob (ISC-A-C3). Serialized as a
      `share <hex(root)> <hex(label)>` directive (empty label hex = None).
    fields:
      - name: root
        type: String
        description: The shared directory path, as the user entered it.
      - name: label
        type: "Option<String>"
        description: Optional client-local label; None falls back to the path at render.

  - name: PublishedShare
    module: daemonseed_core::storage::seeds
    kind: struct
    description: >-
      One remembered published share root in the at-rest blob (publish-intent
      persistence). Holds the share-root path and an optional WIRE-FACING share name,
      deliberately distinct from PersistedShare.label (client-local-only, ISC-A-C3):
      the published name is the one a fetching peer sees, so it travels on the wire
      at republish. Serialized additively as `publish <hex(root)>` (name None, legacy
      form) or `publish <hex(root)> <hex(name)>`; None falls back to the root basename
      at republish. Distinct from daemonseed_tui's runtime PublishedShare, which also
      carries a relay-assigned share_id.
    fields:
      - name: root
        type: String
        description: The published share-root directory path, as the user entered it.
      - name: name
        type: "Option<String>"
        description: >-
          Optional wire-facing share name; None falls back to the root basename at
          republish (the value for every share until a name-a-share UI exists).

  - name: PersistedCircle
    module: daemonseed_core::storage::seeds
    kind: struct
    description: >-
      One remembered circle in the at-rest blob (ISC-C59 persistence, M13). Holds
      the minimum needed to rejoin without re-typing: the canonicalized circle
      entropy (the cot_key IKM, ISC-C8/C9) and the client-local label (ISC-C62).
      Neither field ever leaves the encrypted blob — no wire message carries them
      (ISC-A-C3). `entropy` is the canonicalized phrase, not the derived key, so a
      later cross-family suite change re-derives correctly. `entropy` is PRIVATE and
      held as Zeroizing<String>, so it wipes on drop and cannot be moved out: read it
      with entropy() -> &str, construct with new(entropy: impl Into<String>, label:
      impl Into<String>) -> PersistedCircle. Clone; Debug renders
      `PersistedCircle { entropy: "<redacted>", label: … }`. No PartialEq / Eq.
    security:
      contains_secret: true
      zeroize_on_drop: true
    fields:
      - name: label
        type: String
        description: >-
          Client-local circle label (ISC-C62). Never transmitted, never derived
          from members.

  - name: SealingKey
    module: daemonseed_core::storage::seeds
    kind: struct
    description: >-
      A cached at-rest AEAD key for the session write-through. Holds the
      32-byte key derived once at unlock (Opened::key) or first-start
      (SealingKey::derive) so the running client can re-seal the blob on every
      persist-worthy mutation (mute, hide, circle join/leave, rename, display-name
      change) without re-running Argon2id — which on the Pi-4 floor target would
      otherwise stall the UI for a second or more per action. The session's most
      sensitive in-RAM secret: never logged, never persisted; zeroizes on drop and
      should be dropped at logout. Clone. Methods: derive(passphrase, profile_id,
      params) -> Result<SealingKey, BlobError> (one Argon2id run; used at
      first-start), derive_session(passphrase, profile_id, params) ->
      Result<(SealingKey, IndexKey), BlobError> (M14 — both session keys from one
      Argon2id run; used at first-start so the share index key is free), and
      seal(&Seeds) -> Result<Vec<u8>, BlobError> (re-seal under the active
      write-suite using the cached key, no Argon2id), and to_bytes() ->
      Zeroizing<[u8; AEAD_KEY_LEN]> (#339 — the raw key for a record store that
      takes it by reference rather than through this type, currently
      DmPersist::open; wrapped rather than bare so the copy wipes itself without
      each caller remembering to).
      Debug renders "SealingKey(<redacted>)".

  - name: IndexKey
    module: daemonseed_core::storage::seeds
    kind: struct
    description: >-
      A cached share-index key derived as a sibling of the at-rest SealingKey
      from the *same* single Argon2id run — one expensive KDF, two domain-separated
      HKDF-Expand outputs. Opens the redb ShareIndex (storage::share_index). A
      session secret on par with the at-rest key: zeroizes on drop, never logged or
      persisted; Debug renders "IndexKey(<redacted>)". Clone. Method:
      to_bytes() -> [u8; INDEX_KEY_LEN] for ShareIndex::open (which takes the key by
      value). Obtained via Opened::index_key (unlock) or SealingKey::derive_session
      (first-start).
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: BlobError
    module: daemonseed_core::storage::seeds
    kind: enum
    description: >-
      13 variants. AuthenticationFailed is uniform across wrong-passphrase /
      wrong-profile-id / wrong-argon-params / ciphertext-tamper (constant-time-
      friendly). UnknownSuite, SuiteIdSentinel, WriteRefused are M3 additions.

  # ── storage::recovery_file ──────────────────────────────────────────
  - name: RecoveryFileContents
    module: daemonseed_core::storage::recovery_file
    kind: struct
    description: Decrypted recovery-file payload plus its cleartext-header parameters.
    fields:
      - name: mnemonic
        type: Mnemonic
        description: The recovery-root BIP-39 mnemonic.
      - name: profile_id
        type: Uuid
        description: From the file's cleartext header.
      - name: argon2
        type: ArgonParams
        description: Work factors from the cleartext header.
      - name: suite_id
        type: SuiteId
        description: AAD-bound suite identifier.
      - name: legacy_v1
        type: bool
        description: True if the file used the legacy v1 magic.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: RecoveryFileError
    module: daemonseed_core::storage::recovery_file
    kind: enum
    description: >-
      Mirrors BlobError variants plus the suite-aware additions
      (SuiteIdSentinel, UnknownSuite, WriteRefused).

  # ── storage::cas ────────────────────────────────────────────────────
  - name: ChunkAddr
    module: daemonseed_core::storage::cas
    kind: struct
    description: >-
      SHA-384(chunk) content address. Display/Debug lowercase hex; as_bytes()
      -> &[u8;48]; from_bytes([u8;48]) names a fetch target (bytes not
      re-validated — auth is on re-hash of the fetched chunk).

  - name: Unref
    module: daemonseed_core::storage::cas
    kind: enum
    description: >-
      Outcome of releasing one ref: StillReferenced{remaining: u32} or Dropped
      (last ref released, bytes gone).
    variants:
      - name: StillReferenced
        description: "StillReferenced{remaining: u32} — other refs remain; bytes kept."
      - name: Dropped
        description: Last ref released; the chunk bytes were dropped.

  - name: CasError
    module: daemonseed_core::storage::cas
    kind: enum
    description: >-
      Hash(oxicrypt_module::Error) | Io(std::io::Error) | CorruptRefcount.
      MemoryChunkStore raises only Hash (on put); FileChunkStore adds
      Io/CorruptRefcount.

  - name: ChunkStore
    module: daemonseed_core::storage::cas
    kind: trait
    description: >-
      put(&[u8])->ChunkAddr (insert-or-increment) | get(&ChunkAddr)->Option<Vec<u8>>
      | has(&ChunkAddr)->bool | unref(&ChunkAddr)->Unref. All return
      Result<_, CasError>.

  - name: MemoryChunkStore
    module: daemonseed_core::storage::cas
    kind: struct
    description: >-
      Ephemeral refcounted in-memory store — the relay backing (A-S5, leaves no
      trace). has() compares every stored addr with constant-time ct_eq, no early
      return, closing the timing side-channel (A-S2/A-S12). new() / Default.

  - name: FileChunkStore
    module: daemonseed_core::storage::cas
    kind: struct
    description: >-
      Persistent on-disk store — the client chunk cache (ISC-6, survives
      restart). open(root) creates/reopens; chunk bytes at <root>/<hex-addr>,
      refcount in adjacent <hex-addr>.rc ASCII sidecar. has() is best-effort
      only (no constant-time claim — A-S2 is a relay threat and the relay runs
      MemoryChunkStore).

  # ── cot ─────────────────────────────────────────────────────────────
  - name: AssetAddr
    module: daemonseed_core::cot
    kind: struct
    description: >-
      SHA-384(cot_key||server_id) rendezvous address. Display/Debug lowercase
      hex; as_bytes() -> &[u8;48]; from_bytes([u8;48]) names a subscribe target
      (opaque, unvalidatable by the relay).

  # ── share_serve ─────────────────────────────────────────────────────
  - name: ShareContent
    module: daemonseed_core::share_serve
    kind: struct
    description: >-
      In-RAM serve content: index_dir(root) reads every file under root into a
      MemoryChunkStore + manifest (fails fast on a bad path — never advertise
      content you cannot serve); file_count() / manifest() / answer(&ShareFrame)
      (inherent, delegates to ChunkSource::answer). Caps a share at available
      memory — the CLI/test path; both front-ends' publish path is
      DiskShareContent.

  - name: ShareManifest
    module: daemonseed_core::share_serve
    kind: struct
    description: >-
      The manifest a hash pass produces over a share root: entries:
      Vec<ManifestEntry>, one per file, in the same deterministic order as
      ShareContent::index_dir (sorted walk + full-path sort) with
      byte-identical ORDERED per-chunk SHA-384 addresses (1 MiB CHUNK_SIZE
      sub-file ranges; ManifestEntry { rel_path, size, chunks: Vec<ChunkAddr> },
      empty file = chunks []) — fetch-side verification unchanged in
      principle, now chunk-granular (ISC-S28).

  - name: DiskShareContent
    module: daemonseed_core::share_serve
    kind: struct
    description: >-
      Disk-backed serve content (ISC-C73 / A-C35): new(root, manifest)
      pairs a share root with a hashed ShareManifest (O(1) addr→(entry, chunk
      index) map built once; duplicate addrs keep the first mapping — CAS
      semantics); file_count() / manifest() / get_chunk(&ChunkAddr) ->
      Result<Vec<u8>, ServeError>. get_chunk seeks to chunk_index*CHUNK_SIZE
      in the ONE file behind the address and reads EXACTLY the chunk's
      manifest-implied length — O(CHUNK_SIZE) memory however large the file
      (the former largest-single-file transient-RAM caveat is gone) — with
      cheap fail-closed checks ONLY: a read/open error (Io), an on-disk size
      or short-read mismatch vs the manifest (ChunkModified); UnknownChunk
      for an address not in the manifest. Deliberately NO serve-time re-hash:
      the receiver's per-chunk SHA-384 re-derivation (ISC-S28) is the
      integrity guarantee — a same-size content change passes this server and
      is rejected by the fetcher; re-publish to serve intentionally changed
      content.

  - name: ChunkSource
    module: daemonseed_core::share_serve
    kind: trait
    description: >-
      The minimal content surface a serve loop needs: manifest() ->
      &[ManifestEntry] + chunk(&ChunkAddr) -> Option<Vec<u8>>, with the pure
      answer(&ShareFrame) -> Option<ShareFrame> step provided on top
      (ManifestRequest → full manifest; ChunkRequest → ChunkResponse, or no
      frame when the source cannot faithfully serve the address — never
      fabricate content, ISC-A-S21). Implemented by ShareContent and
      DiskShareContent, so a transport driver (CLI serve loop, TUI net actor)
      serves either.

  - name: ServeError
    module: daemonseed_core::share_serve
    kind: enum
    description: >-
      Why serve-side content (an index, a hash pass, or a disk-backed chunk
      read) failed. M16 added Cancelled / UnknownChunk / ChunkModified.
    variants:
      - name: Io
        description: "Io(std::io::Error) — reading a file under the share root failed."
      - name: Cas
        description: "Cas(CasError) — hashing failed (oxicrypt SHA-384 self-test not passed)."
      - name: Cancelled
        description: The hash pass was cancelled via its flag (checked between files AND between chunks of a large file; no partial manifest).
      - name: UnknownChunk
        description: A requested chunk address is not in this content's manifest.
      - name: ChunkModified
        description: >-
          ChunkModified { rel_path } — a share file's on-disk length no
          longer matches its manifest entry, or a chunk-range read came up
          short (truncated/grew since hashing); fails closed, never a
          knowingly mismatched frame on the wire.

  # ── storage::share_index ────────────────────────────────────────────
  - name: ShareEntry
    module: daemonseed_core::storage::share_index
    kind: struct
    description: One shared-file index record (the logical, decrypted view).
    fields:
      - name: rel_path
        type: String
        description: Path relative to the share root.
      - name: size
        type: u64
        description: File size in bytes.
      - name: mtime_unix_ms
        type: u64
        description: Modification time in Unix milliseconds.
      - name: chunk_addrs
        type: "Option<Vec<u8>>"
        description: >-
          Cached content addresses from the last hash pass (ISC-C73):
          the ORDERED concatenation of the file's per-chunk 48-byte SHA-384
          addresses (len % 48 == 0, len/48 == ceil(size/CHUNK_SIZE);
          Some(empty) = hashed empty file, distinct from None = never
          hashed / metadata-only scan). Valid only while size and
          mtime_unix_ms still match the file; a change event or rescan
          writes None so a stale address never survives.

  - name: ShareIndex
    module: daemonseed_core::storage::share_index
    kind: struct
    description: >-
      Open encrypted index over a redb file; holds a Zeroizing<[u8;32]> index
      key. open(path, key) creates/reopens. Incremental ops: put / get(rel_path)
      / remove(rel_path) / len / is_empty / entries() (decrypts all, paths come
      from values not keys) / clear() (M16 — drop + re-create the table in one
      write txn; the clear-then-rescan move for a wholesale root change).
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: IndexError
    module: daemonseed_core::storage::share_index
    kind: enum
    description: >-
      Crypto = AES-GCM init/seal/open failure incl. tamper auth-fail (fails
      closed, never garbage). A wrong key can't even locate entries (keyed
      opaque key) -> get returns Ok(None).
    variants:
      - name: Db
        description: "Db(Box<redb::Error>) — underlying redb storage error."
      - name: Crypto
        description: AES-GCM init/seal/open failure including tamper auth-fail.
      - name: Corrupt
        description: A stored value could not be decoded after decryption.
      - name: Entropy
        description: CSPRNG nonce generation failed.

  # ── indexer ─────────────────────────────────────────────────────────
  - name: FsEvent
    module: daemonseed_core::indexer
    kind: enum
    description: >-
      Unit of incremental update. An Upserted for a vanished path folds to a
      removal (watchers don't guarantee ordering).
    variants:
      - name: Upserted
        description: Upserted(PathBuf) — a file was created or modified.
      - name: Removed
        description: Removed(PathBuf) — a file was deleted.

  - name: Indexer
    module: daemonseed_core::indexer
    kind: struct
    description: "ShareIndex + share root. new(index, root); index() borrows for queries."

  - name: ShareWatcher
    module: daemonseed_core::indexer
    kind: struct
    description: >-
      Live recursive filesystem watch (notify RecommendedWatcher). watch(root)
      -> (ShareWatcher, Receiver<FsEvent>); holds the watcher alive (drop = stop);
      events feed apply_event (ISC-20).

  - name: WatchError
    module: daemonseed_core::indexer
    kind: enum
    description: >-
      Limit = OS watch limit exceeded (fs.inotify.max_user_watches) — surfaced
      (ISC-21); caller falls back to mtime_rescan.
    variants:
      - name: Limit
        description: OS watch limit exceeded; caller drops to mtime_rescan.
      - name: Io
        description: "Io(notify::Error) — underlying watch error."

  - name: ScanHandle
    module: daemonseed_core::indexer
    kind: struct
    description: >-
      Handle to a running background cold-scan. join() -> Result<usize,
      IndexError> waits + returns the count; drop detaches.

  - name: CachedHashError
    module: daemonseed_core::indexer
    kind: enum
    description: >-
      Why a cached_or_hash pass failed — it spans two domains.
    variants:
      - name: Index
        description: "Index(IndexError) — reading/writing the chunk-addr cache failed."
      - name: Serve
        description: >-
          Serve(ServeError) — the hash pass failed: I/O, hashing, or
          cancellation (ServeError::Cancelled arrives wrapped here).

  # ── storage::fetched ────────────────────────────────────────────────
  - name: FetchedFile
    module: daemonseed_core::storage::fetched
    kind: struct
    description: >-
      One downloaded file inside a FetchedShare. rel_path is the sharer's
      wire path (untrusted; validated at write time — only Normal path
      components survive, ISC-A-C32). size is bytes. The file's bytes are
      already on disk at `<root>/<share.folder>/<rel_path>` — no CAS address,
      no hex filename; the file is directly accessible under its real name.
    fields:
      - name: rel_path
        type: String
        description: The file's path relative to the share's download folder (`/`-separated; real name on disk).
      - name: size
        type: u64
        description: The file's size in bytes.

  - name: FetchedShare
    module: daemonseed_core::storage::fetched
    kind: struct
    description: >-
      One fetched share's manifest record. share_id is the server-assigned
      opaque id (ISC-S21); name is the sharer-advertised display name;
      folder is the single safe path component under the downloads root where
      the files landed (derived from name, collision-suffixed by share_id if
      needed); files is the per-file inventory. total_bytes() sums file sizes.
    fields:
      - name: share_id
        type: String
        description: Server-assigned opaque share id (ISC-S21).
      - name: name
        type: String
        description: Sharer-advertised display name.
      - name: folder
        type: String
        description: >-
          The single safe path component under the downloads root where this
          share's files landed (e.g. "My Photos" or "Vacation-bb3a1f"). Derived
          from name; collision-suffixed by the first 6 chars of share_id when
          another share already occupies the same folder (ISC-A-C32).
      - name: files
        type: "Vec<FetchedFile>"
        description: One entry per downloaded file.

  - name: VerifiedFile
    module: daemonseed_core::storage::fetched
    kind: struct
    description: >-
      One file's verified plaintext bytes, ready to persist. The caller
      (net actor) produces this after the fetch has verified every chunk;
      FetchedStore::record_share writes the bytes under the file's real name
      into the share folder (named files, no CAS layer — M15 cleanup).
    fields:
      - name: rel_path
        type: String
        description: Wire rel_path (untrusted; sanitised before write).
      - name: bytes
        type: "Vec<u8>"
        description: Verified plaintext file bytes.

  - name: SelectionRoot
    module: daemonseed_core::storage::fetched
    kind: enum
    description: >-
      A node the user toggled in the fetch-preview tree (ISC-C72) — what
      place_at_dest is a total function of. Share-relative, `/`-separated.
    variants:
      - name: File
        description: "File(String) — a single selected file's share rel_path."
      - name: Dir
        description: "Dir(String) — a selected directory subtree; the empty string is the whole share."

  - name: PlacedFile
    module: daemonseed_core::storage::fetched
    kind: struct
    description: Where one selected file lands — its share rel_path and its guard-checked path relative to the chosen destination.
    fields:
      - name: share_rel
        type: String
        description: The file's share-relative rel_path (what to fetch).
      - name: dest_rel
        type: String
        description: Where it lands, relative to the chosen destination (`/`-separated).

  - name: StagingArea
    module: daemonseed_core::storage::fetched
    kind: struct
    description: >-
      A download's reserved staging quarantine at `<root>/.dspart/<share_id>/`.
      open(root, share_id); preallocate(final_rel, size) pre-sizes a sparse file;
      write_verified_chunk(final_rel, offset, bytes) positional-writes a verified
      chunk at its manifest offset (concurrent chunks at distinct offsets are
      race-free); promote(final_rel) moves a completed file to `<root>/<final_rel>`
      no-clobber (first free name/name-N, suffix before extension); destroy() erases
      the whole area (integrity abort / post-completion). The reserved `.dspart`
      component is refused by sanitize_rel_path. persist_manifest(manifest:
      &[ManifestEntry]) stores the confirmed manifest (deterministic canonical
      serialization) under the reserved `.dspart` component so no staged file can
      collide with it; read_stored_manifest() -> Vec<ManifestEntry> reads it back,
      fail-closed (missing/unparseable is a typed error, never a silent empty). A
      resume verifies the stored copy via verify_stored_manifest before reuse.
      has_verified_progress() -> bool is true once >=1 verified chunk was staged (a
      progress marker in the reserved sidecar); the start-of-download sweep keeps a
      resumable area only WITH progress, reclaiming a preallocated-but-empty failure.

  - name: ManifestDigestStore
    module: daemonseed_core::storage::manifest_digest
    kind: struct
    description: >-
      A profile-local redb store mapping share_id to the confirmed manifest's
      48-byte SHA-384 digest — the client's own trusted anchor a verified resume
      checks the staging manifest against (DL-ISC-20), kept under the profile dir
      (not the co-resident-writable downloads root). open(path); record_digest(
      share_id, &[u8; 48]) inserts/replaces; get_digest(share_id) -> Option<[u8; 48]>
      (Corrupt if a stored value is not 48 bytes); remove(share_id). The value is a
      bare digest, unencrypted (integrity anchoring, not confidentiality). Table
      `download-manifest-digests-v1`.

  - name: DigestStoreError
    module: daemonseed_core::storage::manifest_digest
    kind: enum
    description: Why a ManifestDigestStore operation failed.
    variants:
      - name: Db
        description: "Db(Box<redb::Error>) — a redb storage/transaction/table error."
      - name: Corrupt
        description: >-
          A stored value was not exactly 48 bytes — a corrupt store or an
          incompatible-version value; fails closed rather than returning a
          truncated digest.

  - name: ResumePlan
    module: daemonseed_core::storage::fetched
    kind: struct
    description: >-
      A resume's per-file plan (files: Vec<FileResume>, one per manifest file in
      order), produced by derive_resume_state. is_complete() (every file complete);
      verified_chunk_count() / missing_chunk_count() (totals across files, feeding
      resumed progress).

  - name: FileResume
    module: daemonseed_core::storage::fetched
    kind: struct
    description: >-
      One file's resume state re-derived from bytes on disk: rel_path (the
      placement-resolved on-disk path), size, total_chunks, verified (Vec<usize>
      chunk indices that re-verify on disk, sorted), missing (Vec<usize> to
      re-fetch, sorted). verified/missing partition 0..total_chunks as a SET (no
      prefix assumption). is_complete() iff every chunk verified.

  - name: LiveFetchRegistry
    module: daemonseed_core::storage::fetched
    kind: struct
    description: >-
      The set of share_ids whose fetches are in-flight or resuming in this
      process (cheap-to-clone shared set). register(share_id) returns a
      LiveFetchGuard that unregisters on drop; is_active(share_id) queries it.
      sweep_staging consults it so a registered fetch's staging is never reclaimed.

  - name: LiveFetchGuard
    module: daemonseed_core::storage::fetched
    kind: struct
    description: Keeps a share_id registered as an active fetch for its lifetime; unregisters on drop.

  - name: FetchedError
    module: daemonseed_core::storage::fetched
    kind: enum
    description: Why a FetchedStore operation failed.
    variants:
      - name: Io
        description: "Io(std::io::Error) — filesystem I/O failed."
      - name: Corrupt
        description: >-
          Corrupt(String) — the manifest (`downloads.idx`) is unparseable or
          otherwise malformed.
      - name: UnsafePath
        description: >-
          UnsafePath(String) — writing a file was refused because its rel_path
          escapes the share folder via `..`, an absolute path, or a non-Normal
          path component (ISC-A-C32). Nothing is written for the offending entry.

  - name: FetchedStore
    module: daemonseed_core::storage::fetched
    kind: struct
    description: >-
      The on-disk store of fetched share content — named files under per-share
      folders. Open once with FetchedStore::open(root); record_share(share_id,
      name, files: &[VerifiedFile]) -> FetchedShare persists a completed fetch
      by writing each file's bytes to `<root>/<folder>/<rel_path>` and
      appending a record to the manifest (ISC-C63 / A-C31);
      list_shares() -> Vec<FetchedShare> enumerates downloads for the browse
      view (ISC-C64); share_dir(&self, &FetchedShare) -> PathBuf returns the
      absolute path of the share's folder. There is no extract step — files are
      already on disk under their real names. Layout: `<root>/<share-name>/`
      (per-share named-file trees) + `<root>/downloads.idx` (the line-based
      manifest; no `<root>/cas/`, no hex names, no `.rc` sidecars).

  # ── first_start ─────────────────────────────────────────────────────
  - name: "FirstStart<S>"
    module: daemonseed_core::first_start
    kind: struct
    description: >-
      Generic over phase. Each phase exposes only the methods valid in that
      phase. Welcome / Sealed / BackupVerified / Ready are uninhabited marker
      types used as the S parameter. Two entry paths from Welcome: initialize()
      generates a fresh mnemonic (cold enrollment); recover() accepts a mnemonic
      the user already holds — typed 24 words or decrypted from a .dseed — and
      lands directly in BackupVerified (clean-device recovery, gate step 8).
      recover() mints a fresh local profile_id but re-derives the same identity
      handle from the mnemonic (identity is profile_id-independent); it does not
      recover circle-of-trust seeds (ISC-A-C2).

  - name: FirstStartError
    module: daemonseed_core::first_start
    kind: enum
    description: Passphrase-too-weak / seed-failed / display-name-invalid / etc.

  - name: SessionMaterials
    module: daemonseed_core::first_start
    kind: struct
    description: >-
      What Ready::into_session_materials() yields — caller persists these and
      hands off to the wire layer.
    fields:
      - name: profile_config
        type: ProfileConfig
        description: The fresh profile config (profile_id, argon2 params, feature flags).
      - name: at_rest_blob_bytes
        type: "Vec<u8>"
        description: The sealed at-rest seeds blob (write to seeds.blob).
      - name: recovery_file_bytes
        type: "Vec<u8>"
        description: The sealed .dseed recovery file (write to identity.dseed).
      - name: display_name
        type: "Option<String>"
        description: The chosen display name (None → floor handle).
      - name: handle
        type: Handle
        description: >-
          The daemon's own handle (name#hash) — the chosen display name attached
          to the SHA-384 of the identity ML-DSA-87 pubkey (derived during
          initialize, while the mnemonic was present). The full handle the
          client uses as its chat sender identity and for self-@mention
          detection (ISC-C4 / C17), distinct from display_name (name part only).
      - name: bootstrap
        type: BootstrapAnchor
        description: The selected initial federation peer.
      - name: seeds
        type: Seeds
        description: >-
          The live at-rest payload the running client mutates and re-seals for the
          M13 write-through (display name, mute/hide, circles, M14 shares). At
          first-start it carries the chosen display name; on Unlock it is the
          decrypted on-disk payload (Opened::seeds).
      - name: seal_key
        type: SealingKey
        description: >-
          The cached at-rest AEAD key matching the blob `seeds` seals into, so
          the client re-seals on each mutation without re-running Argon2id. Zeroizing.
      - name: index_key
        type: IndexKey
        description: >-
          The cached share-index key, derived as a sibling of seal_key from the
          same Argon2id run, used to open the redb ShareIndex and activate the M8
          indexer against TUI-defined share roots. Zeroizing.

  - name: TypeBackChallenge
    module: daemonseed_core::first_start
    kind: struct
    description: >-
      Carries the sampled positions + the expected words (private). matches()
      does whitespace+case-tolerant comparison.

  # ── bootstrap ───────────────────────────────────────────────────────
  - name: BootstrapAnchor
    module: daemonseed_core::bootstrap
    kind: struct
    description: What gets persisted to daemonseed.toml as the initial federation peer.
    fields:
      - name: server_id
        type: String
        description: The peer server identifier.
      - name: address
        type: String
        description: The peer network address.

  - name: BundledAnchor
    module: daemonseed_core::bootstrap
    kind: struct
    description: >-
      Compile-time-embedded canonical anchor. None at M3 (placeholder); a real
      value lands once the project stands up its public relay.
    fields:
      - name: canonical
        type: "Option<BootstrapAnchor>"
        description: The bundled canonical anchor, or None during the placeholder phase.

  # ── crypto::suite ───────────────────────────────────────────────────
  - name: SuiteId
    module: daemonseed_core::crypto::suite
    kind: struct
    description: >-
      u16 newtype. try_new rejects sentinels at parse time. Display is `0xNNNN`
      uppercase hex.

  - name: SuiteIdError
    module: daemonseed_core::crypto::suite
    kind: enum
    description: Parse-time rejection of a reserved sentinel suite id.
    variants:
      - name: Sentinel
        description: "Sentinel(u16) — the raw value is a reserved sentinel (0x0000 or 0xFFFF)."

  - name: Aead
    module: daemonseed_core::crypto::suite
    kind: enum
    description: AEAD primitive of a suite.
    variants:
      - name: Aes256Gcm
        description: AES-256-GCM.

  - name: Kem
    module: daemonseed_core::crypto::suite
    kind: enum
    description: KEM primitive of a suite.
    variants:
      - name: MlKem1024
        description: ML-KEM-1024.

  - name: Sig
    module: daemonseed_core::crypto::suite
    kind: enum
    description: Signature primitive of a suite.
    variants:
      - name: MlDsa87
        description: ML-DSA-87.

  - name: Hash
    module: daemonseed_core::crypto::suite
    kind: enum
    description: Hash primitive of a suite.
    variants:
      - name: Sha256
        description: SHA-256.

  - name: Kdf
    module: daemonseed_core::crypto::suite
    kind: enum
    description: KDF primitive of a suite.
    variants:
      - name: HkdfSha256
        description: HKDF-SHA-256.

  - name: MemoryHard
    module: daemonseed_core::crypto::suite
    kind: enum
    description: Memory-hard KDF primitive of a suite.
    variants:
      - name: Argon2id
        description: Argon2id.

  - name: LifecycleState
    module: daemonseed_core::crypto::suite
    kind: enum
    description: Matches ds-suite-registry.md lifecycle table.
    variants:
      - name: Proposed
        description: Registered but not yet active for writes.
      - name: ActiveWrite
        description: Active and selected for new writes.
      - name: ActiveReadOnly
        description: Still readable, no longer chosen for writes.
      - name: ReadOnlyDeprecated
        description: Deprecated; reads accepted, writes refused.
      - name: Removed
        description: Removed; neither read nor write.

  - name: Suite
    module: daemonseed_core::crypto::suite
    kind: struct
    description: Bundle definition. Const-constructible.
    fields:
      - name: id
        type: SuiteId
        description: The suite identifier.
      - name: aead
        type: Aead
        description: The AEAD primitive.
      - name: kem
        type: Kem
        description: The KEM primitive.
      - name: sig
        type: Sig
        description: The signature primitive.
      - name: hash
        type: Hash
        description: The hash primitive.
      - name: kdf
        type: Kdf
        description: The KDF primitive.
      - name: memory_hard
        type: MemoryHard
        description: The memory-hard KDF primitive.
      - name: state
        type: LifecycleState
        description: The lifecycle state driving write-policy.

  - name: Registry
    module: daemonseed_core::crypto::suite
    kind: struct
    description: Zero-sized convenience handle over the static REGISTRY slice.

  - name: WriteRefusal
    module: daemonseed_core::crypto::suite
    kind: enum
    description: Why a suite was refused for writing.
    variants:
      - name: Unknown
        description: "Unknown(SuiteId) — not in the registry."
      - name: Proposed
        description: "Proposed(SuiteId) — registered but not yet active for writes."
      - name: ActiveReadOnly
        description: "ActiveReadOnly(SuiteId) — readable only, not write-selectable."
      - name: Deprecated
        description: "Deprecated(SuiteId) — deprecated read-only."
      - name: Removed
        description: "Removed(SuiteId) — removed entirely."

  # ── crypto::policy ──────────────────────────────────────────────────
  - name: WritePolicy
    module: daemonseed_core::crypto::policy
    kind: enum
    description: >-
      Allow is test-only. RefuseRemoved is reserved for M7 operator-config use.
      Default is RefuseDeprecated (the ISC-A-C8 client invariant).
    variants:
      - name: Allow
        description: Test-only — permits any lifecycle state.
      - name: RefuseDeprecated
        description: Default — refuses deprecated/removed/non-active-write states.
      - name: RefuseRemoved
        description: Reserved for M7 operator config — refuses only removed suites.

  # ── version ─────────────────────────────────────────────────────────
  - name: ProtocolVersion
    module: daemonseed_core::version
    kind: struct
    description: PATCH deliberately absent per ISC-S14.
    fields:
      - name: major
        type: u16
        description: Major protocol version.
      - name: minor
        type: u16
        description: Minor protocol version (MINOR bumps append additively).

  - name: NegotiationError
    module: daemonseed_core::version
    kind: enum
    description: Version-negotiation failure modes.
    variants:
      - name: NoCommonVersion
        description: "NoCommonVersion{peer_supported} — no mutually supported version."
      - name: OutOfSetAck
        description: "OutOfSetAck{claimed} — peer ACKed a version not in the offered set."
      - name: ZeroRttForbidden
        description: Application data arrived before negotiation completed.
      - name: MalformedPeerOffer
        description: "MalformedPeerOffer(VersionError) — a wire offer failed to decode."

  - name: VersionError
    module: daemonseed_core::version
    kind: enum
    description: Surfaces inside MalformedPeerOffer when wire u32 exceeds u16::MAX.
    variants:
      - name: OutOfRange
        description: "OutOfRange{field, value} — a wire field exceeds the u16 in-memory range."

  - name: VersionNegotiator
    module: daemonseed_core::version
    kind: trait
    description: >-
      Sealed at the daemonseed level — implementations live here. `select` and
      `verify_ack` have default impls.

  - name: DefaultNegotiator
    module: daemonseed_core::version
    kind: struct
    description: Unit struct; offers exactly SUPPORTED. Used by both client and server in MVP.

  # ── connection ──────────────────────────────────────────────────────
  - name: "Connection<S, T>"
    module: daemonseed_core::connection
    kind: struct
    description: >-
      Type-state connection wrapper. All state transitions consume `self`;
      prior-state values drop at the type level. S: ConnState marker
      (Negotiating / Versioned / Authenticated); T: Transport.
    fields:
      - name: transport
        type: T
        description: The underlying transport.
      - name: _state
        type: "PhantomData<fn() -> S>"
        description: Zero-sized type-state marker.

  - name: Transport
    module: daemonseed_core::connection
    kind: trait
    description: >-
      Marker trait. Blanket impl for any T: AsyncRead + AsyncWrite + Send +
      Unpin + 'static. No daemonseed-side glue needed for a concrete stream.

  - name: ConnState
    module: daemonseed_core::connection
    kind: trait
    description: "Sealed via private::Sealed — third parties cannot introduce new states. (state submodule.)"

  - name: Negotiating
    module: daemonseed_core::connection
    kind: enum
    description: Uninhabited marker. Pre-APP_HELLO state; no I/O exposed. (state submodule.)

  - name: Versioned
    module: daemonseed_core::connection
    kind: enum
    description: >-
      Uninhabited marker. Post-APP_HELLO_ACK state; exposes transport_mut() for
      identity-proof envelope I/O. Does NOT impl AsyncRead/AsyncWrite. (state
      submodule.)

  - name: Authenticated
    module: daemonseed_core::connection
    kind: enum
    description: >-
      Uninhabited marker. Connection<Authenticated, T> impls AsyncRead +
      AsyncWrite (delegating to the transport) — the only state that exposes
      application I/O. (state submodule.)

  # ── federation::trust ───────────────────────────────────────────────
  - name: TrustMode
    module: daemonseed_core::federation::trust
    kind: enum
    description: >-
      Serde lowercase. Default = Trusted (ISC-C22 default for new servers).
      Local config — never on the wire (ISC-A-S6).
    variants:
      - name: Trusted
        description: TOFU on first contact, pin-compare after, rotation surfaced.
      - name: Untrusted
        description: Byte-exact pre-configured key; any mismatch is refused.

  - name: TrustDecision
    module: daemonseed_core::federation::trust
    kind: enum
    description: Refuse is fail-closed (ISC-45).
    variants:
      - name: Accept
        description: The presented key is accepted.
      - name: AcceptWithRotation
        description: "AcceptWithRotation{fingerprint: String} — accepted, rotation surfaced."
      - name: Refuse
        description: Fail-closed refusal.

  - name: "TrustQuery<'a>"
    module: daemonseed_core::federation::trust
    kind: struct
    description: >-
      Inputs: mode, expected_prefix, presented_pubkey, presented_prefix,
      pinned_key, configured_key, rotation_dismissed.

  # ── federation::store ───────────────────────────────────────────────
  - name: ServerEntry
    module: daemonseed_core::federation::store
    kind: struct
    description: Constructors new_trusted / new_untrusted.
    fields:
      - name: server_id
        type: Handle
        description: The peer server identifier.
      - name: address
        type: String
        description: The peer network address.
      - name: mode
        type: TrustMode
        description: Configured trust mode for this server.
      - name: pinned_key
        type: "Option<Vec<u8>>"
        description: The TOFU-pinned key, once observed.
      - name: configured_key
        type: "Option<Vec<u8>>"
        description: The pre-configured key (untrusted mode).
      - name: rotation_dismissed
        type: bool
        description: Whether the user dismissed the last rotation notice.

  - name: TrustStore
    module: daemonseed_core::federation::store
    kind: trait
    description: "get / upsert / set_pin / dismiss_rotation."

  - name: InMemoryTrustStore
    module: daemonseed_core::federation::store
    kind: struct
    description: "HashMap-backed, keyed by server-id string. M5 default; not persisted."

  # ── circle ──────────────────────────────────────────────────────────
  - name: CircleKey
    module: daemonseed_core::circle::key
    kind: struct
    description: >-
      A derived 32-byte circle symmetric key (AES-256-GCM). ZeroizeOnDrop;
      Debug is redacted to `CircleKey(<redacted>)` per ISC-A-C1. Implements
      AeadKey256. as_bytes borrows the raw key; from_bytes wraps raw bytes into
      a zeroizing CircleKey.
    implements: [AeadKey256]
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: AeadKey256
    module: daemonseed_core::circle::key
    kind: trait
    description: >-
      A 32-byte AEAD key abstraction implemented by both CircleKey and
      PublicRoomKey, so a tier-agnostic open path accepts either tier's key
      while seal sites stay type-split per tier. aead_key_bytes borrows the raw
      32-byte key.

  - name: CircleKeyError
    module: daemonseed_core::circle::key
    kind: enum
    description: Failure modes for derive_cot_key and derive_circle_veilid_owner_seed.
    variants:
      - name: Hkdf
        description: "Hkdf(oxicrypt_kdf::KdfError) — HKDF derivation failed."

  - name: VeilidNodeSeed
    module: daemonseed_core::identity::keys
    kind: struct
    description: >-
      The Veilid node identity seed (D3), 32 bytes held inline. Derived from the
      identity mnemonic under a domain-separated HKDF label, so one recovery
      phrase yields one identity across the content and transport layers. Not
      Clone; ZeroizeOnDrop; Debug redacted to `VeilidNodeSeed(<redacted>)`. The
      bytes are reached only through with_bytes.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: CircleVeilidOwnerSeed
    module: daemonseed_core::circle::key
    kind: struct
    description: >-
      A circle's deterministic 32-byte Veilid rendezvous-owner seed (VLD0 /
      Ed25519). A sibling of CircleKey from the same circle PRK under a distinct
      label, so the DHT rendezvous address is not a function of the content key.
      Every member derives the same seed, hence the same DHT record key.
      ZeroizeOnDrop; Debug redacted to `CircleVeilidOwnerSeed(<redacted>)`.
      as_bytes borrows the raw seed.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: RoomVeilidOwnerSeed
    module: daemonseed_core::public_room
    kind: struct
    description: >-
      A public room's deterministic 32-byte Veilid rendezvous-owner seed (VLD0 /
      Ed25519). A sibling of PublicRoomKey from the same public-room PRK under a
      distinct label, so the DHT rendezvous address is not a function of the room
      key. World-derivable (room name + family are public), so every participant
      derives the same seed and hence the same DHT record key — the lobby/public
      room is an open rendezvous. ZeroizeOnDrop; Debug redacted to
      `RoomVeilidOwnerSeed(<redacted>)`. as_bytes borrows the raw seed.
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: MessageError
    module: daemonseed_core::circle::message
    kind: enum
    description: >-
      Failure modes for seal_message / open_message. Authentication (wrong
      cot_key or tamper) carries no sub-cause — fail closed.
    variants:
      - name: KeyInit
        description: "KeyInit(oxicrypt_module::Error) — AES-256 key schedule init failed."
      - name: EntropySource
        description: "EntropySource(getrandom::Error) — OS entropy failed drawing the nonce."
      - name: Aead
        description: "Aead(oxicrypt_aes::ModeError) — non-TagMismatch AEAD error."
      - name: Authentication
        description: "Wrong cot_key, tampered ciphertext, swapped nonce, or wrong AAD."
      - name: Truncated
        description: "Sealed buffer shorter than nonce||tag."
      - name: Decode
        description: "Decode(prost::DecodeError) — decrypted bytes are not a RoomMessage."

  # ── public_space ────────────────────────────────────────────────────
  - name: ContentAddress
    module: daemonseed_core::public_space
    kind: struct
    description: >-
      SHA-384(signed_payload) (ISC-17). Derived, never trusted off the wire
      (ISC-A-S3). Display/Debug are lowercase hex; as_bytes() -> &[u8;48].

  - name: WhitelistEntry
    module: daemonseed_core::public_space
    kind: enum
    description: >-
      Operator signer-whitelist entry (ISC-S8). FromStr parses one line: a `#`
      => handle form (ISC-11), else hex full key (ISC-10). Debug redacts the key
      bytes.
    variants:
      - name: FullKey
        description: "FullKey(Box<[u8; PK_LEN]>) — a full ML-DSA-87 public key."
      - name: Handle
        description: "Handle(Handle) — a handle whose hash-prefix authorizes a signer."

  - name: WhitelistParseError
    module: daemonseed_core::public_space
    kind: enum
    description: >-
      A malformed line is a hard error — never silently dropped, so an operator
      typo cannot quietly de-authorize a signer.
    variants:
      - name: Handle
        description: "Handle(HandleParseError) — the handle form failed to parse."
      - name: InvalidPubkeyHex
        description: The full-key form was not valid hex.
      - name: WrongPubkeyLength
        description: "WrongPubkeyLength{found, expected} — decoded key was the wrong length."

  - name: Whitelist
    module: daemonseed_core::public_space
    kind: struct
    description: >-
      Operator entries plus the always-present, file-non-removable project-announce
      entry. authorizes() is the cheap gate before any signature work.

  - name: ArtifactError
    module: daemonseed_core::public_space
    kind: enum
    description: >-
      verify_artifact failure modes. The server maps UnknownSigner +
      BadSignature to one opaque gRPC reject (no which-check oracle).
    variants:
      - name: UnknownSigner
        description: The signer is not authorized by the whitelist.
      - name: BadSignature
        description: The ML-DSA-87 signature did not verify.
      - name: Module
        description: "Module(oxicrypt_module::Error) — underlying crypto-module error."

  # ── crypto::deprecation ─────────────────────────────────────────────
  - name: DeprecationEntry
    module: daemonseed_core::crypto::deprecation
    kind: struct
    description: One per-suite deprecation row.
    fields:
      - name: suite_id
        type: SuiteId
        description: The suite being deprecated.
      - name: cutoff_unix_ms
        type: u64
        description: When the suite stops being accepted (Unix ms).
      - name: recommended_suite_id
        type: SuiteId
        description: The suggested migration target.

  - name: DeprecationPolicy
    module: daemonseed_core::crypto::deprecation
    kind: struct
    description: >-
      Monotonic policy_version + signed_timestamp + entries.
      build/from_signed_payload/to_signed_payload; entry_for /
      is_past_cutoff(now) / affected(in_use).

  - name: PolicyError
    module: daemonseed_core::crypto::deprecation
    kind: enum
    description: >-
      Build/parse/verify failure modes (malformed, cutoff-lead too short, bad
      signature, rollback).

  - name: PolicyCache
    module: daemonseed_core::crypto::deprecation
    kind: struct
    description: >-
      Per-server TTL'd cache. insert / cached_version / fresh(now) /
      is_stale(now) / earliest_cutoff(suite). Rollback to an older version is
      rejected.

  # ── trust_events ────────────────────────────────────────────────────
  - name: TrustEventClass
    module: daemonseed_core::trust_events
    kind: enum
    description: Implementations MUST NOT invent sub-classes.
    variants:
      - name: Blocking
        description: Blocks the affected operation until resolved.
      - name: PersistentNonBlocking
        description: Persisted, surfaced, but does not block.
      - name: Transient
        description: Ephemeral; dropped from the bounded log (A-C12 asymmetry).
      - name: LogOnly
        description: Recorded for audit only.

  - name: TrustEventKey
    module: daemonseed_core::trust_events
    kind: enum
    description: >-
      Closed wire-stability surface (append-only). Includes the M10 update keys
      UpdateVerificationFailed (Blocking), EmergencySecurityUpdateAvailable
      (Blocking), UpdateRelayFallbackUsed (Transient) — added at M7, consumed by
      the M10 update FSM.

  - name: TrustEvent
    module: daemonseed_core::trust_events
    kind: struct
    description: >-
      One log tuple: timestamp, key, optional server_id, optional suite_id,
      optional record_kind, resolution, dismissed_at. observed() builds one with
      no record_kind; TrustEventScope::observed_at builds one with.

  - name: TrustEventScope
    module: daemonseed_core::trust_events
    kind: struct
    description: >-
      A key plus the RecordKind it concerns, if any. bare(key) and
      for_record(key, kind) construct; observed_at(timestamp, server_id,
      suite_id) yields the TrustEvent. DmStoreError::event returns one.

  - name: TrustEventLog
    module: daemonseed_core::trust_events
    kind: struct
    description: >-
      Bounded (DEFAULT_LOG_CAP) in-memory log. append (drops Transient — the
      A-C12 asymmetry), entries, prune_to, dismiss (per (key, scope), never
      global), unreadable_entries (count of persisted entries whose event key
      this build does not know; open_log steps over them).

  - name: DismissalScope
    module: daemonseed_core::trust_events
    kind: struct
    description: >-
      The contextual scope a dismissal applies to (A-C12): server_id, suite_id,
      record_kind. Every field matches by equality; None is a value, not a
      wildcard.
    fields:
      - name: server_id
        type: Option<String>
        description: Server-id the dismissal is scoped to.
      - name: suite_id
        type: Option<SuiteId>
        description: Suite-id the dismissal is scoped to.
      - name: record_kind
        type: Option<RecordKind>
        description: Kind of record the dismissal is scoped to.

  # ── dm::spent_store ─────────────────────────────────────────────────
  - name: SpentStoreError
    module: daemonseed_core::dm::spent_store
    kind: enum
    description: >-
      Argon2, Hkdf, AesKeyInit, AesMode, AuthenticationFailed, EntropySource,
      Malformed.

  # ── backoff ─────────────────────────────────────────────────────────
  - name: CloseCause
    module: daemonseed_core::backoff
    kind: enum
    description: >-
      Network / pre-HELLO_ACK / post-auth layering. user_message() never
      speculates which budget tripped (A-S12).

  # ── mention ─────────────────────────────────────────────────────────
  - name: MentionResolution
    module: daemonseed_core::mention
    kind: enum
    description: >-
      Result of resolving a typed token; an explicit full handle bypasses
      autocomplete.
    variants:
      - name: Resolved
        description: "Resolved(Handle) — exactly one match."
      - name: Ambiguous
        description: "Ambiguous(Vec<Handle>) — several scope matches."
      - name: NotFound
        description: No scope match.

  # ── release ─────────────────────────────────────────────────────────
  - name: ReleaseAnchor
    module: daemonseed_core::release
    kind: struct
    description: >-
      Ordered ML-DSA-87 release-signing key set + N-of-M threshold. new(keys,
      threshold) rejects a degenerate anchor (AnchorError::{NoKeys,
      ThresholdOutOfRange}); threshold()/keys().

  - name: ReleaseKey
    module: daemonseed_core::release
    kind: struct
    description: >-
      Wraps a boxed [u8; PK_LEN] release-signing pubkey. new(pubkey)/public_key().
      Debug shows a 4-byte prefix only.

  - name: BundledReleaseAnchor
    module: daemonseed_core::release
    kind: struct
    description: >-
      Schema for the include_str!'d release_anchor.toml: version, threshold, hex
      keys (empty pre-public). to_anchor() -> Option<ReleaseAnchor> (None until a
      real key is bundled). bundled() -> &'static.

  - name: ReleaseVerifyError
    module: daemonseed_core::release
    kind: enum
    description: Local diagnostic only — feeds the A-C11 failure log, never on the wire.
    variants:
      - name: BelowThreshold
        description: "BelowThreshold{required, valid} — fewer than threshold distinct valid signatures."
      - name: UnrecognizedSignature
        description: A signature did not match any anchor key.
      - name: MalformedSignature
        description: A signature blob was the wrong length / unparseable.
      - name: Module
        description: Underlying oxicrypt-module error.

  - name: UpdateChannel
    module: daemonseed_core::release
    kind: enum
    description: RelayFallback is no more trusted than Primary — verify is anchor-based regardless.
    variants:
      - name: Primary
        description: The primary update channel.
      - name: RelayFallback
        description: Relay fallback channel; no extra trust.

  - name: ReleaseVersion
    module: daemonseed_core::release
    kind: struct
    description: Binary SemVer with Ord (distinct from the wire ProtocolVersion). new().
    fields:
      - name: major
        type: u64
        description: Major version.
      - name: minor
        type: u64
        description: Minor version.
      - name: patch
        type: u64
        description: Patch version.

  - name: UpdateRecord
    module: daemonseed_core::release
    kind: struct
    description: Discovered update metadata.
    fields:
      - name: version
        type: ReleaseVersion
        description: The discovered release version.
      - name: channel
        type: UpdateChannel
        description: The channel it was discovered on.
      - name: emergency
        type: bool
        description: Whether it is flagged as an emergency security update.

  - name: FailureLogEntry
    module: daemonseed_core::release
    kind: struct
    description: A-C11 tuple. No payload retained.
    fields:
      - name: timestamp_unix_ms
        type: u64
        description: When the failure was recorded (Unix ms).
      - name: channel
        type: UpdateChannel
        description: The channel the failed update came from.
      - name: version_attempted
        type: ReleaseVersion
        description: The version that failed verification.
      - name: reason
        type: String
        description: A short failure reason (no payload bytes retained).

  - name: UpdateState
    module: daemonseed_core::release
    kind: enum
    description: ConfirmedReadyToInstall reachable ONLY via confirm() — never auto-reached.
    variants:
      - name: Idle
        description: No update pending.
      - name: Available
        description: "Available(UpdateRecord) — an update was discovered, not yet verified."
      - name: Verified
        description: "Verified{record, is_downgrade} — passed multi-sig verify."
      - name: ConfirmedReadyToInstall
        description: "ConfirmedReadyToInstall(UpdateRecord) — user confirmed; reachable only via confirm()."
      - name: Failed
        description: "Failed(FailureLogEntry) — verification failed; logged."

  - name: ConfirmError
    module: daemonseed_core::release
    kind: enum
    description: confirm() refuses outside Verified, or a downgrade without explicit acknowledgement.
    variants:
      - name: NotVerified
        description: confirm() called outside the Verified state.
      - name: DowngradeNotAcknowledged
        description: A downgrade was confirmed without explicit acknowledgement.

  - name: UpdateLifecycle
    module: daemonseed_core::release
    kind: struct
    description: >-
      The FSM driver. new(current_version); discover(record, artifact);
      verify(anchor, message, signatures, now_ms); confirm(acknowledge_downgrade);
      state/failure_log/has_artifact/take_pending_events.

  # ── biometric (ISC-C7) ──────────────────────────────
  - name: SessionPassphrase
    module: daemonseed_core::biometric
    kind: struct
    description: >-
      The session passphrase — the only secret a BiometricStore may hold.
      Zeroizing newtype (never the BIP-39 mnemonic). new(passphrase) / expose()
      -> &str; Debug redacts to "<redacted>".
    fields:
      - name: "0"
        type: String
        description: The wrapped session passphrase (private, redacted in Debug).
    security:
      contains_secret: true
      zeroize_on_drop: true

  - name: BiometricStore
    module: daemonseed_core::biometric
    kind: trait
    description: >-
      Stores and retrieves the session passphrase in a platform secure enclave
      for biometric login (ISC-C7). Opt-in; off by default
      (ProfileConfig::biometric_unlock). Object-safe. Implemented by the
      platform-holding client, not this crate. Methods: store(&SessionPassphrase)
      / retrieve() -> SessionPassphrase / clear(), each returning
      Result<_, BiometricError>. The recovery seed is intentionally not
      representable here.

  # ── autostart (ISC-C20) ─────────────────────────────
  - name: AutostartTarget
    module: daemonseed_core::autostart
    kind: enum
    description: Which OS autostart mechanism a descriptor targets.
    variants:
      - name: SystemdUser
        description: systemd user unit (~/.config/systemd/user/<name>.service), Linux.
      - name: Launchd
        description: launchd LaunchAgent plist (~/Library/LaunchAgents/<label>.plist), macOS.
      - name: WindowsStartup
        description: Windows Startup-folder command / `Run` key entry.

  - name: AutostartMode
    module: daemonseed_core::autostart
    kind: enum
    description: Whether autostart launches the profile headless (default) or with a GUI.
    variants:
      - name: Headless
        description: No GUI surface — the daemon runs in the background (ISC-C20 default).
      - name: Gui
        description: Explicit opt-in GUI surface.

  - name: AutostartSpec
    module: daemonseed_core::autostart
    kind: struct
    description: >-
      The inputs the pure descriptor generator needs to render a unit for one
      profile. All fields are plain strings so the generator stays free of any
      filesystem or process type.
    fields:
      - name: profile_name
        type: String
        description: Human-facing profile name, used to namespace the unit (multi-instance).
      - name: exec_path
        type: String
        description: Absolute path to the daemonseed executable to launch.
      - name: config_dir
        type: String
        description: The profile's config directory, passed via --config (ISC-C35).
      - name: mode
        type: AutostartMode
        description: Headless (default) or explicit GUI.

  - name: AutostartManager
    module: daemonseed_core::autostart
    kind: trait
    description: >-
      Installs / removes an autostart unit on the host. Implemented by the
      platform-holding client, NOT this crate — generating the descriptor
      (unit_descriptor) is in scope; touching the OS is reserved. Object-safe.
      Methods: enable(&AutostartSpec, AutostartTarget) /
      disable(AutostartTarget) / is_enabled(AutostartTarget), each returning
      Result<_, AutostartError>.

  # ── public_room ─────────────────────────────────────────────────────
  - name: PublicRoomKey
    module: daemonseed_core::public_room
    kind: struct
    description: >-
      A derived 32-byte public-room key (AES-256-GCM) — the global,
      server-readable key for a public room. A distinct type from CircleKey so
      the two cannot be substituted at a seal site (the key-class guard);
      implements AeadKey256 so an open path accepts either tier. ZeroizeOnDrop;
      Debug is redacted to `PublicRoomKey(<redacted>)` per ISC-A-C1. as_bytes
      borrows the raw key; from_bytes wraps raw bytes.
    implements: [AeadKey256]
    security:
      contains_secret: true
      zeroize_on_drop: true

  # ── heartbeat ───────────────────────────────────────────────────────
  - name: HeartbeatFields
    module: daemonseed_core::heartbeat
    kind: struct
    description: >-
      The plaintext fields of a MemberHeartbeat the caller supplies; the member
      pubkey and signature are filled in by the seal functions. Borrowed
      (lifetime 'a) so sealing never forces a clone.
    fields:
      - name: room
        type: "&'a str"
        description: The room/circle the heartbeat belongs to (e.g. "lobby").
      - name: sender_handle
        type: "&'a str"
        description: The member's self-asserted display handle (name#12hex). Advisory.
      - name: sent_unix_ms
        type: i64
        description: Member wall-clock at beacon time, unix milliseconds. Advisory.
      - name: live_share_ids
        type: "&'a [String]"
        description: The share-ids this member is serving into the room — the live-share digest (#76). Bound into provenance.

  # ── presence ────────────────────────────────────────────────────────
  - name: PresenceTracker
    module: daemonseed_core::presence
    kind: struct
    description: >-
      The live set of members heard in one room/circle. new(ttl) /
      with_cadence(interval, miss_count) construct it; apply folds a verified
      MemberHeartbeat (keyed by sender pubkey, an older sent_unix_ms ignored);
      reap ages members out past the TTL (receive-time-measured); members returns
      the live set sorted by handle then pubkey; len / is_empty / ttl report
      state. RAM-only; the caller scopes it to one room and filters its own beacon.

  - name: LiveMember
    module: daemonseed_core::presence
    kind: struct
    description: >-
      One live member — a roster row built from a verified MemberHeartbeat.
    fields:
      - name: handle
        type: String
        description: The member's self-asserted display handle (name#12hex). Advisory.
      - name: pubkey
        type: "Vec<u8>"
        description: The member's ML-DSA-87 public key (for the ISC-C4 handle binding; stable identity key).
      - name: beacon_unix_ms
        type: i64
        description: The member's advisory wall-clock at beacon time (unix ms); ordering only, never TTL.
      - name: last_seen
        type: Instant
        description: Local monotonic receive time of the most recent beacon; TTL reaping measures from here.

  - name: PresenceChange
    module: daemonseed_core::presence
    kind: enum
    description: >-
      What PresenceTracker.apply did: Appeared (a member newly on the roster),
      Refreshed (a known member's liveness updated), or Unchanged (a stale or
      reordered beacon was a no-op).

  # ── share_announce ──────────────────────────────────────────────────
  - name: AnnouncementFields
    module: daemonseed_core::share_announce
    kind: struct
    description: >-
      The plaintext fields of a ShareAnnouncement the caller supplies; the
      announcer pubkey and signature are filled in by the seal functions.
      Borrowed (lifetime 'a) so sealing never forces a clone.
    fields:
      - name: room
        type: "&'a str"
        description: The room/circle the announcement belongs to (e.g. "lobby").
      - name: sender_handle
        type: "&'a str"
        description: The announcer's self-asserted display handle (name#12hex). Advisory.
      - name: share_id
        type: "&'a str"
        description: The share's opaque id (ISC-S21).
      - name: name
        type: "&'a str"
        description: Display name of the shared folder.
      - name: rating
        type: "&'a str"
        description: Sharer-assigned rating label. Advisory, never relay-enforced.
      - name: withdraw
        type: bool
        description: "true = withdraw (unpublish); false = announce/refresh."
      - name: sent_unix_ms
        type: i64
        description: Announcer wall-clock at announce time, unix milliseconds. Advisory.
      - name: root_commitment
        type: "&'a [u8]"
        description: >-
          48-byte SHA-384 commitment (#156) binding share_id to the folder root
          under a secret identity-derived nonce; receivers recompute
          derive_share_id_v2(sender_pubkey, root_commitment) and reject a mismatch.

  # ── share_rollcall ──────────────────────────────────────────────────
  - name: RollCallFields
    module: daemonseed_core::share_rollcall
    kind: struct
    description: >-
      The plaintext fields of a ShareRollCall the caller supplies; the requester
      pubkey and signature are filled in by the seal functions. Borrowed
      (lifetime 'a) so sealing never forces a clone.
    fields:
      - name: room
        type: "&'a str"
        description: The room/circle the roll-call probes (e.g. "lobby").
      - name: requester_handle
        type: "&'a str"
        description: The requester's self-asserted display handle (name#12hex). Advisory.
      - name: sent_unix_ms
        type: i64
        description: Requester wall-clock at request time, unix milliseconds. Advisory.

  # ── share_catalog ───────────────────────────────────────────────────
  - name: ShareCatalog
    module: daemonseed_core::share_catalog
    kind: struct
    description: >-
      The live set of shares discovered in one room/circle. new(ttl) constructs
      an empty catalog pruning entries older than ttl (receive-time-measured);
      apply_verified is the ingest gate — it folds an announcement ONLY after the
      #156 receiver-verifiable binding check (share_id ==
      derive_share_id_v2(sender_pubkey, root_commitment)); apply is the raw fold
      WITHOUT that check and must not be called at ingest. prune ages entries out; remove
      drops one explicitly; entries returns the live shares sorted by name then
      share_id; len / is_empty report size. The caller scopes it to one room
      (it does not re-check the announcement's room field).

  - name: DiscoveredShare
    module: daemonseed_core::share_catalog
    kind: struct
    description: >-
      One discovered share — the rendered row of the share browser, built from a
      verified ShareAnnouncement.
    fields:
      - name: share_id
        type: String
        description: The share's opaque id (ISC-S21) — names the fetch rendezvous address.
      - name: name
        type: String
        description: Display name of the shared folder.
      - name: rating
        type: String
        description: Sharer-assigned rating label. Advisory.
      - name: sender_handle
        type: String
        description: The announcer's self-asserted display handle (name#12hex). Advisory.
      - name: sender_pubkey
        type: "Vec<u8>"
        description: The announcer's ML-DSA-87 public key (for the ISC-C4 handle binding).
      - name: announced_unix_ms
        type: i64
        description: The announcer's advisory wall-clock; used only to order successive announces of the same share.
      - name: received_at
        type: "std::time::Instant"
        description: Local monotonic receive time of the most recent announce; TTL pruning measures from here.

  - name: ShareListing
    module: daemonseed_core::share_catalog
    kind: struct
    description: >-
      A public-share row as surfaced to clients. Plain client-side struct;
      fields are the sharer's self-asserted classification (advisory, never
      relay-policed). Derives Clone, Debug, PartialEq, Eq, Default; convertible
      From<&DiscoveredShare>.
    implements: [Clone, Debug, PartialEq, Eq, Default]
    fields:
      - name: share_id
        type: String
        description: The share's opaque id.
      - name: name
        type: String
        description: Display name of the shared folder.
      - name: rating
        type: String
        description: Sharer-assigned rating label. Advisory.
      - name: sharer_handle
        type: String
        description: The sharer's self-asserted handle.

  - name: CatalogChange
    module: daemonseed_core::share_catalog
    kind: enum
    description: >-
      What ShareCatalog::apply did with an announcement, so a caller can decide
      whether the browser needs a redraw without diffing the catalog. Copy.
    variants:
      - name: Added
        description: A previously-unknown share was inserted.
      - name: Updated
        description: A known share's metadata / liveness was refreshed.
      - name: Removed
        description: A known share was withdrawn (removed).
      - name: Unchanged
        description: No-op (stale/reordered, or a withdraw of an unknown share).

  # ── share_envelope ──────────────────────────────────────────────────
  - name: ShareFrame
    module: daemonseed_core::share_envelope
    kind: enum
    description: >-
      One application-level frame inside a CotFrame.payload on the share-fetch
      path (ISC-19). encode serializes it to its on-wire bytes; decode parses a
      payload back, fail-closed (DecodeError). Derives Debug, Clone, PartialEq,
      Eq.
    implements: [Debug, Clone, PartialEq, Eq]
    variants:
      - name: ManifestRequest
        description: "Fetcher → sharer: send me the manifest for this share."
      - name: ManifestResponse
        description: "Sharer → fetcher: { entries: Vec<ManifestEntry> } — one entry per file."
      - name: ChunkRequest
        description: "Fetcher → sharer: { chunk_addr: ChunkAddr } — send me this chunk."
      - name: ChunkResponse
        description: "Sharer → fetcher: { chunk_addr: ChunkAddr, data: Vec<u8> } — the fetcher MUST re-derive SHA-384 over data and reject a mismatch."

  - name: ManifestEntry
    module: daemonseed_core::share_envelope
    kind: struct
    description: >-
      One file's entry in a ShareFrame::ManifestResponse. Derives Debug, Clone,
      PartialEq, Eq.
    implements: [Debug, Clone, PartialEq, Eq]
    fields:
      - name: rel_path
        type: String
        description: The file's path relative to the share root.
      - name: size
        type: u64
        description: The file's size in bytes (advisory; the per-chunk SHA-384 is authoritative).
      - name: chunks
        type: "Vec<ChunkAddr>"
        description: >-
          The file's ordered chunk addresses. The bytes are the
          concatenation of the chunks in this order; each address is the SHA-384
          of that chunk. An empty file is size 0, chunks [].

# ─────────────────────────────────────────────────────────────────────
# Functions — every public function. Each references its module.
# ─────────────────────────────────────────────────────────────────────

functions:
  # ── kats ────────────────────────────────────────────────────────────
  - name: initialize_module
    module: daemonseed_core::kats
    description: >-
      Bring the oxicrypt module Operational under the CNSA 2.0 profile.
      Call before any cryptographic call. Safe to call unconditionally
      and more than once: module init is one-shot per process and the
      losing caller receives AlreadyInitialized, which this function maps
      to Ok. The calling artifact must be signed with
      oxicrypt-integrity-sign.
    signature: "pub fn initialize_module() -> Result<(), oxicrypt_module::Error>"
    parameters: []
    returns:
      type: "Result<(), oxicrypt_module::Error>"
      description: >-
        Operational, or the terminal state the module latched into. Never
        AlreadyInitialized — that case returns Ok.
      error_variants:
        - name: "oxicrypt_module::Error::SelfTestFailed"
          condition: A power-up known-answer test failed. The module is in the error state.
        - name: "oxicrypt_module::Error::IntegrityUnverified"
          condition: >-
            The artifact carries no valid integrity slot, so its image
            could not be verified. Sign it with oxicrypt-integrity-sign.
        - name: "oxicrypt_module::Error::ConditionalTestFailed"
          condition: A conditional self-test failed. The module is in the error state.

  - name: initialize_module_unsigned_test_binary
    module: daemonseed_core::kats
    description: >-
      Bring the module Operational inside a cargo test binary, which
      carries no integrity slot. Behind the `testing` feature, reached
      only through a dev-dependency edge, which the release command does
      not carry — so no shipped artifact links it. Safe to call
      unconditionally and more than once, on the same terms as
      initialize_module.
    signature: "pub fn initialize_module_unsigned_test_binary() -> Result<(), oxicrypt_module::Error>"
    parameters: []
    returns:
      type: "Result<(), oxicrypt_module::Error>"
      description: >-
        Operational, or the terminal state the module latched into. Never
        AlreadyInitialized — that case returns Ok.
      error_variants:
        - name: "oxicrypt_module::Error::SelfTestFailed"
          condition: A power-up known-answer test failed. The module is in the error state.
        - name: "oxicrypt_module::Error::ConditionalTestFailed"
          condition: A conditional self-test failed. The module is in the error state.

  # ── identity::mnemonic ──────────────────────────────────────────────
  - name: Mnemonic::generate
    module: daemonseed_core::identity::mnemonic
    description: Generate a 24-word mnemonic from the OS CSPRNG.
    signature: "pub fn generate() -> Result<Mnemonic, MnemonicError>"
    parameters: []
    returns:
      type: "Result<Mnemonic, MnemonicError>"
      description: A fresh zeroizing mnemonic, or a generation error.
      error_variants:
        - name: MnemonicError
          condition: Entropy / underlying bip39 generation failed.

  - name: Mnemonic::from_phrase
    module: daemonseed_core::identity::mnemonic
    description: Parse user input or a .dseed-recovered phrase. Validates checksum.
    signature: "pub fn from_phrase(phrase: &str) -> Result<Mnemonic, MnemonicError>"
    parameters:
      - name: phrase
        type: "&str"
        direction: in
        description: A 24-word BIP-39 phrase (whitespace/case tolerated by callers).
    returns:
      type: "Result<Mnemonic, MnemonicError>"
      description: The parsed mnemonic, or a parse/checksum error.
      error_variants:
        - name: MnemonicError
          condition: The phrase is malformed or fails the BIP-39 checksum.

  - name: Mnemonic::to_phrase
    module: daemonseed_core::identity::mnemonic
    description: Render the mnemonic as 24 space-separated lowercase words.
    signature: "pub fn to_phrase(&self) -> String"
    parameters: []
    returns:
      type: String
      description: The 24-word lowercase phrase.

  - name: Mnemonic::to_seed
    module: daemonseed_core::identity::mnemonic
    description: BIP-39 PBKDF2-HMAC-SHA512 seed derivation with empty passphrase.
    signature: "pub fn to_seed(&self) -> [u8; 64]"
    parameters: []
    returns:
      type: "[u8; 64]"
      description: The 64-byte BIP-39 seed.

  # ── identity::keys ──────────────────────────────────────────────────
  - name: derive_identity_keys
    module: daemonseed_core::identity::keys
    description: >-
      End-to-end derivation. Each call regenerates from the seed — keys are not
      cached, so the caller manages lifetime.
    signature: "pub fn derive_identity_keys(mnemonic: &Mnemonic, identity: Identity) -> Result<IdentityKeys, KeyDerivationError>"
    parameters:
      - name: mnemonic
        type: "&Mnemonic"
        direction: in
        description: The recovery-root mnemonic to derive from.
      - name: identity
        type: Identity
        direction: in
        description: Primary or Device(uuid) — selects the HKDF info-string prefix.
    returns:
      type: "Result<IdentityKeys, KeyDerivationError>"
      description: A SignKeypair + KemKeypair bundle for the chosen branch.
      error_variants:
        - name: KeyDerivationError
          condition: HKDF, oxicrypt-module, or KEM keygen failed.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: VeilidNodeSeed::with_bytes
    module: daemonseed_core::identity::keys
    description: >-
      Run a closure over the raw 32-byte node seed and return its value. The only
      accessor; there is no borrowing accessor and the type is not Clone.
    signature: "pub fn with_bytes<T>(&self, f: impl FnOnce(&[u8; VEILID_NODE_SEED_LEN]) -> T) -> T"
    parameters:
      - name: f
        type: "impl FnOnce(&[u8; VEILID_NODE_SEED_LEN]) -> T"
        direction: in
        description: Receives a borrow of the raw seed for the duration of the call.
    returns:
      type: "T"
      description: Whatever the closure returns. T cannot borrow from the argument.

  - name: SignKeypair::from_halves
    module: daemonseed_core::identity::keys
    description: >-
      Assemble a SignKeypair from a verifying key and a signing key already
      known to belong together. The pairing is not re-checked; the halves come
      from one record that stored both, because ML-DSA-87 has no
      public-from-private derivation.
    signature: "pub fn from_halves(public_key: &[u8; ml_dsa::PK_LEN], secret_key: &[u8; ml_dsa::SK_LEN]) -> Self"
    parameters:
      - name: public_key
        type: "&[u8; ml_dsa::PK_LEN]"
        direction: in
        description: The verifying half.
      - name: secret_key
        type: "&[u8; ml_dsa::SK_LEN]"
        direction: in
        description: The signing half, copied straight into its heap allocation.
    returns:
      type: "SignKeypair"
      description: The keypair those two halves form.

  - name: SignKeypair::from_ml_dsa_seed
    module: daemonseed_core::identity::keys
    description: >-
      Build a SignKeypair directly from a raw 32-byte ML-DSA-87 seed via
      oxicrypt_ml_dsa::keygen. The server path (server identity is a bare seed,
      not a mnemonic); deterministic.
    signature: "pub fn from_ml_dsa_seed(seed: &[u8; ML_DSA_SEED_LEN]) -> Result<Self, KeyDerivationError>"
    parameters:
      - name: seed
        type: "&[u8; ML_DSA_SEED_LEN]"
        direction: in
        description: The raw 32-byte ML-DSA-87 seed (server identity).
    returns:
      type: "Result<SignKeypair, KeyDerivationError>"
      description: A deterministic ML-DSA-87 keypair from the seed.
      error_variants:
        - name: KeyDerivationError
          condition: oxicrypt keygen failed or the module is not operational.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: SignKeypair::sign
    module: daemonseed_core::identity::keys
    description: >-
      Detached ML-DSA-87 signature, empty FIPS-204 ctx (daemonseed domain-
      separates inside the signed bytes via the channel-binding prefix).
    signature: "pub fn sign(&self, message: &[u8]) -> Result<[u8; SIG_LEN], SignatureError>"
    parameters:
      - name: message
        type: "&[u8]"
        direction: in
        description: The bytes to sign.
    returns:
      type: "Result<[u8; SIG_LEN], SignatureError>"
      description: A detached ML-DSA-87 signature.
      error_variants:
        - name: Module
          condition: The oxicrypt module is not operational or signing failed.
        - name: BadSignature
          condition: Not produced by sign; reserved for verify paths.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: verify_signature
    module: daemonseed_core::identity::keys
    description: Ok only on a valid signature; all failure modes collapse to BadSignature.
    signature: "pub fn verify_signature(public_key: &[u8; PK_LEN], message: &[u8], signature: &[u8; SIG_LEN]) -> Result<(), SignatureError>"
    parameters:
      - name: public_key
        type: "&[u8; PK_LEN]"
        direction: in
        description: The signer's ML-DSA-87 public key.
      - name: message
        type: "&[u8]"
        direction: in
        description: The message the signature covers.
      - name: signature
        type: "&[u8; SIG_LEN]"
        direction: in
        description: The detached signature to check.
    returns:
      type: "Result<(), SignatureError>"
      description: Ok on a valid signature; otherwise BadSignature.
      error_variants:
        - name: BadSignature
          condition: Tampered message, wrong key, or forged signature (uniform).
        - name: Module
          condition: The oxicrypt module is not operational.
    preconditions:
      - description: The oxicrypt module must be operational.

  # ── identity_proof ──────────────────────────────────────────────────
  - name: derive_channel_binding
    module: daemonseed_core::identity_proof
    description: Fixed label + version-context exporter call.
    signature: "pub fn derive_channel_binding(source: &impl ChannelBindingSource, negotiated_version: ProtocolVersion) -> Result<[u8; 32], ChannelBindingError>"
    parameters:
      - name: source
        type: "&impl ChannelBindingSource"
        direction: in
        description: The TLS exporter seam (MUST NOT substitute a constant).
      - name: negotiated_version
        type: ProtocolVersion
        direction: in
        description: The negotiated APP_HELLO version, used as exporter context.
    returns:
      type: "Result<[u8; 32], ChannelBindingError>"
      description: The 32-byte TLS-exporter channel binding.
      error_variants:
        - name: Export
          condition: The exporter call failed (e.g. handshake incomplete).

  - name: signing_input
    module: daemonseed_core::identity_proof
    description: >-
      Canonical signed bytes (decision D3 — extends ISC-S19's 4 fields to cover
      timestamp+counter). Variable-length fields are u16-BE length-delimited to
      prevent field-confusion.
    signature: "pub fn signing_input(channel_binding: &[u8; 32], claimed_handle: &str, claimed_pubkey: &[u8], negotiated_version: ProtocolVersion, signed_at_unix_ms: u64, counter: u64) -> Vec<u8>"
    parameters:
      - name: channel_binding
        type: "&[u8; 32]"
        direction: in
        description: The local channel binding the signature is bound to.
      - name: claimed_handle
        type: "&str"
        direction: in
        description: The claimed handle.
      - name: claimed_pubkey
        type: "&[u8]"
        direction: in
        description: The claimed identity public key.
      - name: negotiated_version
        type: ProtocolVersion
        direction: in
        description: The negotiated protocol version.
      - name: signed_at_unix_ms
        type: u64
        direction: in
        description: The signing timestamp (Unix ms).
      - name: counter
        type: u64
        direction: in
        description: The per-key monotonic replay counter.
    returns:
      type: "Vec<u8>"
      description: The canonical length-delimited signed-input byte string.

  - name: build_envelope
    module: daemonseed_core::identity_proof
    description: >-
      Constructs + signs the wire envelope. counter/timestamp supplied by
      caller; counter state is sourced from the seeds blob by the orchestration
      layer (later commit).
    signature: "pub fn build_envelope(signing: &SignKeypair, channel_binding: &[u8; 32], claimed_handle: &str, role: Role, suite_id: SuiteId, negotiated_version: ProtocolVersion, signed_at_unix_ms: u64, counter: u64) -> Result<IdentityProof, SignatureError>"
    parameters:
      - name: signing
        type: "&SignKeypair"
        direction: in
        description: The local signing keypair.
      - name: channel_binding
        type: "&[u8; 32]"
        direction: in
        description: The derived channel binding.
      - name: claimed_handle
        type: "&str"
        direction: in
        description: The local claimed handle.
      - name: role
        type: Role
        direction: in
        description: Client/server role (never an auth branch, A-S8).
      - name: suite_id
        type: SuiteId
        direction: in
        description: The negotiated suite.
      - name: negotiated_version
        type: ProtocolVersion
        direction: in
        description: The negotiated protocol version.
      - name: signed_at_unix_ms
        type: u64
        direction: in
        description: The signing timestamp (Unix ms).
      - name: counter
        type: u64
        direction: in
        description: The per-key monotonic replay counter.
    returns:
      type: "Result<IdentityProof, SignatureError>"
      description: The signed identity-proof wire envelope.
      error_variants:
        - name: Module
          condition: The oxicrypt module is not operational or signing failed.
        - name: BadSignature
          condition: Reserved for verify paths; not produced here.
    preconditions:
      - description: The oxicrypt module must be operational.

  - name: verify_envelope
    module: daemonseed_core::identity_proof
    description: >-
      ISC-S19 step 4. Checks suite-support, role well-formedness, handle<->pubkey
      hash binding, signature over the local channel-binding+version (cross-
      session replay fails here), +/-5min skew, and counter monotonicity (gap
      allowed+flagged, <=highest-seen rejected). Identical path for client and
      server (role is never an auth branch, A-S8).
    signature: "pub fn verify_envelope(envelope: &IdentityProof, channel_binding: &[u8; 32], negotiated_version: ProtocolVersion, now_unix_ms: u64, highest_seen_counter: Option<u64>) -> Result<VerifiedPeer, VerifyRejection>"
    parameters:
      - name: envelope
        type: "&IdentityProof"
        direction: in
        description: The peer's identity-proof envelope.
      - name: channel_binding
        type: "&[u8; 32]"
        direction: in
        description: The locally-derived channel binding.
      - name: negotiated_version
        type: ProtocolVersion
        direction: in
        description: The negotiated protocol version.
      - name: now_unix_ms
        type: u64
        direction: in
        description: The local clock (Unix ms) for the +/-5min skew check.
      - name: highest_seen_counter
        type: "Option<u64>"
        direction: in
        description: The highest counter seen for this peer, or None on first contact.
    returns:
      type: "Result<VerifiedPeer, VerifyRejection>"
      description: An opaque VerifiedPeer token on success.
      error_variants:
        - name: VerifyRejection
          condition: >-
            Any check failed — bad-sig / wrong-key / stale-ts / replayed-counter /
            unsupported-suite / handle-mismatch all collapse to one opaque
            rejection (A-S12 / A-C18).

  # ── handle ──────────────────────────────────────────────────────────
  - name: fingerprint_hex
    module: daemonseed_core::handle
    description: 12-char lowercase hex of SHA-384(pubkey)[..6]. 48 bits of entropy.
    signature: "pub fn fingerprint_hex(pubkey: &[u8]) -> String"
    parameters:
      - name: pubkey
        type: "&[u8]"
        direction: in
        description: The identity public key to fingerprint.
    returns:
      type: String
      description: A 12-character lowercase hex fingerprint.

  - name: format_handle
    module: daemonseed_core::handle
    description: Concatenates `name#fingerprint` per ISC-C4 wire format.
    signature: "pub fn format_handle(display_name: &str, fingerprint: &str) -> String"
    parameters:
      - name: display_name
        type: "&str"
        direction: in
        description: The display name portion.
      - name: fingerprint
        type: "&str"
        direction: in
        description: The 12-char hex fingerprint portion.
    returns:
      type: String
      description: The combined `name#fingerprint` handle.

  - name: "Handle::with_display_name"
    module: daemonseed_core::handle
    description: >-
      Return a copy of this handle with its display name replaced, keeping the
      SAME hash prefix. Does NOT violate the ISC-C4 identity binding — the hash
      is never set independently. Used at first-start: the handle is derived
      from the identity key before the user picks a name, then the name is
      attached once finalize validates it (ISC-C4b).
    signature: "pub fn with_display_name(&self, display_name: Option<String>) -> Handle"
    parameters:
      - name: display_name
        type: "Option<String>"
        direction: in
        description: The display name to attach (None → floor handle).
    returns:
      type: Handle
      description: A handle with the same hash prefix and the new display name.

  # ── handle::display_name ────────────────────────────────────────────
  - name: generate
    module: daemonseed_core::handle::display_name
    description: Sample one predicate + one object, return `predicate-object`.
    signature: "pub fn generate<R: DisplayNameRng>(rng: &mut R) -> String"
    parameters:
      - name: rng
        type: "&mut R"
        direction: in-out
        description: A CSPRNG implementing DisplayNameRng.
    returns:
      type: String
      description: A friendly `predicate-object` display name.

  - name: is_valid_display_name
    module: daemonseed_core::handle::display_name
    description: >-
      Empty allowed (floor handle). Otherwise: 1-32 chars, no whitespace, no `#`,
      NFKC-normalizable.
    signature: "pub fn is_valid_display_name(s: &str) -> bool"
    parameters:
      - name: s
        type: "&str"
        direction: in
        description: The candidate display name.
    returns:
      type: bool
      description: True if the name is empty or a valid 1-32 char display name.

  # ── kdf::info ───────────────────────────────────────────────────────
  - name: "info::primary"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/identity/primary/<domain>`.
    signature: "pub fn primary(domain: &str) -> String"
    parameters:
      - name: domain
        type: "&str"
        direction: in
        description: The per-key domain (e.g. sign / kem-d / kem-z).
    returns:
      type: String
      description: The HKDF info string for the primary branch.

  - name: "info::device"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/identity/device-<uuid>/<domain>`.
    signature: "pub fn device(uuid: &str, domain: &str) -> String"
    parameters:
      - name: uuid
        type: "&str"
        direction: in
        description: The device UUID.
      - name: domain
        type: "&str"
        direction: in
        description: The per-key domain.
    returns:
      type: String
      description: The HKDF info string for the device branch.

  - name: "info::at_rest"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/at-rest/<profile_id>`.
    signature: "pub fn at_rest(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the at-rest seeds blob.

  - name: "info::recovery_file"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/recovery-file/<profile_id>`.
    signature: "pub fn recovery_file(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the .dseed recovery file.

  - name: "info::share_index"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/share-index/<profile_id>`.
    signature: "pub fn share_index(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the encrypted share index.

  - name: "info::trust_events"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/trust-events/<profile_id>`.
    signature: "pub fn trust_events(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the encrypted trust-event log.

  - name: "info::spent_tokens"
    module: daemonseed_core::kdf::info
    description: Returns `daemonseed/dm-spent-tokens/<profile_id>`.
    signature: "pub fn spent_tokens(profile_id: &str) -> String"
    parameters:
      - name: profile_id
        type: "&str"
        direction: in
        description: The profile UUID.
    returns:
      type: String
      description: The HKDF info string for the encrypted spent-invite-token set.

  - name: "spent_store::spent_tokens_path"
    module: daemonseed_core::dm::spent_store
    description: Returns `<profile-root>/dm-spent-tokens.bin`.
    signature: "pub fn spent_tokens_path(profile_root: &Path) -> PathBuf"
    parameters:
      - name: profile_root
        type: "&Path"
        direction: in
        description: The profile root directory.
    returns:
      type: PathBuf
      description: Path to the sealed spent-invite-token set.

  - name: "spent_store::seal"
    module: daemonseed_core::dm::spent_store
    description: Encrypts a SpentTokenSet under the profile's spent-token key.
    signature: "pub fn seal(set: &SpentTokenSet, passphrase: &str, profile_id: Uuid, argon2: ArgonParams) -> Result<Vec<u8>, SpentStoreError>"
    parameters:
      - name: set
        type: "&SpentTokenSet"
        direction: in
        description: The set to persist.
      - name: passphrase
        type: "&str"
        direction: in
        description: The profile passphrase.
      - name: profile_id
        type: Uuid
        direction: in
        description: Argon2id salt and HKDF info component.
      - name: argon2
        type: ArgonParams
        direction: in
        description: Work factors, written to the cleartext header.
    returns:
      type: "Vec<u8>"
      description: Header, nonce, ciphertext, tag.

  - name: "spent_store::open"
    module: daemonseed_core::dm::spent_store
    description: >-
      Decrypts a file written by spent_store::seal. Refuses a header whose
      Argon2 cost fails ArgonParams::is_openable before deriving a key.
    signature: "pub fn open(bytes: &[u8], passphrase: &str) -> Result<SpentTokenSet, SpentStoreError>"
    parameters:
      - name: bytes
        type: "&[u8]"
        direction: in
        description: The file contents.
      - name: passphrase
        type: "&str"
        direction: in
        description: The profile passphrase.
    returns:
      type: SpentTokenSet
      description: The recovered set.

  # ── passphrase ──────────────────────────────────────────────────────
  - name: "strength::evaluate"
    module: daemonseed_core::passphrase
    description: zxcvbn-derived score with explicit ISC-C12 floor check.
    signature: "pub fn evaluate(input: &str) -> StrengthReport"
    parameters:
      - name: input
        type: "&str"
        direction: in
        description: The candidate passphrase.
    returns:
      type: StrengthReport
      description: A zxcvbn-derived strength report with the ISC-C12 floor check.

  - name: "strength::estimate_circle"
    module: daemonseed_core::passphrase
    description: >-
      Circle-of-trust entropy estimator (ISC-C9, M15) — the key-space companion
      to the session estimator that can actually certify >=128 bits (zxcvbn
      saturates at 2^64). bits = (distinct BIP-39 words x 11) + charset residue
      (len x log2 of the residue's distinct chars); zxcvbn is retained only as a
      low-end veto on repeat/sequence patterns the additive sum over-credits.
      CircleStrength::is_circle_green() = bits >= 128 && !trivially_weak — the
      real ISC-C9 gate that replaced the M14 interim score-4 proxy.
    signature: "pub fn estimate_circle(phrase: &str) -> CircleStrength"
    parameters:
      - name: phrase
        type: "&str"
        direction: in
        description: The candidate circle-of-trust passphrase.
    returns:
      type: CircleStrength
      description: "{ bits: f64, trivially_weak: bool } with is_circle_green() = bits >= 128 && !trivially_weak."

  - name: "strength::generate_circle_phrase"
    module: daemonseed_core::passphrase
    description: >-
      Canonical home (shared by the GUI and the TUI — neither reimplements it) for
      generating a circle phrase that clears the SAME is_circle_green floor the join
      gate enforces (ISC-C9). Rejection-samples CIRCLE_DICEWARE_WORDS-word (12) BIP-39
      diceware until is_circle_green: a bare generate_diceware(12) draws WITH
      replacement, so ~3% repeat a word and score 11x11=121 bits (below the 128 floor)
      on the distinct-word estimator, which would make the generator emit a phrase its
      own join gate rejects. gotcha: caps at 32 resamples then returns a final draw
      (astronomically unreachable) rather than panicking in a display path.
    signature: "pub fn generate_circle_phrase() -> Result<String, DicewareError>"
    returns:
      type: "Result<String, DicewareError>"
      description: A space-separated 12-word BIP-39 phrase guaranteed is_circle_green.

  - name: "circle_canonicalize::canonicalize"
    module: daemonseed_core::passphrase
    description: >-
      NFKC normalization for circle-of-trust entropy. Pre-applied before KDF so
      equivalent unicode inputs produce the same key.
    signature: "pub fn canonicalize(input: &str) -> String"
    parameters:
      - name: input
        type: "&str"
        direction: in
        description: The raw circle entropy phrase.
    returns:
      type: String
      description: The NFKC-normalized phrase.

  # ── profile::config ─────────────────────────────────────────────────
  - name: ProfileConfig::new_for_first_start
    module: daemonseed_core::profile::config
    description: >-
      Build a fresh config for first-start (ISC-C29 step 3). Mints a UUID-v4
      profile_id from CSPRNG, the given Argon2 params, and both opt-in flags
      defaulted off.
    signature: "pub fn new_for_first_start(argon2: ArgonParams) -> ProfileConfig"
    parameters:
      - name: argon2
        type: ArgonParams
        direction: in
        description: The Argon2 work factors to persist.
    returns:
      type: ProfileConfig
      description: A fresh config with a random profile_id and both flags false.

  - name: ProfileConfig::from_toml
    module: daemonseed_core::profile::config
    description: >-
      Parse a daemonseed.toml body. Distinguishes missing from invalid
      profile_id; biometric_unlock and autostart default false when absent.
    signature: "pub fn from_toml(body: &str) -> Result<ProfileConfig, ProfileConfigError>"
    parameters:
      - name: body
        type: "&str"
        direction: in
        description: The daemonseed.toml file body.
    returns:
      type: "Result<ProfileConfig, ProfileConfigError>"
      description: The parsed config, or a specific parse error.
      error_variants:
        - name: Toml
          condition: TOML syntax error or type mismatch.
        - name: MissingProfileId
          condition: The `profile_id` field is absent.
        - name: InvalidProfileId
          condition: The `profile_id` field is present but not a valid UUID.
        - name: Serialize
          condition: Not produced by from_toml; reserved for to_toml.

  - name: ProfileConfig::to_toml
    module: daemonseed_core::profile::config
    description: Serialize to the canonical daemonseed.toml representation.
    signature: "pub fn to_toml(&self) -> Result<String, ProfileConfigError>"
    parameters: []
    returns:
      type: "Result<String, ProfileConfigError>"
      description: The serialized TOML body, or a serialize error.
      error_variants:
        - name: Serialize
          condition: TOML serialization failed.

  # ── profile::resolve ────────────────────────────────────────────────
  - name: resolve
    module: daemonseed_core::profile::resolve
    description: Resolve the profile root per ISC-C35 priority order.
    signature: "pub fn resolve(args: ResolveArgs) -> Result<ResolvedProfileRoot, ResolveError>"
