# ─────────────────────────────────────────────────────────────────────
# daemonseed-veilid-net — LAMA API Manifest (Veilid transport layer)
#
# The Veilid-native transport for daemonseed: an identity-bound node driven
# through a command-channel actor (VeilidNet / VeilidNetHandle), the
# AppSession-replacement the GUI/TUI drive behind their `veilid` feature. Moves
# ONLY opaque cot-sealed bytes — content stays sealed under a circle key /
# PublicRoomKey (ISC-A-S2); this layer never holds a content key or plaintext.
# Circles, the lobby / public rooms, and public-share discovery all ride ONE
# shared-owner DFLT DHT rendezvous engine, distinguished only by which owner seed
# the caller derives. Public-share content moves owner-on-demand over app_call +
# a private route. The crate is workspace-excluded until the v0.33.0 cutover and
# is compiled by the GUI/TUI only under their `veilid` feature.
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Core crate (key derivation, seal/open, share types): ./daemonseed-core-api.yaml
# - Wire schema: ./daemonseed-proto-protocol.yaml
# - Schema specification: https://github.com/lamaspec/lama/blob/main/SPEC.md
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-veilid-net
  version: "0.1.0"
  description: >-
    Veilid transport layer for daemonseed. Brings up an identity-bound Veilid
    node (VeilidNet::start), driven through a cloneable command-channel handle
    (VeilidNetHandle) that serializes access to the single VeilidAPI. Provides:
    sealed 1:1 messaging over a private route; circles + lobby / public rooms over
    a shared-owner DFLT DHT rendezvous (append-ring fan-out + login-backlog sweep +
    a re-sweep recovery primitive); public-share discovery via an anti-swap SIGNED
    route advert on the lobby rendezvous (DiscoveryEnvelope); and public-share
    content transfer owner-on-demand over app_call, fragment-reassembled and
    SHA-384-verified per chunk. Emits typed VeilidNetEvents so the app never
    touches veilid types. Presence / announcements are Phase 4.
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-veilid-net"
  status: >-
    Phase 3 (public shares) complete and live-verified on the public Veilid
    network; circles + lobby live. Presence / announcements are Phase 4. Consumed
    by the GUI/TUI behind their `veilid` feature; workspace-excluded until the
    v0.33.0 cutover.

# ─────────────────────────────────────────────────────────────────────
# Library-wide constraints
# ─────────────────────────────────────────────────────────────────────

constraints:
  - description: >-
      `oxicrypt_module::initialize()` MUST have run before any operation that
      seals/opens or signs/verifies (share serve/fetch, route advert sign/verify).
      The consuming binary initializes oxicrypt at startup.
    enforcement: runtime
    severity: error

  - description: >-
      The node MUST be attached and public-internet-ready before any transport
      operation — call `VeilidNetHandle::attach_and_wait` after `VeilidNet::start`.
    enforcement: runtime
    severity: error

  - description: >-
      This layer moves ONLY opaque sealed bytes. Content is sealed under a circle
      key / PublicRoomKey in daemonseed-core; the DHT and app_call frames carry
      ciphertext (ISC-A-S2). Rendezvous records are opened with NO Veilid
      encryption key so values are stored verbatim — the cot seal is the only
      content-encryption layer, keeping content crypto decoupled from Veilid's
      transport crypto.
    enforcement: convention + tests
    severity: error

# ─────────────────────────────────────────────────────────────────────
# Modules
# ─────────────────────────────────────────────────────────────────────

modules:
  - name: daemonseed_veilid_net::actor
    description: >-
      The command-channel actor. `VeilidNet::start` spawns the actor + a dedicated
      inbound-serve lane + a slow advert watchdog; `VeilidNetHandle` is the
      cloneable command surface (attach, routes, sealed send, circle/room
      publish/subscribe/resweep, share serve/fetch, share advert publish/stop).
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::config
    description: Bring-up configuration (VeilidNetConfig) — identity seed, bootstrap, storage dir, hop count, namespace, listen address.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::event
    description: Typed transport events (VeilidNetEvent), mapped from raw VeilidUpdates so the app never touches veilid types.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::error
    description: The transport error surface (VeilidNetError) and the crate `Result` alias.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::identity
    description: Derive the Veilid node keypair and the rendezvous-owner keypair from daemonseed-core seeds (D3).
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::discovery
    description: >-
      The anti-swap SIGNED route advert for public-share discovery (D-3.5): a
      DiscoveryEnvelope binds the sharer's private-route blob to the announcer's
      ML-DSA-87 identity over a domain-separated `share_id ‖ route_blob`, signed via
      the least-authority RouteAdvertSigner capability.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::share
    description: >-
      Public-share content transfer over app_call: request/response framing, a
      served-share registry (ServedShare) that answers fragment requests from a
      seal cache, and the fetch side that reassembles ≤30 KiB fragments and
      SHA-384-verifies each chunk against its content address (ISC-S28).
    no_std: false
    depends_on:
      - daemonseed_veilid_net::error
  - name: daemonseed_veilid_net::aimd
    description: An additive-increase/multiplicative-decrease fragment-concurrency window (AimdWindow) that narrows under fragment-latency congestion and recovers as it clears (#128 D-1).
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::route_budget
    description: >-
      A single per-route concurrency budget (RouteBudget) capping total in-flight
      fragment app_calls to one serving route, with a global cap and an
      error-primary window controller (collapse on failure + a sharer-keyed
      learned ceiling; latency only a secondary 3-of-5 valve). Counter-gated
      admission via RouteLease/BudgetPermit; clock-free, injected observations.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::download
    description: >-
      The shared download engine both frontends drive (run_download): fetches a set
      of placed files' chunks in parallel under one RouteLease, writes each verified
      chunk into a StagingArea at its manifest offset, promotes each file on
      completion, and disposes staging by failure class (integrity → destroy;
      transient/not-served/local → retain verified units). Frontend-agnostic and
      network-free (the fetch closure carries the budget).
    no_std: false
    depends_on:
      - daemonseed_veilid_net::error
      - daemonseed_veilid_net::route_budget
  - name: daemonseed_veilid_net::dm
    description: >-
      Direct messaging over the Veilid DHT: VeilidRecords, which implements
      daemonseed_core::dm::flows::Records over real DHT records, and the runner
      task a front end spawns over it.
    no_std: false
    depends_on:
      - daemonseed_veilid_net::actor
      - daemonseed_veilid_net::error
      - daemonseed_veilid_net::rendezvous
  - name: daemonseed_veilid_net::dm::runner
    description: >-
      The direct-message runner: one tokio task per identity that owns a record
      store and a daemonseed_core::dm::store::Store at <profile_root>/dm-store,
      calls daemonseed_core::dm::flows one call at a time, serves RunnerCommands
      between flow calls and emits RunnerEvents, on a collection tick, a repair
      poll and an advert poll.
    no_std: false
    depends_on:
      - daemonseed_veilid_net::dm
  - name: daemonseed_veilid_net::schedule
    description: >-
      The WB-3 write scheduler — the single funnel every DHT write enters, ordering
      across records by WriteClass, holding each record's writes in enqueue order,
      coalescing redundant current-state writes on their logical id, and flushing chat
      and tombstone writes within the close budget.
    no_std: false
    depends_on:
      - daemonseed_veilid_net::error
  - name: daemonseed_veilid_net::dht_gate
    description: >-
      The partitioned DHT permit accountant (DhtGate) sitting above veilid's
      process-global DHT-operation gate. Four dedicated pools — chat, starvation floor,
      non-chat window and read — sum to DHT_BUDGET concurrent operations with no
      cross-pool fallback, so no lane can drain another, and a margin-sized limiter
      bounds the un-gated open_dht_record / watch_dht_values calls.
    no_std: false
    depends_on: []
  - name: daemonseed_veilid_net::resweep
    description: The round-robin cursor selector (next_resweep_record) the frontend net actors share for their steady-state resweep clocks.
    no_std: false
    depends_on: []

# ─────────────────────────────────────────────────────────────────────
# Types
# ─────────────────────────────────────────────────────────────────────

types:
  - name: RouteBudget
    module: daemonseed_veilid_net::route_budget
    kind: struct
    description: >-
      Per-route concurrency budget (generic over the route key; production keys on
      RouteId). `lease(route, sharer)` returns a RouteLease; admission is
      counter-gated at `in_flight(route) < W(route)` and `in_flight(global) < G`.
      `new()` starts fresh routes at `DEFAULT_ROUTE_CEIL`; `with_default_ceiling(c)`
      overrides the fresh-route starting ceiling.
  - name: RouteLease
    module: daemonseed_veilid_net::route_budget
    kind: struct
    description: >-
      A download's lease on a route's budget; `acquire().await` yields a
      BudgetPermit, `observe(outcome)` feeds the window controller. Dropping the
      last lease drops the route's live accounting; the sharer's learned ceiling
      persists.
  - name: BudgetPermit
    module: daemonseed_veilid_net::route_budget
    kind: struct
    description: A granted admission for one fragment app_call; releases its route and global slot on drop (so a retry-backoff release frees the global pool).
  - name: FragmentOutcome
    module: daemonseed_veilid_net::route_budget
    kind: enum
    description: One completed-fragment observation fed to the controller — Completed{over_threshold} or Failed.
  - name: SharerKey
    module: daemonseed_veilid_net::route_budget
    kind: struct
    description: Sharer identity (verified long-term announcer pubkey bytes, #156) — the learned-ceiling key, stable across route rotation.
  - name: PlannedFile
    module: daemonseed_veilid_net::download
    kind: struct
    description: One file the engine fetches — dest_rel (promote target), size (staging pre-size), and the ordered chunk addresses (chunk i writes at offset i*CHUNK_SIZE).
  - name: DownloadOutcome
    module: daemonseed_veilid_net::download
    kind: enum
    description: >-
      The engine's terminal outcome the frontend folds — Complete{files,bytes},
      TransientFailed (retain + mark Unresolved + park), IntegrityFailed (staging
      destroyed + poison flag; no mark/park), LocalFailed (retain; surface only).
  - name: VeilidNet
    module: daemonseed_veilid_net::actor
    kind: struct
    description: Entry point; `start` brings up the node and spawns the actor.
  - name: VeilidNetHandle
    module: daemonseed_veilid_net::actor
    kind: struct
    description: >-
      Cloneable handle to the running actor — every transport operation goes
      through it; the actor task serializes access to the single VeilidAPI. The
      shape the app/UI drives (the AppSession replacement).
  - name: VeilidNetConfig
    module: daemonseed_veilid_net::config
    kind: struct
    description: Node bring-up configuration.
    fields:
      - name: identity_seed
        type: VeilidNodeSeed
        description: Node identity seed (D3), from the daemonseed mnemonic.
      - name: bootstrap
        type: "Vec<String>"
        description: Bootstrap entries; empty uses veilid's built-in defaults.
      - name: storage_dir
        type: String
        description: veilid protected-store + DHT-cache directory.
      - name: hop_count
        type: usize
        description: Private-route hop count (D5); carried, applied when the safety-route dial-up is on.
      - name: namespace
        type: String
        description: Program namespace so multiple nodes coexist on one host.
      - name: listen_address
        type: "Option<String>"
        description: UDP/TCP/WS listen address; None uses veilid's defaults.
  - name: VeilidNetEvent
    module: daemonseed_veilid_net::event
    kind: enum
    description: A daemonseed-facing transport event.
    variants:
      - name: Attachment
        description: "Attachment state changed; `public_internet_ready` gates all operations. Also carries `reliable_peers` / `live_peers` (u32) — the current attach peer counts, climbing during the cold-start warmup (#144)."
      - name: Inbound
        description: An opaque sealed inbound message arrived; the app opens it with the relevant circle/room key.
      - name: RouteChanged
        description: An allocated/imported private route died or changed and may need re-allocation.
      - name: ValueChanged
        description: A watched DHT value changed (circles / shares).
      - name: SweepHealth
        description: Emitted once per completed rendezvous sweep, carrying per-record GET accounting (attempted / failed / timed_out / found) so a consumer can drive session-health / self-heal detection. timed_out is the subset of failed whose reads were abandoned at the sweep's per-GET time bound rather than returning an error. Does not change the on-slot Inbound emission.
  - name: RouteAdvertSigner
    module: daemonseed_veilid_net::discovery
    kind: trait
    description: >-
      Least-authority capability to sign a route advert (`share_id ‖ route_blob`)
      with the sharer's ML-DSA-87 identity — keeps the identity key out of the
      transport crate.
  - name: DiscoveryEnvelope
    module: daemonseed_veilid_net::discovery
    kind: struct
    description: A public-share discovery item on the lobby rendezvous — the sealed self-signed announcement, the sharer's route blob, and the anti-swap route signature.
  - name: ServedShare
    module: daemonseed_veilid_net::share
    kind: struct
    description: A registered share served owner-on-demand from any ChunkSource; answers fragment requests from an LRU-bounded seal cache so all fragments of one response come from a single seal.
  - name: FetchTarget
    module: daemonseed_veilid_net::share
    kind: enum
    description: What a fetcher is pulling.
    variants:
      - name: Manifest
        description: The share manifest (file names + sizes + chunk addresses).
      - name: Chunk
        description: One content chunk, by its ChunkAddr.
  - name: AimdWindow
    module: daemonseed_veilid_net::aimd
    kind: struct
    description: A bounded additive-increase/multiplicative-decrease concurrency window (floor..ceiling).
  - name: VeilidRecords
    module: daemonseed_veilid_net::dm
    kind: struct
    description: >-
      daemonseed_core::dm::flows::Records over the Veilid DHT. Reads run through
      the DHT gate's read pool under a bounded GET; writes enter the write
      scheduler as WriteRequest::direct_message with a DirectMessageWrite kind and
      the method waits for the reply. An advert and a drop are addressed by owner
      seed under the subkey count the caller supplies; a channel is addressed by
      the lookup key open_channel returns, which is the owner's 32-byte public key.
      open_channel creates the record if absent and retains the owner keypair, so
      write_channel addresses only channels opened in this process. erase_drop_slot
      writes an empty value to the slot, and a subkey holding no bytes reads back
      as None. read_drop_slot at slot 0 takes one inspect_sync_set report of the
      drop and answers every slot the network reports no sequence number for
      without a read; a hello written to that drop discards the report and an
      erasure keeps it. Inherent methods outside the trait: publish_advert writes
      subkey 0 of an advert record, erase_channel closes and deletes a channel
      record this side owns from this node's local store without creating an
      absent one and keeps the channel open for a retry when the erase fails,
      write_counts reports writes so far per kind, and
      inspect_channel, inspect_advert and inspect_drop report a SubkeyReport per
      subkey (local and network sequence numbers, and whether Veilid still has
      the subkey queued for its flush). It implements
      daemonseed_veilid_net::dm::runner::RunnerRecords through them, with
      open_existing_channel opening a channel record without creating it. Every
      method bridges the synchronous trait onto the asynchronous transport with
      tokio::task::block_in_place, so every call must be on a multi-thread runtime
      worker; the flavor is checked at construction and at every bridged call.
      Every network call is retried while Veilid refuses transiently (TryAgain,
      offline, routing table not ready): eight attempts, 2 s doubling to a 30 s
      cap, with a write retried inside its dispatch so one submission is one
      entry on the funnel. Any other refusal returns on the first attempt.
      Every subkey write is confirmed after its reply: a Local inspect of the
      record, through inspect_local_pending, reports the subkey's local sequence
      number and whether Veilid still has it queued for its background flush,
      and the write is done when it has a number and is not queued, because
      Veilid reports a write it could only keep locally as done and flushes it
      in the background. A write found queued is polled from 2 s doubling to
      10 s for up to 300 s. The inspect asks no other node and is a read, so the
      write budget is unchanged; a write still queued at the end of the budget
      is an error naming the write.
      Built by VeilidRecords::new from VeilidRecordsParts.
  - name: VeilidRecordsParts
    module: daemonseed_veilid_net::dm
    kind: struct
    description: >-
      The transport state a VeilidRecords is built over: the DHT gate, the
      VeilidAPI, the RoutingContext, the open-record cache, the per-record locks
      and the write scheduler handle. Obtained from
      VeilidNetHandle::dm_records_parts. Fields are private.
  - name: WriteCountsSnapshot
    module: daemonseed_veilid_net::dm
    kind: struct
    description: >-
      One VeilidRecords instance's writes so far, per record kind: hello, erase,
      control, ring, advert. flow_writes() is every field but advert, which is
      the set docs/design/direct-messaging.md § Write budget's per-flow ceilings
      are measured in.
  - name: RecordsError
    module: daemonseed_veilid_net::dm
    kind: enum
    description: >-
      Why VeilidRecords::new refused: NoRuntime (no tokio runtime on this thread),
      NotMultiThread (the runtime is not multi-threaded, so the synchronous bridge
      would panic). Also the error inside a RecordError for a call refused before
      it reached the network: ChannelNotOpened (a write or erasure of a channel
      this process has not opened), SubkeyCount(u16) (a subkey count no record can
      be addressed with) and OwnerKey (an owner keypair that would not derive).
  - name: RunnerRecords
    module: daemonseed_veilid_net::dm::runner
    kind: trait
    description: >-
      daemonseed_core::dm::flows::Records plus inspect_channel, inspect_advert and
      inspect_drop (a SubkeyReport per subkey of a channel, advert or drop
      record), publish_advert, erase_channel (a failed erase leaves the channel
      open), open_existing_channel(&mut self, &ChannelOwnerSeed, u16) ->
      Result<Option<lookup key>, RecordError> (opens without creating, None where
      this node holds no such record; the default calls open_channel) and
      write_counts, the associated fn
      classify(&RecordError) -> RecordFailure (default Refused) that decides the
      counter a failed call is counted in, and take_scan_failure(&mut self) ->
      Option<RecordError> (default None), the failure of the drop inspect a scan
      took before its first slot read, and same_local_refusal(&RecordError,
      &RecordError) -> bool (default false), whether a scan's local refusal and
      its slot read's are the same one and so counted once. VeilidRecords
      implements it, classing VeilidNetError::TimedOut as TimedOut, a
      RecordsError or VeilidNetError::Local as Local, and everything else,
      VeilidNetError::Actor (a dropped scheduler reply or a panicked dispatch)
      included, as Refused.
  - name: RecordFailure
    module: daemonseed_veilid_net::dm::runner
    kind: enum
    description: >-
      How a failed record store call failed: Refused (the network or transport
      refused), TimedOut (ran out of time) or Local (refused before it reached the
      network, counted in HealthCounters::local_refusals).
  - name: SubkeyReport
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      One inspected subkey: local_seq (this node's copy), network_seq (the
      network's, as if the local copy did not exist) and pending (still queued
      for Veilid's flush).
  - name: RunnerParts
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      What spawn_runner takes, all fields public: records (a RunnerRecords),
      signer (Arc<SignKeypair>), channel_root (DmChannelRootSecret, moved),
      at_rest_key (Zeroizing<[u8; 32]>), profile_root (PathBuf) and config
      (RunnerConfig).
  - name: RunnerConfig
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      tick (collection interval before ±20 % jitter, default DEFAULT_TICK 60 s)
      and grace (the longest RunnerHandle::shutdown waits, default DEFAULT_GRACE
      10 s). Implements Default. clamped() holds tick within MIN_TICK (1 ms) and
      MAX_TICK (24 h); spawn_runner applies it.
  - name: RunnerHandle
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      A running runner: commands() clones the command sender, send queues a
      command, next_event and try_next_event read events, shutdown stops it and
      returns the unread events. Dropping it stops the runner after the flow
      call in progress and discards unread events.
  - name: RunnerCommand
    module: daemonseed_veilid_net::dm::runner
    kind: enum
    description: >-
      FirstContact{token, peer_identity_pk, body}, Send{token, peer, body},
      Accept{token, request, reply}, Block{peer}, Unblock{peer},
      DeleteConversation{token, peer}, Shutdown. peer is a CorrespondenceLabel
      except on Block and Unblock, where it is an identity public key. Debug omits
      bodies and keys.
  - name: RunnerEvent
    module: daemonseed_veilid_net::dm::runner
    kind: enum
    description: >-
      Roster(Vec<ConversationSummary>), ContactRequest{request, from},
      StartedOver{request, from}, Message{from, seq, body, received_at (Unix ms,
      stamped by the runner)}, Sent{token, peer, seq}, Deleted{token, peer},
      Delivered{peer, through_seq}, Accepted{peer}, Refused{token:
      Option<CommandToken>, reason: Refusal}, Health(HealthCounters),
      BlockList(Vec<IdentityPk>), BlockListUnreadable. Every command with a token
      is answered by Sent, Deleted or Refused. Health is emitted once at startup
      and then when a counter changes, at most once per scheduled wake. BlockList
      lists every blocked identity in ascending byte order: once at startup
      straight after the first Roster, after each Block and Unblock the store
      accepted (changed or not), and when an unreadable list reads again; a
      refused Block or Unblock emits none. BlockListUnreadable replaces it at
      startup, and follows a later failed read of a known list, when the list
      cannot be read or decoded or its record is gone: blocked state is unknown,
      and the runner scans no drop and collects no conversation until a read
      succeeds. An absent record is created empty only at startup, never while
      running. Debug omits bodies and keys.
  - name: ConversationSummary
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      One roster row: peer, peer_identity_pk, state (ConversationState Pending or
      Established), peer_collected (the correspondent's cursor) and uncollected
      (send_seq minus that cursor).
  - name: ConversationState
    module: daemonseed_veilid_net::dm::runner
    kind: enum
    description: >-
      Pending (this side's first contact awaits acceptance, or this side's
      acceptance of the correspondent's has not finished) or Established.
  - name: CommandToken
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: A caller-chosen u64 echoed on the Sent or Refused event answering a command.
  - name: ContactRequestId
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      The runner's id for a surfaced hello: a value drawn once per run and a
      serial within the run, so an id from an earlier run is refused. It stays
      the same while the same identity's hello keeps surfacing. No public
      constructor, except ContactRequestId::for_test(epoch: u64, serial: u64) ->
      Self under the crate's `test-support` cargo feature (off by default), for a
      front end's tests to build ContactRequest and StartedOver events.
  - name: Refusal
    module: daemonseed_veilid_net::dm::runner
    kind: enum
    description: >-
      UnknownConversation (also a conversation whose delete is under way),
      UnknownRequest, StartedOverNotAcceptable, RingFull (63
      messages uncollected), AwaitingAcceptance, AcceptanceUnfinished (this side's acceptance has not
      finished; the repair poll carries it on), AlreadyEstablished, NoAdvert,
      DropFull, BlockListFull (a Block past the maximum), Store (also a stored
      block list that is absent or does not decode, and an Accept while it will
      not read), Network, Flow, ShuttingDown (the runner stopped with the command
      still queued). An Accept of a request whose identity the block list holds
      is UnknownRequest.
  - name: HealthCounters
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      Counters since the runner started: reads, inspects and writes per record
      kind (advert, drop, channel, plus channel opens and erasures), each as a
      _failures counter (refused) and a _timeouts counter (ran out of time, as
      RunnerRecords::classify classes it; the drop inspect counters include the
      scan's inspect before its first slot read), local_refusals (calls refused
      before they reached the network),
      advert_failures, network_not_answering (a record with no network number on
      any subkey in a pass where this node's own advert showed none either, or
      the inspect of that advert failed, left alone), hellos_dropped (blocked
      sender),
      hellos_already_collected, hellos_unsettled, conversation_failures,
      store_failures (a block list that will not read adds one at startup and one
      for each later drop scan that meets it) and
      requests_evicted (held requests dropped, oldest-seen first, above one per
      drop slot).
  - name: ShutdownOutcome
    module: daemonseed_veilid_net::dm::runner
    kind: enum
    description: >-
      Finished(Result<(), RunnerError>), Panicked, or TimedOut(TaskEnd): the
      grace period ended with a flow call in progress, which was not
      interrupted.
  - name: TaskEnd
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      A runner task still inside a flow call when its shutdown's grace period
      ended. is_finished() reports whether it has ended; finish() waits for it
      and returns a RunnerStop with every event emitted meanwhile. The call may
      still save a collection cursor or an acceptance, and the bodies it read
      are lost if the TaskEnd is dropped unfinished. The profile must not be
      opened again until the task has ended.
  - name: RunnerStop
    module: daemonseed_veilid_net::dm::runner
    kind: struct
    description: >-
      What RunnerHandle::shutdown returns: outcome (ShutdownOutcome) and
      undelivered (every event emitted and not read, in order).
  - name: RunnerError
    module: daemonseed_veilid_net::dm::runner
    kind: enum
    description: Store(StoreError) or Advert(AdvertError), a startup failure that stopped the runner.
  - name: OwnerSeed
    module: daemonseed_veilid_net::identity
    kind: struct
    description: >-
      A rendezvous record's 32-byte Ed25519 owner seed — the VLD0 secret that signs
      writes to that record. Constructed by OwnerSeed::new from a seed the caller
      derived in daemonseed-core; as_bytes yields the raw seed for
      rendezvous_owner_keypair. Debug is redacted; the type is not zeroize-on-drop.
  - name: OperatorCredential
    module: daemonseed_veilid_net::identity
    kind: struct
    description: >-
      What the operator instance holds: the project-announce signing keypair and the
      announce record's owner seed, both derived from one runtime-loaded project seed and
      both checked against the keys baked into the build before either is handed out.
      Not Clone; Debug redacted. Held for the session by the instance that writes the
      announce record; every other instance has none and subscribes on
      PROJECT_ANNOUNCE_OWNER_PUBKEY alone.
    security:
      contains_secret: true
  - name: OperatorCredentialError
    module: daemonseed_veilid_net::identity
    kind: enum
    description: >-
      Why an operator credential could not be built — Seed(ProjectAnnounceSeedError),
      Signer(KeyDerivationError), Owner(AnnounceOwnerError), NotTheBakedSigner (the seed
      derives a signing key that is not the expected one), or NotTheBakedOwner (the seed
      derives an announce owner key that is not the expected one).
  - name: OwnerPublic
    module: daemonseed_veilid_net::identity
    kind: struct
    description: >-
      A rendezvous owner's 32-byte Ed25519 public key — enough to address, read and
      watch the record, never enough to write it. Two constructors and no others:
      OwnerPublic::of_seed runs the one-way derivation from an OwnerSeed, and the const
      OwnerPublic::baked admits a key already baked into the source. There is no
      From<[u8; 32]> and no public field. Debug renders the first four bytes as hex
      followed by "..", never the whole value: baked cannot tell a public key from a
      seed, so truncating here caps what a mis-wrapped seed could print through any
      derived Debug that contains one.
  - name: RendezvousOwner
    module: daemonseed_veilid_net::identity
    kind: enum
    description: >-
      How this party holds a rendezvous record's owner. subscribe_room,
      resweep_rendezvous, repair_rendezvous and rendezvous_record_key take it in place of
      a raw owner seed. One record may be held as either variant, including within a
      single process: every piece of per-record state the engine keeps — the open cache,
      the record locks, the repair in-flight set — keys on the owner public key, which
      both variants yield, so the two name one entry rather than two. Whether the cached
      handle carries a writer does not decide whether a write succeeds —
      rendezvous::publish_at_subkey, the crate's only write site, passes its own writer
      explicitly, and veilid-core prefers the call's writer over the handle's
      (veilid-core-0.5.7 src/storage_manager/set_value.rs:82-85). That is a dependency,
      not an incidental: a write site that stopped passing an explicit writer would fall
      back to the cached handle's writer and fail wherever another path had opened the
      record read-only first.
    variants:
      - name: Held
        description: >-
          Carries the OwnerSeed. A circle or public-room member, and the instance that
          writes the project-announce record. Subscribing may deterministically create a
          record that does not exist yet. RendezvousOwner::held wraps a raw derived seed
          in one step; RendezvousOwner::resolve yields ResolvedOwner::Writer.
      - name: PublicOnly
        description: >-
          Carries the OwnerPublic. A client reading the project-announce/MOTD record. It
          holds no secret, so RendezvousOwner::resolve yields ResolvedOwner::ReadOnly and
          the engine opens the record with no writer and never creates it.
  - name: ResolvedOwner
    module: daemonseed_veilid_net::identity
    kind: enum
    description: >-
      A RendezvousOwner resolved into the veilid key the engine opens the record with.
      One difference reaches the network: a Writer opens with the owner keypair and may
      create the record and sign writes to it; a ReadOnly opens with no writer, so the
      record must already exist — a read-only open never creates it — and no owner secret
      is derived or held, so a caller that needs to write cannot produce the owner keypair
      a write to that record takes. Everything else —
      the DHT address, the open-cache id, the record lock — comes from
      ResolvedOwner::public_key, which is the same value in both arms for one record. No
      Debug: veilid's KeyPair renders its secret half.
    variants:
      - name: Writer
        description: The veilid KeyPair — address, read, watch, create and write.
      - name: ReadOnly
        description: The OwnerPublic — address, read and watch a record that already exists.
  - name: RecordId
    module: daemonseed_veilid_net::schedule
    kind: type_alias
    description: "[u8; 32] — a DHT record's identity, the rendezvous owner seed. The scope a write's enqueue order and coalescing are measured in."
  - name: WriteClass
    module: daemonseed_veilid_net::schedule
    kind: enum
    description: >-
      A write's priority class, highest first. `rank()` is the sort key, 1 to 5.
      Reordering by class is across records only; one record's writes dispatch in
      enqueue order whatever their classes.
    variants:
      - name: Chat
        description: Rank 1 — chat / user-action writes. Draws the dedicated chat dispatch pool, is never counted against the non-chat window, and is retained by the shutdown flush.
      - name: SessionBoundary
        description: Rank 2 — presence join/leave and share withdraw.
      - name: AdvertRefresh
        description: Rank 3 — share-advert refresh.
      - name: Keepalive
        description: Rank 4 — presence beacon and operator MOTD keepalive.
      - name: Republish
        description: Rank 5 — post-warmup republish writes.
  - name: WriteKind
    module: daemonseed_veilid_net::schedule
    kind: enum
    description: >-
      How a write interacts with coalescing and dominance. The key is the logical id,
      never the physical subkey.
    variants:
      - name: Ring
        description: An append-ring write; never coalesced and never dropped. Carries no logical id.
      - name: "CurrentState { logical_id: String }"
        description: A last-writer-wins write; a queued one is dropped when a newer write for the same record and logical id arrives, and its reply resolves Ok.
      - name: "Tombstone { logical_id: String }"
        description: A withdraw; never coalesced, and it dominates same-id current-state writes queued or in flight, which are dropped rather than landing after it.
  - name: WriteRequest
    module: daemonseed_veilid_net::schedule
    kind: struct
    description: >-
      One write submitted to the funnel, generic over the sink's dispatch token.
      WriteSchedulerHandle::enqueue takes it; WriteRequest::direct_message builds the
      direct-messaging shape of it.
    fields:
      - name: record
        type: RecordId
        description: The target DHT record — the enqueue-order and coalescing scope.
      - name: class
        type: WriteClass
        description: The priority class.
      - name: kind
        type: WriteKind
        description: The coalescing and dominance behavior.
      - name: deadline
        type: "Option<Instant>"
        description: A hard DHT expiry; once passed the write dispatches ahead of class order on the floor lane.
      - name: item
        type: D
        description: The opaque dispatch token handed to the WriteSink at dispatch.
      - name: reply
        type: "Option<oneshot::Sender<Result<()>>>"
        description: Fired with the write result, or Ok when the write is coalesced away by a winning same-id write.
  - name: DirectMessageWrite
    module: daemonseed_veilid_net::schedule
    kind: enum
    description: >-
      A write named by the direct-messaging write budget. A request built by
      WriteRequest::direct_message carries WriteClass::Chat plus WriteKind::Ring and no
      other shape: the class draws the chat dispatch lane and is retained by the
      shutdown flush, the kind is what the funnel never coalesces and never drops. A
      Chat-class WriteKind::CurrentState write is coalescible, so the class alone does
      not carry that. `ALL` is the array of every variant.
    variants:
      - name: Advert
        description: ADVERT subkey 0 — the signed advert carrying the current ML-KEM-1024 public key.
      - name: Hello
        description: A DROP slot — one first-contact hello.
      - name: HelloErase
        description: A DROP slot — the recipient's erasure of a hello it has collected.
      - name: ChannelOpening
        description: CHAN subkey 0 — the channel opening.
      - name: MessageSlot
        description: A CHAN message-ring subkey — one message.
      - name: Cursor
        description: CHAN subkey 0 — the writer's collected cursor.
      - name: SlotRepair
        description: A CHAN message-ring subkey — the rewrite of a slot a storage node evicted.
      - name: ClosedMarker
        description: CHAN subkey 0 — the marker naming the conversation closed, written before the record is erased.
      - name: ChannelErase
        description: The erasure of the writer's own channel record, on delete-conversation.
  - name: WriteScheduler
    module: daemonseed_veilid_net::schedule
    kind: struct
    description: >-
      The scheduler entry point — a unit struct carrying the two constructors.
      `spawn(sink, cfg)` starts the driver task and returns a WriteSchedulerHandle
      generic over the sink's Item. `spawn_with_probe(sink, cfg, latency_probe)` does the
      same and additionally publishes, on each non-chat completion, the median of the
      last five non-chat enqueue-to-ack latencies in milliseconds into the supplied
      Arc<AtomicU64>; a partial window is padded with zeros, and no consumer of that
      value may enqueue writes from it. The driver task runs until every handle is
      dropped or WriteSchedulerHandle::shutdown completes.
  - name: WriteSchedulerHandle
    module: daemonseed_veilid_net::schedule
    kind: struct
    description: >-
      A cloneable handle onto one running scheduler task, generic over the sink's
      dispatch token. `enqueue(req)` submits a write and `shutdown(budget)` runs the
      graceful-close flush. Every clone addresses the same scheduler.
  - name: WriteSink
    module: daemonseed_veilid_net::schedule
    kind: trait
    description: >-
      The seam over the physical DHT write. The scheduler decides when, in what order and
      on which DispatchLane a write goes out; the sink acquires that lane's DhtGate
      permit, performs exactly one write, and returns a DispatchOutcome. The associated
      type Item is the opaque per-write dispatch token the scheduler carries and hands
      back at dispatch. `dispatch(&self, item: Self::Item, lane: DispatchLane)` returns a
      pinned boxed Send future, which the scheduler spawns off its driver loop. Bounds
      are Send + Sync + 'static.
  - name: daemonseed_veilid_net::schedule::DispatchLane
    kind: enum
    description: >-
      Which DhtGate pool a dispatched write draws. The scheduler picks the lane and the
      sink acquires the matching pool; there is no cross-pool fallback, so the combined
      in-flight count is pool arithmetic.
    variants:
      - name: Chat
        description: The chat pool, for chat and user-action writes. A chat write never waits on a non-chat pool.
      - name: Floor
        description: The one-permit floor pool — the starvation floor and the deadline lane, an additional guaranteed write slot.
      - name: Window
        description: The non-chat window pool, capped at W_MAX.
  - name: DispatchOutcome
    module: daemonseed_veilid_net::schedule
    kind: struct
    description: >-
      The result of one WriteSink dispatch. `bare(result)` builds one carrying no
      acquire-wait signal.
    fields:
      - name: result
        type: "Result<()>"
        description: The DHT write result.
      - name: acquire_wait
        type: "Option<Duration>"
        description: The delay the sink observed between requesting its DhtGate permit and holding one. Telemetry only — no scheduler, gate or window logic consumes it. None when the transport cannot surface it.
  - name: SchedulerConfig
    module: daemonseed_veilid_net::schedule
    kind: struct
    description: >-
      The scheduler's tunable parameters, passed to WriteScheduler::spawn. Copy, and its
      Default is nonchat_cap 2 with age bounds 2s / 30s / 60s / 120s / 90s.
    fields:
      - name: nonchat_cap
        type: usize
        description: W_max — the non-chat window ceiling. The window is min(distinct pending non-chat records, nonchat_cap) and tracks no latency signal.
      - name: age_bounds
        type: "[Duration; 5]"
        description: Per-class starvation age bound, indexed by WriteClass::rank() - 1. A write older than its bound escalates one class on the window lane; at twice its bound it becomes eligible for the floor lane. Both are measured against the write's starvation clock, which survives coalescing.
  - name: DhtGate
    module: daemonseed_veilid_net::dht_gate
    kind: struct
    description: >-
      The partitioned DHT permit accountant, shared as an Arc by the write sink and every
      read-lane call site so all lanes draw on one partition. It holds four dedicated
      pools — chat CHAT_PERMITS, floor FLOOR_PERMITS, window W_MAX, read READ_PERMITS,
      summing to DHT_BUDGET — plus a separate DHT_GATE_MARGIN-sized limiter for the
      un-gated open_dht_record and watch_dht_values calls. `new()` builds the four pools
      at those sizes and `with_pools(chat, floor, write, read)` at explicit ones, each
      forced to at least 1. `acquire_chat`, `acquire_floor`, `acquire_write`,
      `acquire_read` and `acquire_ungated` each await a GatePermit from one pool and are
      FIFO-fair within it; a read permit is held around one get_dht_value and released
      before the next. A caller holds a permit from at most one of the four pools at a
      time, and never holds a read permit across an acquire_ungated. `available_chat`,
      `available_floor`, `available_write`, `available_read` and `available_ungated`
      report a pool's free permits, and `total_in_flight(chat, floor, write, read)` takes
      the four pool sizes and returns their summed occupancy.
  - name: GatePermit
    module: daemonseed_veilid_net::dht_gate
    kind: struct
    description: >-
      One held DHT-op permit from exactly one DhtGate pool. Dropping it, including on a
      panic unwind, releases the permit back to that pool.
    fields:
      - name: acquire_wait
        type: Duration
        description: The delay between requesting the permit and holding it. Telemetry only — no scheduler, gate or window logic consumes it.

# ─────────────────────────────────────────────────────────────────────
# Functions
# ─────────────────────────────────────────────────────────────────────

functions:
  # ── actor: bring-up ──────────────────────────────────────────────────
  - name: VeilidNet::start
    module: daemonseed_veilid_net::actor
    description: Bring up the node with a daemonseed-derived identity, spawn the actor, and return the handle plus a stream of events. Does NOT attach.
    signature: "pub async fn start(cfg: VeilidNetConfig) -> Result<(VeilidNetHandle, mpsc::UnboundedReceiver<VeilidNetEvent>)>"
    parameters:
      - name: cfg
        type: VeilidNetConfig
        direction: in
        description: Node bring-up configuration.
    returns:
      type: "Result<(VeilidNetHandle, mpsc::UnboundedReceiver<VeilidNetEvent>)>"
      description: The command handle and the event stream, or a startup error.

  # ── actor: VeilidNetHandle ───────────────────────────────────────────
  - name: VeilidNetHandle::attach_and_wait
    module: daemonseed_veilid_net::actor
    description: Attach and poll until public-internet-ready or the deadline elapses.
    signature: "pub async fn attach_and_wait(&self, timeout_secs: u64) -> Result<()>"
    parameters:
      - name: timeout_secs
        type: u64
        direction: in
        description: Deadline for reaching public-internet-ready.
    returns:
      type: "Result<()>"
      description: Ok when ready; NotReady on timeout.
  - name: VeilidNetHandle::new_inbound_route
    module: daemonseed_veilid_net::actor
    description: Allocate a private inbound route; the returned blob never exposes this node's id or IP.
    signature: "pub async fn new_inbound_route(&self) -> Result<RouteBlob>"
    parameters: []
    returns:
      type: "Result<RouteBlob>"
      description: The route blob a peer addresses.
  - name: VeilidNetHandle::import_route
    module: daemonseed_veilid_net::actor
    description: Import a peer's private-route blob, returning the route id to send to.
    signature: "pub async fn import_route(&self, blob: Vec<u8>) -> Result<RouteId>"
    parameters:
      - name: blob
        type: "Vec<u8>"
        direction: in
        description: A peer's private-route blob.
    returns:
      type: "Result<RouteId>"
      description: The imported route id.
  - name: VeilidNetHandle::release_route
    module: daemonseed_veilid_net::actor
    description: Release a previously imported peer route.
    signature: "pub async fn release_route(&self, route_id: RouteId)"
    parameters:
      - name: route_id
        type: RouteId
        direction: in
        description: The imported route id to release.
    returns:
      type: "()"
      description: None.
  - name: VeilidNetHandle::send_sealed
    module: daemonseed_veilid_net::actor
    description: Send a sealed 1:1 payload over a peer's private route.
    signature: "pub async fn send_sealed(&self, route: RouteId, sealed: Vec<u8>) -> Result<()>"
    parameters:
      - name: route
        type: RouteId
        direction: in
        description: The imported peer route.
      - name: sealed
        type: "Vec<u8>"
        direction: in
        description: The cot-sealed payload.
    returns:
      type: "Result<()>"
      description: Ok on send, else a Send error.
  - name: VeilidNetHandle::publish_circle
    module: daemonseed_veilid_net::actor
    description: Publish a sealed payload to a circle's shared-owner rendezvous append-ring.
    signature: "pub async fn publish_circle(&self, owner_seed: [u8; 32], sealed: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The circle's rendezvous-owner seed (daemonseed_core::derive_circle_veilid_owner_seed).
      - name: sealed
        type: "Vec<u8>"
        direction: in
        description: The circle-key-sealed message.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. This is a Ring
        write and is never coalesced.
  - name: VeilidNetHandle::subscribe_circle
    module: daemonseed_veilid_net::actor
    description: Open + watch + backlog-sweep a circle's rendezvous record; inbound messages arrive as VeilidNetEvent::Inbound.
    signature: "pub async fn subscribe_circle(&self, owner_seed: OwnerSeed) -> Result<()>"
    parameters:
      - name: owner_seed
        type: OwnerSeed
        direction: in
        description: The circle's rendezvous-owner seed.
    returns:
      type: "Result<()>"
      description: Ok once subscribed.
  - name: VeilidNetHandle::publish_room
    module: daemonseed_veilid_net::actor
    description: Publish a sealed payload to a public room / lobby rendezvous (a room message, or a ShareAnnouncement for share discovery). Mechanics identical to publish_circle; only the owner seed differs.
    signature: "pub async fn publish_room(&self, owner_seed: [u8; 32], sealed: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The public-room rendezvous-owner seed (daemonseed_core::derive_room_veilid_owner_seed), world-derivable.
      - name: sealed
        type: "Vec<u8>"
        direction: in
        description: Payload sealed under the room's PublicRoomKey.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. This is a Ring
        write and is never coalesced.
  - name: VeilidNetHandle::subscribe_room
    module: daemonseed_veilid_net::actor
    description: Open + watch + backlog-sweep a public room / lobby rendezvous; inbound sealed room messages / share announcements arrive as VeilidNetEvent::Inbound.
    signature: "pub async fn subscribe_room(&self, owner: RendezvousOwner) -> Result<bool>"
    parameters:
      - name: owner
        type: RendezvousOwner
        direction: in
        description: The record's rendezvous owner. Held carries the owner seed; PublicOnly carries only the owner public key.
    returns:
      type: "Result<bool>"
      description: >-
        Whether a record was opened and watched. A PublicOnly owner opens the record
        read-only; a record that is absent is Ok(false) with no watch registered, and a
        later call picks it up once it exists. A caller that remembers "this record is
        subscribed" must remember it only on true, or one absent first pass costs it
        push updates for as long as it holds that memory. A Held owner opens-or-creates,
        so it answers true whenever it answers Ok.
  - name: VeilidNetHandle::resweep_rendezvous
    module: daemonseed_veilid_net::actor
    description: Re-run the one-shot backlog sweep on an already-subscribed rendezvous record WITHOUT registering another watch — the recovery primitive for an item published during the post-(re)connect watch-warmup window (#132/#133) and for re-resolving a stale-route share (#118).
    signature: "pub async fn resweep_rendezvous(&self, owner: RendezvousOwner) -> Result<()>"
    parameters:
      - name: owner
        type: RendezvousOwner
        direction: in
        description: The record's rendezvous owner.
    returns:
      type: "Result<()>"
      description: >-
        Ok once the re-sweep is dispatched; re-swept items arrive as Inbound and are
        deduped downstream. A PublicOnly owner whose record is absent is Ok with nothing
        swept.
  - name: VeilidNetHandle::repair_rendezvous
    module: daemonseed_veilid_net::actor
    description: Re-establish a rendezvous record's session under its record_lock — invalidate the open-cache entry, re-open, re-watch, and full re-sweep. Re-swept backlog arrives as VeilidNetEvent::Inbound.
    signature: "pub async fn repair_rendezvous(&self, owner: RendezvousOwner) -> Result<()>"
    parameters:
      - name: owner
        type: RendezvousOwner
        direction: in
        description: The record's rendezvous owner.
    returns:
      type: "Result<()>"
      description: >-
        Ok once the repair is dispatched. A PublicOnly owner re-opens read-only, and a
        record that cannot be found is an error here rather than a state to wait out — a
        repair re-establishes a session that was working.
  - name: VeilidNetHandle::rendezvous_record_key
    module: daemonseed_veilid_net::actor
    description: Derive a rendezvous record's RecordKey from its owner locally (no network) — the owner→key resolution the self-heal needs.
    signature: "pub async fn rendezvous_record_key(&self, owner: RendezvousOwner) -> Result<RecordKey>"
    parameters:
      - name: owner
        type: RendezvousOwner
        direction: in
        description: The record's rendezvous owner.
    returns:
      type: "Result<RecordKey>"
      description: >-
        The record's deterministic key. Both owner variants resolve to the same key: the
        address is a function of the owner's public half alone.
  - name: VeilidNetHandle::dm_records_parts
    module: daemonseed_veilid_net::actor
    description: >-
      Hand out the transport state a VeilidRecords is built over. Every value in
      it is a clone of one the actor holds, so a record store built from it shares
      the node's open-record cache, its per-record locks, its DHT gate and its
      write scheduler.
    signature: "pub async fn dm_records_parts(&self) -> Result<VeilidRecordsParts>"
    returns:
      type: "Result<VeilidRecordsParts>"
      description: The parts, or an actor error where the actor task is gone.
  # ── dm: the runner ───────────────────────────────────────────────────
  - name: spawn_runner
    module: daemonseed_veilid_net::dm::runner
    description: >-
      Start a runner on the current tokio runtime with a command queue of
      COMMAND_QUEUE (64) and an event queue of EVENT_QUEUE (256). Over
      VeilidRecords the runtime must be multi-thread.
    signature: "pub fn spawn_runner<R>(parts: RunnerParts<R>) -> RunnerHandle where R: RunnerRecords + Send + 'static"
    returns:
      type: RunnerHandle
      description: The handle; a startup failure ends the task and closes the event stream.
  - name: RunnerHandle::shutdown
    module: daemonseed_veilid_net::dm::runner
    description: >-
      Ask the task to stop, read its events while it finishes the flow call in
      progress, and wait at most RunnerConfig::grace. After the call the task
      starts no flow call that writes, and every command still queued is
      answered Refused ShuttingDown. A call still running at the end of the grace
      period is not interrupted; the outcome is TimedOut with a TaskEnd.
    signature: "pub async fn shutdown(self) -> RunnerStop"
    returns:
      type: RunnerStop
      description: How the task ended, and every event not yet read.
  - name: TaskEnd::finish
    module: daemonseed_veilid_net::dm::runner
    description: >-
      Wait for a timed-out runner task to end, reading its events meanwhile.
    signature: "pub async fn finish(self) -> RunnerStop"
    returns:
      type: RunnerStop
      description: Finished or Panicked, and every event the task emitted after the shutdown returned.
  - name: RunnerParts::over_veilid
    module: daemonseed_veilid_net::dm::records
    description: Build RunnerParts over a VeilidRecords made from VeilidRecordsParts.
    signature: "pub fn over_veilid(parts: VeilidRecordsParts, signer: Arc<SignKeypair>, channel_root: DmChannelRootSecret, at_rest_key: Zeroizing<[u8; AEAD_KEY_LEN]>, profile_root: PathBuf, config: RunnerConfig) -> Result<Self, RecordsError>"
    returns:
      type: "Result<RunnerParts<VeilidRecords>, RecordsError>"
      description: The parts, or the error VeilidRecords::new returns off a multi-thread runtime worker.
  - name: VeilidRecords::inspect_channel
    module: daemonseed_veilid_net::dm::records
    description: >-
      A local inspect and a SyncSet inspect of a channel record, as one
      SubkeyReport per subkey, pending taken from the local report's flush queue.
      Both reports must start at subkey 0. An own channel opens under its
      keypair, any other read-only; an absent record reports no numbers.
    signature: "pub fn inspect_channel(&mut self, lookup_key: &[u8; HELLO_LOOKUP_KEY_LEN]) -> Result<Vec<SubkeyReport>, RecordError>"
    returns:
      type: "Result<Vec<SubkeyReport>, RecordError>"
      description: One report per subkey, indexed by subkey.
  - name: VeilidRecords::inspect_advert
    module: daemonseed_veilid_net::dm::records
    description: The same two inspects over the advert record the seed owns.
    signature: "pub fn inspect_advert(&mut self, owner: &AdvertOwnerSeed, subkeys: u16) -> Result<Vec<SubkeyReport>, RecordError>"
    returns:
      type: "Result<Vec<SubkeyReport>, RecordError>"
      description: One report per subkey, indexed by subkey.
  - name: VeilidRecords::inspect_drop
    module: daemonseed_veilid_net::dm::records
    description: The same two inspects over the drop record the seed owns.
    signature: "pub fn inspect_drop(&mut self, owner: &DropOwnerSeed, subkeys: u16) -> Result<Vec<SubkeyReport>, RecordError>"
    returns:
      type: "Result<Vec<SubkeyReport>, RecordError>"
      description: One report per slot, indexed by slot.
  - name: VeilidNetHandle::publish_presence
    module: daemonseed_veilid_net::actor
    description: Publish a sealed member-presence beacon to a per-member current-state slot on the presence sibling rendezvous record; a re-beacon overwrites the same slot (last-writer-wins). The presence record is distinct from the chat rendezvous, so a beacon never evicts chat backlog. member_pubkey owns the stable-slot-id encoding (member_slot_id, hex) so all callers agree. The slot count is bounded (SUBKEY_COUNT), so at unbounded membership two members can slot-share (a bounded, self-healing degradation). The app net actor holds the keys and runs the emit/ingest/reap loop; a receiver subscribes via subscribe_room on the same presence owner seed.
    signature: "pub async fn publish_presence(&self, owner_seed: [u8; 32], member_pubkey: &[u8], sealed: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The presence sibling record's rendezvous-owner seed (daemonseed_core::derive_room_presence_veilid_owner_seed / derive_circle_presence_veilid_owner_seed).
      - name: member_pubkey
        type: "&[u8]"
        direction: in
        description: The beacon's stable identity pubkey; hex-encoded to a slot id via member_slot_id.
      - name: sealed
        type: "Vec<u8>"
        direction: in
        description: The opaque sealed MemberHeartbeat.
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. The funnel also
        answers Ok when the write is coalesced away by a later same-record, same-logical-id
        write, and when a tombstone dominates it.
  - name: VeilidNetHandle::publish_current_state
    module: daemonseed_veilid_net::actor
    description: Publish opaque bytes to a named current-state slot (last-writer-wins) on an owner-gated rendezvous record — the Phase-4 A-b operator announcements/MOTD record. The write is owner-signed, so only a holder of owner_seed (the non-derivable project-announce owner from daemonseed_core::derive_project_announce_veilid_owner_seed — the write-gate) can place a value; clients subscribe_room and read/verify but cannot write. slot_id is the stable slot key ("motd", or an announcement's content address); bytes is a public signed SignedArtifact (verified client-side by verify_artifact, not AEAD-sealed). Spawned off-loop, per-record serialized.
    signature: "pub async fn publish_current_state(&self, owner_seed: [u8; 32], slot_id: &str, bytes: Vec<u8>) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The operator record's owner seed (the write-gate secret).
      - name: slot_id
        type: "&str"
        direction: in
        description: The stable slot key ("motd" or an announcement's content address).
      - name: bytes
        type: "Vec<u8>"
        direction: in
        description: The opaque payload (a signed SignedArtifact).
    returns:
      type: "Result<()>"
      description: >-
        Ok means the write left this layer, NOT that it reached the DHT. The funnel also
        answers Ok when the write is coalesced away by a later same-record, same-logical-id
        write, and when a tombstone dominates it.
  - name: member_slot_id
    module: daemonseed_veilid_net::actor
    description: The stable presence-slot id for a member — its identity pubkey, hex-encoded. A pure function of the member's stable identity, so a re-beacon overwrites the same current_state_subkey slot and all callers agree byte-for-byte.
    signature: "pub fn member_slot_id(member_pubkey: &[u8]) -> String"
    parameters:
      - name: member_pubkey
        type: "&[u8]"
        direction: in
        description: The member's identity pubkey.
    returns:
      type: "String"
      description: The lowercase-hex slot id.
  - name: VeilidNetHandle::serve_share
    module: daemonseed_veilid_net::actor
    description: Register a share to serve owner-on-demand; the actor answers inbound fragment app_calls for share_id from content, sealing each response under room_key. The sharer must stay online to serve (ISC-A-S21).
    signature: "pub async fn serve_share(&self, share_id: String, content: Arc<dyn ChunkSource + Send + Sync>, room_key: [u8; 32]) -> Result<()>"
    parameters:
      - name: share_id
        type: String
        direction: in
        description: The share's stable id (daemonseed_core::share_announce::derive_share_id_v2).
      - name: content
        type: "Arc<dyn ChunkSource + Send + Sync>"
        direction: in
        description: The share's content source — DiskShareContent to serve from disk at O(CHUNK_SIZE) memory, ShareContent to serve from RAM.
      - name: room_key
        type: "[u8; 32]"
        direction: in
        description: The share's PublicRoomKey bytes (responses seal under it).
    returns:
      type: "Result<()>"
      description: Ok once registered.
  - name: VeilidNetHandle::fetch_manifest
    module: daemonseed_veilid_net::actor
    description: Fetch + reassemble + open a share's manifest from the sharer at a private route.
    signature: "pub async fn fetch_manifest(&self, route: RouteId, share_id: &str, room_key: [u8; 32]) -> Result<Vec<ManifestEntry>>"
    parameters:
      - name: route
        type: RouteId
        direction: in
        description: The imported sharer route (anti-swap-verified at discovery before import).
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: room_key
        type: "[u8; 32]"
        direction: in
        description: The share's PublicRoomKey bytes.
    returns:
      type: "Result<Vec<ManifestEntry>>"
      description: The manifest entries, or a transport / NotServed error.
  - name: VeilidNetHandle::fetch_manifest_budgeted
    module: daemonseed_veilid_net::actor
    description: Budget-admitted fetch_manifest — every fragment app_call is admitted through the shared per-route RouteBudget via lease. The scheduler leases once per download and shares the lease across the manifest + every chunk (#204).
    signature: "pub async fn fetch_manifest_budgeted(&self, route: RouteId, share_id: &str, room_key: [u8; 32], lease: &RouteLease<RouteId>) -> Result<Vec<ManifestEntry>>"
    parameters:
      - name: route
        type: RouteId
        direction: in
        description: The imported sharer route.
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: room_key
        type: "[u8; 32]"
        direction: in
        description: The share's PublicRoomKey bytes.
      - name: lease
        type: "&RouteLease<RouteId>"
        direction: in
        description: The download's shared per-route budget lease.
    returns:
      type: "Result<Vec<ManifestEntry>>"
      description: The manifest entries, or a classified fetch error.
  - name: VeilidNetHandle::fetch_chunk_budgeted
    module: daemonseed_veilid_net::actor
    description: Budget-admitted fetch_chunk — SHA-384-verifies the chunk (ISC-S28 / ISC-A-S20) and admits every fragment app_call through the shared per-route budget via lease; the controller's observations are fed internally (the caller never calls observe).
    signature: "pub async fn fetch_chunk_budgeted(&self, route: RouteId, share_id: &str, chunk_addr: ChunkAddr, room_key: [u8; 32], lease: &RouteLease<RouteId>) -> Result<(Vec<u8>, Duration)>"
    parameters:
      - name: route
        type: RouteId
        direction: in
        description: The imported sharer route.
      - name: share_id
        type: "&str"
        direction: in
        description: The share id.
      - name: chunk_addr
        type: ChunkAddr
        direction: in
        description: The content-address of the chunk to fetch.
      - name: room_key
        type: "[u8; 32]"
        direction: in
        description: The share's PublicRoomKey bytes.
      - name: lease
        type: "&RouteLease<RouteId>"
        direction: in
        description: The download's shared per-route budget lease.
    returns:
      type: "Result<(Vec<u8>, Duration)>"
      description: The verified chunk bytes and the max per-fragment latency observed.
  - name: run_download
    module: daemonseed_veilid_net::download
    description: The shared download engine — fetch a set of PlannedFiles' chunks in parallel under the budget behind fetch_chunk, write each verified chunk into staging at its offset, promote each file on completion, and dispose staging by failure class. progress(chunks_done, bytes_done) reports cumulative totals.
    signature: "pub async fn run_download<FetchChunk, Fut, Prog>(files: &[PlannedFile], staging: &StagingArea, fetch_chunk: &FetchChunk, progress: &Prog) -> DownloadOutcome"
    parameters:
      - name: files
        type: "&[PlannedFile]"
        direction: in
        description: The placed files to fetch (dest_rel + size + chunk addresses).
      - name: staging
        type: "&StagingArea"
        direction: in
        description: The fetch's reserved staging area (daemonseed_core::storage::fetched).
      - name: fetch_chunk
        type: "&FetchChunk"
        direction: in
        description: Fn(ChunkAddr) -> Future<Result<Vec<u8>, VeilidNetError>> returning already-verified bytes — bind to fetch_chunk_budgeted on one lease.
      - name: progress
        type: "&Prog"
        direction: in
        description: Fn(u32, u64) + Sync called with cumulative (chunks, bytes) after each verified chunk.
    returns:
      type: DownloadOutcome
      description: The terminal outcome; staging is disposed by class before returning.
  - name: VeilidNetHandle::publish_share
    module: daemonseed_veilid_net::actor
    description: Announce a public share to the lobby with an anti-swap SIGNED route advert — allocate a private route, sign the advert via signer, wrap it with the sealed announcement into a DiscoveryEnvelope, and publish on the lobby rendezvous. When persist is true the advert is remembered and re-published on RouteChanged; when false (a withdraw) it is a one-shot write that releases its own route and is never re-published (#163). Pair with serve_share.
    signature: "pub async fn publish_share(&self, owner_seed: [u8; 32], share_id: String, sealed_announcement: Vec<u8>, signer: Arc<dyn RouteAdvertSigner>, persist: bool) -> Result<()>"
    parameters:
      - name: owner_seed
        type: "[u8; 32]"
        direction: in
        description: The lobby rendezvous-owner seed.
      - name: share_id
        type: String
        direction: in
        description: The share's stable id (also its stable-slot placement key).
      - name: sealed_announcement
        type: "Vec<u8>"
        direction: in
        description: The core ShareAnnouncement sealed under the PublicRoomKey.
      - name: signer
        type: "Arc<dyn RouteAdvertSigner>"
        direction: in
        description: Least-authority capability signing `share_id ‖ route_blob`.
      - name: persist
        type: bool
        direction: in
        description: true for a live share (remembered + re-published on RouteChanged/watchdog); false for a one-shot withdraw, written exactly once and never re-lingered (#163).
    returns:
      type: "Result<()>"
      description: Ok once the advert is published.
  - name: VeilidNetHandle::stop_serve
    module: daemonseed_veilid_net::actor
    description: Stop serving a share and drop its advert (the teeth of unpublish) — inbound fetch app_calls for it are no longer answered and a RouteChanged will not re-publish it; its private route is released.
    signature: "pub async fn stop_serve(&self, share_id: String) -> Result<()>"
    parameters:
      - name: share_id
        type: String
        direction: in
        description: The share to stop serving.
    returns:
      type: "Result<()>"
      description: Ok once de-registered.
  - name: VeilidNetHandle::shutdown
    module: daemonseed_veilid_net::actor
    description: Runs the I7 write-scheduler flush within flush_budget, then shuts the node down. Terminal — every later command on this handle fails.
    signature: "pub async fn shutdown(&self, flush_budget: Duration)"
    parameters:
      - name: flush_budget
        type: Duration
        direction: in
        description: Bound on the flush. The caller's remaining GRACEFUL_CLOSE_BUDGET; pending chat and tombstones dispatch inside it, class-3/4/5 current-state writes are shed, and an overrun abandons to the TTL backstop.
    returns:
      type: "()"
      description: Returns once the flush has completed or expired and the node has shut down.

