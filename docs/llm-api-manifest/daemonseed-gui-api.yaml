# ─────────────────────────────────────────────────────────────────────
# daemonseed-gui — LAMA API Manifest (Slint GUI client; round-3 core wiring)
#
# A binary view-crate that consumes the daemonseed-proto + daemonseed-core +
# daemonseed-cli contract. Round 3 wired the public Lobby room to REAL networking
# via an internal Slint-free net actor (daemonseed_gui::net) — a dedicated-thread
# tokio runtime mirroring daemonseed-tui's net actor. It is still a binary with NO
# published library API surface (the net actor + state machine are internal), so
# this manifest stays a placeholder that grows only if the GUI exposes reusable
# library components.
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Core crate (future data source): ./daemonseed-core-api.yaml
# - Proto contract (future data source): ./daemonseed-proto-protocol.yaml
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-gui
  version: "0.1.0"
  description: >-
    Slint GUI client for daemonseed (round-1 scaffold). The design brief's
    three-zone shell (circle rail / conversation pane / on-demand context sheet)
    ported from the perf spike into structured Slint components, with the alpha
    tab nav (Chat / Shares / a "coming soon" circle-shares placeholder) and a
    command-palette overlay seeded from a Rust-side action registry. Round 2's
    mechanical slice made the rail interactive (click-to-switch) over a Slint-free,
    unit-tested per-circle RAM state machine (daemonseed_gui::state) that retains
    each circle's draft + scroll across switches, fed by a real TextInput composer
    and Flickable transcript. Round 3 wired the public Lobby (rail index 0) to
    REAL networking via an internal Slint-free net actor (daemonseed_gui::net,
    dedicated-thread tokio runtime mirroring daemonseed-tui's net actor):
    connect_session to the relay (ephemeral ClientIdentity), auto-join
    public_room::DEFAULT_ROOM, inbound open_room_message → render, composer
    seal_room_message → publish (+ local echo). The other rail circles keep the
    round-2 local-stub behaviour. Connection identity is ephemeral (no persistent
    identity / first-start yet — a separate milestone). Base build is
    software-renderer-only (offscreen `--screenshot <path>` PNG — the only mode a
    headless terminal can verify); the `desktop` feature forwards
    slint/backend-winit for a real software-rendered window. ISC-C6 (the GUI
    framework commitment) stays unchecked until the on-device mic-permission spike.
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-gui"
  status: "round-3 core wiring — the public Lobby room is wired to REAL networking via an internal Slint-free net actor (daemonseed_gui::net): connect_session to the relay (ephemeral identity), auto-join public_room::DEFAULT_ROOM, real AEAD-sealed chat in/out, UI thread never blocks (NetCommand/NetEvent over tokio::mpsc, drained on a slint::Timer). Other circles keep the round-2 stub; circles-with-phrase + persistent identity/first-start + felt polish are separate milestones. Lobby chat is live-verified by a 2-client felt-test on the fra1 relay. Launch flag: --x11 / DAEMONSEED_X11=1 forces XWayland (winit 0.30's Wayland pointer path drops clicks under VM software rendering; native Wayland stays the default). The public-share net path is BUILT (PublishShare/UnpublishShare/RefreshShares/FetchShare/ConfirmFetch commands + PublishStarted/Stopped/Error, SharesSnapshot/Error, FetchManifest/Progress/Complete/Error events, mirroring daemonseed-tui's share machinery — ShareContent::index_dir publish + serve_share, SHA-384-verified chunk fetch to disk — proven by in-process + live-fra1 round-trips). The Shares-tab UI lands in three commits: (1) DONE — the BROWSE TREE: the tab is an OS-style lazy-expand file tree (each relay share a root node; FetchShare previews its manifest on first expand; the flat manifest is parsed into a dirs-first/alphabetical folder hierarchy) over a Slint-free, unit-tested model (daemonseed_gui::share_browser); RefreshShares fires on tab-open + a manual Refresh button + a ~3s comparative-real-time auto-poll while the tab is open, all reconciled by share_id so a refresh never collapses open folders (the catalog has no relay push — ListPublicShares is unary, so liveness = re-list + reconcile). (2) DONE — download: right-click a tree node (file -> itself, folder -> its files, share -> all, via share_browser::fetch_target) opens the native folder picker (rfd xdg-portal backend, NO GTK link; driven on a dedicated thread + current-thread tokio runtime so the UI never blocks, dispatched to the relay via a Send command-sender clone) and fires ConfirmFetch{flat_dest} (SHA-384-verified bytes to the chosen dir); a simple label+fraction download meter sits in the rail footer (persists across tabs — download keeps running while you return to Chat). rfd needs a running xdg-desktop-portal at runtime only (a system without one falls through to a cancelled pick). (3) PENDING — publish: an overlay (choose folder + name -> PublishShare) + Unpublish, with one's own shares appearing in the same tree. Offscreen render flag --show-shares draws the populated tree (fixture, no relay). Still a binary with no published library API; ISC-C6 unchecked (mic-permission spike pending)"

# The crate is a binary with no published library surface. Internal modules:
# `daemonseed_gui::state` (Slint-free RAM per-circle state machine),
# `daemonseed_gui::net` (Slint-free net actor: NetCommand/NetEvent over a
# dedicated-thread current-thread tokio runtime + LocalSet, mirroring
# daemonseed-tui's net actor; ephemeral ClientIdentity, public-room seal/open), and
# `daemonseed_gui::share_browser` (Slint-free, unit-tested public-share browse-tree
# model: reconcile-by-share_id listing, lazy per-share manifest load, flatten-with-
# depth render rows, and fetch-target resolution for right-click download). None is a
# published API. This manifest grows only if the GUI ever exposes reusable library
# components.
modules: []
public_types: []
public_functions: []
