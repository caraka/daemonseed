# The Definition-of-Done gate. The gate is defined once as a table of steps in
# three groups in `xtask` (`RELEASE_GATE_STEPS`); each job below runs one group.
# `preflight` and `dev-suite` run on every pull request and on `main`.
# `release-suite` runs the whole test suite in the release profile, which
# differs in behaviour (overflow checks, `debug_assertions`) and not only in
# optimisation; it runs on every push to `main`, on manual dispatch, and on pull
# requests from a `release/` branch, but not on other pull requests. A
# profile-only regression is caught within one merge of landing, and a release
# pull request carries all three groups before its commit is tagged.
#
# On `main`, CI can skip a group. It does not re-run one when the newest
# pull-request run of the same commit ID passed it on the same tree. Any doubt
# runs the gate. On a pull request, once a
# job's gate passes, it uploads an artifact named for the job and the tree of the
# merge commit it tested. On a push that is not a force-push, a job first runs
# `scripts/ci/already-passed.sh`, which asks the GitHub API whether the newest
# pull-request run of this commit that ran the same job passed it and recorded
# the pushed commit's tree. A newer run that has not reported this job's result
# answers run. If the check passes, the job skips its setup and gate steps and
# reports success; otherwise, or if the API cannot answer, it runs the gate.
# Comparing trees is what makes the skip sound: a pull-request run tests its head
# merged into whatever base it had, and only a matching tree shows that the
# result applies to what was pushed. This covers a merge that lands the pull
# request's head with its commit ID unchanged; a squash or rebase merge lands a
# new commit ID and always runs the gate. Pull requests and manual dispatch
# always run the gate.
#
# The pre-push hook runs the `preflight` group, and `cargo xtask release-gate`
# runs all three groups locally.
#
# The live-network tests are excluded by their `#[ignore]` attribute and are NOT
# covered by this workflow. No job opts back into ignored tests; a unit test in
# `xtask` asserts that the flag which would do so appears in no string of this
# file or of the action it calls.
#
# Do NOT move any job to a larger runner: larger runners are billed.
#
# Every job carries a `timeout-minutes` well under the six-hour default: a test
# that leaves a child holding its output pipe stops producing output without
# exiting, and the run must end rather than hold a runner for the maximum.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation caches serve a developer's edit loop and are dead
  # weight on a fresh runner. Full debuginfo in the dev profile is most of a
  # dev-profile target directory's size and changes nothing a test asserts;
  # line tables keep panics and backtraces readable.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # `ubuntu-24.04` is pinned rather than `ubuntu-latest` so the `protoc` the
  # runner image ships is the same version between runs:
  # `cargo xtask check-proto` regenerates the protobuf code and fails on any
  # byte difference from the committed snapshot.
  #
  # Each job takes its own cache key: they run concurrently, and one shared key
  # would have them racing to save over each other.
  #
  # The job ids carry no `name:`, so `github.job` is the name the API reports
  # for the job, which is what `scripts/ci/already-passed.sh` matches on.
  #
  # The last two steps of each job record, on a pull request, the tree the gate
  # just passed. They follow the gate without `always()`, so they run only when
  # it succeeded. `overwrite` lets a re-run attempt record the same tree again.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - id: prior
        if: github.event_name == 'push' && github.event.forced != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/already-passed.sh "${{ github.job }}"
      - if: steps.prior.outputs.passed != 'true'
        uses: ./.github/actions/setup
        with:
          cache-key: ci-preflight
      - if: steps.prior.outputs.passed != 'true'
        run: cargo xtask gate --group preflight
      - id: tree
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree"
          echo "sha=$(cat "$RUNNER_TEMP/tested-tree")" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ github.job }}-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  dev-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - id: prior
        if: github.event_name == 'push' && github.event.forced != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/already-passed.sh "${{ github.job }}"
      - if: steps.prior.outputs.passed != 'true'
        uses: ./.github/actions/setup
        with:
          cache-key: ci-dev-suite
      - if: steps.prior.outputs.passed != 'true'
        run: cargo xtask gate --group dev-suite
      - id: tree
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree"
          echo "sha=$(cat "$RUNNER_TEMP/tested-tree")" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ github.job }}-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  release-suite:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - id: prior
        if: github.event_name == 'push' && github.event.forced != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/already-passed.sh "${{ github.job }}"
      - if: steps.prior.outputs.passed != 'true'
        uses: ./.github/actions/setup
        with:
          cache-key: ci-release-suite
      - if: steps.prior.outputs.passed != 'true'
        run: cargo xtask gate --group release-suite
      - id: tree
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree"
          echo "sha=$(cat "$RUNNER_TEMP/tested-tree")" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tested-${{ github.job }}-${{ steps.tree.outputs.sha }}
          path: ${{ runner.temp }}/tested-tree
          retention-days: 30
          overwrite: true
          if-no-files-found: error
