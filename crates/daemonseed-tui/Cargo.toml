[package]
name = "daemonseed-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
description = "daemonseed interactive terminal client"

[lib]
# The interactive surface lives in the library so the M11 gate harness and
# unit tests can drive the screen state machine without a real terminal.
name = "daemonseed_tui"
path = "src/lib.rs"

[[bin]]
name = "daemonseed-tui"
path = "src/main.rs"

[dependencies]
# UI framework (MIT/Apache-2.0). ratatui 0.29 bundles crossterm under its
# default features and re-exports it as `ratatui::crossterm`, so the TUI needs
# no separate backend dep and no version-skew risk.
ratatui = { workspace = true }

# Domain logic + reused client stack. The TUI depends on daemonseed-cli to
# reuse the proven connect / identity-proof / C22-trust client flow rather than
# duplicating security-critical code (see PRD D4). cli pulls core/proto/server
# transitively; tui also names core + proto directly for the types it renders.
daemonseed-cli = { path = "../daemonseed-cli" }
daemonseed-core = { path = "../daemonseed-core" }
daemonseed-proto = { path = "../daemonseed-proto" }

# Veilid transport (#98) — the only transport. Backs the net actor
# (`src/veilid_net.rs`) that `net::NetHandle::new` spawns.
daemonseed-veilid-net = { path = "../daemonseed-veilid-net" }

# Startup crypto-module init — symmetric with the GUI.
oxicrypt-module = { workspace = true }

# Async runtime for the network side. The render loop stays on the main thread
# (blocking crossterm event poll); network operations run on this runtime and
# post results back over an mpsc channel.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }

# Circle chat rides the CircleOfTrust bidirectional Subscribe stream: tokio-stream
# wraps the outbound mpsc as a Stream; tonic::Streaming is the inbound type the
# reader task drains. AppSession (cli) builds the channel; these are the stream
# adapters the actor drives directly.
tokio-stream = { workspace = true }
tonic = { workspace = true }

anyhow = { workspace = true }

# Per-platform Downloads directory resolver for the fetch download destination
# (ISC-C68 / A3). Replaces the hand-rolled `$XDG_DOWNLOAD_DIR` / `$HOME/Downloads`
# probe in `main::os_downloads_dir`.
dirs = { workspace = true }

[dev-dependencies]
# Throwaway dirs for the M16 streaming-fetch persistence tests (the
# downloads.idx round-trip and the abort-time partial-file cleanup).
tempfile = { workspace = true }
# Test-only: paused virtual time (`start_paused`) for the #180 §RS-2 off-loop fetch
# oracle (CRSH-ISC-7 — a failing-fetch storm must not delay chat past the I4 bound).
tokio = { workspace = true, features = ["test-util", "time"] }
