isc_reference:
  current_count: 93
  numbering:
    server_positive: "ISC-S1 .. ISC-S19"
    server_negative: "ISC-A-S1 .. ISC-A-S14"
    client_positive: "ISC-C1 .. ISC-C37 (C5 intentionally vacant)"
    client_negative: "ISC-A-C1 .. ISC-A-C19"

