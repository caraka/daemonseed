# Test surface (non-spec extra section, retained from the project dialect).
# ─────────────────────────────────────────────────────────────────────

testing:
  inline_tests: 165
  integration_test_crate: "daemonseed-integration-tests"
  per_milestone_coverage_files:
    - "tests/m1_isc_coverage.rs (17 ISCs)"
    - "tests/m2_isc_coverage.rs (12 ISCs, cumulative 29)"
    - "tests/m3_isc_coverage.rs (5 ISCs, cumulative 34)"
    - "tests/m4a_isc_coverage.rs (lands in M4a commit 6)"
  coverage_command: "cargo xtask isc-coverage"
  coverage_target: "static M3 floor = 34/93 = 36.6% (M4a will bump to 43/93)"
