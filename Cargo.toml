[workspace]
resolver = "2"
members = [
    "crates/daemonseed-core",
    "crates/daemonseed-proto",
    "crates/daemonseed-server",
    "crates/daemonseed-cli",
    "crates/daemonseed-tui",
    "crates/daemonseed-integration-tests",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["caraka <3311120+caraka@users.noreply.github.com>"]
repository = "https://github.com/caraka/daemonseed"

[workspace.dependencies]
# Wire schema codegen — pinned so the committed snapshot under
# crates/daemonseed-proto/src/generated/ is reproducible across contributors.
prost = "=0.13.4"
prost-types = "=0.13.4"
tonic = { version = "=0.12.3", default-features = false, features = ["transport", "codegen", "prost"] }
tonic-build = { version = "=0.12.3", default-features = false, features = ["prost"] }
tokio = { version = "1.43", default-features = false, features = ["rt", "macros", "io-util", "net"] }
# Tokio-side rustls adapter for `TlsAcceptor`. Server-only in M4a; no crypto
# feature flag because rustls's CryptoProvider is installed process-wide via
# oxitls (see daemonseed-server::tls::install_provider). `tls12` feature
# omitted — daemonseed is TLS 1.3 only by construction (rustls config is built
# with `&[&TLS13]`).
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# Single-connection incoming stream for serving the post-Authenticated tonic
# application service (M6) over one already-established TLS stream. Pinned to
# the version tonic 0.12.3 already pulls so there is no extra lockfile churn.
tokio-stream = "=0.1.18"

# xtask + general utility
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"

# TUI framework (MIT or Apache-2.0). daemonseed-tui (AGPL-3.0-or-later) consumes
# ratatui under its permissive license — FSF-compatible combined-work shape.
# Pinned at workspace level so future M11 TUI integration uses a single version.
ratatui = "0.29"

# ── Crypto stack (oxicrypt path-deps via the worktree-parent symlink) ────────
# During the private phase, daemonseed consumes oxicrypt as a path-dependency
# through `<worktree-parent>/oxicrypt` (a symlink to `~/repos/oxicrypt`). Once
# oxicrypt opens publicly, these become registry-deps pinned to the published
# version. The path is `../oxicrypt/crates/...` because the worktree itself
# sits at `<vault>/.worktrees/<branch>/` and the symlink is at
# `<vault>/.worktrees/oxicrypt`.
oxicrypt-module = { path = "../oxicrypt/crates/oxicrypt-module" }
oxicrypt-ml-dsa = { path = "../oxicrypt/crates/oxicrypt-ml-dsa" }
oxicrypt-ml-kem = { path = "../oxicrypt/crates/oxicrypt-ml-kem" }
oxicrypt-aes = { path = "../oxicrypt/crates/oxicrypt-aes" }
oxicrypt-kdf = { path = "../oxicrypt/crates/oxicrypt-kdf" }
oxicrypt-sha = { path = "../oxicrypt/crates/oxicrypt-sha" }
oxicrypt-zeroize = { path = "../oxicrypt/crates/oxicrypt-zeroize" }
# Additional oxicrypt primitives reached by daemonseed-server in M4a for
# assembling the production KATS slice that drives
# `oxicrypt_module::initialize_with_profile`.
oxicrypt-hmac = { path = "../oxicrypt/crates/oxicrypt-hmac" }
oxicrypt-drbg = { path = "../oxicrypt/crates/oxicrypt-drbg" }
oxicrypt-ecdh = { path = "../oxicrypt/crates/oxicrypt-ecdh" }
# oxitls TLS-stack glue. Consumed by daemonseed-server in M4a commit 3+.
oxitls-rustls-provider = { path = "../oxitls/crates/oxitls-rustls-provider" }
oxitls-webpki-mldsa = { path = "../oxitls/crates/oxitls-webpki-mldsa" }
# rustls — exact-pinned to match oxitls's lock at `=0.23.37`.
rustls = { version = "=0.23.37", default-features = false, features = ["std", "logging"] }
rustls-pki-types = { version = "1.14", default-features = false, features = ["std"] }
# Filesystem fixtures for test scaffolding.
tempfile = "3"

# ── External crypto + identity deps not covered by oxicrypt ──────────────────
# Argon2id is RFC 9106 (not NIST), so oxicrypt's NIST-only KDF crate doesn't
# carry it. RustCrypto's argon2 crate is the canonical pure-Rust impl.
argon2 = "0.5"
# BIP-39 is a wallet-ecosystem standard; the canonical Rust impl ships the
# 2048-word English wordlist + checksum logic. ~200 LOC saved. The `zeroize`
# feature enables `ZeroizeOnDrop` on `bip39::Mnemonic`.
bip39 = { version = "2", features = ["zeroize"] }
# RustCrypto `zeroize` crate (bip39 already pulls it transitively via the
# feature above; this declares the direct trait dep so daemonseed-core code
# can `use zeroize::Zeroize`).
zeroize = { version = "1", features = ["zeroize_derive"] }
# zxcvbn estimates passphrase entropy for the ISC-C12 strength meter and
# ISC-C9 circle-of-trust threshold.
zxcvbn = "3"
# UUID v4 from cryptographic randomness for profile-id (ISC-C36) and the
# per-device identity discriminator (ISC-C1). `serde` feature lets the
# profile config (de)serialize Uuid as a string.
uuid = { version = "1", features = ["v4", "serde"] }
# Profile config persistence — `daemonseed.toml` per ISC-C35 / C36 / C14.
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# NFKC canonicalization for circle-of-trust entropy (ISC-C9).
unicode-normalization = "0.1"
# Hex codec for the 12-char hash prefix in the handle format (ISC-C4).
hex = "0.4"
# CSPRNG entry point for mnemonic entropy and profile-id generation.
getrandom = "0.3"
# Embedded pure-Rust KV store — the redb-backed indexed-state layer of the
# three-layer storage split (M8 share index, ISC-C21). daemonseed encrypts each
# value (AES-256-GCM) before storing it (ISC-A-C6); redb itself holds opaque
# bytes. Pure Rust, no C — preserves the no-C-dependencies constraint.
redb = "2"
# Cross-platform filesystem-event watcher (inotify / FSEvents /
# ReadDirectoryChangesW) for the live share indexer (M8, ISC-C21 / ISC-20).
# Pure Rust (the platform backends are syscall bindings, no bundled C).
notify = "6"
# PTY-backed subprocess control for the M11 MVP-gate harness — the only thing
# under `dev-dependencies` of `daemonseed-integration-tests` that touches a real
# terminal. portable-pty is the MIT-licensed cross-platform PTY layer used by
# wezterm; we only ever construct PTY pairs and drive `daemonseed-tui` through
# them, never reach for the platform internals. Pinned at the workspace level
# so the gate harness, future xtask helpers, and any later parallel harness
# share one version.
portable-pty = "0.9"
