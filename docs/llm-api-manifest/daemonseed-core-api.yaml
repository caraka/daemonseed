      Copy or PartialEq and has no Deref, AsRef, Borrow or From conversion back to
      AckState; merge_peer_ack consumes it, so the ceiling is a required argument
      on the only path by which a peer's claim enters an AckState. ack_sig_input(chan_id, dir, state) binds
      daemonseed/dm/ack/sig/v3 || lp(chan_id) || lp(dir) || lp(high_water_be) ||
      lp(encoded runs); an absent prefix binds as a zero-length component.
      beyond_runs() yields those runs as ascending inclusive RangeInclusive<u64>,
      settled on the same terms as is_settled.
      AckState carries no chan_id, and neither encode_beyond nor
      decode_unvalidated takes one.
      Sub-module dm::ack_record is the DHT record an AckState is published in.
      derive_owner_seed(AR, dir) is HKDF-SHA-384(salt=
      daemonseed/dm/ack/addr/salt/v1, ikm=AR, info=daemonseed/dm/ack/addr/v1||
      lp(dir)); there is no page argument, because one direction has exactly one
      record, rewritten in place. Only the two parties can derive it, so
      DmAckOwnerSeed is a genuine secret and the record is owner-write-gated. The
      salt is distinct from dm::ack's DM_ACK_SALT, so the address and the seal key
      do not share one extraction. DmAckAddress::for_direction(AR, dir) pairs the
      seed with the direction it was derived for; owner_seed() and direction() read
      it, and Debug renders the seed redacted. ACK_RECORD_SLOTS (1) is the record's
      o_cnt and part of its address — a writer builds its RecordShape from it
      (ISC-C100). build(state, chan_id, dir, AR, signing_pc) -> DmAck signs the
      state under the PSEUDONYM key over ack::ack_sig_input, pads the encoded
      DmAckBody to the single bucket ACK_PAD_BUCKETS (6144) and seals it under
      ack::derive_seal_key(AR, dir), binding daemonseed/dm/ack/aad/v3||lp(chan_id)
      ||lp(dir) as AAD; build_encoded is the same returning wire bytes, so a
      frontend needs no prost. Every record is ACK_SEALED_LEN bytes sealed whatever
      it carries, so the length reveals no gap count. decode_and_verify(bytes,
      chan_id, dir, AR, peer_pk_pc) and verify(&DmAck, ...) open the seal, unpad,
      decode, length-gate msg_sig at ml_dsa::SIG_LEN, decode the statement, then
      verify the signature — in that order — and return PeerAck, never AckState, so
      the ceiling on merge_peer_ack remains the only path in. AckRecordError is
      Kdf, Module, Signing, Sealing, EntropySource, Aead, Malformed, FieldLength
      { field, expected, actual }, Signature, Ack(AckError) and TooLarge
      { got, max }; Aead is the uniform open-path authentication failure and covers
      a wrong direction, a wrong conversation and a wrong chan_id alike. dir is the
      direction of the messages being acknowledged, as in dm::ack. NOT YET
      AVAILABLE: the standalone-record path (#235).
      Sub-module dm::collect is the pure collection state machine for one
      direction of one conversation. Collection::new() holds two pointers, and
      Collection::resuming_from_page(page) is one whose frontier starts at a
      persisted cursor's page with nothing settled; a page above MAX_PAGE resumes
      nothing. Because nothing is settled, every position below the frontier
      reads as unsettled, so a caller resuming a LIVE collection must consult its
      own message log before displaying anything or it re-delivers (ISC-A-C21);
      the cursor names a page and not a set, and this type cannot close that. The two pointers are:
      frontier_page() -> Option<u64> is the highest page observed holding any
      populated slot, and contiguous_through() -> Option<u64> is the
      acknowledgement's contiguous prefix, settled rather than collected.
      observe_page(page, populated: &[u16]) -> Result<PageObservation,
      CollectError> folds one swept page; populated may be unordered and may
      repeat. PageObservation.unsettled lists the populated positions not yet
      settled, ascending and deduplicated, as PagePosition; frontier_advanced
      reports whether the page moved the frontier, which it does when the page
      holds any populated slot and sits above the frontier. The frontier does not
      regress. A page above paging::MAX_PAGE returns
      CollectError::PageBeyondSequenceSpace { page }, checked before any slot; a
      slot outside the record returns CollectError::SlotOutsideRecord { page,
      slot }. Either leaves the collection unchanged. collected(at: PagePosition)
      -> Result<(), AckError> records a position as collected and abandoned(seq:
      u64) -> Result<(), AckError> records one the sender gave up on; both
      delegate to the owned AckState, which ack() -> &AckState reads, and both
      lift the frontier to the settled position's page when the cursor has run
      past it. An AckError::TooManyRuns refusal from collected is dropped, not
      retained: the position stays unsettled and observe_page offers it again,
      and the caller retains it and calls collected again once capacity frees.
      watched() -> [u64; WATCHED_PAGES] is the current and next page, WATCHED_PAGES
      (2) being the window's width. retired_below() -> u64 is the lowest page any
      future plan can name — the lesser of watched()[0] and
      AckState::settled_pages_below() — so every page below it is settled through and
      out of the watched window, and a transport holding one record per page may
      release those. **The receiving side is told of no give-up**: no record carries
      the sender's, so sweep_give_ups(now_ms: u64) -> Vec<u64> measures it here.
      It abandons whole every gap whose accumulated age has reached
      RECEIVE_GIVE_UP_MS (outbox::GIVE_UP plus the longest RESEED_LADDER rung),
      ascending from each gap's first position, and returns what it abandoned. The
      age accumulates across calls: each call adds the time since the last one
      capped at AGE_STEP_CAP_MS (4 x PROBE_INTERVAL_MS), so a gap first seen in
      this call is at zero and a clock that steps forward adds one cap. A gap is
      identified by its whole range and inherits the largest age among the ranges
      it overlaps, so shrinking and splitting both keep it. The caller chooses the
      cadence; probe_plan does not call it. probe_plan(now_ms: u64)
      -> Option<Vec<u64>> is that pair followed by up to MAX_BACKFILL_PAGES (2)
      pages holding a hole, oldest first, deduplicated — the pages outstanding()
      witnesses, then the pages from the cursor to the frontier; the bound counts
      backfill entries alone. It returns None until PROBE_INTERVAL_MS (30000) has
      elapsed since the last plan, and treats a now_ms below the last one as due.
      Nothing here reads a clock. outstanding() -> Vec<RangeInclusive<u64>> is
      the unsettled positions below the highest settled one; view() ->
      CollectionView returns contiguous_through, frontier_page and outstanding as
      owned data. The frame's declared-sequence check is ParsedFrame::open's
      found_at, one layer above. NOT YET AVAILABLE: the doorbell sweep, the
      accept/decline/block flow, any caller that populates the contact cache, the
      block list, the transport wiring and the UI (#236, #243).
      Sub-module dm::persist is the wiring between these types and
      storage::dm_store, and is what makes any of this reach a disk. DmPersist
      derives both the store key and the provisional record's key from one
      at_rest_key. restart_channel(label, ctx) -> StoredChannelRestart is
      Established(Box<ResumeRecord>), HandshakeResumes(PendingHandshake) or
      TornDown(Teardown), and asks through the store's lock-free read so probing
      an unknown channel creates nothing. The resume record is consulted first
      (A4.8 read order): a present resume record is the authority, a provisional
      record beside it is deleted best-effort, and a resume record that will not
      read is TornDown(StoreUnreadable) rather than a fall-through to the
      provisional record.
      peek_channel_restart(label, ctx) -> StoredChannelRestart returns the same
      three arms and writes nothing: no provisional record is deleted and no lock
      is taken. It is the form for a caller scanning correspondences it is not
      acting on.
      sweep_lingering_provisionals() -> Result<usize, DmPersistError> deletes
      every provisional record left beside a readable resume record and returns
      the count. A store that will not enumerate is an error; a correspondence
      whose resume record will not read is skipped.
      PendingHandshake owns the record, lends
      eph_ek/address_root/channel_roots, returns this party's own
      per-correspondent keypair by value from signing_pc() -> SignKeypair,
      and offers five endings: ratchet() derives a Ratchet and leaves the record on disk,
      for the window between an initiator's knock and the acceptance that
      verifies its correspondent; commit() consumes the handshake and deletes
      the record; establish() is the pair, and builds the ratchet first so a
      failed delete returns an error rather than a ratchet, leaving the call a
      safe retry; commit_with_resume(&ResumeRecord) and
      establish_with_resume(&ResumeRecord) -> Result<Ratchet, DmPersistError>
      are commit() and establish() under the A4.8 write order — the resume
      record is committed first and the erase that follows is best-effort, so a
      refused resume write leaves the provisional record in place and a refused
      erase does not withhold the ratchet. It is must_use: a resumed handshake
      that is neither committed nor dropped leaves ss0 on disk. update_outbox(label, direction, now_ms, f) and
      advance_cursor(label, page, read_through) are read-modify-write inside one
      critical_section; there is no load-then-save pair to lose an update. f
      returns Mutation<T>, which is Changed(T) or Unchanged(T) and is must_use;
      update_outbox writes the record on Changed, and on Unchanged when the prune
      below reclaimed entries. Once the encoded record reaches half the outbox
      record's capacity it calls Outbox::prune before running f, so an enqueue's
      capacity gate prices against the reclaimed bytes; a prune that reclaims
      nothing writes nothing. An Unchanged report for a
      correspondence that has no record writes no record and spends no seal,
      though taking the lock creates the correspondence directory and its lock
      file; DmPersistError::OutboxDirectionMismatch therefore arises once an
      entry has been queued. Debug builds panic when an Unchanged report follows
      a change to the outbox. A stored record is re-encoded to the current
      format and write suite on any write.
      commit_resume(&CorrespondenceLabel, &ResumeRecord) -> Result<Option<Vec<u8>>,
      DmPersistError> applies every ResumeRecord invariant this module owns and
      writes the record inside one critical section. The guards bound this write
      path, not the file: DmPersist::store() returns a &DmStore whose
      critical_section takes &self and yields a mutable guard, and
      Locked::replace(RecordKind::Resume, ...) reaches the record through it.
      On a successful write it returns the record's sealed RE-EST bytes; Ok(None)
      is a record whose handshake slot is empty. It refuses with DmPersistError::Resume(
      ResumeError::FloorWouldRollBack) when the stored send floor is ahead of
      the offered one, ResumeError::AttemptWouldRollBack { stored, offered } on
      an attempt regression, and ResumeError::AttemptResealed { attempt } when a
      persisted attempt is offered with different sealed bytes,
      ResumeError::EmptySlotWouldReplaceAttempt { stored } when a record with an
      empty handshake slot is offered against a stored attempt, and
      ResumeError::PseudonymPairChanged when the offered s_pc or pk_pc differs
      from the stored one — the pair is fixed for the life of a correspondence,
      and on two empty slots it is the only guard that discriminates them; it
      writes nothing in any of those cases. A stored record that will not decode makes every
      further commit for that correspondence fail, which is the fail-closed
      direction. read_resume(
      &CorrespondenceLabel) -> Result<Option<ResumeRecord>, DmPersistError>
      reads it back. DmPersistError::Resume(ResumeError) carries both.
      DmPersistError::retrying_cannot_help() -> bool reports whether repeating
      the same call could answer differently: Contact, ContactRecordMissing,
      CorrespondenceHoldsAnotherIdentity, AlreadyEstablished,
      AmbiguousCorrespondent, OutboxDirectionMismatch and CursorPayloadWrongLen
      are settled, a Store error is settled when is_unreadable_record is, and
      every other variant is retryable.
      read_contact(&CorrespondenceLabel) -> Result<Option<ContactRecord>,
      DmPersistError> reads the stored contact record. A record that exists and
      will not decode is DmPersistError::Contact(ContactCacheError), never
      Ok(None); Ok(None) is any NotFound on the path, so it means nothing
      readable is there rather than an intact store holding no such
      correspondent. update_contact(label, seed, f) is read-modify-write inside
      one critical_section. seed: impl FnOnce() -> Result<ContactRecord,
      DmPersistError> supplies the record when the correspondence has none and
      is not built when one is stored; f: impl FnOnce(&mut ContactRecord) ->
      Result<Mutation<T>, DmPersistError> then runs against seed's record or the
      stored one, and the call yields T. A stored record is written only on
      Changed; a seeded record is written whatever f reports. Nothing is written
      if f fails, though taking the lock creates the correspondence directory
      and its lock file. A stored record that will not decode fails the call and
      is never re-seeded over. Debug builds panic when an Unchanged report
      follows a change to a stored record. A recorded pk_pc is write-once: no
      path here replaces one with a different key.
      record_first_contact_sent(&CorrespondenceLabel, Box<[u8; ml_dsa::PK_LEN]>,
      Zeroizing<[u8; ROOT_LEN]>, i64) -> Result<(), DmPersistError> writes an
      initiator's contact record when a first-contact entry is sent, with no
      pseudonym; a record already present is re-addressed to the given root and
      keeps its first_seen_ms. It is DmPersistError::AlreadyEstablished on a
      record whose pk_pc is present and CorrespondenceHoldsAnotherIdentity on
      one naming a different pk_lt.
      record_correspondent_pseudonym(&CorrespondenceLabel,
      Box<[u8; ml_dsa::PK_LEN]>, i64) -> Result<bool, DmPersistError> fills an
      absent pseudonym and records the sighting, reporting whether it was newly
      recorded; an identical key is false and spends no seal, a different one is
      DmPersistError::Contact(ContactCacheError::PseudonymAlreadyRecorded), and a
      correspondence with no record is DmPersistError::ContactRecordMissing.
      DmPersistError::Contact(ContactCacheError) carries a stored record that
      will not decode and a caller's own contact error raised inside f.
      correspondence_for_pk_lt(&[u8; ml_dsa::PK_LEN]) ->
      Result<Option<CorrespondenceLabel>, DmPersistError> names the
      correspondence whose contact record holds that long-term identity key. It
      is a scan of DmStore::correspondences and each one's contact record; no
      index is stored and no answer is cached. Ok(None) is no match. Two or more
      matches is DmPersistError::AmbiguousCorrespondent { matches }, which
      carries the count and no label; the scan reads every correspondence on
      every call, so it does not stop at the first match. A record whose pk_pc
      is absent matches like any other, so a caller meaning an established
      correspondence reads the record. A correspondence with
      no contact record is skipped; a record that exists and will not decode
      fails the whole lookup, as does an IO error that is not absence. The key
      comparison is not constant-time. The answer is not
      a snapshot: a writer can establish a correspondence before the caller acts
      on it, and a caller that then writes does so under update_contact.
      correspondent_state_lost(&VerifiedFirstContact, Direction, now_ms) ->
      Result<StateLoss, DmPersistError> answers an opened first-contact entry
      against what is stored and stops that correspondence's outbox where the
      entry means the correspondent lost their at-rest state. StateLoss is
      NoCorrespondence when no correspondence holds the entry's pk_lt and when
      the one that does has no recorded pseudonym, which is a correspondence
      this side is still waiting to have accepted;
      SameChannel(label) when the stored record's address root is the entry's,
      which is the introduction that established it arriving again and changes
      nothing; Confirmed { correspondence, teardown, outcome } when the roots
      differ, in which case every pending entry becomes Lifecycle::Undelivered
      with Surfacing::Owed and appears in outcome.surfaced, outcome.retained is
      empty, and teardown carries TeardownCause::CorrespondentStateLost and
      TrustEventKey::DmCorrespondentStateLost. The outbox write goes through
      update_outbox, so a correspondence with no pending entry spends no seal and
      writes no record. DmPersistError::AmbiguousCorrespondent is propagated and
      nothing is marked. DmPersistError::FirstContact(FirstContactError) carries
      a stored record whose channel roots would not derive. Only the outbox is
      touched; the entry itself is accepted or declined separately and no pending
      frame is migrated onto the new channel.
      accept_first_contact(VerifiedFirstContact, signing_pc: &SignKeypair,
      now_ms) -> Result<(CorrespondenceLabel, Ratchet), DmPersistError> is the
      acceptor's establishment, the counterpart of PendingHandshake::establish: it
      mints a label, opens the recipient ratchet over the knock's ss0, writes the
      resume record carrying both halves of signing_pc, the knock's pk_pc and RS_0,
      and then writes the
      contact record carrying pk_lt, pk_pc and the address root derived from that
      ss0, with both timestamps at now_ms, in one call. signing_pc is the acceptor's own
      per-correspondent keypair, minted by the caller; the resume record is its
      only at-rest home. The resume record is written first: the contact record's
      pseudonym is what every later lookup reads as established, so a crash in the
      other order leaves a correspondence that is established and cannot sign a
      re-establishment leg. The ratchet is built
      before the record is written, so a module fault leaves the disk untouched.
      A correspondence already holding the knock's pk_lt is
      DmPersistError::AlreadyEstablished where its record carries a pseudonym;
      where it does not, that record is this side's own unanswered first-contact
      entry and is removed before the new label is minted, so one identity is
      never under two records. No provisional record is written — the acceptor
      has none.
      read_block_list() -> Result<BlockList, DmPersistError> reads the profile's
      block list through the store's lock-free profile read. An absent record is
      DmPersistError::BlockListMissing, never an empty list: DmStore::open creates
      the record, so absence means it was removed or that open's best-effort
      creation was skipped — it takes the profile lock with try_acquire and a
      second opener that finds it held returns with the record still absent.
      provision_block_list() -> Result<bool, DmPersistError> closes that window: it
      writes an empty list when there is none, reports whether it wrote, and leaves
      an existing list — empty or full — exactly as it is. update_block_list(f)
      is read-modify-write inside one profile_critical_section, where f: impl
      FnOnce(&mut BlockList) -> Result<T, DmPersistError> and the call yields T.
      There is no Mutation: the list is written back on every call and spends one
      seal whether or not it changed. Nothing is written if f fails, and nothing
      is written if the resulting list is over the ceiling — BlockList::encode
      refuses before the replace, leaving the stored list as it was.
      DmPersistError::BlockList(BlockListError) carries a stored list that will
      not decode and a caller's own over-ceiling change.
      read_outbox/read_cursor/read_contact/read_block_list and
      correspondence_for_pk_lt are lock-free; correspondent_state_lost takes the
      lock only when it reaches the outbox.
      The provisional
      record is sealed by its own path and again by the store: the record's seal
      binds RecordContext and refuses one lifted from another channel, the store's AAD binds label
      and kind and refuses a blob moved between slots, and neither layer can
      check the other's fact. Erasure is unlink, not overwrite (#293).
      CorrespondenceLabel is taken as a parameter, never derived here (#288).
      Sub-module dm::outbox is the persisted sender-side outbox for one
      direction of one correspondence. Outbox::new(direction: Direction) keys
      OutboxEntry by sequence number over one monotonic space covering the
      doorbell knock at sequence 0 and every channel message after it;
      direction() reads it and there is no Default, because a sequence number
      means nothing without a direction and an acknowledgement is per-direction.
      enqueue_sealed(seq, target, now_ms, frame, sealed_under_gen) and
      enqueue_awaiting_key(seq, target, now_ms) -> Result<&mut
      OutboxEntry, OutboxError> add one, taking the caller's clock as the compose
      time; a repeat is OutboxError::DuplicateSequence, and a message the record
      could not then hold is OutboxError::Full { seq, needed, capacity } with
      needed the would-be total and Display rendering the excess. An
      enqueue_awaiting_key reservation is priced at frame::WORST_CASE_SEALED_FRAME_LEN
      plus its length prefix and the entry's fixed fields, cumulatively over the
      reservations the record already holds, which bounds waiting messages per
      correspondence at dm_store::OUTBOX_CAPACITY divided by that price; the charge
      is released at publish, which prices the frame it received, and it is charged
      against further reservations only, not against enqueue_sealed or publish.
      publish(seq,
      now_ms, frame, sealed_under_gen) installs the sealed frame on an AwaitingKey
      entry and is the only public way to do so — OutboxEntry::publish is pub(crate) — because
      installing a frame is the other edge that grows the record and is gated the
      same way; an unknown seq is OutboxError::UnknownSequence. Both gates price
      the candidate before mutating, so a refusal leaves the outbox byte-identical.
      encoded_len() -> usize is the exact length encode() would produce and is
      what both gates consult. room_for(seq, target, frame_len) -> Result<(),
      OutboxError> answers whether a sealed entry of that size would be accepted,
      through the same private gate the enqueue passes, so the two answers cannot
      differ; a caller that cannot know its frame's length before sealing passes
      frame::WORST_CASE_SEALED_FRAME_LEN; it runs the enqueue gate, so a sequence the
      record already holds is OutboxError::DuplicateSequence. room_to_publish(seq,
      now_ms, frame_len) -> Result<(), OutboxError> is the same question for a sequence
      the record does hold, asking what publish asks in the same order:
      OutboxError::UnknownSequence for an absent sequence, OutboxError::AlreadyPublished
      for an entry not awaiting a key, OutboxError::GaveUp past its window,
      OutboxError::Full when the frame would not fit. Its Ok is meaningful only for a
      reservation.
      sealing_plan(now_ms) -> Vec<SealingStep> classifies every AwaitingKey entry in
      ascending sequence as SealingStep::GivenUp(seq) (past its window: end it
      Undelivered, mint nothing), SealingStep::Admitted(seq) (a worst-case frame fits:
      mint, seal, publish at that sequence) or SealingStep::Stop(seq) (it does not
      fit: mint nothing, leave it and every later entry waiting). It mutates nothing,
      prices each admission against the frames the steps before it install, and ends
      at its first Stop. prune() -> usize removes entries that are terminal
      AND already Surfacing::Clear, returning how many went, and is the only thing
      that shrinks the record: without it the record grows with lifetime rather
      than owed messages and every persist fails permanently past capacity.
      Because both gates price from the entry set, a prune can let a previously
      refused send succeed. pruned_high_water() -> u64 is one past the highest
      pruned sequence, zero when nothing has been pruned; it takes over the
      sequence dedup the pruned entries provided, so insert refuses a seq below it
      with the same DuplicateSequence a still-present entry would give. It is
      persisted, which is why the at-rest format is v4; v3 and v2 records are read
      with it defaulting to zero. OutboxTarget is Doorbell { slot },
      validated against DOORBELL_SLOTS, ChannelPage, or ReEstablishmentLeg; the
      record key is not carried and OutboxEntry::position() derives the page slot
      from the sequence number for both channel targets. ReEstablishmentLeg is
      paged exactly as ChannelPage and differs only in being exempt from
      sweep_dead_chain: a leg hangs off no ratchet chain, so the target rather
      than a generation carries A3.12's exempting provenance. sweep_give_ups
      spares it for a sharper reason: its return value is rendered to the user as
      a message that failed to arrive, and a leg sits at a sequence the user
      never sent anything at. Lifecycle is AwaitingKey,
      AwaitingCollection(SealedFrame), ConfirmedCollected or Undelivered, and
      is_pending() is the first two. OutboxEntry::surfacing() is
      Surfacing::Owed when a terminal transition has not yet been reported to the
      user and Clear otherwise; one private edge into a terminal lifecycle sets
      both, so sweep_give_ups, settle_from_ack and channel_torn_down's surfacing
      arms cannot move an entry without owing the notification.
      owed_surfacings() -> Vec<u64> reads the outstanding set,
      record_surfaced(&[u64]) clears it, and the clear is persisted after the
      consumption it records. channel_torn_down's retained set is not flagged:
      those entries are unchanged and are re-reported on their own merits.
      encode/decode carry the flag; the at-rest form is
      daemonseed/dm/outbox/v5\0 plus a 2-byte suite id; target tag 2 is
      ReEstablishmentLeg, added to v5 in place because no released build has
      written a v5 record. The v5 header carries
      next_send_seq: u64 and last_clear_gen: u32 after the pruned high-water, and
      each entry carries sealed_under_gen: u32 after next_due_ms. v4
      (OUTBOX_MAGIC_V4) is read with those three fields zero; v3
      (OUTBOX_MAGIC_V3) additionally reads with the pruned high-water zero; v2
      (OUTBOX_MAGIC_V2) additionally defaults every entry to
      Acceptance::Unconfirmed; v1 (OUTBOX_MAGIC_V1) is refused as
      OutboxError::UnsupportedVersion. next_send_seq() -> u64 and
      last_clear_gen() -> u32 read the two header counters, never lowered:
      next_send_seq is raised by every enqueue path including
      enqueue_awaiting_key, and last_clear_gen by publish and enqueue_sealed; OutboxEntry::sealed_under_gen()
      -> u32 is the entry's sealing-chain provenance, 0 while it holds no frame.
      sweep_dead_chain(reroot_ratchet_gen: u32) -> Vec<u64> ends, via
      OutboxEntry::end(Undelivered), exactly the AwaitingCollection entries whose
      target is OutboxTarget::ChannelPage and whose sealed_under_gen is strictly
      below the argument; OutboxTarget::Doorbell and
      OutboxTarget::ReEstablishmentLeg entries are left alone.
      sweep_give_ups(now_ms) likewise ends no OutboxTarget::ReEstablishmentLeg
      entry, whatever its age. That target has two terminal edges of its own, and
      they record different facts. retire_leg(seq: u64) -> bool is the
      COMPLETION's: it moves a pending leg to Lifecycle::ConfirmedCollected,
      which the completion is the proof of. abandon_leg(seq: u64) -> bool is for
      a leg nobody opened — one the contest coin conceded, or one past its
      give-up — and moves it to Lifecycle::Undelivered, because
      ConfirmedCollected would be a claim about the peer that no observation
      supports. Both leave Surfacing::Clear, since the user composed nothing at a
      leg's sequence, and both answer false for an absent sequence, another
      target, or an already-terminal leg. It
      marks each ended entry Surfacing::Owed
      and returns their sequences; it is #[must_use], idempotent, and a
      derivation re-runnable at every load rather than a transaction. Sealing,
      padding and the fixed on-disk size belong to
      storage::dm_store (#279). SealedFrame::new(Vec<u8>) wraps sealed bytes
      and exposes as_bytes/len/is_empty only; there is no mutating accessor.
      Outbox::publish(seq, now_ms, frame, sealed_under_gen) is the only edge that
      installs a frame and accepts only AwaitingKey, returning OutboxError::AlreadyPublished
      otherwise; OutboxEntry::publish is pub(crate) so the frame install cannot
      bypass the capacity check. It places the entry on RESEED_LADDER's first rung
      under RESEED_JITTER_FRAC rather than leaving it due at now_ms, so messages
      sealed at one settlement do not fall due together; the rung a key-fetch retry
      consumed is not carried over and the give-up clock is untouched. emit(now_ms) -> Result<&[u8], OutboxError>
