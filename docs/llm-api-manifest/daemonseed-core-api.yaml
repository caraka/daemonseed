# ─────────────────────────────────────────────────────────────────────
# Common gotchas across modules (non-spec extra section, retained from the
# project dialect — high-value cross-cutting pitfalls).
# ─────────────────────────────────────────────────────────────────────

gotchas:
  - description: >-
      AuthenticationFailed in seeds::open / recovery_file::open is the
      uniform error for wrong-passphrase, wrong-profile-id, wrong-argon-
      params, and tampered-ciphertext. This is a deliberate constant-
      time-friendly design — never report which check failed to the user
      in a way that distinguishes them.
    severity: warning
    scope: storage::seeds, storage::recovery_file

  - description: >-
      Every test in this crate that touches crypto must call
      `oxicrypt_module::initialize()` (or the test-only `let _ =
      oxicrypt_module::initialize();` idiom) before any cryptographic
      function. Without it, every primitive returns ModuleNotOperational.
    severity: error
    scope: all crypto-touching modules

  - description: >-
      Mnemonic round-trips through to_phrase()/from_phrase() are
      whitespace-tolerant via word-token comparison in
      first_start::Sealed::verify_round_trip — leading/trailing/internal
      whitespace and uppercase letters in user input are accepted.
      Direct string equality on phrases will reject what verify_round_trip
      accepts.
    severity: warning
    scope: first_start, identity::mnemonic

  - description: >-
      Suite-id 0x0000 and 0xFFFF are reserved sentinels. SuiteId::try_new
      rejects them. Any wire path that decodes a u16 into a SuiteId must
      route through try_new so the rejection is uniform.
    severity: error
    scope: crypto::suite, storage::seeds, storage::recovery_file

  - description: >-
      biometric and autostart are scaffolds only — no platform backend
      ships. SessionPassphrase deliberately cannot hold the BIP-39
      mnemonic, and unit_descriptor renders text without any filesystem
      or process side effects. Wiring a real backend later is additive.
    severity: warning
    scope: biometric, autostart

