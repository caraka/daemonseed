  - name: verify_route_advert
    module: daemonseed_veilid_net::discovery
    description: Verify a route advert against the announcer's ML-DSA-87 public key (the one open_announcement provenance-verified). Fails closed (returns false) on a wrong-length key/signature, a tampered/rogue route_blob, a share_id mismatch, or a forged signature — uniform close-shape, the caller cannot tell which.
    signature: "pub fn verify_route_advert(announcer_pubkey: &[u8], share_id: &str, route_blob: &[u8], route_sig: &[u8]) -> bool"
