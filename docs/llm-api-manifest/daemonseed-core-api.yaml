# ─────────────────────────────────────────────────────────────────────
# daemonseed-core — LAMA API Manifest
#
# Public API surface of the daemonseed-core crate through M10 verifiable-core
# (v0.12.0-pre). M3 closed the crypto-agility primitives; M4a/M4b added the
# connection type-state + identity-proof; M5 federation; M6 public-space client
# plumbing; M7 the deprecation policy + trust-event taxonomy; M8 the CoT/chunk/
# indexer client surface; M9 backoff + mention + mute/hide; M10 the release
# trust anchor + multi-sig verify + update-lifecycle FSM. Designed for AI
# coding agents that need to discover what the protocol library exposes, what
# the preconditions are, and where each piece anchors in the ISC spec.
#
# Cross-references:
# - Repository root: ../../lama.yaml
# - Wire schema: ./daemonseed-proto-protocol.yaml
# ─────────────────────────────────────────────────────────────────────

lama: "0.1"

library:
  name: daemonseed-core
  version: "0.1.0"
  description: >-
    Protocol library. Identity primitives, profile substrate, at-rest
    storage, first-start orchestration, bootstrap-anchor selection,
    crypto-agility primitives (suite registry + policy gate + deprecation),
    circle-of-trust key derivation, the connection type-state + identity-proof,
    federation trust, the trust-event taxonomy, reconnect backoff, @-mention
    logic, and the release trust anchor + multi-sig verify + update-lifecycle
    FSM (M10 verifiable-core). The wire-protocol surface landed from M4a.
  license: "AGPL-3.0-or-later"
  manifest_for: "crates/daemonseed-core"

constraints:
  - description: >-
      `oxicrypt_module::initialize()` (or `initialize_with_tests`) MUST
      be called before any cryptographic function in this crate runs.
      Every cryptographic primitive gates on the underlying oxicrypt
      power-on self-test. Tests in this crate call a local `init_oxicrypt()`
      helper at the top of every test function for this reason.
    enforcement: runtime
    severity: error

  - description: >-
      No `unsafe` code. Enforced by `#![forbid(unsafe_code)]` at the
      crate root. Every primitive is pure safe Rust.
    enforcement: compile-time
    severity: error

  - description: >-
      Secret-bearing types (Mnemonic, Seeds, IdentityKeys components)
      implement Zeroize / ZeroizeOnDrop. Debug impls always redact
      sensitive fields with the literal token "<redacted>" — verified
      by inline tests in every module that holds secrets.
    enforcement: convention + regression tests
    severity: error

# ─────────────────────────────────────────────────────────────────────
# Module: identity::mnemonic
# ─────────────────────────────────────────────────────────────────────

modules:
  - path: daemonseed_core::identity::mnemonic
    purpose: >-
      BIP-39 24-word mnemonic generation, parsing, and zeroized in-RAM
      handling. Wraps the upstream `bip39` crate's `Mnemonic` type with
      ZeroizeOnDrop semantics and a redacted Debug impl.
    iscs: [C2, A-C2]
    public:
      - { kind: const, name: WORD_COUNT, value: 24, note: "BIP-39 mnemonic length pinned at 24 words (256-bit entropy)." }
      - { kind: struct, name: Mnemonic, note: "Newtype wrapping bip39::Mnemonic. Debug redacts." }
      - { kind: enum, name: MnemonicError, note: "Generation / parsing failure modes." }
    key_functions:
      - { sig: "Mnemonic::generate() -> Result<Mnemonic, MnemonicError>", note: "Generate from OS CSPRNG." }
      - { sig: "Mnemonic::from_phrase(phrase: &str) -> Result<Mnemonic, MnemonicError>", note: "Parse user input or .dseed-recovered phrase. Validates checksum." }
      - { sig: "Mnemonic::to_phrase(&self) -> String", note: "24 space-separated lowercase words." }
      - { sig: "Mnemonic::to_seed(&self) -> [u8; 64]", note: "BIP-39 PBKDF2-HMAC-SHA512 seed derivation with empty passphrase." }

  - path: daemonseed_core::identity::keys
    purpose: >-
      Derive ML-DSA-87 (signing) and ML-KEM-1024 (KEM) keypairs from
      a BIP-39 seed via HKDF-SHA-384 with domain-separated info strings.
      Distinguishes "primary" (cross-device root) from "per-device" (UUID-
      keyed) identity branches per ISC-C1 / C13.
    iscs: [C1, C13, S11]
    public:
      - { kind: const, name: ML_DSA_SEED_LEN, value: 32, note: "ML-DSA-87 seed length (FIPS 204 §5.1); the raw seed a server persists." }
      - { kind: enum, name: Identity, note: "Primary | Device(Uuid) — selects which HKDF info-string prefix is used." }
      - { kind: enum, name: KeyDerivationError, note: "HKDF / oxicrypt-module / KEM keygen failure modes." }
      - { kind: struct, name: SignKeypair, note: "ML-DSA-87 keypair. Drop zeroizes private key. Exposes detached `sign`. Built from a mnemonic (via derive_identity_keys) or directly from a raw seed (from_ml_dsa_seed, server path)." }
      - { kind: struct, name: KemKeypair, note: "ML-KEM-1024 keypair. Drop zeroizes private key." }
      - { kind: struct, name: IdentityKeys, note: "Bundle of SignKeypair + KemKeypair for one Identity branch." }
      - { kind: enum, name: SignatureError, note: "Module(oxicrypt_module::Error) | BadSignature. BadSignature is uniform across tampered-message / wrong-key / forged-sig (ISC-A-S12 / A-C18 — verifier cannot distinguish the sub-cause)." }
    key_functions:
      - { sig: "derive_identity_keys(mnemonic: &Mnemonic, identity: Identity) -> Result<IdentityKeys, KeyDerivationError>", note: "End-to-end derivation. Each call regenerates from the seed — keys are not cached, so the caller manages lifetime." }
      - { sig: "SignKeypair::from_ml_dsa_seed(seed: &[u8; ML_DSA_SEED_LEN]) -> Result<Self, KeyDerivationError>", note: "Builds a SignKeypair directly from a raw 32-byte ML-DSA-87 seed via oxicrypt_ml_dsa::keygen. The server path (server identity is a bare seed, not a mnemonic); deterministic. Requires oxicrypt module operational." }
      - { sig: "SignKeypair::sign(&self, message: &[u8]) -> Result<[u8; SIG_LEN], SignatureError>", note: "Detached ML-DSA-87 signature, empty FIPS-204 ctx (daemonseed domain-separates inside the signed bytes via the channel-binding prefix). Requires oxicrypt module operational." }
      - { sig: "verify_signature(public_key: &[u8; PK_LEN], message: &[u8], signature: &[u8; SIG_LEN]) -> Result<(), SignatureError>", note: "Ok only on a valid signature; all failure modes collapse to BadSignature." }

  - path: daemonseed_core::identity_proof
    purpose: >-
      Post-HELLO identity-proof envelope construction + channel binding
      (ISC-S19, A-S14, A-C18). Owns the construction half: derive the
      32-byte TLS-exporter channel binding (label tied to
      `kdf::info::IDENTITY_PROOF_V1`, context = negotiated APP_HELLO
      version), build the canonical signed input, and sign the envelope.
      The exporter call is injected via `ChannelBindingSource` so core
      stays rustls-free; the label + context byte-layout live HERE (one
      definition, both peers) to defeat the channel-binding asymmetry bug.
      Verification (`verify_envelope`) runs every check and collapses all
      failures to one opaque `VerifyRejection` (uniform close-shape,
      A-S12/A-C18); success yields a `VerifiedPeer` token that gates the
      Versioned->Authenticated transition.
    iscs: [S19, A-S14, A-C18, S15, C4, C22]
    public:
      - { kind: const, name: CHANNEL_BINDING_LABEL, value: '"daemonseed/identity-proof/v1" (= kdf::info::IDENTITY_PROOF_V1.as_bytes())', note: "TLS 1.3 exporter label. Single source of truth in the kdf-info registry." }
      - { kind: const, name: CHANNEL_BINDING_LEN, value: 32 }
      - { kind: const, name: SKEW_WINDOW_MS, value: 300000, note: "±5min freshness window (decision D1). Hosts MUST run NTP — drift beyond this fails identity-proof." }
      - { kind: trait, name: ChannelBindingSource, note: "export_keying_material(label, context, out). Implemented by the TLS-holding layer (server/cli) over rustls; MUST NOT substitute a constant (A-S14/A-C18)." }
      - { kind: enum, name: ChannelBindingError, note: "Export(String) — exporter call failed (e.g. handshake incomplete)." }
      - { kind: struct, name: VerifiedPeer, note: "Opaque proof-of-verification token. Constructible ONLY by verify_envelope returning Ok. Accessors: handle(), pubkey(), counter(), counter_gap(). Gates Connection::into_authenticated." }
      - { kind: struct, name: VerifyRejection, note: "Zero-field, no-discriminator rejection — bad-sig / wrong-key / stale-ts / replayed-counter / unsupported-suite / handle-mismatch all collapse here so neither caller nor peer can tell which check failed (A-S12 / A-C18)." }
    key_functions:
      - { sig: "derive_channel_binding(source: &impl ChannelBindingSource, negotiated_version: ProtocolVersion) -> Result<[u8; 32], ChannelBindingError>", note: "Fixed label + version-context exporter call." }
      - { sig: "signing_input(channel_binding, claimed_handle, claimed_pubkey, negotiated_version, signed_at_unix_ms, counter) -> Vec<u8>", note: "Canonical signed bytes (decision D3 — extends ISC-S19's 4 fields to cover timestamp+counter). Variable-length fields are u16-BE length-delimited to prevent field-confusion." }
      - { sig: "build_envelope(signing, channel_binding, claimed_handle, role, suite_id, negotiated_version, signed_at_unix_ms, counter) -> Result<IdentityProof, SignatureError>", note: "Constructs + signs the wire envelope. counter/timestamp supplied by caller; counter state is sourced from the seeds blob by the orchestration layer (later commit)." }
      - { sig: "verify_envelope(envelope: &IdentityProof, channel_binding: &[u8;32], negotiated_version: ProtocolVersion, now_unix_ms: u64, highest_seen_counter: Option<u64>) -> Result<VerifiedPeer, VerifyRejection>", note: "ISC-S19 step 4. Checks suite-support, role well-formedness, handle↔pubkey hash binding, signature over the local channel-binding+version (cross-session replay fails here), ±5min skew, and counter monotonicity (gap allowed+flagged, <=highest-seen rejected). Identical path for client and server (role is never an auth branch, A-S8)." }

  - path: daemonseed_core::handle
    purpose: >-
      Handle format (ISC-C4) — combination of a display name and a
      12-character hex fingerprint of the identity public key. The
      fingerprint is `hex(SHA-384(pubkey)[..6])` (lowercase). Display
      names are generated by `display_name` (see next module).
    iscs: [C4, C4a, C4b]
    submodules:
      - daemonseed_core::handle::display_name
    public:
      - { kind: fn, name: "fingerprint_hex(pubkey: &[u8]) -> String", note: "12-char lowercase hex of SHA-384(pubkey)[..6]. 48 bits of entropy." }
      - { kind: fn, name: "format_handle(display_name: &str, fingerprint: &str) -> String", note: "Concatenates `name#fingerprint` per ISC-C4 wire format." }

  - path: daemonseed_core::handle::display_name
    purpose: >-
      Friendly adjective-noun display-name generator. Wordlists from
      Glitch's `friendly-words` project (MIT, embedded via include_str!):
      1,450 predicates × 3,062 objects = 4,439,900 distinct pairs.
      Birthday-paradox collision in display-name space alone reaches
      50% at ~2,481 daemons; the full handle (display name +
      48-bit fingerprint) collides at ~13 billion. Allows custom display
      names; the default is suggested-not-typed per anti-overclaim hygiene.
    iscs: [C4a, C4b]
    public:
      - { kind: fn, name: "generate<R: DisplayNameRng>(rng: &mut R) -> String", note: "Sample one predicate + one object, return `predicate-object`." }
      - { kind: trait, name: DisplayNameRng, note: "CSPRNG abstraction. random_index(len) -> usize. Same trait used by type-back challenge." }
      - { kind: fn, name: "is_valid_display_name(s: &str) -> bool", note: "Empty allowed (floor handle). Otherwise: 1-32 chars, no whitespace, no `#`, NFKC-normalizable." }

  - path: daemonseed_core::kdf::info
    purpose: >-
      Authoritative registry of HKDF info-string constants. Every
      HKDF context used by daemonseed lives here as a `pub const &str`
      or as a function emitting a deterministic string from runtime
      parameters. **Changing any of these strings silently breaks
      identity continuity and cross-version interop** — wire-visible
      regression tests byte-compare them against the published spec.
    iscs: [C1, C3, C13, C30, C36, A-C6, C28, S19]
    public:
      - { kind: const, name: IDENTITY_ROOT_SALT, value: '"daemonseed/v1/identity-root"' }
      - { kind: const, name: DOMAIN_SIGN, value: '"sign"' }
      - { kind: const, name: DOMAIN_KEM_D, value: '"kem-d"' }
      - { kind: const, name: DOMAIN_KEM_Z, value: '"kem-z"' }
      - { kind: const, name: IDENTITY_PROOF_V1, value: '"daemonseed/identity-proof/v1"' }
      - { kind: fn, name: "primary(domain: &str) -> String", note: "Returns `daemonseed/identity/primary/<domain>`." }
      - { kind: fn, name: "device(uuid: &str, domain: &str) -> String", note: "Returns `daemonseed/identity/device-<uuid>/<domain>`." }
      - { kind: fn, name: "at_rest(profile_id: &str) -> String", note: "Returns `daemonseed/at-rest/<profile_id>`." }
      - { kind: fn, name: "recovery_file(profile_id: &str) -> String", note: "Returns `daemonseed/recovery-file/<profile_id>`." }
      - { kind: fn, name: "share_index(profile_id: &str) -> String", note: "Returns `daemonseed/share-index/<profile_id>`." }
      - { kind: fn, name: "trust_events(profile_id: &str) -> String", note: "Returns `daemonseed/trust-events/<profile_id>`." }

  - path: daemonseed_core::passphrase
    purpose: >-
      Passphrase utilities — strength estimation via zxcvbn (ISC-C12
      gate) and NFKC canonicalization for circle-of-trust entropy
      (ISC-C9).
    iscs: [C9, C12]
    submodules:
      - daemonseed_core::passphrase::strength
      - daemonseed_core::passphrase::circle_canonicalize
    public:
      - { kind: fn, name: "strength::evaluate(input: &str) -> StrengthReport", note: "zxcvbn-derived score with explicit ISC-C12 floor check." }
      - { kind: fn, name: "circle_canonicalize::canonicalize(input: &str) -> String", note: "NFKC normalization for circle-of-trust entropy. Pre-applied before KDF so equivalent unicode inputs produce the same key." }

  - path: daemonseed_core::profile::config
    purpose: >-
      Per-profile `daemonseed.toml` schema: profile_id (UUID v4) +
      Argon2id params + future fields. Persisted at the profile root
      (resolved per ISC-C35).
    iscs: [C14, C36]
    public:
      - { kind: struct, name: ArgonParams, fields: "{memory_kib: u32, iterations: u32, parallelism: u32}", note: "ISC-C14 work-factor knobs. Defaults are OWASP-2024 baselines." }
      - { kind: struct, name: ProfileConfig, fields: "{profile_id: Uuid, argon2: ArgonParams}", note: "Round-tripped through `toml` to / from `daemonseed.toml`." }
      - { kind: enum, name: ProfileConfigError, note: "Missing / unparseable / wrong-type field surfaces here." }
    key_functions:
      - { sig: "ProfileConfig::new_fresh() -> ProfileConfig", note: "Mints a UUID-v4 profile_id from CSPRNG + default Argon2 params." }
      - { sig: "ProfileConfig::from_toml(s: &str) -> Result<ProfileConfig, ProfileConfigError>" }
      - { sig: "ProfileConfig::to_toml(&self) -> String" }

  - path: daemonseed_core::profile::resolve
    purpose: >-
      Profile-root resolution per ISC-C35. Priority order:
      `--config <path>` flag → CWD-discovery (daemonseed.toml in CWD)
      → XDG fallback. Returns whether the profile exists or first-start
      is needed.
    iscs: [C35]
    public:
      - { kind: const, name: CONFIG_FILENAME, value: '"daemonseed.toml"' }
      - { kind: struct, name: ResolveArgs, note: "Caller-supplied: optional --config path, optional override-XDG, etc." }
      - { kind: enum, name: ResolvedProfileRoot, variants: "{Existing(PathBuf), FirstStart(PathBuf)}" }
      - { kind: enum, name: ResolveError, note: "Filesystem / parse failure modes." }
    key_functions:
      - { sig: "resolve(args: ResolveArgs) -> Result<ResolvedProfileRoot, ResolveError>" }
      - { sig: "resolve_with_env<F>(args: ResolveArgs, getenv: F) -> Result<ResolvedProfileRoot, ResolveError>", note: "Testable variant — pass an env-var lookup closure." }

  - path: daemonseed_core::storage::seeds
    purpose: >-
      Encrypted at-rest seeds blob (ISC-C3). Format v2 as of M3 with
      a 2-byte big-endian suite_id slot after the magic prefix. v1
      reads accepted under implicit suite_id = 0x0001 (M1 / M2
      compatibility). KDF chain (unchanged from M1):
      Argon2id(passphrase, salt=profile_id) → HKDF-SHA384-Expand →
      AES-256-GCM. v2 binds suite_id into AEAD AAD so tamper-swap
      fails authentication. M4b extends the *plaintext payload* (not the
      blob format) with replay-protection counters via a backward-
      compatible directive-line schema — see CounterState + Seeds.
    iscs: [C3, C24, A-C9, S19, A-S1]
    public:
      - { kind: const, name: MAGIC, value: 'b"daemonseed/blob/v2\\0"', note: "Current 19-byte v2 magic. seal() always writes this. NOT bumped by M4b — counters are a payload-schema extension, not a blob-format change." }
      - { kind: const, name: MAGIC_V1, value: 'b"daemonseed/blob/v1\\0"', note: "Legacy v1 magic accepted by open() for read-fallback." }
      - { kind: const, name: SUITE_ID_LEN, value: 2 }
      - { kind: const, name: NONCE_LEN, value: 12 }
      - { kind: const, name: TAG_LEN, value: 16 }
      - { kind: const, name: ARGON2_OUTPUT_LEN, value: 48, note: "48 since D5 (HKDF-SHA-384 PRK length; was 32 under SHA-256)." }
      - { kind: const, name: AEAD_KEY_LEN, value: 32 }
      - { kind: struct, name: CounterState, fields: "{send_counter: u64 (private), seen: BTreeMap<String,u64> (private)}", note: "Replay-protection state (project_clocks_freshness). Methods: next_send()->u64 (pre-increment, first=1), current_send(), highest_seen(target)->Option<u64>, record_seen(target, counter) (keeps max). send_counter MUST persist (ISC-33); server MUST NOT persist its per-client seen map (A-S1/A-S12, RAM-only)." }
      - { kind: struct, name: Seeds, fields: "{mnemonic: Mnemonic, counters: CounterState}", note: "Plaintext payload. Construct via Seeds::new(mnemonic) (default counters). Plaintext is line-based: line 0 = phrase, then `send-counter <n>` / `seen <target> <n>` directives. Bare-phrase (legacy M1/M2/M3) payloads parse with default counters — no re-enrollment. Directive scheme is additive for future fields." }
      - { kind: struct, name: Opened, fields: "{seeds: Seeds, suite_id: SuiteId, legacy_v1: bool}", note: "Output of open(). legacy_v1=true signals the caller should run touch_reseal on next save." }
      - { kind: enum, name: BlobError, note: "13 variants. AuthenticationFailed is uniform across wrong-passphrase / wrong-profile-id / wrong-argon-params / ciphertext-tamper (constant-time-friendly). UnknownSuite, SuiteIdSentinel, WriteRefused are M3 additions." }
    key_functions:
      - { sig: "seal(seeds: &Seeds, passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<Vec<u8>, BlobError>", note: "Writes v2 under Registry::default_write_suite()." }
      - { sig: "seal_under(seeds, passphrase, profile_id, params, suite_id: SuiteId) -> Result<Vec<u8>, BlobError>", note: "Explicit-suite variant. Used by touch_reseal and by tests." }
      - { sig: "open(blob: &[u8], passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<Opened, BlobError>", note: "Dispatches on MAGIC: v2 parses suite_id, v1 assumes 0x0001." }
      - { sig: "touch_reseal(blob: &[u8], passphrase: &str, profile_id: Uuid, params: ArgonParams) -> Result<Vec<u8>, BlobError>", note: "ISC-C24 read-old-write-new — decrypt then re-encrypt as v2 under the active write-suite." }

  - path: daemonseed_core::storage::recovery_file
    purpose: >-
      Encrypted `.dseed` recovery file (ISC-C32). Format v2 as of M3.
      Layout includes profile-id + argon2 params in cleartext header
      (per ISC-C32 "header unauthenticated by design — tamper changes
      derived key → AEAD fails closed"), plus suite_id which IS
      AAD-bound. Same passphrase as the at-rest blob (ISC-C30 single-
      credential design) but distinct HKDF info string yields distinct
      keys.
    iscs: [C24, C30, C32]
    public:
      - { kind: const, name: MAGIC, value: 'b"daemonseed/dseed/v2\\0"' }
      - { kind: const, name: MAGIC_V1, value: 'b"daemonseed/dseed/v1\\0"' }
      - { kind: const, name: SUITE_ID_LEN, value: 2 }
      - { kind: struct, name: RecoveryFileContents, fields: "{mnemonic: Mnemonic, profile_id: Uuid, argon2: ArgonParams, suite_id: SuiteId, legacy_v1: bool}" }
      - { kind: enum, name: RecoveryFileError, note: "Mirrors BlobError variants plus the suite-aware additions (SuiteIdSentinel, UnknownSuite, WriteRefused)." }
    key_functions:
      - { sig: "seal(mnemonic: &Mnemonic, passphrase: &str, profile_id: Uuid, argon2: ArgonParams) -> Result<Vec<u8>, RecoveryFileError>" }
      - { sig: "seal_under(mnemonic, passphrase, profile_id, argon2, suite_id: SuiteId) -> Result<Vec<u8>, RecoveryFileError>" }
      - { sig: "open(bytes: &[u8], passphrase: &str) -> Result<RecoveryFileContents, RecoveryFileError>", note: "Recovery-on-clean-device: takes only the file bytes + passphrase; profile_id + argon2 come from the file's cleartext header." }

  - path: daemonseed_core::storage::cas
    purpose: >-
      Content-addressed chunk store — the third storage layer (M8). Opaque
      already-encrypted chunks named by SHA-384(chunk); the address both
      locates and authenticates a chunk (a re-hash mismatch = corrupt or
      substituted, caller drops it). Reference-counted dedup: put inserts-
      or-increments, unref decrements and drops the bytes at zero (the
      server-blind CoT lifecycle of A-S5). Per-chunk hash = SHA-384 (F23,
      one hash primitive across the protocol). Two impls below.
    iscs: [A-S2, A-S5, A-S12, S17]
    public:
      - { kind: const, name: CHUNK_ADDR_LEN, value: 48 }
      - { kind: struct, name: ChunkAddr, note: "SHA-384(chunk) content address. Display/Debug lowercase hex; as_bytes() -> &[u8;48]; from_bytes([u8;48]) names a fetch target (bytes not re-validated — auth is on re-hash of the fetched chunk)." }
      - { kind: enum, name: Unref, note: "Outcome of releasing one ref: StillReferenced{remaining: u32} or Dropped (last ref released, bytes gone)." }
      - { kind: enum, name: CasError, note: "Hash(oxicrypt_module::Error) | Io(std::io::Error) | CorruptRefcount. MemoryChunkStore raises only Hash (on put); FileChunkStore adds Io/CorruptRefcount." }
      - { kind: trait, name: ChunkStore, note: "put(&[u8])->ChunkAddr (insert-or-increment) | get(&ChunkAddr)->Option<Vec<u8>> | has(&ChunkAddr)->bool | unref(&ChunkAddr)->Unref. All return Result<_, CasError>." }
      - { kind: struct, name: MemoryChunkStore, note: "Ephemeral refcounted in-memory store — the relay backing (A-S5, leaves no trace). has() compares every stored addr with constant-time ct_eq, no early return, closing the timing side-channel (A-S2/A-S12). new() / Default." }
      - { kind: struct, name: FileChunkStore, note: "Persistent on-disk store — the client chunk cache (ISC-6, survives restart). open(root) creates/reopens; chunk bytes at <root>/<hex-addr>, refcount in adjacent <hex-addr>.rc ASCII sidecar. has() is best-effort only (no constant-time claim — A-S2 is a relay threat and the relay runs MemoryChunkStore)." }
    key_functions:
      - { sig: "chunk_addr(chunk: &[u8]) -> Result<ChunkAddr, oxicrypt_module::Error>", note: "SHA-384(chunk) (ISC-2 / F23). Requires the oxicrypt module operational (power-up self-test passed)." }

  - path: daemonseed_core::cot
    purpose: >-
      Circle-of-trust rendezvous addressing (M8, ISC-8 / S4). asset_address =
      SHA-384(cot_key || server_id): the opaque 48-byte point a relay routes a
      circle's traffic through. Only a member can compute it (needs cot_key →
      relay never learns the circle, ISC-A-S2); server_id namespaces it per
      relay (same circle on two relays = two unlinkable addresses) without
      tying the circle to any relay (cot_key is server-independent).
    iscs: [C8, A-S2, S4]
    public:
      - { kind: const, name: ASSET_ADDR_LEN, value: 48 }
      - { kind: struct, name: AssetAddr, note: "SHA-384(cot_key||server_id) rendezvous address. Display/Debug lowercase hex; as_bytes() -> &[u8;48]; from_bytes([u8;48]) names a subscribe target (opaque, unvalidatable by the relay)." }
    key_functions:
      - { sig: "asset_address(cot_key: &circle::key::CotKey, server_id: &[u8]) -> Result<AssetAddr, oxicrypt_module::Error>", note: "SHA-384(cot_key.as_bytes() || server_id) (ISC-8). Transient key||id buffer is zeroed after hashing. server_id must be the same stable wire server-id representation on member + relay." }

  - path: daemonseed_core::storage::share_index
    purpose: >-
      Encrypted, incremental redb-backed share index (M8, ISC-C21 / A-C6 / A-C7)
      — the indexed-state layer of the three-layer storage split. One ShareEntry
      per shared file (rel_path, size, mtime). Incremental: put/remove rewrite ONE
      entry, never the whole index (A-C7, the Pi-4 civility floor); persisted, so
      reopening reuses rather than cold-rescans (C21). Per entry the redb KEY is
      SHA-384(index_key||rel_path)[:32] (keyed → not reversible OR confirmable
      without the key; deterministic) and the VALUE is AES-256-GCM(index_key,
      nonce, padded-metadata). Values padded to 256-byte buckets so ciphertext
      length can't leak path length (forward-composes with future at-rest folder
      encryption). Index records the LOGICAL view (decrypted names).
    iscs: [C21, A-C6, A-C7]
    public:
      - { kind: const, name: INDEX_KEY_LEN, value: 32 }
      - { kind: const, name: BUCKET_STEP, value: 256, note: "Value padding granularity." }
      - { kind: struct, name: ShareEntry, fields: "{rel_path: String, size: u64, mtime_unix_ms: u64}" }
      - { kind: struct, name: ShareIndex, note: "Open encrypted index over a redb file; holds a Zeroizing<[u8;32]> index key. open(path, key) creates/reopens. Incremental ops: put / get(rel_path) / remove(rel_path) / len / is_empty / entries() (decrypts all, paths come from values not keys)." }
      - { kind: enum, name: IndexError, variants: "{Db(Box<redb::Error>), Crypto, Corrupt, Entropy}", note: "Crypto = AES-GCM init/seal/open failure incl. tamper auth-fail (fails closed, never garbage). A wrong key can't even locate entries (keyed opaque key) → get returns Ok(None)." }
    key_functions:
      - { sig: "ShareIndex::open(path: impl AsRef<Path>, index_key: [u8; 32]) -> Result<ShareIndex, IndexError>", note: "index_key derived Argon2id(passphrase, salt=profile_id)→HKDF-SHA384(info=kdf::info::share_index(profile_id)) by the caller (seeds-blob chain, distinct info)." }
      - { sig: "ShareIndex::put(&self, entry: &ShareEntry) -> Result<(), IndexError>", note: "Single-entry encrypted write (A-C7)." }
      - { sig: "ShareIndex::get(&self, rel_path: &str) -> Result<Option<ShareEntry>, IndexError>" }
      - { sig: "ShareIndex::entries(&self) -> Result<Vec<ShareEntry>, IndexError>" }

  - path: daemonseed_core::indexer
    purpose: >-
      Share-folder indexer engine (M8, ISC-C21 / A-C7) — drives a ShareIndex from
      the filesystem, designed against Demonsaw's cold-rescan thrash. Two modes:
      cold_scan (one-time walkdir → upsert every file; caller runs it on a niced
      background thread so it never starves a foreground task, and the persisted
      index stays queryable meanwhile → startup never blocks) and apply_event
      (one FsEvent → exactly one index write; a single file change never triggers
      a share-wide rewalk). Synchronous + runtime-free by design so the caller
      owns task isolation/priority. The live inotify/FSEvents source is
      ShareWatcher (notify crate); when the OS watch limit is exceeded it
      surfaces WatchError::Limit and the caller drops to the periodic
      mtime_rescan fallback (ISC-21).
    iscs: [C21, A-C7]
    public:
      - { kind: enum, name: FsEvent, variants: "{Upserted(PathBuf), Removed(PathBuf)}", note: "Unit of incremental update. An Upserted for a vanished path folds to a removal (watchers don't guarantee ordering)." }
      - { kind: struct, name: Indexer, note: "ShareIndex + share root. new(index, root); index() borrows for queries." }
      - { kind: struct, name: ShareWatcher, note: "Live recursive filesystem watch (notify RecommendedWatcher). watch(root) -> (ShareWatcher, Receiver<FsEvent>); holds the watcher alive (drop = stop); events feed apply_event (ISC-20)." }
      - { kind: enum, name: WatchError, variants: "{Limit, Io(notify::Error)}", note: "Limit = OS watch limit exceeded (fs.inotify.max_user_watches) — surfaced (ISC-21); caller falls back to mtime_rescan." }
      - { kind: struct, name: ScanHandle, note: "Handle to a running background cold-scan. join() -> Result<usize, IndexError> waits + returns the count; drop detaches." }
    key_functions:
      - { sig: "Indexer::cold_scan(&self) -> Result<usize, IndexError>", note: "Walk the root, upsert every regular file, return count. Unreadable entries skipped (robust). Run on a niced bg thread (ISC-A-C7 no-fate-sharing)." }
      - { sig: "Indexer::apply_event(&self, event: &FsEvent) -> Result<(), IndexError>", note: "Single-entry write (ISC-C21/A-C7 no rewalk). Upsert→put (or remove if vanished); transient stat error leaves entry as-is; paths outside root ignored." }
      - { sig: "Indexer::mtime_rescan(&self, since_unix_ms: u64) -> Result<usize, IndexError>", note: "Fallback (ISC-21): walk root, upsert only files newer than the cutoff (visits all, writes only changed). Driven periodically with the last pass's timestamp when watching is unavailable." }
      - { sig: "ShareWatcher::watch(root: impl AsRef<Path>) -> Result<(ShareWatcher, Receiver<FsEvent>), WatchError>", note: "Begin recursive watching; WatchError::Limit → caller uses mtime_rescan." }
      - { sig: "Indexer::spawn_background_scan(self: Arc<Self>) -> ScanHandle", note: "Run cold_scan on a dedicated thread (ISC-19/A-C7 no-fate-sharing). Returns immediately; index stays queryable from redb (MVCC) during the scan (ISC-23 no-startup-blockade). OS nice/ionice is a best-effort platform refinement on top." }

  - path: daemonseed_core::first_start
    purpose: >-
      Type-state orchestrator for cold-enrollment per ISC-C29 step
      ordering. Phases: Welcome → Sealed → BackupVerified → Ready.
      Each transition consumes the prior state. The
      identity-recoverable-before-network invariant (ISC-A-C15) is
      compile-time enforced: the only method that yields network
      handoff lives on Ready, which is only reachable through
      BackupVerified.
    iscs: [C29, C30, C31, C33, C34, C37, A-C13, A-C14, A-C15, A-C19]
    submodules:
      - daemonseed_core::first_start::orchestrator
      - daemonseed_core::first_start::verify
    public:
      - { kind: phantom-enum, name: "Welcome / Sealed / BackupVerified / Ready", note: "Uninhabited types used as phase markers on FirstStart<S>." }
      - { kind: struct, name: "FirstStart<S>", note: "Generic over phase. Each phase exposes only the methods valid in that phase." }
      - { kind: enum, name: FirstStartError, note: "Passphrase-too-weak / seed-failed / display-name-invalid / etc." }
      - { kind: struct, name: SessionMaterials, fields: "{toml: String, at_rest_blob: Vec<u8>, recovery_file: Vec<u8>, display_name: String, bootstrap: BootstrapAnchor}", note: "What Ready::into_session_materials() yields — caller persists these and hands off to the wire layer (M4a+)." }
      - { kind: const, name: TYPE_BACK_WORD_COUNT, value: 3, note: "N=3 random positions sampled for the ISC-C34 type-back challenge." }
      - { kind: const, name: TYPE_BACK_MAX_RETRIES, value: 3 }
      - { kind: struct, name: TypeBackChallenge, note: "Carries the sampled positions + the expected words (private). matches() does whitespace+case-tolerant comparison." }
    key_functions:
      - { sig: "FirstStart::<Welcome>::new() -> FirstStart<Welcome>" }
      - { sig: "FirstStart::<Welcome>::initialize(passphrase, params: ArgonParams) -> Result<FirstStart<Sealed>, FirstStartError>", note: "C29 steps 1-3 atomically: passphrase strength gate, mnemonic gen, profile init, at-rest+recovery sealed under shared Argon2id intermediate (C30)." }
      - { sig: "FirstStart::<Sealed>::display_phrase(&self) -> String", note: "C31 copy-friendly 24-word display. Available only in Sealed phase." }
      - { sig: "FirstStart::<Sealed>::verify_round_trip(self, saved_phrase: &str) -> Result<FirstStart<BackupVerified>, FirstStartError>", note: "C33 path." }
      - { sig: "FirstStart::<Sealed>::issue_type_back_challenge<R: DisplayNameRng>(&self, rng: &mut R) -> TypeBackChallenge", note: "C34 path step 1." }
      - { sig: "FirstStart::<Sealed>::verify_type_back(self, ch: TypeBackChallenge, answers: &[String]) -> Result<FirstStart<BackupVerified>, FirstStartError>", note: "C34 path step 2." }
      - { sig: "FirstStart::<BackupVerified>::finalize(self, display_name: Option<String>, bootstrap: BootstrapAnchor) -> Result<FirstStart<Ready>, FirstStartError>", note: "C29 steps 5-6. bootstrap is non-Option — A-C19 no-zero-config enforcement." }
      - { sig: "FirstStart::<Ready>::into_session_materials(self) -> SessionMaterials" }

  - path: daemonseed_core::bootstrap
    purpose: >-
      Bootstrap-anchor selection per ISC-C37. Two paths offered at
      first-start: the bundled canonical project relay (placeholder
      until the project stands up its public network) and a manual-
      paste server-id + address obtained out-of-band.
    iscs: [C22, C37]
    submodules:
      - daemonseed_core::bootstrap::anchor
    public:
      - { kind: struct, name: BootstrapAnchor, fields: "{server_id: String, address: String}", note: "What gets persisted to daemonseed.toml as the initial federation peer." }
      - { kind: struct, name: BundledAnchor, fields: "{canonical: Option<BootstrapAnchor>}", note: "Compile-time-embedded canonical anchor. None at M3 (placeholder); a real value lands once the project stands up its public relay." }
    key_functions:
      - { sig: "bundled() -> &'static BundledAnchor", note: "Reads the include_str!'d TOML at anchor.toml. Bound to the release-signed binary." }

  - path: daemonseed_core::crypto::suite
    purpose: >-
      Suite registry — the authoritative list of crypto bundles
      daemonseed supports (ISC-S15 / C24). One entry at M3: CNSA 2.0
      (0x0001). Lifecycle states drive write-policy. Family
      discriminator (KDF + hash equivalence) gates cross-family
      migration per ISC-A-C8.
    iscs: [C24, S15, A-C8, A-S10]
    public:
      - { kind: const, name: SENTINEL_INVALID, value: "0x0000", note: "Reserved. SuiteId::try_new rejects." }
      - { kind: const, name: SENTINEL_MAX, value: "0xFFFF", note: "Reserved. SuiteId::try_new rejects." }
      - { kind: struct, name: SuiteId, note: "u16 newtype. try_new rejects sentinels at parse time. Display is `0xNNNN` uppercase hex." }
      - { kind: enum, name: SuiteIdError, variants: "{Sentinel(u16)}" }
      - { kind: enum, name: Aead, variants: "{Aes256Gcm}" }
      - { kind: enum, name: Kem, variants: "{MlKem1024}" }
      - { kind: enum, name: Sig, variants: "{MlDsa87}" }
      - { kind: enum, name: Hash, variants: "{Sha256}" }
      - { kind: enum, name: Kdf, variants: "{HkdfSha256}" }
      - { kind: enum, name: MemoryHard, variants: "{Argon2id}" }
      - { kind: enum, name: LifecycleState, variants: "{Proposed, ActiveWrite, ActiveReadOnly, ReadOnlyDeprecated, Removed}", note: "Matches ds-suite-registry.md lifecycle table." }
      - { kind: struct, name: Suite, fields: "{id, aead, kem, sig, hash, kdf, memory_hard, state}", note: "Bundle definition. Const-constructible." }
      - { kind: const, name: CNSA_2_0, note: "0x0001. Pinned byte-for-byte against ds-suite-registry.md by cnsa_2_0_matches_registry_doc unit test." }
      - { kind: const, name: REGISTRY, note: "Static slice of all Suites this build ships." }
      - { kind: struct, name: Registry, note: "Zero-sized convenience handle." }
      - { kind: enum, name: WriteRefusal, variants: "{Unknown(SuiteId), Proposed(SuiteId), ActiveReadOnly(SuiteId), Deprecated(SuiteId), Removed(SuiteId)}" }
    key_functions:
      - { sig: "SuiteId::try_new(raw: u16) -> Result<SuiteId, SuiteIdError>", note: "const fn. Rejects sentinels." }
      - { sig: "SuiteId::get(self) -> u16" }
      - { sig: "Suite::same_family(&self, other: &Suite) -> bool", note: "const fn. True iff KDF + hash match (per ISC-A-C8). No wire field — family is implicit in the registry." }
      - { sig: "Registry::lookup(id: SuiteId) -> Option<&'static Suite>" }
      - { sig: "Registry::resolve_for_write(id: SuiteId) -> Result<&'static Suite, WriteRefusal>", note: "Default policy: refuse non-Active-write states." }
      - { sig: "Registry::resolve_for_write_with(id: SuiteId, policy: WritePolicy) -> Result<&'static Suite, WriteRefusal>", note: "Policy-explicit variant." }
      - { sig: "Registry::default_write_suite() -> SuiteId", note: "Returns the first Active-write entry. M3 ships with one row so this is unambiguous; a transition with multiple Active-write suites would resolve via operator config." }

  - path: daemonseed_core::crypto::policy
    purpose: >-
      Write-time policy gate (ISC-A-C8 compose-time enforcement).
      WritePolicy is the configurable knob callers pass to
      Registry::resolve_for_write_with. Default (RefuseDeprecated)
      matches the ISC-A-C8 client invariant.
    iscs: [A-C8]
    public:
      - { kind: enum, name: WritePolicy, variants: "{Allow, RefuseDeprecated [#default], RefuseRemoved}", note: "Allow is test-only. RefuseRemoved is reserved for M7 operator-config use." }
    key_functions:
      - { sig: "WritePolicy::permits(self, state: LifecycleState) -> bool", note: "const fn. Drives the WriteRefusal dispatch." }

  - path: daemonseed_core::version
    purpose: >-
      Wire-protocol version negotiation policy (Invariant 2 in the
      implementation plan). The wire shape lives in
      daemonseed_proto::v1::ProtocolVersion (proto3 uint32); this
      module's in-memory ProtocolVersion is `u16` because real-world
      protocol-version counts never exceed 65535. Conversions go
      through ProtocolVersion::try_from_wire (narrowing, fallible)
      and ProtocolVersion::to_wire (widening, infallible).
    iscs: [S14, A-S9, C23]
    added_in: "v0.5.0 (M4a)"
    submodules: []
    public:
      - { kind: struct, name: ProtocolVersion, fields: "{major: u16, minor: u16}", note: "PATCH deliberately absent per ISC-S14." }
      - { kind: const, name: SUPPORTED, type: "&[ProtocolVersion]", note: "MVP ships exactly [ProtocolVersion::new(1, 0)]. Future MINOR bumps append additively." }
      - { kind: enum, name: NegotiationError, variants: "{NoCommonVersion { peer_supported }, OutOfSetAck { claimed }, ZeroRttForbidden, MalformedPeerOffer(VersionError)}" }
      - { kind: enum, name: VersionError, variants: "{OutOfRange { field, value }}", note: "Surfaces inside MalformedPeerOffer when wire u32 exceeds u16::MAX." }
      - { kind: trait, name: VersionNegotiator, note: "Sealed at the daemonseed level — implementations live here. `select` and `verify_ack` have default impls." }
      - { kind: struct, name: DefaultNegotiator, note: "Unit struct; offers exactly SUPPORTED. Used by both client and server in MVP." }
    key_functions:
      - { sig: "ProtocolVersion::new(major: u16, minor: u16) -> Self", note: "const fn." }
      - { sig: "ProtocolVersion::try_from_wire(w: &wire::ProtocolVersion) -> Result<Self, VersionError>" }
      - { sig: "ProtocolVersion::to_wire(self) -> wire::ProtocolVersion", note: "const fn; widening can't fail." }
      - { sig: "VersionNegotiator::select(&self, peer_offer: &[ProtocolVersion]) -> Result<ProtocolVersion, NegotiationError>", note: "Highest mutual wins; preference follows self.offer() order." }
      - { sig: "VersionNegotiator::verify_ack(&self, ack: ProtocolVersion) -> Result<(), NegotiationError>", note: "ISC-C23 client-side enforcement: ACK out-of-set is a hard close." }

  - path: daemonseed_core::connection
    purpose: >-
      Type-state Connection<S, T> machine (Invariant 3). ISC-C23
      mandates compile-time prevention of pre-APP_HELLO application
      traffic; this module's marker types + consuming transitions
      enforce that without runtime checks. Concrete TLS streams plug
      in via the Transport trait's blanket impl over
      `AsyncRead + AsyncWrite + Send + Unpin + 'static`.
      Negotiating → Versioned (M4a) → Authenticated (M4b). Only
      Authenticated impls AsyncRead/AsyncWrite, so application traffic
      is a compile error pre-auth. The Versioned → Authenticated step
      consumes a VerifiedPeer token (mintable only by a passed
      identity_proof::verify_envelope), so the gate cannot be skipped.
    iscs: [C23, S14, S19]
    added_in: "v0.5.0 (M4a)"
    submodules:
      - daemonseed_core::connection::state
    public:
      - { kind: struct, name: "Connection<S: ConnState, T: Transport>", fields: "{transport: T, _state: PhantomData<fn() -> S>}", note: "All state transitions consume `self`; prior-state values drop at the type level." }
      - { kind: trait, name: Transport, note: "Marker trait. Blanket impl for any T: AsyncRead + AsyncWrite + Send + Unpin + 'static. No daemonseed-side glue needed for concrete TLS streams." }
      - { kind: trait, name: "state::ConnState (sealed)", note: "Sealed via private::Sealed — third parties cannot introduce new states." }
      - { kind: enum, name: "state::Negotiating (never)", note: "Marker. Pre-APP_HELLO state; no I/O exposed." }
      - { kind: enum, name: "state::Versioned (never)", note: "Marker. Post-APP_HELLO_ACK state; exposes transport_mut() for identity-proof envelope I/O. Does NOT impl AsyncRead/AsyncWrite." }
      - { kind: enum, name: "state::Authenticated (never)", note: "Marker. Connection<Authenticated, T> impls AsyncRead + AsyncWrite (delegating to the transport) — the only state that exposes application I/O." }
    key_functions:
      - { sig: "Connection::<Negotiating, T>::from_handshaked_transport(transport: T) -> Self", note: "Wraps a freshly-TLS-handshaked transport. Constructor does not drive the TLS handshake itself." }
      - { sig: "Connection::<Negotiating, T>::advance_to_versioned(self) -> Connection<Versioned, T>", note: "Consuming transition. Caller drives APP_HELLO frame I/O against the transport via daemonseed_server::hello helpers before calling this." }
      - { sig: "Connection::<Versioned, T>::transport_mut(&mut self) -> &mut T", note: "Drives identity-proof envelope I/O. Deliberately NOT an AsyncRead/AsyncWrite impl on the Connection wrapper." }
      - { sig: "Connection::<Versioned, T>::into_authenticated(self, verified: VerifiedPeer) -> Connection<Authenticated, T>", note: "ISC-S19 step 5 / ISC-C23. Consumes a VerifiedPeer token (only verify_envelope can mint one), so Authenticated is unreachable without a passed verification." }
      - { sig: "Connection::<Authenticated, T>::into_inner(self) -> T", note: "Unwraps the raw authenticated transport — e.g. to hand to tonic for the post-auth application stream (M5+)." }
      - { sig: "impl AsyncRead + AsyncWrite for Connection<Authenticated, T>", note: "Delegates to the inner transport. This impl exists ONLY for the Authenticated state." }

  - path: daemonseed_core::federation::trust
    purpose: >-
      The federation trust slider (ISC-C22 / ISC-S12) — a pure, total,
      side-effect-free decision function shared by the client and
      server-to-server peering. Given a server's configured trust mode and the
      key it presented (already proven self-consistent by the M4b
      identity-proof), it returns accept / accept-with-rotation-notice / refuse.
      Does no crypto: the caller computes the SHA-384 prefix and passes it in.
    iscs: [C22, S12, S1]
    public:
      - { kind: enum, name: TrustMode, note: "Trusted | Untrusted. Serde lowercase. Default = Trusted (ISC-C22 default for new servers). Local config — never on the wire (ISC-A-S6)." }
      - { kind: enum, name: TrustDecision, note: "Accept | AcceptWithRotation{fingerprint: String} | Refuse. Refuse is fail-closed (ISC-45)." }
      - { kind: struct, name: "TrustQuery<'a>", note: "Inputs: mode, expected_prefix, presented_pubkey, presented_prefix, pinned_key, configured_key, rotation_dismissed." }
    key_functions:
      - { sig: "evaluate_trust(q: &TrustQuery) -> TrustDecision", note: "Trusted: TOFU hash-match on first contact, pin-compare after, rotation surfaces unless dismissed. Untrusted: byte-exact pre-configured key, refuse any mismatch incl. rotation." }

  - path: daemonseed_core::federation::store
    purpose: >-
      Per-server federation trust state and the evaluate-then-record step. The
      TrustStore trait + in-memory implementation hold the trust mode, the TOFU
      pin, and the rotation-dismissal flag. Disk persistence is deferred to the
      client-identity work (mirrors M4b decision D8); M5 ships the state machine.
    iscs: [C22, S12]
    public:
      - { kind: struct, name: ServerEntry, note: "{server_id: Handle, address, mode, pinned_key: Option<Vec<u8>>, configured_key: Option<Vec<u8>>, rotation_dismissed}. Constructors new_trusted / new_untrusted." }
      - { kind: trait, name: TrustStore, note: "get / upsert / set_pin / dismiss_rotation." }
      - { kind: struct, name: InMemoryTrustStore, note: "HashMap-backed, keyed by server-id string. M5 default; not persisted." }
    key_functions:
      - { sig: "apply_trust(store: &mut dyn TrustStore, server_id: &Handle, presented_pubkey: &[u8], presented_prefix: &[u8; 6]) -> TrustDecision", note: "Looks up the entry, runs evaluate_trust, and on a trusted-mode accept pins the presented key. Unknown server → Refuse." }

  - path: daemonseed_core::federation::peering
    purpose: >-
      Server-to-server peering helper (ISC-S12). The trust decision itself is
      shared via federation::trust; this holds the F31 concurrent-TOFU
      tiebreaker.
    iscs: [S12]
    key_functions:
      - { sig: "initiates_peer_tofu(own_prefix: &[u8; 6], peer_prefix: &[u8; 6]) -> bool", note: "F31 tiebreaker (ISC-S12-8): the lower server-id hash-prefix initiates TOFU, the other observes-and-confirms. Antisymmetric → no split-brain double-pin." }

  - path: daemonseed_core::circle
    purpose: >-
      Circle-of-trust types. **Client-only scope** — per ISC-A-S2 the
      server is never aware of which circles exist or who is in them.
      Circles are flat and metadata-free (F16): a circle is defined
      solely by its shared entropy — no founder, no signed metadata
      record, no per-circle minimum-suite policy. The shared phrase is
      both the sole circle secret and the sole distinguisher. Suite
      floor is enforced at the server (S16 deprecation policy) plus the
      client-local registry; a cross-family crypto change is the
      circle-rekey/new-circle event of ISC-A-C8, expressed structurally
      by family-anchored derivation rather than a stored record.
    iscs: [C8, C9, A-C8, A-S2]
    submodules:
      - daemonseed_core::circle::key
    public:
      - { kind: const, name: COT_KEY_LEN, type: usize, note: "32 — circle-of-trust symmetric key length for AES-256-GCM (ISC-C8)." }
      - { kind: const, name: EXAMPLE_ENTROPY, type: "&str", note: "Public teaching passphrase (xkcd-936). Pre-filled as the circle-creation placeholder so a user watches entropy → key derive locally; never auto-joined to a relay, so nothing reaches the network until the user types their own secret." }
      - { kind: struct, name: CotKey, note: "Derived 32-byte symmetric key. ZeroizeOnDrop; Debug is redacted to `CotKey(<redacted>)` per ISC-A-C1." }
      - { kind: enum, name: CircleKeyError, variants: "{Hkdf(oxicrypt_kdf::KdfError)}", note: "Failure modes for derive_cot_key." }
    key_functions:
      - { sig: "derive_cot_key(entropy: &str, suite: &Suite) -> Result<CotKey, CircleKeyError>", note: "ISC-C8/C9. Canonicalizes entropy (NFKC + whitespace) then HKDF-SHA-384(salt=CIRCLE_KEY_SALT, ikm=canonical) → expand(info=\"daemonseed/circle/<family>\"). Family-anchored on Suite::family_token, so within-family suite ratchets leave the key unchanged; only a cross-family change re-derives (ISC-A-C8 new-circle event). Strength gating (≥128-bit) is the caller's responsibility via passphrase::strength." }
      - { sig: "CotKey::as_bytes(&self) -> &[u8; COT_KEY_LEN]", note: "Borrow raw key bytes for AEAD use; callers must not copy into a non-zeroizing buffer." }

  - path: daemonseed_core::public_space
    purpose: >-
      Signed-artifact model for the public-space service (M6), shared
      byte-for-byte by the server (verify-and-serve, ISC-A-S3) and every
      client (independent re-verification of what the server served). One
      implementation of "is this artifact trustworthy" — content-address
      derivation, signer-whitelist authorization, ML-DSA-87 signature
      verification — so the server can never serve content a client would
      reject. Proto-agnostic: operates on &[u8] payloads / keys / signatures
      (no daemonseed-proto dependency), so the wire crate adapts its types
      into these calls.
    iscs: [S7, S8, A-S3]
    added_in: "v0.8.0 (M6)"
    public:
      - { kind: const, name: CONTENT_ADDRESS_LEN, value: 48, note: "SHA-384 content-address length in bytes." }
      - { kind: struct, name: ContentAddress, note: "SHA-384(signed_payload) (ISC-17). Derived, never trusted off the wire (ISC-A-S3). Display/Debug are lowercase hex; as_bytes() -> &[u8;48]." }
      - { kind: enum, name: WhitelistEntry, variants: "{FullKey(Box<[u8; PK_LEN]>), Handle(Handle)}", note: "Operator signer-whitelist entry (ISC-S8). FromStr parses one line: a `#` => handle form (ISC-11), else hex full key (ISC-10). Debug redacts the key bytes." }
      - { kind: enum, name: WhitelistParseError, variants: "{Handle(HandleParseError), InvalidPubkeyHex, WrongPubkeyLength{found,expected}}", note: "A malformed line is a hard error — never silently dropped, so an operator typo cannot quietly de-authorize a signer." }
      - { kind: struct, name: Whitelist, note: "Operator entries plus the always-present, file-non-removable project-release entry (F17). authorizes() is the cheap gate before any signature work." }
      - { kind: enum, name: ArtifactError, variants: "{UnknownSigner, BadSignature, Module(oxicrypt_module::Error)}", note: "verify_artifact failure modes. The server maps UnknownSigner + BadSignature to one opaque gRPC reject (no which-check oracle)." }
    key_functions:
      - { sig: "content_address(signed_payload: &[u8]) -> Result<ContentAddress, oxicrypt_module::Error>", note: "SHA-384(signed_payload) (ISC-17). Requires oxicrypt module operational." }
      - { sig: "project_release_pubkey() -> &'static [u8; PK_LEN]", note: "F17 project-release signer key (ISC-15). DEV PLACEHOLDER derived once from an in-source seed during the private phase; replaced by a baked-in real release pubkey (secret offline) before public launch. Always authorized; operators cannot remove it." }
      - { sig: "WhitelistEntry::from_str(s: &str) -> Result<WhitelistEntry, WhitelistParseError>", note: "Parse one whitelist-file line (ISC-10 / ISC-11)." }
      - { sig: "WhitelistEntry::from_full_key_bytes(bytes: &[u8]) -> Result<WhitelistEntry, WhitelistParseError>", note: "Build a FullKey entry from raw ML-DSA-87 pubkey bytes (e.g. a wire SignerWhitelistEntry::FullPubkey a client fetched); length-checked. Used by the CLI to rebuild the published whitelist for client re-verification." }
      - { sig: "Whitelist::from_entries(entries: Vec<WhitelistEntry>) -> Whitelist", note: "Build from parsed operator entries; F17 is checked unconditionally by authorizes(), not stored in entries()." }
      - { sig: "Whitelist::entries(&self) -> &[WhitelistEntry]", note: "Operator entries, for publishing to clients via GetSignerWhitelist (ISC-S8 / ISC-6)." }
      - { sig: "Whitelist::authorizes(&self, pubkey: &[u8]) -> Result<bool, oxicrypt_module::Error>", note: "ISC-12 gate: project-release always authorized; FullKey by exact bytes; Handle by SHA-384 hash-prefix match computed without touching the signature." }
      - { sig: "verify_artifact(signed_payload: &[u8], signer_pubkey: &[u8], signature: &[u8], whitelist: &Whitelist) -> Result<ContentAddress, ArtifactError>", note: "ISC-A-S3 pipeline, in order (ISC-12): authorize -> ML-DSA-87 verify over the exact signed bytes (D-M6-7) -> SHA-384 content-address. The single shared server+client trust decision." }

  - path: daemonseed_core::crypto::deprecation
    purpose: >-
      Operator-configured suite-deprecation policy (M7, ISC-S16 / A-S11 / C25 /
      A-C9). A signed, monotonically-versioned policy listing per-suite cutoffs
      and recommended migration targets; clients fetch + verify it and surface
      trust events (never silently downgrade). Includes a TTL'd per-server cache
      with rollback detection (older policy-version than already seen = attack
      signal).
    iscs: [S16, A-S11, C25, A-C9]
    added_in: "v0.9.0 (M7)"
    public:
      - { kind: const, name: CACHE_TTL, value: "3600s", note: "Cached-policy freshness window." }
      - { kind: const, name: MIN_CUTOFF_LEAD, value: "2h", note: "Minimum lead time a cutoff must sit in the future at signing." }
      - { kind: struct, name: DeprecationEntry, note: "{ suite_id, cutoff_unix_ms, recommended_suite_id }." }
      - { kind: struct, name: DeprecationPolicy, note: "Monotonic policy_version + signed_timestamp + entries. build/from_signed_payload/to_signed_payload; entry_for / is_past_cutoff(now) / affected(in_use)." }
      - { kind: enum, name: PolicyError, note: "Build/parse/verify failure modes (malformed, cutoff-lead too short, bad signature, rollback)." }
      - { kind: struct, name: PolicyCache, note: "Per-server TTL'd cache. insert / cached_version / fresh(now) / is_stale(now) / earliest_cutoff(suite). Rollback to an older version is rejected." }
    key_functions:
      - { sig: "sign_policy(policy: &DeprecationPolicy, signing: &SignKeypair) -> Result<Vec<u8>, PolicyError>", note: "Sign the canonical policy payload (ML-DSA-87)." }
      - { sig: "verify_policy(bytes: &[u8], pubkey: &[u8; PK_LEN]) -> Result<DeprecationPolicy, PolicyError>", note: "Verify + parse a signed policy. The only trusted ingestion path." }

  - path: daemonseed_core::trust_events
    purpose: >-
      Trust-event taxonomy + bounded encrypted audit log (M7, ISC-C28 / A-C12).
      A closed, append-only TrustEventKey enum mapped to a four-class affordance
      taxonomy (Blocking / PersistentNonBlocking / Transient / LogOnly), with a
      frozen stable string form persisted in the log and consumed by third-party
      clients. Keys may be added, never renamed/removed.
    iscs: [C28, A-C12]
    added_in: "v0.9.0 (M7)"
    public:
      - { kind: enum, name: TrustEventClass, variants: "{Blocking, PersistentNonBlocking, Transient, LogOnly}", note: "Implementations MUST NOT invent sub-classes." }
      - { kind: enum, name: TrustEventKey, note: "Closed wire-stability surface (append-only). Includes the M10 update keys UpdateVerificationFailed (Blocking), EmergencySecurityUpdateAvailable (Blocking), UpdateRelayFallbackUsed (Transient) — added at M7, consumed by the M10 update FSM." }
      - { kind: struct, name: TrustEvent, note: "One log tuple: timestamp, key, optional server_id, optional suite_id, resolution, dismissed_at. observed() builder." }
      - { kind: struct, name: TrustEventLog, note: "Bounded (DEFAULT_LOG_CAP) in-memory log. append (drops Transient — the A-C12 asymmetry), entries, prune_to, dismiss (per (key, scope), never global)." }
    key_functions:
      - { sig: "class_of(key: TrustEventKey) -> TrustEventClass", note: "Total, pure, no override (A-C12 no-class-degradation)." }
      - { sig: "event_key_string(key) -> &'static str / event_key_from_str(s) -> Option<TrustEventKey>", note: "Frozen-forever stable string form (closes R9)." }
      - { sig: "seal_log(&TrustEventLog, passphrase, profile_id, ArgonParams) -> Result<Vec<u8>, AuditLogError> / open_log(bytes, passphrase)", note: "Argon2id+HKDF-SHA-384 key independent of the at-rest blob; AES-256-GCM with the header as AAD." }
      - { sig: "assess_deprecation(&DeprecationPolicy, in_use: &[SuiteId], now_ms) -> Vec<DeprecationSignal>", note: "Derive client trust signals from a verified policy; reports only — never mutates suite/identity." }

  - path: daemonseed_core::backoff
    purpose: >-
      Client reconnect backoff curve + close-cause categorization (M9, ISC-C26).
      Exponential 1s→60s ×2 with ±25% jitter and an 8-retry per-server-id budget;
      a uniform close-cause layering that never names which rate-limit was hit
      (A-S12).
    iscs: [C26, A-S12]
    added_in: "v0.11.0 (M9)"
    public:
      - { kind: const, name: "DEFAULT_BASE / DEFAULT_CAP / DEFAULT_MAX_RETRIES / DEFAULT_JITTER_FRAC", value: "1s / 60s / 8 / 0.25", note: "Default policy constants." }
      - { kind: struct, name: BackoffPolicy, note: "delay_for_attempt(attempt) (saturating, no overflow); jitter(delay, unit)." }
      - { kind: struct, name: Backoff, note: "Stateful driver. new/with_policy; next(unit)/next_jittered() consume one retry, None once the budget is exhausted; attempts/exhausted/reset; refusal_event() -> TrustEventKey (ConnectionRateLimited → …Exhausted)." }
      - { kind: enum, name: CloseCause, note: "Network / pre-HELLO_ACK / post-auth layering. user_message() never speculates which budget tripped (A-S12)." }

  - path: daemonseed_core::mention
    purpose: >-
      @-mention recognition + resolution over decrypted chat plaintext (M9,
      ISC-C17 / C18 / A-C4). Pure client-side functions that add no server-
      visible distinction over plain chat (no daemonseed-proto dependency).
    iscs: [C17, C18, A-C4]
    added_in: "v0.11.0 (M9)"
    public:
      - { kind: enum, name: MentionResolution, variants: "{Resolved(Handle), Ambiguous(Vec<Handle>), NotFound}", note: "Result of resolving a typed token; an explicit full handle bypasses autocomplete." }
    key_functions:
      - { sig: "find_self_mentions(plaintext: &str, own_handle: &Handle) -> Vec<MentionSpan>", note: "Read-only scan keyed on the full wire handle, with word-boundary + trailing-hex guards. Does not mutate the plaintext." }
      - { sig: "resolve_mention(typed: &str, scope: &[Handle]) -> MentionResolution", note: "Bare display name resolves by exact scope match — one match resolves, several are Ambiguous, none is NotFound." }

  - path: daemonseed_core::release
    purpose: >-
      Release-signing trust anchor, N-of-M multi-sig verify, and the client
      update-lifecycle FSM (M10 verifiable-core, ISC-S18 / A-S13 / C27 / A-C11).
      The anchor is binary-bound (include_str!'d TOML, mirrors bootstrap::anchor)
      and ships its 1-of-1 shape with the key array empty (real key deferred to
      M10-infra). The FSM enforces verify-before-apply, never-auto-install,
      no-silent-downgrade, and wipe-and-log-on-failure by its shape, emitting the
      existing M7 update trust-event keys (no new wire surface).
    iscs: [S18, A-S13, C27, A-C11]
    added_in: "v0.12.0 (M10)"
    deferred: "Real signing keys / Sigstore / reproducible build / live fetch / binary swap (M10-infra)."
    public:
      - { kind: struct, name: ReleaseAnchor, note: "Ordered ML-DSA-87 release-signing key set + N-of-M threshold. new(keys, threshold) rejects a degenerate anchor (AnchorError::{NoKeys, ThresholdOutOfRange}); threshold()/keys()." }
      - { kind: struct, name: ReleaseKey, note: "Wraps a boxed [u8; PK_LEN] release-signing pubkey. new(pubkey)/public_key(). Debug shows a 4-byte prefix only." }
      - { kind: struct, name: BundledReleaseAnchor, note: "Schema for the include_str!'d release_anchor.toml: version, threshold, hex keys (empty pre-public). to_anchor() -> Option<ReleaseAnchor> (None until a real key is bundled). bundled() -> &'static." }
      - { kind: enum, name: ReleaseVerifyError, variants: "{BelowThreshold{required,valid}, UnrecognizedSignature, MalformedSignature, Module}", note: "Local diagnostic only — feeds the A-C11 failure log, never on the wire." }
      - { kind: enum, name: UpdateChannel, variants: "{Primary, RelayFallback}", note: "RelayFallback is no more trusted than Primary — verify is anchor-based regardless." }
      - { kind: struct, name: ReleaseVersion, note: "Binary SemVer {major, minor, patch} with Ord (distinct from the wire ProtocolVersion). new()." }
      - { kind: struct, name: UpdateRecord, note: "{ version, channel, emergency } — discovered update metadata." }
      - { kind: struct, name: FailureLogEntry, note: "A-C11 tuple: {timestamp_unix_ms, channel, version_attempted, reason}. No payload retained." }
      - { kind: enum, name: UpdateState, variants: "{Idle, Available(UpdateRecord), Verified{record,is_downgrade}, ConfirmedReadyToInstall(UpdateRecord), Failed(FailureLogEntry)}", note: "ConfirmedReadyToInstall reachable ONLY via confirm() — never auto-reached." }
      - { kind: enum, name: ConfirmError, variants: "{NotVerified, DowngradeNotAcknowledged}", note: "confirm() refuses outside Verified, or a downgrade without explicit acknowledgement." }
      - { kind: struct, name: UpdateLifecycle, note: "The FSM driver. new(current_version); discover(record, artifact); verify(anchor, message, signatures, now_ms); confirm(acknowledge_downgrade); state/failure_log/has_artifact/take_pending_events." }
    key_functions:
      - { sig: "verify_multisig(anchor: &ReleaseAnchor, message: &[u8], signatures: &[&[u8]]) -> Result<(), ReleaseVerifyError>", note: "Accepts iff >= threshold DISTINCT anchor keys each signed validly. No verify-bypass; each key counted once; a non-anchor signature is a hard refusal; a wrong-length blob is rejected without panic." }
      - { sig: "bundled() -> &'static BundledReleaseAnchor", note: "The compile-time release anchor. to_anchor() is None during the pre-public phase (no real key yet)." }

# ─────────────────────────────────────────────────────────────────────
# Common gotchas across modules
# ─────────────────────────────────────────────────────────────────────

gotchas:
  - description: >-
      AuthenticationFailed in seeds::open / recovery_file::open is the
      uniform error for wrong-passphrase, wrong-profile-id, wrong-argon-
      params, and tampered-ciphertext. This is a deliberate constant-
      time-friendly design — never report which check failed to the user
      in a way that distinguishes them.
    severity: warning
    scope: storage::seeds, storage::recovery_file

  - description: >-
      Every test in this crate that touches crypto must call
      `oxicrypt_module::initialize()` (or the test-only `let _ =
      oxicrypt_module::initialize();` idiom) before any cryptographic
      function. Without it, every primitive returns ModuleNotOperational.
    severity: error
    scope: all crypto-touching modules

  - description: >-
      Mnemonic round-trips through to_phrase()/from_phrase() are
      whitespace-tolerant via word-token comparison in
      first_start::Sealed::verify_round_trip — leading/trailing/internal
      whitespace and uppercase letters in user input are accepted.
      Direct string equality on phrases will reject what verify_round_trip
      accepts.
    severity: warning
    scope: first_start, identity::mnemonic

  - description: >-
      Suite-id 0x0000 and 0xFFFF are reserved sentinels. SuiteId::try_new
      rejects them. Any wire path that decodes a u16 into a SuiteId must
      route through try_new so the rejection is uniform.
    severity: error
    scope: crypto::suite, storage::seeds, storage::recovery_file

